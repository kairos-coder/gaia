<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sacred Grove · Demeter's Realm · GAIA</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c; --gold-bright: #f0d080; --gold-dim: #8b7332;
            --parchment: #f5f0e0;
            --sage: #889966; --sage-dark: #667744;
            --earth: #5a4a35; --earth-dark: #3d2f1f;
            --bloom-pink: #d8a8b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #2d2a1f;
            color: #5a4a35;
            font-family: 'Georgia','Times New Roman',serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(200,168,76,0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(45,42,31,0.98) 0%, transparent 50%);
        }

        #sacred-grove {
            position: relative; width: 820px; max-width: 98vw;
            height: 1100px; margin: 0 auto 1rem; overflow: hidden;
            background: linear-gradient(180deg, #f5f0e0 0%, #ede4cc 40%, #e0d5b8 100%);
            border-left: 4px solid #5a4a35;
            border-right: 4px solid #5a4a35;
            box-shadow: 0 0 120px rgba(0,0,0,0.5), 0 0 240px rgba(200,168,76,0.08);
        }
        @media (max-width: 840px) {
            #sacred-grove { width: 98vw; height: calc(98vw * 1.34); }
        }

        .zone { cursor: pointer; transition: filter 0.3s, transform 0.3s; }
        .zone:hover { filter: brightness(1.25); z-index: 50 !important; }
        .zone:active { transform: scale(0.94); transition: transform 0.1s; }

        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(245,240,224,0.96); border: 1px solid #8b7332;
            border-radius: 4px; padding: 0.5rem 1.2rem;
            font-family: 'Georgia',serif; font-size: 0.78rem;
            z-index: 200; opacity: 0; transition: opacity 0.35s;
            pointer-events: none; text-align: center; max-width: 420px; line-height: 1.4;
            box-shadow: 0 6px 24px rgba(0,0,0,0.4); white-space: pre-line;
            color: #5a4a35;
        }
        #toast.show { opacity: 1; }

        @keyframes petalDrift {
            0% { transform: translateY(-10px) translateX(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(90px) translateX(var(--px)) rotate(var(--pr)); opacity: 0; }
        }
        @keyframes canopySway {
            0%,100% { transform: translateX(0); }
            50% { transform: translateX(2px); }
        }
        @keyframes blossomShimmer {
            0%,100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        @keyframes lightShaft {
            0%,100% { opacity: 0.35; }
            50% { opacity: 0.7; }
        }
        @keyframes inscriptionGlow {
            0%,100% { text-shadow: 0 0 4px rgba(200,168,76,0.1); }
            50% { text-shadow: 0 0 14px rgba(200,168,76,0.4); }
        }
    </style>
</head>
<body>

    <div id="sacred-grove"></div>
    <div id="toast"></div>

    <script src="../js/gaia-mason.js"></script>
    <script>
    /*
     * ═══════════════════════════════════════════════════════════════
     * THE SACRED GROVE · Demeter's Realm
     * Ancient trees with connected trunks and layered canopies.
     * Blooming ancient at center. Hollow exits. Harvest altar.
     * Petal fall. The goddess of the growing season.
     * All built from typography. GaiaMason v2.1.
     * ═══════════════════════════════════════════════════════════════
     */

    const DEFAULT_STATE = {
        groveVisits: 0,
        offeringsMade: 0,
        ancientWhispersHeard: 0,
    };
    let state = JSON.parse(JSON.stringify(DEFAULT_STATE));

    function loadState() {
        const raw = localStorage.getItem('gaia_demeter');
        if (!raw) return false;
        try { state = { ...DEFAULT_STATE, ...JSON.parse(raw) }; return true; } catch(e) { return false; }
    }
    function saveState() { localStorage.setItem('gaia_demeter', JSON.stringify(state)); }

    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg, d = 3200) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), d);
    }

    function spawnPetals(x, y, count = 8) {
        const c = document.getElementById('sacred-grove');
        if (!c) return;
        for (let i = 0; i < count; i++) {
            const petal = document.createElement('div');
            const px = (Math.random() - 0.5) * 100;
            const pr = Math.random() * 360;
            const size = 3 + Math.random() * 5;
            const dur = 2 + Math.random() * 3;
            petal.style.cssText = `
                position:absolute; left:${x}px; top:${y}px;
                width:${size}px; height:${size * 1.4}px;
                background:radial-gradient(ellipse, rgba(255,200,210,0.7), rgba(216,168,184,0.2));
                border-radius:50% 50% 50% 0;
                pointer-events:none; z-index:50;
                --px:${px}px; --pr:${pr}deg;
                animation:petalDrift ${dur}s ease-out ${Math.random()*0.5}s forwards;
            `;
            c.appendChild(petal);
            setTimeout(() => { if (petal.parentNode) petal.remove(); }, dur * 1000 + 600);
        }
    }

    function makeZone(x, y, w, h, title, action) {
        const el = document.createElement('div');
        el.className = 'zone';
        el.title = title;
        el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:25;`;
        el.addEventListener('click', action);
        return el;
    }

    // ═══════════════════════════════════
    // TREE BUILDER — trunk connects to canopy
    // ═══════════════════════════════════

    function buildTree(mason, config) {
        const {
            tx, ty,           // tree origin
            // Canopy layers (bottom to top)
            canopyLayers = [],
            // Trunk
            trunkChars = ['║','║','║'],
            trunkColor = '#4a3525',
            trunkWidth = 26,
            trunkHeight = 140,
            trunkZ = 4,
            // Roots
            roots = null,
            // Opening (for hollow)
            opening = null,
            // Ember particles (for charred)
            embers = false,
        } = config;

        const elements = [];

        // ── CANOPY LAYERS (bottom-up, each overlaps the one below) ──
        // The last layer's bottom edge overlaps the top of the trunk.
        let prevBottom = ty;
        canopyLayers.forEach((layer, i) => {
            const lx = tx + (layer.offsetX || 0);
            // First layer positions relative to ty; subsequent layers stack upward
            const ly = i === 0 ? ty + (layer.offsetY || 0) : prevBottom - layer.height + (layer.overlap || 15);
            const el = mason.buildWall({
                chars: layer.chars,
                textColor: layer.textColor,
                mortarColor: layer.mortarColor,
                fontSize: layer.fontSize,
                lineHeight: layer.lineHeight || 0.42,
                letterSpacing: layer.letterSpacing || -2,
                fontFamily: layer.fontFamily || 'monospace',
                x: lx,
                y: ly,
                width: layer.width,
                height: layer.height,
                z: layer.z || 5,
                weathering: layer.weathering || 0.05
            });
            if (el) {
                el.style.animation = `canopySway ${4 + Math.random()*3}s ease-in-out infinite`;
                if (layer.animationDelay) el.style.animationDelay = layer.animationDelay;
                elements.push(el);
            }
            prevBottom = ly;
        });

        // ── TRUNK ──
        // The trunk top overlaps with the lowest canopy's bottom
        const lowestCanopy = canopyLayers[0];
        const canopyBottom = lowestCanopy
            ? ty + (lowestCanopy.offsetY || 0) + lowestCanopy.height
            : ty + 80;
        const trunkTop = canopyBottom - 22; // trunk extends up into canopy

        const trunk = mason.buildPillar({
            chars: trunkChars,
            textColor: trunkColor,
            mortarColor: '#2a1f15',
            fontSize: Math.max(14, trunkWidth * 0.7),
            fontFamily: 'monospace',
            x: tx + (config.trunkOffsetX || 0),
            y: trunkTop,
            width: trunkWidth,
            height: trunkHeight,
            z: trunkZ
        });
        if (trunk) {
            trunk.style.animation = `canopySway ${5+Math.random()*4}s ease-in-out infinite`;
            elements.push(trunk);
        }

        const trunkBottom = trunkTop + trunkHeight;

        // ── ROOTS ──
        if (roots) {
            const rootEl = mason.buildInscription({
                text: roots.chars.join(' '),
                x: tx + (roots.offsetX || 0),
                y: trunkBottom - 6,
                fontSize: roots.fontSize || 12,
                color: roots.color,
                fontFamily: 'monospace',
                z: 3
            });
            if (rootEl) elements.push(rootEl);
        }

        // ── OPENING (hollow trees) ──
        if (opening) {
            const ox = tx + opening.offsetX;
            const oy = trunkTop + opening.offsetY;
            const void_el = mason.buildWall({
                chars: [' '],
                textColor: '#0a0806', mortarColor: '#0a0806',
                fontSize: 10, lineHeight: 0.5, letterSpacing: 0,
                fontFamily: 'monospace',
                x: ox, y: oy,
                width: opening.width, height: opening.height,
                z: 7
            });
            if (void_el) {
                void_el.style.borderRadius = opening.arch ? `${opening.width/2}px ${opening.width/2}px 0 0` : '3px';
                void_el.style.boxShadow = 'inset 0 0 25px rgba(0,0,0,0.8)';
                elements.push(void_el);
            }
        }

        // ── EMBERS ──
        if (embers) {
            const emberInterval = setInterval(() => {
                if (!document.getElementById('sacred-grove')) {
                    clearInterval(emberInterval);
                    return;
                }
                mason.spawnParticles({
                    x: tx + (config.trunkOffsetX || 0) + trunkWidth/2,
                    y: trunkTop + trunkHeight * 0.4,
                    count: 2,
                    color: '#ff6b2b',
                    minSize: 1, maxSize: 3,
                    riseDistance: 40,
                    spreadX: 20,
                    durationMin: 1.5, durationMax: 3,
                    z: 45
                });
            }, 5000 + Math.random() * 4000);
        }

        return { elements, trunkTop, trunkBottom, canopyBottom };
    }

    // ═══════════════════════════════════
    // BUILD THE SACRED GROVE
    // ═══════════════════════════════════

    function buildGrove() {
        const container = document.getElementById('sacred-grove');
        container.innerHTML = '';
        const m = new GaiaMason('sacred-grove');

        // Register grove materials
        GaiaMason.MATERIALS['earth_loam'] = {
            chars: ['▓','░','▒','▓','░'], textColor:'#6a5a45', mortarColor:'#4a3a2a',
            fontSize:32, lineHeight:0.47, letterSpacing:-2, fontFamily:'monospace', weathering:0.08
        };
        GaiaMason.MATERIALS['moss_patch'] = {
            chars: ['░','▒','░','▒','░'], textColor:'#889966', mortarColor:'#667744',
            fontSize:14, lineHeight:0.5, letterSpacing:0, fontFamily:'monospace', weathering:0.18
        };

        // ═══════════════════════════════════
        // SKY
        // ═══════════════════════════════════

        m.buildWall({
            chars: ['⌒','⌣','~','⋅','⌒'],
            textColor: '#ffe8cc', mortarColor: '#ffd599',
            fontSize: 16, lineHeight: 0.6, letterSpacing: 3,
            fontFamily: "'Georgia',serif",
            x: 0, y: -40, width: 820, height: 65, z: -2
        });

        m.buildLight({ color: '#ffd599', radius: 70, x: 410, y: 15, pulse: true, z: 0 });
        m.buildLight({ color: '#ffd599', radius: 50, x: 250, y: 25, pulse: true, z: 0 });
        m.buildLight({ color: '#ffd599', radius: 50, x: 570, y: 25, pulse: true, z: 0 });

        // ═══════════════════════════════════
        // THE BLOOMING ANCIENT — center
        // ═══════════════════════════════════

        buildTree(m, {
            tx: 310, ty: 10,
            trunkOffsetX: 55,
            trunkChars: ['║','╫','║','╫','║'],
            trunkColor: '#4a3525',
            trunkWidth: 38,
            trunkHeight: 190,
            canopyLayers: [
                // Layer 1 — dark broad canopy (back)
                {
                    chars: ['▲','▲','◆','▲','▲'],
                    textColor: '#2d4a1a', mortarColor: '#1a2a0f',
                    fontSize: 30, width: 160, height: 70,
                    offsetX: -10, offsetY: 0,
                    z: 4, weathering: 0.08
                },
                // Layer 2 — mid green canopy
                {
                    chars: ['▲','◆','▲','▼','▲'],
                    textColor: '#3d5a2a', mortarColor: '#2d3a1f',
                    fontSize: 34, width: 140, height: 60,
                    offsetX: 0, offsetY: -8, overlap: 18,
                    z: 5
                },
                // Layer 3 — brighter crown
                {
                    chars: ['▲','◆','▲','◆','▲'],
                    textColor: '#5a8a4a', mortarColor: '#3a6a2a',
                    fontSize: 28, width: 100, height: 40,
                    offsetX: 20, offsetY: -5, overlap: 16,
                    z: 6
                },
                // Layer 4 — blossom overlay
                {
                    chars: ['❀','✿','❁','✾','❋'],
                    textColor: '#d8a8b8', mortarColor: 'transparent',
                    fontSize: 20, width: 130, height: 38,
                    offsetX: 5, offsetY: -6, overlap: 14,
                    z: 7, weathering: 0,
                    fontFamily: "'Georgia',serif",
                    letterSpacing: 0
                }
            ],
            roots: {
                chars: ['╽','╿','╽','╿','╽','╿','╽'],
                offsetX: 15,
                fontSize: 14,
                color: '#3d2b1f'
            }
        });

        // Glyph on the ancient
        m.buildInscription({
            text: '❀  ✿  ❁  ✾  ❋',
            x: 360, y: 160,
            fontSize: 12, color: 'rgba(216,168,184,0.3)',
            fontFamily: "'Georgia',serif", z: 8,
            animation: 'inscriptionGlow 5s ease-in-out infinite'
        });

        m.buildInscription({
            text: 'THE SACRED TREE',
            x: 345, y: -8,
            fontSize: 7, color: 'rgba(200,168,76,0.5)',
            fontFamily: "'Cinzel',serif", z: 9
        });

        // Zone: stand beneath
        const ancientZone = makeZone(310, 70, 200, 220, 'Stand beneath the Sacred Tree', () => {
            state.ancientWhispersHeard++;
            const whispers = [
                'Petals fall on your shoulders. They smell like honey and something older.',
                'The tree is celebrating. A wedding? A birth? A century of survival? All of them.',
                'One blossom lands in your palm. It\'s warm. It pulses, once. Then it\'s just a flower.',
                'A bee the size of your thumb drifts past. It\'s on pilgrimage.',
                'You feel it breathing. Slow. In. Out. One breath per season.'
            ];
            toast('🌸 ' + whispers[state.ancientWhispersHeard % whispers.length]);
            spawnPetals(390, 100, 12);
            saveState();
        });
        container.appendChild(ancientZone);

        // ═══════════════════════════════════
        // HOLLOW TREE — left exit
        // ═══════════════════════════════════

        buildTree(m, {
            tx: 30, ty: 300,
            trunkOffsetX: 28,
            trunkChars: ['║','╫','║','╫','║'],
            trunkColor: '#4a3525',
            trunkWidth: 28,
            trunkHeight: 130,
            canopyLayers: [
                { chars: ['▲','◆','▲','▼'], textColor:'#2d4a1a', mortarColor:'#1a2a0f', fontSize:22, width:100, height:48, offsetX:-5, offsetY:0, z:4, weathering:0.12 },
                { chars: ['▲','◆','▲','▼'], textColor:'#3d5a2a', mortarColor:'#2d3a1f', fontSize:24, width:90, height:40, offsetX:0, offsetY:-6, overlap:16, z:5 },
            ],
            roots: { chars:['╽','╿','╽','╿','╽'], offsetX:5, fontSize:12, color:'#3d2b1f' },
            opening: { offsetX: 0, offsetY: 28, width: 42, height: 70, arch: true }
        });

        m.buildInscription({
            text: 'TO THE DEEP',
            x: 42, y: 455,
            fontSize: 6, color: 'rgba(58,107,140,0.5)',
            fontFamily: "'Cinzel',serif", z: 9
        });

        const hollowLeftZone = makeZone(58, 340, 42, 70, 'Step into the hollow — descend to Poseidon', () => {
            toast('🌊 Salt air rises. The deep calls.');
            saveState();
            setTimeout(() => { window.location.href = '../poseidon/realm.html?from=demeter'; }, 1000);
        });
        container.appendChild(hollowLeftZone);

        // ═══════════════════════════════════
        // HOLLOW TREE — right exit
        // ═══════════════════════════════════

        buildTree(m, {
            tx: 680, ty: 280,
            trunkOffsetX: 25,
            trunkChars: ['║','╫','║','╫','║'],
            trunkColor: '#4a3525',
            trunkWidth: 28,
            trunkHeight: 130,
            canopyLayers: [
                { chars: ['▲','◆','▲','▼'], textColor:'#2d4a1a', mortarColor:'#1a2a0f', fontSize:22, width:100, height:48, offsetX:-5, offsetY:0, z:4, weathering:0.12 },
                { chars: ['▲','◆','▲','▼'], textColor:'#3d5a2a', mortarColor:'#2d3a1f', fontSize:24, width:90, height:40, offsetX:0, offsetY:-6, overlap:16, z:5 },
            ],
            roots: { chars:['╽','╿','╽','╿','╽'], offsetX:5, fontSize:12, color:'#3d2b1f' },
            opening: { offsetX: 0, offsetY: 28, width: 42, height: 70, arch: true }
        });

        m.buildInscription({
            text: 'TO THE HAVEN',
            x: 693, y: 435,
            fontSize: 6, color: 'rgba(184,134,11,0.5)',
            fontFamily: "'Cinzel',serif", z: 9
        });

        const hollowRightZone = makeZone(705, 320, 42, 70, 'Step into the hollow — rise to Gwalenn', () => {
            toast('🏛️ The Olympian Haven awaits.');
            saveState();
            setTimeout(() => { window.location.href = '../gwalenn.html?from=demeter'; }, 1000);
        });
        container.appendChild(hollowRightZone);

        // ═══════════════════════════════════
        // CHARRED STUMP — far left
        // ═══════════════════════════════════

        buildTree(m, {
            tx: 8, ty: 560,
            trunkOffsetX: 14,
            trunkChars: ['║','║','║'],
            trunkColor: '#1a1410',
            trunkWidth: 18,
            trunkHeight: 65,
            trunkZ: 3,
            canopyLayers: [
                { chars: ['▲','▲','◆','▲'], textColor:'#0f0c08', mortarColor:'#050505', fontSize:16, width:70, height:24, offsetX:-5, offsetY:0, z:3, weathering:0.4 },
                { chars: ['◆','▲','◆'], textColor:'#1a1410', mortarColor:'#0a0806', fontSize:14, width:50, height:18, offsetX:5, offsetY:-4, overlap:12, z:4, weathering:0.5 },
            ],
            embers: true
        });

        m.buildInscription({
            text: 'BURNED',
            x: 18, y: 635,
            fontSize: 5, color: 'rgba(196,79,28,0.3)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        const charredZone = makeZone(8, 570, 60, 75, 'Touch the charred stump', () => {
            toast('🔥 Still warm. The fire was recent. Or the tree has never stopped burning inside.');
            m.spawnParticles({ x: 35, y: 590, count: 5, color: '#ff6b2b', minSize: 2, maxSize: 4, riseDistance: 40, spreadX: 20, z: 45 });
            saveState();
        });
        container.appendChild(charredZone);

        // ═══════════════════════════════════
        // MATURE TREE — left mid
        // ═══════════════════════════════════

        buildTree(m, {
            tx: 140, ty: 390,
            trunkOffsetX: 16,
            trunkChars: ['║','║','║'],
            trunkColor: '#3d2b1f',
            trunkWidth: 16,
            trunkHeight: 90,
            canopyLayers: [
                { chars: ['▲','◆','▲','▼','▲'], textColor:'#3d5a2a', mortarColor:'#1a2a0f', fontSize:20, width:80, height:42, offsetX:-8, offsetY:0, z:4 },
                { chars: ['▲','◆','▲','◆','▲'], textColor:'#4a7a3a', mortarColor:'#2d3a1f', fontSize:18, width:65, height:32, offsetX:0, offsetY:-4, overlap:14, z:5 },
            ],
            roots: { chars:['╽','╿','╽','╿','╽'], offsetX:2, fontSize:10, color:'#3d2b1f' }
        });

        // ═══════════════════════════════════
        // MATURE TREE — right mid
        // ═══════════════════════════════════

        buildTree(m, {
            tx: 610, ty: 370,
            trunkOffsetX: 16,
            trunkChars: ['║','║','║'],
            trunkColor: '#3d2b1f',
            trunkWidth: 16,
            trunkHeight: 90,
            canopyLayers: [
                { chars: ['▲','◆','▲','▼','▲'], textColor:'#3d5a2a', mortarColor:'#1a2a0f', fontSize:20, width:80, height:42, offsetX:-8, offsetY:0, z:4 },
                { chars: ['▲','◆','▲','◆','▲'], textColor:'#4a7a3a', mortarColor:'#2d3a1f', fontSize:18, width:65, height:32, offsetX:0, offsetY:-4, overlap:14, z:5 },
            ],
            roots: { chars:['╽','╿','╽','╿','╽'], offsetX:2, fontSize:10, color:'#3d2b1f' }
        });

        // ═══════════════════════════════════
        // SAPLING CLUSTER — bottom right
        // ═══════════════════════════════════

        for (let i = 0; i < 3; i++) {
            const sx = 640 + i * 40;
            const sy = 560 + Math.random() * 25;
            buildTree(m, {
                tx: sx, ty: sy,
                trunkOffsetX: 4,
                trunkChars: ['╎'],
                trunkColor: '#3d5a2a',
                trunkWidth: 6,
                trunkHeight: 40,
                canopyLayers: [
                    { chars: ['▲','◆'], textColor:'#4a7a3a', mortarColor:'#2d3a1f', fontSize:11, width:22, height:18, offsetX:0, offsetY:0, z:4 },
                ]
            });
        }

        m.buildInscription({
            text: 'NEW GROWTH',
            x: 655, y: 545,
            fontSize: 5, color: 'rgba(74,122,58,0.35)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        // ═══════════════════════════════════
        // FLOOR
        // ═══════════════════════════════════

        m.buildFloor({
            ...GaiaMason.mat('earth_loam'),
            x: 15, y: 680, width: 790, height: 180, z: 0,
            perspectiveStrength: 7,
            glyphCarving: {
                text: '🌾  🌸  🍯  🌿  🌾  🌸  🍯  🌿',
                x: 110, y: 55,
                size: 16, spacing: 30,
                color: 'rgba(200,168,76,0.08)'
            }
        });

        // Moss
        m.buildWall({ ...GaiaMason.mat('moss_patch'), x: 50, y: 700, width: 130, height: 35, z: 1 });
        m.buildWall({ ...GaiaMason.mat('moss_patch'), x: 580, y: 720, width: 160, height: 30, z: 1 });

        // ═══════════════════════════════════
        // HARVEST ALTAR — center floor
        // ═══════════════════════════════════

        m.buildWall({
            ...GaiaMason.mat('marble_white'),
            x: 340, y: 720, width: 140, height: 80, z: 8,
            weathering: 0.06
        });

        m.buildWall({
            chars: ['╎','╎','╎','╎','╎'],
            textColor: '#c8a848', mortarColor: '#a88828',
            fontSize: 16, lineHeight: 0.5, letterSpacing: 1,
            fontFamily: 'monospace',
            x: 335, y: 712, width: 150, height: 16, z: 9
        });

        m.buildOfferingBowl({ x: 375, y: 685, z: 12, material: 'gold_leaf' });

        m.buildInscription({
            text: '🌾',
            x: 400, y: 698,
            fontSize: 22, color: 'rgba(200,168,76,0.5)',
            fontFamily: "'Georgia',serif", z: 13
        });

        m.buildInscription({
            text: 'HARVEST ALTAR',
            x: 368, y: 805,
            fontSize: 7, color: 'rgba(200,168,76,0.4)',
            fontFamily: "'Cinzel',serif", z: 10,
            animation: 'inscriptionGlow 4s ease-in-out infinite'
        });

        const altarZone = makeZone(340, 685, 140, 115, 'Make an offering at the Harvest Altar', () => {
            state.offeringsMade++;
            const offerings = [
                'You offer a sheaf of wheat. The altar warms beneath your hands.',
                'You offer honey. It sinks into the stone. Accepted.',
                'You offer a poppy bloom. The air sweetens.',
                'You offer nothing but your presence. The altar accepts anyway.',
            ];
            toast('🕯️ ' + offerings[state.offeringsMade % offerings.length]);
            spawnPetals(410, 710, 8);
            saveState();
        });
        container.appendChild(altarZone);

        // ═══════════════════════════════════
        // INSCRIPTIONS
        // ═══════════════════════════════════

        m.buildInscription({
            text: 'THE GROVE REMEMBERS EVERY SEED',
            x: 265, y: 840,
            fontSize: 8, color: 'rgba(200,168,76,0.28)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        m.buildInscription({
            text: 'DEMETER  ·  PERSEPHONE  ·  ARISTAEUS',
            x: 240, y: 858,
            fontSize: 6, color: 'rgba(136,153,102,0.35)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        // ═══════════════════════════════════
        // EXIT
        // ═══════════════════════════════════

        m.buildArch({
            chars: ['H','N','M','W'],
            textColor: '#889966', fontSize: 20,
            fontFamily: "'Cinzel','Georgia',serif",
            cx: 410, cy: 880, innerRadius: 50,
            stoneCount: 13, stoneDepth: 18, z: 10,
            keystoneChar: '🌾', keystoneOversize: 1.5
        });

        m.buildInscription({
            text: 'RETURN TO GAIA',
            x: 363, y: 945,
            fontSize: 7, color: 'rgba(136,153,102,0.5)',
            fontFamily: "'Cinzel',serif", z: 11
        });

        const exitZone = makeZone(360, 855, 100, 75, 'Leave the Sacred Grove', () => {
            saveState();
            toast('🌾 You bow to the Sacred Tree and step back through the wheat fields...');
            setTimeout(() => { window.location.href = '../index.html?from=demeter'; }, 1200);
        });
        exitZone.innerHTML = `<div style="width:100px;height:75px;background:radial-gradient(ellipse at center, rgba(136,153,102,0.1), transparent 70%);border-radius:50px 50px 0 0;"></div>`;
        container.appendChild(exitZone);

        // ═══════════════════════════════════
        // AMBIENT
        // ═══════════════════════════════════

        m.spawnAmbientFall({
            count: 8,
            color: 'rgba(255,200,210,0.3)',
            minSize: 2, maxSize: 4,
            speedMin: 12, speedMax: 25,
            z: 15
        });

        return m;
    }

    // ═══════════════════════════════════
    // INIT
    // ═══════════════════════════════════

    function init() {
        const loaded = loadState();
        if (!loaded) saveState();

        state.groveVisits++;
        saveState();

        const params = new URLSearchParams(window.location.search);
        if (params.get('from')) {
            toast(`🌳 You enter the Sacred Grove from the ${params.get('from')}. The ancient trees welcome you.`);
            window.history.replaceState({}, '', 'realm.html');
        } else {
            const welcome = state.groveVisits > 1
                ? '🌳 The Sacred Grove remembers you. The trees have missed your steps.'
                : '🌳 You step into the Sacred Grove. The ancient trees watch. The air smells of honey and earth.';
            toast(welcome);
        }

        buildGrove();

        setInterval(() => {
            spawnPetals(390, 80, 3 + Math.floor(Math.random() * 5));
        }, 7000 + Math.random() * 6000);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.target.closest('input,textarea')) {
                e.preventDefault();
                const altar = document.querySelector('[title="Make an offering at the Harvest Altar"]');
                if (altar) altar.click();
            }
        });
    }

    init();
    </script>
</body>
</html>
