<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cultivation Lab · Demeter's Farm · Digital Divination</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #1a1410; --deep: #2a2218; --stone: #3d362f;
            --parchment: #f5f0e0; --parchment-dim: #d8d0b8;
            --gold: #c9a84c; --gold-bright: #f0d080; --gold-dim: #8b7332;
            --sage: #889966; --sage-light: #aabb88; --earth: #8b7355;
            --honey: #e8a830; --locked: #55aa55; --error: #cc4444;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--void);
            color: var(--parchment);
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(136,153,102,0.06) 0%, transparent 60%);
        }

        /* ── HEADER ── */
        .lab-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.8rem 1.5rem;
            background: rgba(26,20,16,0.95);
            border-bottom: 1px solid rgba(200,168,76,0.15);
            position: sticky; top:0; z-index: 100;
        }
        .lab-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.9rem; color: var(--gold-bright);
            letter-spacing: 0.2em;
        }
        .lab-subtitle {
            font-family: 'Cinzel', serif; font-size: 0.45rem;
            letter-spacing: 0.25em; color: var(--gold-dim);
            text-transform: uppercase;
        }
        .lab-nav {
            display: flex; gap: 1rem; align-items: center;
        }
        .lab-nav a {
            font-family: 'Cinzel', serif; font-size: 0.5rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--gold-dim); text-decoration: none;
            transition: color 0.2s;
        }
        .lab-nav a:hover { color: var(--gold-bright); }

        /* ── TOOLBAR ── */
        .toolbar {
            display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;
            padding: 0.7rem 1.5rem;
            background: rgba(26,20,16,0.7);
            border-bottom: 1px solid rgba(200,168,76,0.08);
        }
        .toolbar label {
            font-family: 'Cinzel', serif; font-size: 0.45rem;
            letter-spacing: 0.15em; color: var(--sage-light);
            text-transform: uppercase;
        }
        .toolbar select, .toolbar input {
            background: rgba(10,8,6,0.6); border: 1px solid rgba(200,168,76,0.2);
            color: var(--parchment); padding: 0.3rem 0.5rem;
            font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
            border-radius: 2px; outline: none;
        }
        .toolbar select:focus, .toolbar input:focus { border-color: var(--gold); }
        .tool-btn {
            font-family: 'Cinzel', serif; font-size: 0.5rem;
            letter-spacing: 0.15em; text-transform: uppercase;
            padding: 0.35rem 0.8rem; border-radius: 2px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-compare {
            background: var(--gold-dim); border: none; color: var(--void);
        }
        .btn-compare:hover { background: var(--gold); }
        .btn-save {
            background: transparent; border: 1px solid var(--locked); color: var(--locked);
        }
        .btn-save:hover { background: rgba(68,204,136,0.1); }
        .btn-reset {
            background: transparent; border: 1px solid var(--error); color: var(--error);
        }
        .btn-reset:hover { background: rgba(204,68,68,0.1); }
        .btn-json {
            background: transparent; border: 1px solid rgba(200,168,76,0.25);
            color: var(--gold-dim); font-family: 'JetBrains Mono', monospace;
        }
        .btn-json:hover { border-color: var(--gold); color: var(--gold-bright); }
        .btn-json.active { border-color: var(--gold); color: var(--gold-bright); background: rgba(200,168,76,0.08); }

        /* ── MAIN PANELS ── */
        .panels {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0;
            height: calc(100vh - 140px); min-height: 500px;
        }
        .panel {
            position: relative; overflow: hidden;
            border-right: 1px solid rgba(200,168,76,0.1);
        }
        .panel:last-child { border-right: none; }
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.5rem 1rem;
            background: rgba(26,20,16,0.8);
            border-bottom: 1px solid rgba(200,168,76,0.1);
        }
        .panel-label {
            font-family: 'Cinzel Decorative', serif; font-size: 0.6rem;
            letter-spacing: 0.15em;
        }
        .panel-a .panel-label { color: var(--sage-light); }
        .panel-b .panel-label { color: var(--honey); }
        .panel-variant {
            font-family: 'JetBrains Mono', monospace; font-size: 0.45rem;
            color: rgba(200,168,76,0.4);
        }
        .panel-render {
            width: 100%; height: calc(100% - 38px);
            position: relative; overflow: hidden;
        }

        /* ── JSON EDITOR OVERLAY ── */
        .json-editor {
            display: none; position: absolute; inset: 38px 0 0 0;
            z-index: 50; background: rgba(10,8,6,0.97);
            flex-direction: column;
        }
        .json-editor.active { display: flex; }
        .json-editor textarea {
            flex: 1; background: transparent; border: none;
            color: var(--sage-light); padding: 1rem;
            font-family: 'JetBrains Mono', monospace; font-size: 0.55rem;
            resize: none; outline: none; line-height: 1.6;
        }
        .json-editor textarea:focus { background: rgba(0,0,0,0.2); }
        .json-actions {
            display: flex; gap: 0.5rem; padding: 0.5rem 1rem;
            border-top: 1px solid rgba(200,168,76,0.1);
            justify-content: flex-end;
        }

        /* ── TOAST ── */
        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(26,20,16,0.97); border: 1px solid var(--gold);
            border-radius: 3px; padding: 0.5rem 1.2rem;
            font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.1em;
            z-index: 200; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; text-align: center; max-width: 90vw;
        }
        #toast.show { opacity: 1; }
        #toast.success { border-color: var(--locked); color: var(--locked); }
        #toast.error { border-color: var(--error); color: var(--error); }

        @media (max-width: 800px) {
            .panels { grid-template-columns: 1fr; height: auto; }
            .panel { height: 400px; border-right: none; border-bottom: 1px solid rgba(200,168,76,0.1); }
        }
    </style>
</head>
<body>

    <div class="lab-header">
        <div>
            <div class="lab-title">🌾 THE CULTIVATION LAB</div>
            <div class="lab-subtitle">Demeter's Farm · A/B Test Bed · Grow the Primitives</div>
        </div>
        <div class="lab-nav">
            <a href="index.html">← Temple</a>
            <a href="../index.html">🌍 GAIA</a>
        </div>
    </div>

    <div class="toolbar">
        <label>Object:</label>
        <select id="objectSelect" onchange="loadObject()">
            <option value="tree">tree.json</option>
            <option value="well">well.json</option>
            <option value="altar">altar.json</option>
            <option value="crop">crop.json</option>
        </select>
        <label>A:</label>
        <select id="variantASelect" onchange="renderPanel('A')"></select>
        <label>B:</label>
        <select id="variantBSelect" onchange="renderPanel('B')"></select>
        <button class="tool-btn btn-compare" onclick="compare()">⟳ Compare</button>
        <button class="tool-btn btn-save" onclick="saveVariant('A')">💾 Save A</button>
        <button class="tool-btn btn-save" onclick="saveVariant('B')">💾 Save B</button>
        <button class="tool-btn btn-json" id="jsonToggleA" onclick="toggleEditor('A')">{ } Edit A</button>
        <button class="tool-btn btn-json" id="jsonToggleB" onclick="toggleEditor('B')">{ } Edit B</button>
    </div>

    <div class="panels">
        <!-- PANEL A -->
        <div class="panel panel-a" id="panelA">
            <div class="panel-header">
                <span class="panel-label">🌱 VERSION A</span>
                <span class="panel-variant" id="variantALabel">sapling</span>
            </div>
            <div class="panel-render" id="renderA"></div>
            <div class="json-editor" id="editorA">
                <textarea id="jsonTextA" spellcheck="false"></textarea>
                <div class="json-actions">
                    <button class="tool-btn btn-reset" onclick="resetJSON('A')">↺ Reset</button>
                    <button class="tool-btn btn-compare" onclick="applyJSON('A')">⟳ Apply & Render</button>
                </div>
            </div>
        </div>

        <!-- PANEL B -->
        <div class="panel panel-b" id="panelB">
            <div class="panel-header">
                <span class="panel-label">🌳 VERSION B</span>

            <div class="panel-render" id="renderB"></div>
            <div class="json-editor" id="editorB">

                <div class="json-actions">

            </div>
        </div>
    </div>

    // ═══════════════════════════════════
    // STATE
    // ═══════════════════════════════════

    let currentObject = 'tree';
    let variantA = 'sapling';
    let variantB = 'mature';
    let editedJSON = { A: null, B: null };

    // ═══════════════════════════════════
    // TOAST
    // ═══════════════════════════════════

    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg, type = '') {
        toastEl.textContent = msg; toastEl.className = 'show ' + (type || '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toastEl.className = ''; }, 2500);
    }

    // ═══════════════════════════════════
    // LOAD OBJECT → POPULATE VARIANTS
    // ═══════════════════════════════════

    function loadObject() {
        currentObject = document.getElementById('objectSelect').value;
        const obj = OBJECT_LIBRARY[currentObject];
        const variantNames = Object.keys(obj.variants);

        // Populate dropdowns
        ['A', 'B'].forEach(panel => {
            const select = document.getElementById(`variant${panel}Select`);
            select.innerHTML = variantNames.map(v => `<option value="${v}">${v}</option>`).join('');
        });

        // Reset to first two variants
        variantA = variantNames[0];
        variantB = variantNames.length > 1 ? variantNames[1] : variantNames[0];
        document.getElementById('variantASelect').value = variantA;
        document.getElementById('variantBSelect').value = variantB;

        editedJSON = { A: null, B: null };
        renderPanel('A');
        renderPanel('B');
        toast(`📦 Loaded: ${obj.name} (${variantNames.length} variants)`);
    }

    // ═══════════════════════════════════
    // BUILD FROM VARIANT
    // ═══════════════════════════════════

    function buildVariant(containerId, variantData) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        
        // Give the container a unique ID for GaiaMason
        const masonId = containerId + '-mason';
        const masonDiv = document.createElement('div');
        masonDiv.id = masonId;
        masonDiv.style.cssText = 'position:relative;width:100%;height:100%;';
        container.appendChild(masonDiv);

        const m = new GaiaMason(masonId);

        // Background
        m.buildWall({
            chars: ['▓','░','▒','▓','░'],
            textColor: '#5c4f42', mortarColor: '#3a3028',
            fontSize: 30, lineHeight: 0.47, letterSpacing: -2,
            fontFamily: "'Georgia',serif",
            x: 0, y: 0, width: 400, height: 340, z: 0
        });

        // Build the main object
        const data = JSON.parse(JSON.stringify(variantData)); // Deep clone
        const pos = data;
        const dim = data;

        switch (data.build) {
            case 'pillar':
                m.buildPillar({
                    chars: data.chars, textColor: data.textColor, mortarColor: data.mortarColor,
                    fontSize: data.fontSize, fontFamily: data.fontFamily || 'monospace',
                    x: data.x, y: data.y, width: data.width, height: data.height, z: data.z
                });
                break;
            case 'wall':
                m.buildWall({
                    chars: data.chars, textColor: data.textColor, mortarColor: data.mortarColor,
                    fontSize: data.fontSize, lineHeight: data.lineHeight || 0.47,
                    letterSpacing: data.letterSpacing || -2,
                    fontFamily: data.fontFamily || "'Georgia',serif",
                    x: data.x, y: data.y, width: data.width, height: data.height,
                    z: data.z, shape: data.shape || null
                });
                break;
            case 'inscription':
                m.buildInscription({
                    text: data.text, x: data.x, y: data.y,
                    fontSize: data.fontSize, color: data.color,
                    fontFamily: data.fontFamily || "'Georgia',serif", z: data.z
                });
                break;
        }

        // Build canopy if present
        if (data.canopy) {
            m.buildWall({
                chars: data.canopy.chars,
                textColor: data.canopy.textColor,
                mortarColor: data.canopy.mortarColor,
                fontSize: data.canopy.fontSize,
                lineHeight: 0.4, letterSpacing: -2,
                fontFamily: 'monospace',
                x: data.x + (data.canopy.offsetX || 0),
                y: data.y + (data.canopy.offsetY || 0),
                width: data.canopy.width,
                height: data.canopy.height,
                z: data.canopy.z || 5
            });
        }

        // Build blossom if present
        if (data.blossom) {
            const bl = m.buildWall({
                chars: data.blossom.chars,
                textColor: data.blossom.textColor,
                mortarColor: data.blossom.mortarColor,
                fontSize: data.blossom.fontSize,
                lineHeight: 0.45, letterSpacing: 0,
                fontFamily: "'Georgia',serif",
                x: data.x + (data.blossom.offsetX || 0),
                y: data.y + (data.blossom.offsetY || 0),
                width: data.blossom.width,
                height: data.blossom.height,
                z: data.blossom.z || 6
            });
            if (bl) bl.style.background = 'transparent';
        }

        // Build roots inscription
        if (data.roots) {
            m.buildInscription({
                text: data.roots.text,
                x: data.roots.x, y: data.roots.y,
                fontSize: data.roots.fontSize,
                color: data.roots.color,
                fontFamily: 'monospace', z: 2
            });
        }

        // Build inscription
        if (data.inscription) {
            m.buildInscription({
                text: data.inscription.text,
                x: data.inscription.x, y: data.inscription.y,
                fontSize: data.inscription.size,
                color: data.inscription.color,
                fontFamily: "'Georgia',serif", z: 4
            });
        }

        // Build inner object (for wells)
        if (data.inner) {
            m.buildWall({
                chars: data.inner.chars,
                textColor: data.inner.textColor,
                mortarColor: data.inner.mortarColor,
                fontSize: data.inner.fontSize,
                lineHeight: 0.5, letterSpacing: 0,
                fontFamily: "'Georgia',serif",
                x: data.x + (data.inner.offsetX || 0),
                y: data.y + (data.inner.offsetY || 0),
                width: data.inner.width,
                height: data.inner.height,
                z: data.inner.z || 3,
                shape: data.inner.shape || null
            });
        }

        // Build roof/pillar (for wells)
        if (data.roof) {
            m.buildPillar({
                chars: data.roof.chars,
                textColor: data.roof.textColor,
                mortarColor: data.roof.mortarColor,
                fontSize: data.roof.fontSize,
                fontFamily: 'monospace',
                x: data.x + (data.roof.offsetX || 0),
                y: data.y + (data.roof.offsetY || 0),
                width: data.roof.width,
                height: data.roof.height,
                z: data.roof.z || 6
            });
        }

        // Build opening (hollow tree)
        if (data.opening) {
            const dark = m.buildWall({
                chars: [' '],
                textColor: '#0a0806', mortarColor: '#0a0806',
                fontSize: 10, lineHeight: 0.5, letterSpacing: 0,
                fontFamily: 'monospace',
                x: data.opening.x, y: data.opening.y,
                width: data.opening.width, height: data.opening.height,
                z: 7
            });
            if (dark) {
                dark.style.borderRadius = data.opening.arch ? 
                    `${data.opening.width/2}px ${data.opening.width/2}px 0 0` : '2px';
                dark.style.boxShadow = 'inset 0 0 20px rgba(0,0,0,0.8)';
            }
        }

        // Floor
        m.buildFloor({
            chars: ['▓','░','▒','▓','░'],
            textColor: '#5c4f42', mortarColor: '#3a3028',
            fontSize: 32, lineHeight: 0.47, letterSpacing: -2,
            fontFamily: "'Georgia',serif",
            x: 0, y: 300, width: 400, height: 40, z: 0,
            perspectiveStrength: 5
        });

        return m;
    }

    // ═══════════════════════════════════
    // RENDER PANEL
    // ═══════════════════════════════════

    function renderPanel(panel) {
        const variantName = panel === 'A' ? variantA : variantB;
        const containerId = panel === 'A' ? 'renderA' : 'renderB';
        const labelId = panel === 'A' ? 'variantALabel' : 'variantBLabel';

        document.getElementById(labelId).textContent = variantName;

        // Use edited JSON if available, otherwise use library variant
        let variantData;
        if (editedJSON[panel]) {
            try {
                variantData = JSON.parse(editedJSON[panel]);
            } catch(e) {
                toast('Invalid JSON — using library variant', 'error');
                variantData = OBJECT_LIBRARY[currentObject].variants[variantName];
            }
        } else {
            variantData = OBJECT_LIBRARY[currentObject].variants[variantName];
        }

        buildVariant(containerId, variantData);
    }

    // ═══════════════════════════════════
    // COMPARE
    // ═══════════════════════════════════

    function compare() {
        variantA = document.getElementById('variantASelect').value;
        variantB = document.getElementById('variantBSelect').value;
        editedJSON = { A: null, B: null };
        renderPanel('A');
        renderPanel('B');
        toast(`⟳ Comparing: ${variantA} vs ${variantB}`);
    }

    // ═══════════════════════════════════
    // JSON EDITOR
    // ═══════════════════════════════════

    function toggleEditor(panel) {
        const editor = document.getElementById(`editor${panel}`);
        const btn = document.getElementById(`jsonToggle${panel}`);
        const isActive = editor.classList.contains('active');

        if (isActive) {
            editor.classList.remove('active');
            btn.classList.remove('active');
        } else {
            // Populate textarea with current variant JSON
            const variantName = panel === 'A' ? variantA : variantB;
            const source = editedJSON[panel] || 
                JSON.stringify(OBJECT_LIBRARY[currentObject].variants[variantName], null, 2);
            document.getElementById(`jsonText${panel}`).value = source;
            editor.classList.add('active');
            btn.classList.add('active');
        }
    }

    function applyJSON(panel) {
        const text = document.getElementById(`jsonText${panel}`).value;
        try {
            JSON.parse(text); // Validate
            editedJSON[panel] = text;
            renderPanel(panel);
            document.getElementById(`editor${panel}`).classList.remove('active');
            document.getElementById(`jsonToggle${panel}`).classList.remove('active');
            toast(`✅ JSON applied to Panel ${panel}`, 'success');
        } catch(e) {
            toast(`❌ Invalid JSON: ${e.message}`, 'error');
        }
    }

    function resetJSON(panel) {
        editedJSON[panel] = null;
        const variantName = panel === 'A' ? variantA : variantB;
        document.getElementById(`jsonText${panel}`).value = 
            JSON.stringify(OBJECT_LIBRARY[currentObject].variants[variantName], null, 2);
        toast(`↺ Panel ${panel} reset to library variant`);
    }

    // ═══════════════════════════════════
    // SAVE VARIANT
    // ═══════════════════════════════════

    function saveVariant(panel) {
        const variantName = panel === 'A' ? variantA : variantB;
        let data;
        
        if (editedJSON[panel]) {
            try { data = JSON.parse(editedJSON[panel]); }
            catch(e) { toast('❌ Cannot save invalid JSON', 'error'); return; }
        } else {
            data = OBJECT_LIBRARY[currentObject].variants[variantName];
        }

        // Store in localStorage as a custom variant
        const savedVariants = JSON.parse(localStorage.getItem('demeter_cultivars') || '{}');
        const key = `${currentObject}_${variantName}`;
        savedVariants[key] = data;
        localStorage.setItem('demeter_cultivars', JSON.stringify(savedVariants));

        // Also add to library for this session
        if (!OBJECT_LIBRARY[currentObject].variants._custom) {
            OBJECT_LIBRARY[currentObject].variants._custom = {};
        }
        OBJECT_LIBRARY[currentObject].variants._custom[variantName] = data;

        toast(`💾 Saved: ${currentObject}/${variantName}`, 'success');
    }

    // ═══════════════════════════════════
    // INIT
    // ═══════════════════════════════════

    function init() {
        loadObject();
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' && e.ctrlKey) {
                e.preventDefault();
                compare();
            }
            if (e.key === 's' && e.ctrlKey && e.shiftKey) {
                e.preventDefault();
                saveVariant('A');
                saveVariant('B');
                toast('💾 Both variants saved', 'success');
            }
        });
    }

    init();
    </script>
</body>
</html>
