<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aristaeus · The Strategist · GAIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0e06;
            color: #c8b890;
            font-family: 'Cinzel', Georgia, serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* ── SCENE (left, main) ── */
        #field-scene {
            position: relative;
            flex: 1;
            height: 100vh;
            overflow: hidden;
        }

        /* ── PANEL (right sidebar) ── */
        #aristaeus-panel {
            width: 260px;
            min-width: 260px;
            height: 100vh;
            background: rgba(8,12,4,0.97);
            border-left: 1px solid rgba(140,160,60,0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
        }

        .panel-header {
            padding: 18px 16px 12px;
            border-bottom: 1px solid rgba(140,160,60,0.15);
        }

        .panel-header h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 13px;
            color: rgba(180,200,80,0.9);
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        .panel-header p {
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(140,160,60,0.45);
            text-transform: uppercase;
            line-height: 1.5;
        }

        .panel-section {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(140,160,60,0.1);
        }

        .section-label {
            font-size: 7px;
            letter-spacing: 3px;
            color: rgba(140,160,60,0.5);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* Preset buttons */
        .preset-btn {
            display: block;
            width: 100%;
            background: rgba(20,28,8,0.8);
            border: 1px solid rgba(140,160,60,0.2);
            color: rgba(180,200,80,0.75);
            font-family: 'Cinzel', serif;
            font-size: 9px;
            letter-spacing: 1px;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 2px;
            text-align: left;
            margin-bottom: 5px;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            background: rgba(40,56,16,0.9);
            border-color: rgba(180,200,80,0.4);
            color: #c8d880;
        }

        .preset-btn.active {
            background: rgba(60,80,20,0.9);
            border-color: rgba(200,220,80,0.6);
            color: #d8e890;
        }

        .preset-btn .preset-meta {
            display: block;
            font-size: 7px;
            color: rgba(140,160,60,0.4);
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* Override controls */
        .ctrl-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .ctrl-label-sm {
            font-size: 7px;
            letter-spacing: 2px;
            color: rgba(140,160,60,0.45);
            text-transform: uppercase;
            margin-bottom: 5px;
            margin-top: 8px;
        }

        .ctrl-btn {
            background: rgba(20,28,8,0.8);
            border: 1px solid rgba(140,160,60,0.2);
            color: rgba(160,180,70,0.7);
            font-family: 'Cinzel', serif;
            font-size: 8px;
            letter-spacing: 1px;
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(40,56,16,0.9);
            border-color: rgba(180,200,80,0.4);
            color: #c8d880;
        }

        .ctrl-btn.active {
            background: rgba(60,80,20,0.9);
            border-color: rgba(200,220,80,0.6);
            color: #d8e890;
        }

        select.ctrl-select {
            background: rgba(20,28,8,0.9);
            border: 1px solid rgba(140,160,60,0.25);
            color: rgba(160,180,70,0.8);
            font-family: 'Cinzel', serif;
            font-size: 8px;
            letter-spacing: 1px;
            padding: 5px 8px;
            border-radius: 2px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 6px;
        }

        select.ctrl-select option {
            background: #0a0e06;
        }

        /* Action buttons */
        .action-btn {
            display: block;
            width: 100%;
            padding: 10px 12px;
            font-family: 'Cinzel Decorative', serif;
            font-size: 9px;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 2px;
            margin-bottom: 6px;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-compose {
            background: rgba(60,80,20,0.9);
            border: 1px solid rgba(180,200,80,0.5);
            color: #d8e890;
        }
        .btn-compose:hover {
            background: rgba(80,100,24,0.95);
            border-color: rgba(200,220,80,0.8);
        }

        .btn-random {
            background: rgba(40,30,8,0.9);
            border: 1px solid rgba(200,160,40,0.4);
            color: rgba(200,160,40,0.9);
        }
        .btn-random:hover {
            background: rgba(60,44,12,0.95);
            border-color: rgba(200,160,40,0.7);
        }

        .btn-export {
            background: rgba(8,20,40,0.9);
            border: 1px solid rgba(80,140,200,0.4);
            color: rgba(140,180,220,0.9);
        }
        .btn-export:hover {
            background: rgba(12,30,60,0.95);
            border-color: rgba(100,160,220,0.7);
        }

        /* Status */
        #status-bar {
            padding: 10px 16px;
            font-size: 8px;
            letter-spacing: 1px;
            color: rgba(140,160,60,0.5);
            border-bottom: 1px solid rgba(140,160,60,0.1);
            min-height: 36px;
            line-height: 1.6;
        }

        /* Export area */
        #export-area {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 0;
        }

        #export-area.visible {
            display: flex;
        }

        #export-area .export-header {
            padding: 10px 16px 6px;
            font-size: 7px;
            letter-spacing: 2px;
            color: rgba(80,140,200,0.6);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(80,140,200,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #export-area .copy-btn {
            background: rgba(8,20,40,0.9);
            border: 1px solid rgba(80,140,200,0.3);
            color: rgba(140,180,220,0.8);
            font-family: 'Cinzel', serif;
            font-size: 7px;
            letter-spacing: 1px;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 2px;
        }

        #export-area .copy-btn:hover {
            border-color: rgba(100,160,220,0.6);
            color: #90c0e8;
        }

        #export-textarea {
            flex: 1;
            background: rgba(4,8,16,0.95);
            border: none;
            color: rgba(100,160,100,0.8);
            font-family: 'Courier New', monospace;
            font-size: 9px;
            line-height: 1.5;
            padding: 12px;
            resize: none;
            outline: none;
        }

        /* Scrollbar */
        #aristaeus-panel::-webkit-scrollbar { width: 3px; }
        #aristaeus-panel::-webkit-scrollbar-track { background: transparent; }
        #aristaeus-panel::-webkit-scrollbar-thumb { background: rgba(140,160,60,0.25); }

        /* Build counter */
        #build-badge {
            display: inline-block;
            background: rgba(60,80,20,0.6);
            border: 1px solid rgba(140,160,60,0.3);
            color: rgba(180,200,80,0.7);
            font-size: 7px;
            padding: 2px 6px;
            border-radius: 10px;
            letter-spacing: 1px;
            margin-left: 6px;
        }
    </style>
</head>
<body>

<!-- SCENE -->
<div id="field-scene"></div>

<!-- CONTROL PANEL -->
<div id="aristaeus-panel">

    <div class="panel-header">
        <h1>✦ Aristaeus</h1>
        <p>Son of Apollo · God of the Rural Arts<br>Keeper of Hives · Guardian of Herds</p>
    </div>

    <div id="status-bar">Awaiting composition...</div>

    <!-- PRESETS -->
    <div class="panel-section">
        <div class="section-label">Scene Presets</div>
        <button class="preset-btn active" data-preset="spring_morning" onclick="selectPreset('spring_morning', this)">
            Spring Morning
            <span class="preset-meta">dawn · skep hives · meadow hares</span>
        </button>
        <button class="preset-btn" data-preset="summer_day" onclick="selectPreset('summer_day', this)">
            Summer Day
            <span class="preset-meta">full sun · clay hives · scattered pack</span>
        </button>
        <button class="preset-btn" data-preset="autumn_dusk" onclick="selectPreset('autumn_dusk', this)">
            Autumn Dusk
            <span class="preset-meta">golden hour · log hives · nervous hares</span>
        </button>
        <button class="preset-btn" data-preset="winter_night" onclick="selectPreset('winter_night', this)">
            Winter Night
            <span class="preset-meta">dark sky · no swarm · dream hares</span>
        </button>
        <button class="preset-btn" data-preset="chaos_field" onclick="selectPreset('chaos_field', this)">
            Chaos Field
            <span class="preset-meta">all 11 hares · max hives · full chaos</span>
        </button>
    </div>

    <!-- OVERRIDES -->
    <div class="panel-section">
        <div class="section-label">Overrides</div>

        <div class="ctrl-label-sm">Season</div>
        <select class="ctrl-select" id="override-season">
            <option value="">— preset default —</option>
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="autumn">Autumn</option>
            <option value="winter">Winter</option>
        </select>

        <div class="ctrl-label-sm">Time of Day</div>
        <select class="ctrl-select" id="override-time">
            <option value="">— preset default —</option>
            <option value="dawn">Dawn</option>
            <option value="day">Day</option>
            <option value="dusk">Dusk</option>
            <option value="night">Night</option>
        </select>

        <div class="ctrl-label-sm">Hare Variant</div>
        <select class="ctrl-select" id="override-variant">
            <option value="">— preset default —</option>
            <option value="meadow">Meadow</option>
            <option value="nervous">Nervous</option>
            <option value="dream">Dream</option>
            <option value="king">King</option>
            <option value="chaos">Chaos</option>
        </select>

        <div class="ctrl-label-sm">Farm Layout</div>
        <select class="ctrl-select" id="override-layout">
            <option value="">— preset default —</option>
            <option value="scattered">Scattered</option>
            <option value="row">Row</option>
            <option value="ring">Ring</option>
        </select>
    </div>

    <!-- ACTIONS -->
    <div class="panel-section">
        <button class="action-btn btn-compose" onclick="compose()">
            ✦ Compose Scene
        </button>
        <button class="action-btn btn-random" onclick="randomize()">
            ⟳ Randomize
        </button>
        <button class="action-btn btn-export" onclick="exportScene()">
            ↓ Export HTML
        </button>
    </div>

    <!-- EXPORT AREA -->
    <div id="export-area">
        <div class="export-header">
            <span id="export-filename">field.html</span>
            <button class="copy-btn" onclick="copyExport()">Copy</button>
        </div>
        <textarea id="export-textarea" readonly spellcheck="false"></textarea>
    </div>

</div>

<script src="../js/gaia-mason.js"></script>
<script src="js/field-builder.js"></script>
<script src="js/farm-builder.js"></script>
<script src="js/hive-builder.js"></script>
<script src="js/hare-builder.js"></script>
<script src="js/aristaeus.js"></script>
<script>

// ─── INIT ───

const director = new Aristaeus('field-scene');
let selectedPreset = 'spring_morning';

// ─── PRESET SELECTION ───

function selectPreset(name, btn) {
    selectedPreset = name;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Hide export when changing preset
    document.getElementById('export-area').classList.remove('visible');
}

// ─── COMPOSE ───

function compose() {
    const overrides = {};

    const season  = document.getElementById('override-season').value;
    const time    = document.getElementById('override-time').value;
    const variant = document.getElementById('override-variant').value;
    const layout  = document.getElementById('override-layout').value;

    if (season || time) {
        overrides.field = {};
        if (season) overrides.field.season = season;
        if (time)   overrides.field.time   = time;
    }
    if (variant) overrides.hares = { variant };
    if (layout)  overrides.farm  = { layout };

    setStatus('Composing...');

    try {
        director.compose(selectedPreset, overrides);
        // Status update after hares finish spawning
        setTimeout(() => {
            const h = director.hareBuilder ? director.hareBuilder.hares.length : 0;
            const hv = director.hiveBuilder ? director.hiveBuilder.hives.length : 0;
            setStatus(`Scene composed · ${h} hares · ${hv} hives`);
        }, 1000);
    } catch(e) {
        setStatus('Error: ' + e.message);
        console.error(e);
    }

    // Close export
    document.getElementById('export-area').classList.remove('visible');
}

// ─── RANDOMIZE ───

function randomize() {
    setStatus('Rolling the dice...');
    // Reset overrides
    document.getElementById('override-season').value  = '';
    document.getElementById('override-time').value    = '';
    document.getElementById('override-variant').value = '';
    document.getElementById('override-layout').value  = '';

    director.randomize();

    const preset = director.currentPreset;
    const presetDef = Aristaeus.PRESETS[preset];

    // Highlight the active preset button
    document.querySelectorAll('.preset-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.preset === preset);
    });

    setTimeout(() => {
        const h = director.hareBuilder ? director.hareBuilder.hares.length : 0;
        setStatus(`${presetDef.label} · ${h} hares`);
    }, 1000);

    document.getElementById('export-area').classList.remove('visible');
}

// ─── EXPORT ───

function exportScene() {
    if (!director.currentConfig) {
        setStatus('Compose a scene first.');
        return;
    }

    const buildNum = director._buildCount;
    const { html, filename } = director.export({ filename: `field${buildNum}.html` });

    document.getElementById('export-filename').textContent = filename;
    document.getElementById('export-textarea').value = html;
    document.getElementById('export-area').classList.add('visible');

    setStatus(`Ready to export as ${filename}`);
}

function copyExport() {
    const ta = document.getElementById('export-textarea');
    ta.select();
    navigator.clipboard.writeText(ta.value).then(() => {
        setStatus('Copied to clipboard · ready to commit');
    }).catch(() => {
        // Fallback
        document.execCommand('copy');
        setStatus('Copied · ready to commit');
    });
}

// ─── STATUS ───

function setStatus(msg) {
    document.getElementById('status-bar').textContent = msg;
}

// ─── LISTEN FOR COMPOSE EVENTS ───

document.getElementById('field-scene').addEventListener('aristaeus-composed', (e) => {
    console.log('[Aristaeus] Scene composed:', e.detail);
});

// ─── AUTO-COMPOSE ON LOAD ───

window.addEventListener('load', () => {
    setTimeout(() => compose(), 400);
});

</script>
</body>
</html>
