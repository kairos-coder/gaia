<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwalenn de Olympia · The Olympian Haven</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c; --gold-bright: #f0d080; --gold-dim: #6b5520;
            --marble: #d8d0c8; --marble-dark: #b0a8a0;
            --void: #0a0806; --deep: #1a1410;
            --flame: #ffcc44; --flame-core: #ffaa00;
            --sky: #4488cc; --sky-bright: #88bbff;
            --kronos: #7a6a9a; --kronos-bright: #b0a0d0;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--void);
            color: var(--marble);
            font-family: 'EB Garamond','Georgia',serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(10,8,6,0.95) 0%, transparent 50%);
        }

        .gwalenn-header {
            text-align: center; padding: 1rem 1rem 0.2rem; width: 100%; z-index: 10;
        }
        .gwalenn-header h1 {
            font-family: 'Cinzel Decorative',serif;
            font-size: clamp(1.6rem,4vw,2.6rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-dim), var(--gold-bright), var(--gold), var(--gold-dim));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            filter: drop-shadow(0 0 20px rgba(201,168,76,0.5));
            letter-spacing: 0.2em;
        }
        .gwalenn-header .subtitle {
            font-family: 'Cinzel',serif; font-size: 0.65rem; color: var(--gold-dim);
            letter-spacing: 0.3em; text-transform: uppercase;
        }

        #gwalenn-scene {
            position: relative; width: 860px; max-width: 98vw;
            height: 600px; margin: 0.3rem auto 1rem; overflow: hidden;
            background: var(--void);
            border: 3px solid rgba(201,168,76,0.12); border-radius: 4px;
            box-shadow: 0 0 100px rgba(0,0,0,0.6), 0 0 200px rgba(0,0,0,0.3);
        }
        @media (max-width: 880px) {
            #gwalenn-scene { width: 98vw; height: calc(98vw * 0.7); }
        }

        .zone, .altar-zone, .altar-object-zone { cursor: pointer; transition: filter 0.25s, transform 0.25s; }
        .zone:hover, .altar-zone:hover, .altar-object-zone:hover { filter: brightness(1.35); z-index: 50 !important; }
        .zone:active, .altar-zone:active { transform: scale(0.94); }

        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(10,8,6,0.95); border: 1px solid var(--gold);
            border-radius: 6px; padding: 0.5rem 1.2rem;
            font-family: 'EB Garamond','Georgia',serif; font-size: 0.8rem;
            z-index: 200; opacity: 0; transition: opacity 0.4s;
            pointer-events: none; text-align: center; max-width: 440px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); white-space: pre-line;
        }
        #toast.show { opacity: 1; }

        @keyframes hearthPulse {
            0%,100% { transform: scaleY(1); opacity: 0.85; }
            25% { transform: scaleY(1.12); opacity: 1; }
            50% { transform: scaleY(0.92); opacity: 0.8; }
            75% { transform: scaleY(1.08); opacity: 0.95; }
        }
        @keyframes altarGlow {
            0%,100% { box-shadow: 0 0 8px var(--glow-color, #d4af37); }
            50% { box-shadow: 0 0 20px var(--glow-color, #d4af37), 0 0 35px var(--glow-color, #d4af37); }
        }
        @keyframes sparkFade {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        @keyframes inscriptionGlow {
            0%,100% { text-shadow: 0 0 6px rgba(201,168,76,0.2); }
            50% { text-shadow: 0 0 16px rgba(201,168,76,0.5); }
        }
    </style>
</head>
<body>

    <header class="gwalenn-header">
        <h1>ΓΒΑΛΕΝΝ ΔΕ ΟΛΨΜΠΙΑ</h1>
        <div class="subtitle">The Olympian Haven · Ring of the Twelve</div>
    </header>

    <div id="gwalenn-scene"></div>
    <div id="toast"></div>

    <script src="js/gaia-mason.js"></script>
    <script src="js/gaia-scene-loader.js"></script>
    <script src="js/gaia-object-renderer.js"></script>
    <script src="js/gaia-suncalc.js"></script>
    <script src="js/gaia-celestial.js"></script>
    <script src="js/observe.js"></script>
    <script src="js/gaia-deck.js"></script>
    <script>
    /*
     * ═══════════════════════════════════════════════════════
     * GWALENN DE OLYMPIA · The Olympian Haven
     * gaia/gwalenn.html
     *
     * Twelve altars in a ring. Central hearth. Ouranos sky.
     * Living celestial bindings. Every god has a place here.
     * ═══════════════════════════════════════════════════════
     */

    // ── TOAST ──
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg, d = 3200) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), d);
    }

    // ── CELESTIAL STATE (graceful degradation) ──
    let skyState = null;
    let sunPos = null;
    let moonPos = null;
    let period = 'SUN';
    let moonAspect = 'Artemis';

    function loadCelestialState() {
        // Try Observe first (may need SunCalc which isn't loaded in this page)
        try {
            if (typeof Observe !== 'undefined' && Observe.getSkyState) {
                Observe.getSkyState().then(state => { skyState = state; });
            }
        } catch (e) {
            console.warn('Observe unavailable');
        }

        // GaiaSuncalc always works — no external dependencies
        try {
            if (typeof GaiaSuncalc !== 'undefined') {
                sunPos = GaiaSuncalc.getSunPosition();
                moonPos = GaiaSuncalc.getMoonPosition();
            }
            if (typeof Observe !== 'undefined' && Observe.getCurrentPeriod) {
                period = Observe.getCurrentPeriod();
            }
            if (typeof Observe !== 'undefined' && Observe.getMoonAspect) {
                moonAspect = Observe.getMoonAspect();
            }

            // Build minimal skyState from GaiaSuncalc if Observe failed
            if (!skyState && typeof GaiaSuncalc !== 'undefined') {
                skyState = {
                    ascendant: GaiaSuncalc.getAscendant(),
                    planets: {},
                    period: period,
                    moonPhase: {
                        name: moonPos?.phaseName || 'Unknown',
                        illumination: moonPos?.illumination || 50,
                        phase: moonPos?.phase || 0.5
                    }
                };
            }
        } catch (e2) {
            console.warn('Celestial state unavailable:', e2.message);
        }
    }

    // ── GOD PAGE LINKS ──
    const GOD_LINKS = {
        zeus:      'zeus/index.html',
        hera:      'hera/index.html',
        poseidon:  'poseidon/index.html',
        demeter:   'demeter/index.html',
        apollo:    'apollo/apolloTable.html',
        artemis:   'artemis/index.html',
        ares:      'ares/index.html',
        aphrodite: 'aphrodite/index.html',
        athena:    'athena/index.html',
        hephaestus:'hephaestus/index.html',
        hermes:    'hermes/index.html',
        hestia:    'index.html',
    };

    const GOD_PLANETS = {
        zeus:      'jupiter',
        poseidon:  'neptune',
        apollo:    'sun',
        artemis:   'moon',
        ares:      'mars',
        aphrodite: 'venus',
        hermes:    'mercury',
    };

    const GOD_SIGN_RULERS = {
        zeus:      ['Sagittarius','Pisces'],
        poseidon:  ['Pisces'],
        apollo:    ['Leo'],
        artemis:   ['Cancer'],
        ares:      ['Aries','Scorpio'],
        aphrodite: ['Taurus','Libra'],
        hermes:    ['Gemini','Virgo'],
    };

    // ── SACRED OBJECTS PER ALTAR ──
    const ALTAR_OBJECTS = {
        zeus:      'thunderbolt',
        hera:      'offering_bowl',
        poseidon:  'trident',
        demeter:   'grain_sheaf',
        apollo:    'lyre',
        artemis:   'bow_silver',
        ares:      'offering_bowl',
        aphrodite: 'mirror_silver',
        athena:    'owl_statue',
        hephaestus:'anvil',
        hermes:    'caduceus',
        hestia:    'brazier_gold',
    };

    // ── BUILD GWALENN ──
    async function buildGwalenn() {
        const container = document.getElementById('gwalenn-scene');

        // Load celestial state first
        loadCelestialState();

        // Create scene loader and load the ring
        const loader = new GaiaSceneLoader('gwalenn-scene');
        await loader.load('json/scenes/gwalenn.json');

        // Create object renderer
        const objRenderer = new GaiaObjectRenderer('gwalenn-scene');
        objRenderer.setMason(loader.mason);
        await objRenderer.loadObjects('json/altar-objects.json');

        // Place sacred objects on each altar
        const altars = loader.scene.altarRing.altars;
        const cx = loader.scene.altarRing.centerX;
        const cy = loader.scene.altarRing.centerY;
        const radius = loader.scene.altarRing.radius;

        altars.forEach((altar, i) => {
            const angle = (i / altars.length) * Math.PI * 2 - Math.PI / 2;
            const ax = cx + Math.cos(angle) * radius - 50;
            const ay = cy + Math.sin(angle) * radius - 60;
            const objectName = ALTAR_OBJECTS[altar.god];
            if (objectName) {
                objRenderer.placeOnAltar(objectName, ax, ay);
            }
        });

        // ── Celestial glow bindings ──
        applyCelestialGlows(container, altars, cx, cy, radius);

        // ── Altar click interactions ──
        const altarClickCount = {};

        loader.onAltarInteract = (god, altar) => {
            altarClickCount[god] = (altarClickCount[god] || 0) + 1;

            // First click: show whisper
            let msg = `${altar.glyph} Altar of ${altar.name}\n\n`;

            // Try GaiaDeck for a whisper
            try {
                if (typeof GaiaDeck !== 'undefined') {
                    const card = GaiaDeck.getCard(god);
                    if (card?.whisper) {
                        msg += `"${card.whisper}"\n\n`;
                    }
                }
            } catch (e) {}

            // Add planet position if available
            const planet = GOD_PLANETS[god];
            if (planet && skyState?.planets?.[planet]) {
                const p = skyState.planets[planet];
                msg += `${planet.toUpperCase()} in ${p.sign} ${p.glyph || ''} · `;
                msg += p.aboveHorizon ? 'Above horizon.' : 'Below horizon.';
            } else if (god === 'apollo' && sunPos) {
                msg += `☀️ Sun in ${sunPos.sign} ${sunPos.glyph}`;
            } else if (god === 'artemis' && moonPos) {
                msg += `🌙 Moon in ${moonPos.sign} ${moonPos.glyph} · ${moonPos.phaseName}`;
            }

            toast(msg);

            // Second click: navigate to god's page
            if (altarClickCount[god] >= 2) {
                const link = GOD_LINKS[god];
                if (link) {
                    toast(`🏛️ Approaching the realm of ${altar.name}...`);
                    setTimeout(() => { window.location.href = link; }, 800);
                }
                altarClickCount[god] = 0;
            }
        };

        // ── Object interactions (offerings, flames) ──
        container.addEventListener('object-interact', (e) => {
            const { object, action, x, y } = e.detail;
            switch (action) {
                case 'leave_offering':
                    toast('🙏 You leave an offering.\n\n"The gods do not need your gift. But they notice the gesture."');
                    spawnSparks(x + 25, y + 25, '#ffd700', 8);
                    break;
                case 'tend_flame':
                    toast('🔥 You tend the sacred flame.\n\n"The fire holds. It has always held."');
                    spawnSparks(x + 25, y + 10, '#ff8833', 12);
                    break;
            }
        });

        // ── Welcome toast ──
        const dayLabel = period === 'SUN' ? '☀️ Apollo reigns' : '🌙 Artemis watches';
        toast(`🏛️ Gwalenn de Olympia · ${altars.length} altars · ${dayLabel}`);
    }

    // ── CELESTIAL GLOW OVERLAYS ──
    function applyCelestialGlows(container, altars, cx, cy, radius) {
        if (!skyState) return;

        const ascSign = skyState.ascendant?.sign;

        altars.forEach((altar, i) => {
            const planet = GOD_PLANETS[altar.god];
            const signRulers = GOD_SIGN_RULERS[altar.god] || [];
            let intensity = 0.25;
            let glowColor = altar.glowColor || '#d4af37';

            // Sun-ruled: brighter during day
            if (planet === 'sun' && period === 'SUN') intensity = 0.7;

            // Moon-ruled: pulse with illumination
            if (planet === 'moon' && moonPos) {
                intensity = moonPos.illumination / 100;
                if (period === 'MOON') intensity = Math.max(intensity, 0.45);
            }

            // Planet in ruling sign = brighter
            if (planet && skyState.planets?.[planet]) {
                const p = skyState.planets[planet];
                if (signRulers.includes(p.sign)) {
                    intensity = Math.max(intensity, 0.65);
                }
            }

            // Ascendant sign ruler = featured glow
            if (signRulers.includes(ascSign)) {
                intensity = 1.0;
                glowColor = '#ffd700';
            }

            // Hestia always glows warmly
            if (altar.god === 'hestia') {
                intensity = Math.max(intensity, 0.5);
                glowColor = '#ffaa44';
            }

            if (intensity > 0.15) {
                const angle = (i / altars.length) * Math.PI * 2 - Math.PI / 2;
                const ax = cx + Math.cos(angle) * radius - 50;
                const ay = cy + Math.sin(angle) * radius - 60;
                const alpha = Math.round(intensity * 35).toString(16).padStart(2, '0');

                const glow = document.createElement('div');
                glow.style.cssText = `
                    position: absolute;
                    left: ${ax - 20}px; top: ${ay + 15}px;
                    width: 140px; height: 120px;
                    background: radial-gradient(ellipse, ${glowColor}${alpha} 0%, transparent 70%);
                    border-radius: 50%;
                    z-index: 5;
                    pointer-events: none;
                    animation: altarGlow ${2 + Math.random() * 2}s ease-in-out infinite;
                    --glow-color: ${glowColor};
                `;
                container.appendChild(glow);
            }
        });

        // Central hearth pulse
        const hearthFlame = container.querySelector('[style*="hearthFlame"]');
        if (hearthFlame) {
            const moonIllum = moonPos?.illumination || 50;
            hearthFlame.style.opacity = 0.6 + (moonIllum / 250);
        }
    }

    // ── SPARKS ──
    function spawnSparks(x, y, color, count) {
        const container = document.getElementById('gwalenn-scene');
        for (let i = 0; i < count; i++) {
            const spark = document.createElement('div');
            spark.style.cssText = `
                position: absolute;
                left: ${x + (Math.random() - 0.5) * 40}px;
                top: ${y + (Math.random() - 0.5) * 30}px;
                width: 3px; height: 3px;
                background: ${color};
                border-radius: 50%;
                box-shadow: 0 0 8px ${color};
                pointer-events: none;
                z-index: 60;
                animation: sparkFade ${1 + Math.random()}s ease-out forwards;
            `;
            container.appendChild(spark);
            setTimeout(() => spark.remove(), 1500);
        }
    }

    // ═══════════════════════════════════
    // INIT
    // ═══════════════════════════════════

    async function init() {
        await buildGwalenn();

        // Ambient prayer sparks
        document.addEventListener('click', (e) => {
            if (Math.random() > 0.75 &&
                !e.target.closest('.zone') &&
                !e.target.closest('.altar-zone') &&
                !e.target.closest('.altar-object-zone')) {
                const spark = document.createElement('div');
                spark.style.cssText = `
                    position: fixed;
                    left: ${e.clientX}px; top: ${e.clientY}px;
                    width: 3px; height: 3px;
                    background: #d4af37;
                    border-radius: 50%;
                    box-shadow: 0 0 10px #d4af37;
                    pointer-events: none;
                    z-index: 150;
                    animation: sparkFade 1.4s ease-out forwards;
                `;
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 1500);
            }
        });
    }

    init().catch(err => {
        console.error('Gwalenn failed to load:', err);
        document.getElementById('gwalenn-scene').innerHTML = `
            <div style="color:#c9a84c;text-align:center;padding:3rem;font-family:'Cinzel',serif;line-height:1.6;">
                <span style="font-size:2rem;">🏛️</span><br>
                Gwalenn could not be opened.<br>
                <span style="font-size:0.7rem;color:#6b5520;">${err.message}</span>
            </div>`;
    });
    </script>
</body>
</html>
