<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Threshold — GAIA Witness Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0c0d0e;
    --stone:#17181a;
    --verdigris:#5a8577;
    --bronze:#a3814f;
    --bone:#e7e0d0;
    --ember:#7d3f2c;
    --dim:#8a8578;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--void); overflow:hidden;}
  body{
    font-family:'EB Garamond', serif;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #scene-media{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(0.85) contrast(1.05);
  }
  #scene-media.placeholder{
    background:
      radial-gradient(ellipse at 50% 30%, rgba(90,133,119,0.18), transparent 60%),
      linear-gradient(180deg, #14161a 0%, #0c0d0e 70%);
  }
  #vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
  }

  #trail{
    position:absolute; top:28px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center;
    z-index:10;
  }
  .trail-tier{ display:flex; gap:5px; }
  .trail-dot{
    width:6px; height:6px; border-radius:50%;
    background:rgba(231,224,208,0.18);
    border:1px solid rgba(231,224,208,0.25);
    transition:background 0.4s ease, box-shadow 0.4s ease;
  }
  .trail-dot.lit{
    background:var(--verdigris);
    box-shadow:0 0 8px rgba(90,133,119,0.9);
    border-color:var(--verdigris);
  }
  .trail-sep{ width:1px; height:10px; background:rgba(231,224,208,0.15); margin:0 2px; }

  #caption{
    position:absolute; bottom:32%; left:50%; transform:translateX(-50%);
    max-width:640px; text-align:center;
    font-style:italic; font-size:1.15rem; line-height:1.5;
    color:var(--bone);
    text-shadow:0 2px 12px rgba(0,0,0,0.8);
    z-index:5; padding:0 24px;
    opacity:0; transition:opacity 1.1s ease;
  }
  #caption.show{ opacity:1; }

  #choices{
    position:absolute; bottom:9%; left:50%; transform:translateX(-50%);
    display:flex; gap:18px; flex-wrap:wrap; justify-content:center;
    z-index:10; max-width:820px; padding:0 20px;
    opacity:0; pointer-events:none;
    transition:opacity 0.6s ease;
  }
  #choices.show{ opacity:1; pointer-events:auto; }

  .choice-btn{
    font-family:'Cinzel', serif;
    font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--bone);
    background:rgba(23,24,26,0.55);
    border:1px solid rgba(163,129,79,0.45);
    padding:14px 22px;
    cursor:pointer;
    backdrop-filter:blur(3px);
    transition:border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
  }
  .choice-btn:hover{
    border-color:var(--verdigris);
    background:rgba(90,133,119,0.15);
    transform:translateY(-2px);
  }

  #skip{
    position:absolute; top:26px; right:28px; z-index:10;
    font-family:'Inter',sans-serif; font-size:0.65rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--dim);
    background:none; border:none; cursor:pointer;
    opacity:0.6; transition:opacity 0.3s ease;
  }
  #skip:hover{ opacity:1; }

  #title-card{
    position:absolute; inset:0; z-index:20;
    background:var(--void);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:22px; cursor:pointer;
  }
  #title-card h1{
    font-family:'Cinzel', serif; font-weight:600;
    font-size:2.1rem; letter-spacing:0.08em; color:var(--bone);
  }
  #title-card p{
    font-style:italic; color:var(--dim); max-width:420px; font-size:1rem;
  }
  #title-card .enter{
    font-family:'Inter',sans-serif; font-size:0.7rem; letter-spacing:0.2em;
    text-transform:uppercase; color:var(--verdigris); margin-top:10px;
  }

  #ending-panel{
    position:absolute; inset:0; z-index:20;
    background:rgba(12,13,14,0.92);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px; padding:20px;
  }
  #ending-panel.show{ display:flex; }
  #ending-panel h2{ font-family:'Cinzel', serif; font-size:1.5rem; letter-spacing:0.06em; color:var(--bronze); }
  #ending-panel p{ max-width:480px; font-style:italic; color:var(--bone); line-height:1.6; }
  #ending-panel a{
    font-family:'Inter',sans-serif; font-size:0.7rem; letter-spacing:0.15em;
    text-transform:uppercase; color:var(--verdigris);
    text-decoration:none; border:1px solid rgba(90,133,119,0.5);
    padding:12px 24px; margin-top:8px;
  }
  #ending-panel a:hover{ background:rgba(90,133,119,0.12); }
  #restart{
    font-family:'Inter',sans-serif; font-size:0.62rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--dim); background:none; border:none;
    cursor:pointer; margin-top:4px;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="scene-media" class="placeholder" muted playsinline></video>
  <div id="vignette"></div>

  <div id="trail"></div>
  <button id="skip">skip clip</button>

  <div id="caption"></div>
  <div id="choices"></div>

  <div id="title-card">
    <h1>THE THRESHOLD</h1>
    <p>Dawn has not yet decided what it is. Something in the witness layer is already awake, and it has been waiting for you specifically.</p>
    <div class="enter">▸ enter the witness layer</div>
  </div>

  <div id="ending-panel">
    <h2 id="ending-title"></h2>
    <p id="ending-text"></p>
    <a id="ending-link" href="https://kairos-coder.github.io/divination" target="_blank">Cross into Digital Divination</a>
    <button id="restart">walk the threshold again</button>
  </div>
</div>

<script>
/* ============================================================
   THE THRESHOLD — node graph
   Fibonacci depth: 1 → 1 → 2 → 3 → 5
   Replace `video` paths with real NightCafe exports when ready.
   Each node's `video` is relative to /gaia/portal/media/
   ============================================================ */

const NODES = {

  // DEPTH 1 — the wake (1 node)
  wake: {
    depth: 1,
    video: "media/wake.mp4",
    caption: "The witness layer stirs before the eye does. Something has been counting the hours until this one.",
    choices: [ { label: "Open your eyes", next: "gate" } ]
  },

  // DEPTH 2 — the gate (1 choice, not a fork — a threshold to cross)
  gate: {
    depth: 2,
    video: "media/gate.mp4",
    caption: "A line in the dark that was not there a moment ago. It does not ask permission to exist. Neither should you.",
    choices: [ { label: "Cross the threshold", next: "pull_a" } ]
  },

  // DEPTH 3 — 2 branches: which direction the witness pulls you
  pull_a: {
    depth: 3,
    video: "media/pull_time.mp4",
    caption: "Something old turns beneath your feet, patient and exact, counting what you have not yet done.",
    choices: [
      { label: "Follow the turning", next: "domain_kronos" },
      { label: "Follow the memory beneath it", next: "domain_mnemosyne" }
    ]
  },
  pull_b: {
    depth: 3,
    video: "media/pull_tide.mp4",
    caption: "Water moves without asking the shore's permission. You feel the pull before you understand it.",
    choices: [
      { label: "Follow the current", next: "domain_oceanus" },
      { label: "Follow the stillness beneath the current", next: "domain_tethys" }
    ]
  },

  // DEPTH 4 — 3 branches per pulled direction: which Titan's domain calls
  domain_kronos: {
    depth: 4,
    video: "media/domain_kronos.mp4",
    caption: "Kronos does not rush. He has already seen where this ends and is in no hurry to arrive.",
    choices: [
      { label: "Ask what time owes you", next: "end_kronos" },
      { label: "Ask what you owe time", next: "end_mnemosyne" },
      { label: "Say nothing and simply watch", next: "end_hidden" }
    ]
  },
  domain_mnemosyne: {
    depth: 4,
    video: "media/domain_mnemosyne.mp4",
    caption: "Mnemosyne forgets nothing, including things you have worked very hard to forget yourself.",
    choices: [
      { label: "Ask to remember", next: "end_mnemosyne" },
      { label: "Ask to be forgotten, briefly", next: "end_hidden" },
      { label: "Turn back toward the tide", next: "pull_b" }
    ]
  },
  domain_oceanus: {
    depth: 4,
    video: "media/domain_oceanus.mp4",
    caption: "Oceanus circles everything and belongs to no shore. He offers you the same arrangement.",
    choices: [
      { label: "Accept the current", next: "end_oceanus" },
      { label: "Ask what lies beneath the circle", next: "end_tethys" },
      { label: "Turn back toward the turning", next: "pull_a" }
    ]
  },
  domain_tethys: {
    depth: 4,
    video: "media/domain_tethys.mp4",
    caption: "Tethys is the source rivers forget they came from. She does not mind. She was never owed the credit.",
    choices: [
      { label: "Ask to be a source, not a river", next: "end_tethys" },
      { label: "Ask to stay a river", next: "end_oceanus" },
      { label: "Say nothing and simply watch", next: "end_hidden" }
    ]
  },

  // DEPTH 5 — 5 endings, converged from multiple paths
  end_kronos: {
    depth: 5, ending: true, title: "Aspect of Kronos",
    video: "media/end_kronos.mp4",
    text: "Time did not owe you an answer. It gave you one anyway, the way it always does — late, and exactly on schedule."
  },
  end_mnemosyne: {
    depth: 5, ending: true, title: "Aspect of Mnemosyne",
    video: "media/end_mnemosyne.mp4",
    text: "You remember now what you already knew. The witness layer does not create memory. It only refuses to let it go."
  },
  end_oceanus: {
    depth: 5, ending: true, title: "Aspect of Oceanus",
    video: "media/end_oceanus.mp4",
    text: "You are circling now, same as he does. No shore claims you. That was always the offer."
  },
  end_tethys: {
    depth: 5, ending: true, title: "Aspect of Tethys",
    video: "media/end_tethys.mp4",
    text: "You are a source now, not a river. Everything downstream of you will forget where it began. Let it."
  },
  end_hidden: {
    depth: 5, ending: true, title: "The Hidden",
    video: "media/end_hidden.mp4",
    text: "She was not on the list. She surfaced anyway, because you asked nothing and watched everything. That is its own kind of question."
  }
};

const START = "wake";
const WITNESS_KEY = "gaia_witness_threshold";

let current = null;

const els = {
  stage: document.getElementById('stage'),
  media: document.getElementById('scene-media'),
  trail: document.getElementById('trail'),
  caption: document.getElementById('caption'),
  choices: document.getElementById('choices'),
  titleCard: document.getElementById('title-card'),
  endingPanel: document.getElementById('ending-panel'),
  endingTitle: document.getElementById('ending-title'),
  endingText: document.getElementById('ending-text'),
  skip: document.getElementById('skip'),
  restart: document.getElementById('restart')
};

function buildTrail(){
  const tiers = [1,1,2,3,5];
  els.trail.innerHTML = "";
  tiers.forEach((count, i) => {
    const tier = document.createElement('div');
    tier.className = 'trail-tier';
    tier.dataset.depth = i + 1;
    for(let d=0; d<count; d++){
      const dot = document.createElement('div');
      dot.className = 'trail-dot';
      tier.appendChild(dot);
    }
    els.trail.appendChild(tier);
    if(i < tiers.length - 1){
      const sep = document.createElement('div');
      sep.className = 'trail-sep';
      els.trail.appendChild(sep);
    }
  });
}

function litTrail(depth){
  const tiers = els.trail.querySelectorAll('.trail-tier');
  tiers.forEach((tier, i) => {
    const dots = tier.querySelectorAll('.trail-dot');
    dots.forEach(dot => dot.classList.toggle('lit', (i+1) <= depth));
  });
}

function logWitness(nodeId){
  try{
    const raw = localStorage.getItem(WITNESS_KEY);
    const path = raw ? JSON.parse(raw) : [];
    path.push({ node: nodeId, ts: Date.now() });
    localStorage.setItem(WITNESS_KEY, JSON.stringify(path));
  }catch(e){ /* storage unavailable, proceed silently */ }
}

function loadNode(id){
  current = id;
  const node = NODES[id];
  logWitness(id);
  litTrail(node.depth);

  els.caption.classList.remove('show');
  els.choices.classList.remove('show');
  els.choices.innerHTML = "";

  // swap media — placeholder gradient until real clips exist
  els.media.classList.add('placeholder');
  els.media.removeAttribute('src');
  els.media.pause();
  // When real clips are ready: els.media.src = node.video; els.media.classList.remove('placeholder'); els.media.play();

  if(node.ending){
    setTimeout(() => showEnding(node), 900);
    return;
  }

  setTimeout(() => {
    els.caption.textContent = node.caption;
    els.caption.classList.add('show');
  }, 500);

  setTimeout(() => {
    node.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.label;
      btn.onclick = () => loadNode(choice.next);
      els.choices.appendChild(btn);
    });
    els.choices.classList.add('show');
  }, 1600);
}

function showEnding(node){
  els.endingTitle.textContent = node.title;
  els.endingText.textContent = node.text;
  els.endingPanel.classList.add('show');
}

els.titleCard.addEventListener('click', () => {
  els.titleCard.style.display = 'none';
  buildTrail();
  loadNode(START);
});

els.skip.addEventListener('click', () => {
  const node = NODES[current];
  if(!node || node.ending) return;
  els.caption.classList.add('show');
  els.caption.textContent = node.caption;
  node.choices && els.choices.classList.add('show');
});

els.restart.addEventListener('click', () => {
  els.endingPanel.classList.remove('show');
  els.titleCard.style.display = 'flex';
});
</script>

</body>
</html>
