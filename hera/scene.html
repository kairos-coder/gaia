<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Scene · The Living World</title>
<style>
  :root {
    --overlay: rgba(5, 5, 15, 0.75);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Georgia', serif;
    color: #e8e0d0;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    transition: background-image 1s ease;
    position: relative;
    overflow-x: hidden;
  }
  
  /* Dark overlay for readability */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 0;
  }
  
  /* Content */
  .content {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* Header */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header .sigil { font-size: 40px; margin-bottom: 8px; }
  .header h1 { 
    font-size: 22px; 
    letter-spacing: 0.1em; 
    color: #c9a84c;
    margin-bottom: 4px;
  }
  .header .date {
    font-size: 11px;
    color: rgba(200,180,140,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  
  /* Scene Description */
  .scene-description {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.2);
    border-left: 3px solid #c9a84c;
    padding: 24px;
    margin-bottom: 32px;
    font-size: 17px;
    line-height: 1.7;
    font-style: italic;
    color: rgba(220,200,160,0.9);
    text-align: center;
    min-height: 80px;
  }
  .scene-description.loading {
    color: rgba(180,160,100,0.4);
    font-style: normal;
  }
  
  /* Element Images */
  .elements {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .element-card {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.15);
    padding: 12px;
    text-align: center;
  }
  .element-card img {
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    border: 1px solid rgba(200,160,80,0.1);
    background: rgba(0,0,0,0.5);
  }
  .element-label {
    font-size: 10px;
    color: rgba(200,160,100,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 8px;
  }
  
  /* Data Bar */
  .data-bar {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.15);
    padding: 16px;
    margin-top: auto;
    font-family: monospace;
    font-size: 10px;
    color: rgba(180,160,100,0.5);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
  }
  .data-item strong {
    color: #c9a84c;
    display: block;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  
  /* Buttons */
  .btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .btn {
    background: rgba(20, 15, 8, 0.8);
    border: 1px solid rgba(200,160,80,0.3);
    color: #c9a84c;
    padding: 10px 20px;
    font-family: 'Georgia', serif;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.3s;
  }
  .btn:hover { background: rgba(40, 30, 15, 0.8); border-color: #c9a84c; color: #e0c860; }

  .drone-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    font-size: 10px;
    color: rgba(200,180,140,0.6);
    letter-spacing: 0.05em;
  }
  .drone-row input[type="range"] {
    width: 120px;
    accent-color: #c9a84c;
  }
</style>
</head>
<body id="sceneBody">

<div class="content">
  
  <div class="header">
    <div class="sigil">🌍</div>
    <h1>The Living World</h1>
    <div class="date" id="sceneDate"></div>
  </div>
  
  <div class="btn-row">
    <button class="btn" onclick="generateScene()">⟳ New Scene</button>
    <button class="btn" onclick="toggleDataBar()">📊 Toggle Data</button>
    <button class="btn" id="droneToggle" onclick="toggleDrone()">🎧 Ambient Tone: off</button>
  </div>
  <div class="drone-row" id="droneRow" style="display:none;">
    <input type="range" id="droneVolume" min="0" max="10" value="4" oninput="setDroneVolume(this.value)">
    <span class="drone-label" id="droneLabel">—</span>
  </div>
  
  <div class="scene-description loading" id="sceneDesc">
    The world assembles itself. One moment.
  </div>
  
  <div class="elements" id="elementsGrid"></div>
  
  <div class="data-bar" id="dataBar">
    <div class="data-item"><strong>Background</strong><span id="dataBg">—</span></div>
    <div class="data-item"><strong>Solar</strong><span id="dataSolar">—</span></div>
    <div class="data-item"><strong>Moon</strong><span id="dataMoon">—</span></div>
    <div class="data-item"><strong>Weather</strong><span id="dataWeather">—</span></div>
    <div class="data-item"><strong>UV Index</strong><span id="dataUv">—</span></div>
    <div class="data-item"><strong>Sun</strong><span id="dataSun">—</span></div>
    <div class="data-item"><strong>Tide</strong><span id="dataTide">—</span></div>
    <div class="data-item"><strong>Scene Prompt</strong><span id="dataPrompt">—</span></div>
  </div>

</div>

<script>
// ═══════════════════════════════════
// FREE IMAGE APIs
// ═══════════════════════════════════

const IMAGE_SERVICES = {
  // Pollinations image generation — free, no key
  pollinations: (prompt) => 
    `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=500&nologo=true`,
  
  // Another free option — picsum placeholder while waiting
  picsum: (seed) => `https://picsum.photos/seed/${seed}/800/500`,
};

// Bucksport, ME coordinates — the Witch's Foot
const LAT = 44.5734;
const LON = -68.7956;
const NOAA_TIDE_STATION = '8414684'; // Bucksport, ME
let lastBackgroundUrl = null;

// ═══════════════════════════════════
// DATA FETCHERS
// ═══════════════════════════════════

async function fetchAPOD() {
  // APOD only changes once per day — cache it so "New Scene" doesn't
  // re-download and re-decode the same image every click.
  const today = new Date().toISOString().split('T')[0];
  try {
    const cached = JSON.parse(localStorage.getItem('apod_cache') || 'null');
    if (cached && cached.date === today) return cached;
  } catch(e) {}

  try {
    const resp = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
    const data = await resp.json();
    let result;
    if (data.media_type === 'image') {
      result = { url: data.url, title: data.title, date: data.date };
    } else {
      // Fallback: yesterday's image
      const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      const fallbackResp = await fetch(`https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date=${yesterday}`);
      const fallback = await fallbackResp.json();
      result = { url: fallback.url, title: fallback.title, date: fallback.date };
    }
    result.date = today; // cache key, not necessarily APOD's own date field
    try { localStorage.setItem('apod_cache', JSON.stringify(result)); } catch(e) {}
    return result;
  } catch(e) {
    return null;
  }
}

// Preload an image and resolve only once it's actually decoded —
// avoids a flash/lag when swapping the background.
function preloadImage(url) {
  return new Promise((resolve) => {
    if (!url) return resolve(null);
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function fetchSolarData() {
  try {
    const resp = await fetch('https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json');
    const rows = await resp.json();
    const longRows = rows.filter(r => r.energy === '0.1-0.8nm');
    if (longRows.length > 0) {
      const latest = longRows[longRows.length - 1];
      const flux = latest.flux;
      let cls = '?';
      if (flux < 1e-7) cls = `A${(flux/1e-8).toFixed(1)}`;
      else if (flux < 1e-6) cls = `B${(flux/1e-7).toFixed(1)}`;
      else if (flux < 1e-5) cls = `C${(flux/1e-6).toFixed(1)}`;
      else if (flux < 1e-4) cls = `M${(flux/1e-5).toFixed(1)}`;
      else cls = `X${(flux/1e-4).toFixed(1)}`;
      return { class: cls, flux: flux?.toExponential(2), time: latest.time_tag };
    }
  } catch(e) {}
  return null;
}

async function fetchMoonPhase() {
  try {
    const now = new Date();
    const lp = 2551443;
    const newMoon = new Date(2026, 4, 18).getTime();
    const phase = ((now.getTime() - newMoon) % lp) / lp;
    const names = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous',
                   'Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
    const idx = Math.floor(phase * 8) % 8;
    const emojis = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
    return { phase: (phase*100).toFixed(1), name: names[idx], emoji: emojis[idx] };
  } catch(e) {}
  return null;
}

// Weather + UV + sunrise/sunset in a single Open-Meteo call
async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,wind_speed_10m,uv_index` +
      `&daily=sunrise,sunset&timezone=auto`;
    const resp = await fetch(url);
    const data = await resp.json();
    const cur = data.current || {};
    const daily = data.daily || {};
    return {
      temp: cur.temperature_2m,
      wind: cur.wind_speed_10m,
      uv: cur.uv_index,
      sunrise: daily.sunrise ? daily.sunrise[0] : null,
      sunset: daily.sunset ? daily.sunset[0] : null,
    };
  } catch(e) {}
  return null;
}

function uvLabel(uv) {
  if (uv == null) return null;
  if (uv < 3) return 'low';
  if (uv < 6) return 'moderate';
  if (uv < 8) return 'high';
  if (uv < 11) return 'very high';
  return 'extreme';
}

function formatClockTime(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

// NOAA CO-OPS tide predictions (high/low) for today at Bucksport, ME
async function fetchTide() {
  try {
    const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter` +
      `?product=predictions&application=hera-living-world&station=${NOAA_TIDE_STATION}` +
      `&datum=MLLW&time_zone=lst_ld&units=english&interval=hilo&format=json&date=today`;
    const resp = await fetch(url);
    const data = await resp.json();
    const preds = data.predictions || [];
    if (preds.length === 0) return null;

    const now = new Date();
    // Find current state: are we rising toward the next high, or falling toward the next low?
    let next = null;
    for (const p of preds) {
      const t = new Date(p.t.replace(' ', 'T'));
      if (t > now) { next = p; break; }
    }
    const state = next ? (next.type === 'H' ? 'rising' : 'falling') : 'unknown';
    return {
      state,
      nextType: next ? (next.type === 'H' ? 'high' : 'low') : null,
      nextTime: next ? formatClockTime(next.t.replace(' ', 'T')) : null,
      nextHeight: next ? parseFloat(next.v).toFixed(1) : null,
    };
  } catch(e) {}
  return null;
}

// ═══════════════════════════════════
// BINAURAL AMBIENT TONE
// ═══════════════════════════════════
// Two oscillators, one per ear, offset by a small "beat" frequency.
// That offset is what the brain perceives as a slow pulsing tone —
// this is presented as mood-setting ambience tied to the day's data,
// not a guaranteed brainwave-entrainment effect (the research on that
// is mixed and mostly anecdotal).

let audioCtx = null;
let droneOscL = null, droneOscR = null, droneGain = null;
let dronePlaying = false;
let currentBeatHz = 10, currentBand = 'alpha';

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// Decide target brainwave band + beat frequency from the day's data.
// Daytime → alpha (8-12Hz, "relaxed alertness"). Nighttime → theta (4-8Hz, "drowsy/meditative").
// Solar flux and tide state nudge the exact Hz within that band — a small
// sonification of the same data driving the scene, not a clinical claim.
function computeBrainwaveTarget(solar, weather, tide) {
  const now = new Date();
  let isDaytime = true;
  if (weather?.sunrise && weather?.sunset) {
    const sr = new Date(weather.sunrise);
    const ss = new Date(weather.sunset);
    isDaytime = now >= sr && now <= ss;
  }

  const band = isDaytime ? 'alpha' : 'theta';
  const [lo, hi] = band === 'alpha' ? [8, 12] : [4, 8];

  // Solar flux pushes toward the higher end (more "charged"); calmer/lower flux toward the low end.
  let solarPos = 0.5;
  if (solar?.class) {
    if (solar.class.startsWith('X') || solar.class.startsWith('M')) solarPos = 0.9;
    else if (solar.class.startsWith('C')) solarPos = 0.6;
    else solarPos = 0.2;
  }
  // Rising tide nudges up slightly, falling tide nudges down slightly.
  const tideNudge = tide?.state === 'rising' ? 0.05 : tide?.state === 'falling' ? -0.05 : 0;

  const pos = Math.min(1, Math.max(0, solarPos + tideNudge));
  const hz = lo + (hi - lo) * pos;
  return { band, hz: Math.round(hz * 10) / 10 };
}

function startDrone(carrierHz, beatHz) {
  const ctx = ensureAudioCtx();
  droneOscL = ctx.createOscillator();
  droneOscR = ctx.createOscillator();
  const panL = ctx.createStereoPanner();
  const panR = ctx.createStereoPanner();
  panL.pan.value = -1;
  panR.pan.value = 1;
  droneGain = ctx.createGain();
  droneGain.gain.value = 0;

  droneOscL.type = 'sine';
  droneOscR.type = 'sine';
  droneOscL.frequency.value = carrierHz;
  droneOscR.frequency.value = carrierHz + beatHz;

  droneOscL.connect(panL).connect(droneGain);
  droneOscR.connect(panR).connect(droneGain);
  droneGain.connect(ctx.destination);

  droneOscL.start();
  droneOscR.start();

  const vol = document.getElementById('droneVolume');
  const target = vol ? vol.value / 100 : 0.04;
  droneGain.gain.linearRampToValueAtTime(target, ctx.currentTime + 2);
  dronePlaying = true;
}

function stopDrone() {
  if (!dronePlaying || !droneGain) return;
  const ctx = ensureAudioCtx();
  droneGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1);
  const oscL = droneOscL, oscR = droneOscR;
  setTimeout(() => {
    try { oscL.stop(); oscR.stop(); } catch(e) {}
  }, 1100);
  dronePlaying = false;
}

// Smoothly retune the beat frequency on a new scene, without restarting the tone
function updateDroneFrequency(carrierHz, beatHz) {
  if (!dronePlaying || !droneOscR) return;
  const ctx = ensureAudioCtx();
  droneOscR.frequency.linearRampToValueAtTime(carrierHz + beatHz, ctx.currentTime + 3);
}

function toggleDrone() {
  const btn = document.getElementById('droneToggle');
  const row = document.getElementById('droneRow');
  if (dronePlaying) {
    stopDrone();
    btn.textContent = '🎧 Ambient Tone: off';
    row.style.display = 'none';
  } else {
    startDrone(180, currentBeatHz);
    btn.textContent = `🎧 Ambient Tone: ${currentBand} ${currentBeatHz}Hz`;
    row.style.display = 'flex';
  }
}

function setDroneVolume(val) {
  if (droneGain) {
    const ctx = ensureAudioCtx();
    droneGain.gain.linearRampToValueAtTime(val / 100, ctx.currentTime + 0.3);
  }
}

// ═══════════════════════════════════
// BUILD SCENE PROMPT
// ═══════════════════════════════════

function buildScenePrompt(solar, moon, weather, apod, tide) {
  const solarMood = solar?.class?.startsWith('X') ? 'harsh blazing light, intense, dangerous'
    : solar?.class?.startsWith('M') ? 'bright active light, energetic'
    : solar?.class?.startsWith('C') ? 'moderate daylight, steady'
    : 'quiet dim light, calm, still';
  
  const moonMood = moon?.name?.includes('Full') ? 'full moon casting long shadows'
    : moon?.name?.includes('New') ? 'moonless dark night'
    : `moon in ${moon?.name || 'unknown phase'}`;

  const uv = uvLabel(weather?.uv);
  const uvMood = uv === 'extreme' || uv === 'very high' ? 'a searing, merciless light overhead'
    : uv === 'high' ? 'a sharp, unforgiving sun'
    : uv === 'low' ? 'a soft, gentle light'
    : null;

  const tideMood = tide?.state === 'rising' ? 'the tide creeping in over the flats'
    : tide?.state === 'falling' ? 'the tide pulling back, exposing dark wet stone'
    : null;
  
  const weatherDesc = weather?.temp != null 
    ? `${weather.temp}°C, wind ${weather.wind}km/h at the Witch's Foot, Maine`
    : 'the Witch\'s Foot, Maine';
  
  const apodTitle = apod?.title || 'the cosmos';

  const extras = [uvMood, tideMood].filter(Boolean).join('. ');
  
  return `A fantasy landscape scene inspired by "${apodTitle}". ${weatherDesc}. ${solarMood}. ${moonMood}.${extras ? ' ' + extras + '.' : ''} Ancient stone ruins, a distant tower, a small fire burning. Atmospheric, cinematic, digital painting style. No text, no letters, no words.`;
}

// ═══════════════════════════════════
// GENERATE SCENE ELEMENTS
// ═══════════════════════════════════

function getElementPrompts() {
  return [
    { label: 'The Tower', prompt: 'A lone ancient stone tower on a hill at twilight, crumbling but still standing, one window glowing with firelight, atmospheric digital painting' },
    { label: 'The Forest', prompt: 'Dark pine forest at the edge of a clearing, mist between the trees, moonlight filtering through branches, moody atmospheric digital painting' },
    { label: 'The Hearth', prompt: 'A small campfire burning in a stone circle, embers rising into the dark, warm glow on surrounding stones, cozy but isolated, digital painting' },
  ];
}

// ═══════════════════════════════════
// RENDER SCENE
// ═══════════════════════════════════

async function generateScene() {
  const desc = document.getElementById('sceneDesc');
  desc.classList.add('loading');
  desc.textContent = 'The world assembles itself...';
  
  // Fetch all data
  const [apod, solar, moon, weather, tide] = await Promise.all([
    fetchAPOD(),
    fetchSolarData(),
    fetchMoonPhase(),
    fetchWeather(),
    fetchTide()
  ]);
  
  // Set background — skip re-applying if it's the same image already showing,
  // and preload so the swap doesn't cause a lag/flash.
  if (apod?.url && apod.url !== lastBackgroundUrl) {
    const loadedUrl = await preloadImage(apod.url);
    if (loadedUrl) {
      document.getElementById('sceneBody').style.backgroundImage = `url(${loadedUrl})`;
      lastBackgroundUrl = loadedUrl;
    }
  }
  
  // Build scene prompt
  const scenePrompt = buildScenePrompt(solar, moon, weather, apod, tide);
  
  // Generate scene description via Pollinations Text API
  let sceneText = '';
  try {
    const resp = await fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: `Describe this scene in 3-4 poetic sentences. Use vivid imagery. ${scenePrompt}` }],
        model: 'openai',
        temperature: 0.9,
        max_tokens: 200
      })
    });
    if (resp.ok) sceneText = (await resp.text()).trim();
  } catch(e) {}
  
  if (!sceneText) {
    sceneText = `The Witch's Foot under a ${moon?.name || 'shifting'} sky. The air holds ${weather?.temp || 'an unknown'} degrees. The tower stands. The fire burns. The world breathes.`;
  }
  
  desc.classList.remove('loading');
  desc.textContent = sceneText;
  
  // Generate element images
  const elements = getElementPrompts();
  const grid = document.getElementById('elementsGrid');
  grid.innerHTML = elements.map(el => `
    <div class="element-card">
      <img src="${IMAGE_SERVICES.pollinations(el.prompt)}" 
           alt="${el.label}" 
           loading="lazy"
           onerror="this.src='${IMAGE_SERVICES.picsum(el.label.replace(/\s/g,''))}'">
      <div class="element-label">${el.label}</div>
    </div>
  `).join('');
  
  // Update data bar
  document.getElementById('dataBg').textContent = apod?.title || '—';
  document.getElementById('dataSolar').textContent = solar?.class || '—';
  document.getElementById('dataMoon').textContent = moon ? `${moon.emoji} ${moon.name} (${moon.phase}%)` : '—';
  document.getElementById('dataWeather').textContent = weather ? `${weather.temp}°C, wind ${weather.wind}km/h` : '—';
  document.getElementById('dataUv').textContent = weather?.uv != null ? `${weather.uv} (${uvLabel(weather.uv)})` : '—';
  document.getElementById('dataSun').textContent = weather
    ? `↑${formatClockTime(weather.sunrise) || '—'} ↓${formatClockTime(weather.sunset) || '—'}`
    : '—';
  document.getElementById('dataTide').textContent = tide
    ? `${tide.state}, next ${tide.nextType} ${tide.nextTime} (${tide.nextHeight}ft)`
    : '—';
  document.getElementById('dataPrompt').textContent = scenePrompt.substring(0, 100) + '...';

  // Retune ambient tone to match this scene's data
  const target = computeBrainwaveTarget(solar, weather, tide);
  currentBand = target.band;
  currentBeatHz = target.hz;
  const droneLabel = document.getElementById('droneLabel');
  if (droneLabel) droneLabel.textContent = `${target.band} · ${target.hz}Hz beat`;
  const droneBtn = document.getElementById('droneToggle');
  if (droneBtn && dronePlaying) {
    droneBtn.textContent = `🎧 Ambient Tone: ${target.band} ${target.hz}Hz`;
    updateDroneFrequency(180, target.hz);
  }
  
  // Date
  document.getElementById('sceneDate').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

function toggleDataBar() {
  const bar = document.getElementById('dataBar');
  bar.style.display = bar.style.display === 'none' ? '' : 'none';
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
generateScene();
</script>

</body>
</html>
