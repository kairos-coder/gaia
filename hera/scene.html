<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Scene · The Living World</title>
<style>
  :root { --overlay: rgba(5, 5, 15, 0.75); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Georgia', serif;
    color: #e8e0d0;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    transition: background-image 1s ease;
    position: relative;
    overflow-x: hidden;
  }
  
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 0;
  }
  
  .content {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  .header { text-align: center; margin-bottom: 24px; }
  .header .sigil { font-size: 40px; margin-bottom: 8px; }
  .header h1 { font-size: 22px; letter-spacing: 0.1em; color: #c9a84c; margin-bottom: 4px; }
  .header .date { font-size: 11px; color: rgba(200,180,140,0.5); letter-spacing: 0.08em; text-transform: uppercase; }
  
  .scene-description {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.2);
    border-left: 3px solid #c9a84c;
    padding: 24px;
    margin-bottom: 24px;
    font-size: 17px;
    line-height: 1.7;
    font-style: italic;
    color: rgba(220,200,160,0.9);
    text-align: center;
    min-height: 60px;
  }
  .scene-description.loading { color: rgba(180,160,100,0.4); font-style: normal; }
  
  /* Character Evolution Card */
  .character-section {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.2);
    border-left: 3px solid #c9a84c;
    padding: 20px;
    margin-bottom: 24px;
    text-align: center;
  }
  .character-label {
    font-size: 10px;
    color: rgba(200,160,100,0.5);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .character-stage {
    font-size: 9px;
    color: #c9a84c;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .character-card {
    position: relative;
  }
  .character-card img {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border: 1px solid rgba(200,160,80,0.1);
    background: rgba(0,0,0,0.5);
    transition: opacity 1s ease;
  }
  .character-card img.loading-img { opacity: 0.4; }
  .character-desc {
    font-size: 13px;
    font-style: italic;
    color: rgba(200,180,140,0.7);
    margin-top: 10px;
    min-height: 40px;
  }
  
  /* Cascade Status */
  .cascade-status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    font-size: 10px;
    color: rgba(200,160,100,0.5);
    letter-spacing: 0.06em;
    flex-wrap: wrap;
  }
  .cascade-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(200,160,100,0.3);
    transition: all 0.5s;
  }
  .cascade-dot.active { background: #44cc88; box-shadow: 0 0 8px #44cc88; }
  .cascade-dot.generating { background: #c9a84c; animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  
  /* Element Images */
  .elements {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .element-card {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.15);
    padding: 12px;
    text-align: center;
  }
  .element-card img {
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    border: 1px solid rgba(200,160,80,0.1);
    background: rgba(0,0,0,0.5);
  }
  .element-label { font-size: 10px; color: rgba(200,160,100,0.5); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; }
  
  /* Data Bar */
  .data-bar {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.15);
    padding: 16px;
    margin-top: auto;
    font-family: monospace;
    font-size: 10px;
    color: rgba(180,160,100,0.5);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
  }
  .data-item strong { color: #c9a84c; display: block; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
  
  .btn-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
  .btn {
    background: rgba(20, 15, 8, 0.8);
    border: 1px solid rgba(200,160,80,0.3);
    color: #c9a84c;
    padding: 10px 20px;
    font-family: 'Georgia', serif;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.3s;
  }
  .btn:hover { background: rgba(40, 30, 15, 0.8); border-color: #c9a84c; color: #e0c860; }

  .drone-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    font-size: 10px;
    color: rgba(200,180,140,0.6);
    letter-spacing: 0.05em;
  }
  .drone-row input[type="range"] { width: 120px; accent-color: #c9a84c; }

  .character-evolution-log {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.15);
    padding: 12px;
    margin-bottom: 24px;
    font-family: monospace;
    font-size: 9px;
    color: rgba(180,160,100,0.4);
    max-height: 120px;
    overflow-y: auto;
    display: none;
  }
  .character-evolution-log .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
</style>
</head>
<body id="sceneBody">

  <div class="character-section">
    <div class="character-label">✦ The Wanderer ✦</div>
    <div class="character-stage" id="characterStage">Stage 1 · The Arrival</div>

      <img id="characterImg" src="" alt="The Wanderer" class="loading-img" style="display:none;">

    <div class="data-item"><strong>Weather</strong><span id="dataWeather">—</span></div>
    <div class="data-item"><strong>UV Index</strong><span id="dataUv">—</span></div>
    <div class="data-item"><strong>Sun</strong><span id="dataSun">—</span></div>
    <div class="data-item"><strong>Tide</strong><span id="dataTide">—</span></div>
    <div class="data-item"><strong>Cascade Stage</strong><span id="dataCascade">—</span></div>

</div>

<script>
// ═══════════════════════════════════
// FREE IMAGE APIs
// ═══════════════════════════════════
const IMAGE_SERVICES = {
  pollinations: (prompt) => 
    `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=500&nologo=true`,
  picsum: (seed) => `https://picsum.photos/seed/${seed}/800/500`,
};

// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const LAT = 44.5734;
const LON = -68.7956;
const NOAA_TIDE_STATION = '8414684';
const CASCADE_INTERVAL = 30000; // 30 seconds between stages
const MAX_CASCADE_STAGES = 4;
let lastBackgroundUrl = null;

// ═══════════════════════════════════
// CASCADE STATE
// ═══════════════════════════════════
let cascadeRunning = false;
let cascadeTimer = null;
let cascadeStage = 0;
let characterHistory = []; // Stores text descriptions of each stage
let sceneData = null; // Current scene data for cascade prompts

// ═══════════════════════════════════
// DATA FETCHERS (unchanged)
// ═══════════════════════════════════

async function fetchAPOD() {
  const today = new Date().toISOString().split('T')[0];
  try {
    const cached = JSON.parse(localStorage.getItem('apod_cache') || 'null');
    if (cached && cached.date === today && cached.url) return cached;
  } catch(e) {}

  try {
    const resp = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
    const data = await resp.json();
    if (resp.ok && data.media_type === 'image' && data.url) {
      const result = { url: data.url, title: data.title, date: today };
      try { localStorage.setItem('apod_cache', JSON.stringify(result)); } catch(e) {}
      return result;
    }
    throw new Error(data?.error?.message || 'APOD unavailable');
  } catch(e) {
    return {
      url: IMAGE_SERVICES.pollinations(`deep space nebula, cosmic, stars, seed ${today}`),
      title: 'Cosmic backdrop (APOD unavailable)',
      date: today,
    };
  }
}

function preloadImage(url) {
  return new Promise((resolve) => {
    if (!url) return resolve(null);
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function fetchSolarData() {
  try {
    const resp = await fetch('https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json');
    const rows = await resp.json();
    const longRows = rows.filter(r => r.energy === '0.1-0.8nm');
    if (longRows.length > 0) {
      const latest = longRows[longRows.length - 1];
      const flux = latest.flux;
      let cls = '?';
      if (flux < 1e-7) cls = `A${(flux/1e-8).toFixed(1)}`;
      else if (flux < 1e-6) cls = `B${(flux/1e-7).toFixed(1)}`;
      else if (flux < 1e-5) cls = `C${(flux/1e-6).toFixed(1)}`;
      else if (flux < 1e-4) cls = `M${(flux/1e-5).toFixed(1)}`;
      else cls = `X${(flux/1e-4).toFixed(1)}`;
      return { class: cls, flux: flux?.toExponential(2), time: latest.time_tag };
    }
  } catch(e) {}
  return null;
}

async function fetchMoonPhase() {
  try {
    const now = new Date();
    const lp = 2551443;
    const newMoon = new Date(2026, 4, 18).getTime();
    const phase = ((now.getTime() - newMoon) % lp) / lp;
    const names = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous',
                   'Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
    const idx = Math.floor(phase * 8) % 8;
    const emojis = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
    return { phase: (phase*100).toFixed(1), name: names[idx], emoji: emojis[idx] };
  } catch(e) {}
  return null;
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,wind_speed_10m,uv_index&daily=sunrise,sunset&timezone=auto`;
    const resp = await fetch(url);
    const data = await resp.json();
    const cur = data.current || {};
    const daily = data.daily || {};
    return {
      temp: cur.temperature_2m, wind: cur.wind_speed_10m, uv: cur.uv_index,
      sunrise: daily.sunrise ? daily.sunrise[0] : null,
      sunset: daily.sunset ? daily.sunset[0] : null,
    };
  } catch(e) {}
  return null;
}

function uvLabel(uv) {
  if (uv == null) return null;
  if (uv < 3) return 'low'; if (uv < 6) return 'moderate';
  if (uv < 8) return 'high'; if (uv < 11) return 'very high';
  return 'extreme';
}

function formatClockTime(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

async function fetchTide() {
  const baseUrl = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter` +
    `?product=predictions&application=hera-living-world&station=${NOAA_TIDE_STATION}` +
    `&time_zone=lst_ld&units=english&interval=hilo&format=json&date=today`;
  for (const datum of ['MLLW', 'STND']) {
    try {
      const resp = await fetch(`${baseUrl}&datum=${datum}`);
      const data = await resp.json();
      if (!resp.ok || data.error) continue;
      const preds = data.predictions || [];
      if (preds.length === 0) continue;
      const now = new Date();
      let next = null;
      for (const p of preds) {
        if (new Date(p.t.replace(' ', 'T')) > now) { next = p; break; }
      }
      const state = next ? (next.type === 'H' ? 'rising' : 'falling') : 'unknown';
      return {
        state,
        nextType: next ? (next.type === 'H' ? 'high' : 'low') : null,
        nextTime: next ? formatClockTime(next.t.replace(' ', 'T')) : null,
        nextHeight: next ? parseFloat(next.v).toFixed(1) : null,
      };
    } catch(e) {}
  }
  return null;
}

// ═══════════════════════════════════
// BINAURAL AMBIENT TONE (unchanged)
// ═══════════════════════════════════
let audioCtx = null, droneOscL = null, droneOscR = null, droneGain = null;
let dronePlaying = false, currentBeatHz = 10, currentBand = 'alpha';

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function computeBrainwaveTarget(solar, weather, tide) {
  const now = new Date();
  let isDaytime = true;
  if (weather?.sunrise && weather?.sunset) {
    isDaytime = now >= new Date(weather.sunrise) && now <= new Date(weather.sunset);
  }
  const band = isDaytime ? 'alpha' : 'theta';
  const [lo, hi] = band === 'alpha' ? [8, 12] : [4, 8];
  let solarPos = 0.5;
  if (solar?.class) {
    if (solar.class.startsWith('X') || solar.class.startsWith('M')) solarPos = 0.9;
    else if (solar.class.startsWith('C')) solarPos = 0.6;
    else solarPos = 0.2;
  }
  const tideNudge = tide?.state === 'rising' ? 0.05 : tide?.state === 'falling' ? -0.05 : 0;
  const pos = Math.min(1, Math.max(0, solarPos + tideNudge));
  return { band, hz: Math.round((lo + (hi - lo) * pos) * 10) / 10 };
}

function startDrone(carrierHz, beatHz) { /* unchanged */ }
function stopDrone() { /* unchanged */ }
function updateDroneFrequency(carrierHz, beatHz) { /* unchanged */ }
function toggleDrone() { /* unchanged */ }
function setDroneVolume(val) { /* unchanged */ }

// ═══════════════════════════════════
// BUILD SCENE PROMPT
// ═══════════════════════════════════

function buildScenePrompt(solar, moon, weather, apod, tide) {
  const solarMood = solar?.class?.startsWith('X') ? 'harsh blazing light, intense, dangerous'
    : solar?.class?.startsWith('M') ? 'bright active light, energetic'
    : solar?.class?.startsWith('C') ? 'moderate daylight, steady'
    : 'quiet dim light, calm, still';
  const moonMood = moon?.name?.includes('Full') ? 'full moon casting long shadows'
    : moon?.name?.includes('New') ? 'moonless dark night'
    : `moon in ${moon?.name || 'unknown phase'}`;
  const uv = uvLabel(weather?.uv);
  const uvMood = uv === 'extreme' || uv === 'very high' ? 'a searing, merciless light overhead'
    : uv === 'high' ? 'a sharp, unforgiving sun'
    : uv === 'low' ? 'a soft, gentle light' : null;
  const tideMood = tide?.state === 'rising' ? 'the tide creeping in over the flats'
    : tide?.state === 'falling' ? 'the tide pulling back, exposing dark wet stone' : null;
  const weatherDesc = weather?.temp != null 
    ? `${weather.temp}°C, wind ${weather.wind}km/h at the Witch's Foot, Maine`
    : 'the Witch\'s Foot, Maine';
  const apodTitle = apod?.title || 'the cosmos';
  const extras = [uvMood, tideMood].filter(Boolean).join('. ');
  return `A fantasy landscape scene inspired by "${apodTitle}". ${weatherDesc}. ${solarMood}. ${moonMood}.${extras ? ' ' + extras + '.' : ''} Ancient stone ruins, a distant tower, a small fire burning. Atmospheric, cinematic, digital painting style. No text, no letters, no words.`;
}

// ═══════════════════════════════════
// POLLINATIONS API CALLS
// ═══════════════════════════════════

async function pollinationsText(prompt) {
  try {
    const resp = await fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: prompt }],
        model: 'openai',
        temperature: 0.9,
        max_tokens: 200
      })
    });
    if (resp.ok) return (await resp.text()).trim();
  } catch(e) {}
  return null;
}

function pollinationsImage(prompt) {
  return IMAGE_SERVICES.pollinations(prompt);
}

// ═══════════════════════════════════
// CHARACTER CASCADE ENGINE
// ═══════════════════════════════════

async function generateCharacterStage(stage) {
  if (!sceneData) return null;
  
  const { solar, moon, weather, apod, tide } = sceneData;
  const solarMood = solar?.class?.startsWith('X') ? 'violent and sudden' 
    : solar?.class?.startsWith('M') ? 'dramatic and energetic'
    : 'gradual and subtle';
  
  let prompt;
  
  if (stage === 0) {
    // Stage 1: The Arrival
    prompt = `Describe a solitary wanderer who has just arrived in this scene. ` +
      `The sky is lit by "${apod?.title || 'the cosmos'}". ` +
      `The mood is ${solarMood}. The moon is ${moon?.name || 'overhead'}. ` +
      `The temperature is ${weather?.temp || 'unknown'}°C with ${weather?.wind || 'unknown'} km/h winds. ` +
      `Describe the wanderer's appearance, their clothing, what they carry, and their posture. ` +
      `Be specific and vivid. 2-3 sentences. Do not name the wanderer.`;
  } else {
    // Stages 2-4: Evolution — what changed?
    const previousDesc = characterHistory[characterHistory.length - 1] || '';
    const stageNames = ['', 'Approach', 'Threshold', 'Return'];
    const stageName = stageNames[stage] || 'Change';
    
    prompt = `A wanderer in a fantasy landscape. Previously: "${previousDesc}". ` +
      `The scene is: "${buildScenePrompt(solar, moon, weather, apod, tide)}". ` +
      `The mood is ${solarMood}. The moon is ${moon?.name || 'overhead'}. ` +
      `This is Stage ${stage + 1}: The ${stageName}. ` +
      `Describe how the wanderer has CHANGED from the previous description. ` +
      `What have they acquired? What has changed about their appearance, their possessions, their posture? ` +
      `What new element has entered their story? ` +
      `Be specific. 2-3 sentences. Reference the previous description so the evolution is clear.`;
  }
  
  // Generate text description
  const textDesc = await pollinationsText(prompt);
  if (!textDesc) return null;
  
  characterHistory.push(textDesc);
  
  // Generate image from the description
  const imagePrompt = `A fantasy character: ${textDesc}. The scene: ${buildScenePrompt(solar, moon, weather, apod, tide)}. Digital painting, atmospheric, cinematic, no text.`;
  const imageUrl = pollinationsImage(imagePrompt);
  
  // Log the evolution
  addEvolutionLog(stage, textDesc);
  
  return { textDesc, imageUrl };
}

function addEvolutionLog(stage, text) {
  const log = document.getElementById('evolutionLog');
  const stageNames = ['Arrival', 'Approach', 'Threshold', 'Return'];
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.textContent = `[Stage ${stage+1}: ${stageNames[stage]}] ${text}`;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

async function advanceCascade() {
  if (!cascadeRunning || cascadeStage >= MAX_CASCADE_STAGES) {
    stopCascade();
    return;
  }
  
  // Update dots
  updateCascadeDots(cascadeStage, 'generating');
  
  const stageNames = ['The Arrival', 'The Approach', 'The Threshold', 'The Return'];
  document.getElementById('characterStage').textContent = 
    `Stage ${cascadeStage + 1} · ${stageNames[cascadeStage]}`;
  
  // Generate this stage
  const result = await generateCharacterStage(cascadeStage);
  
  if (result) {
    // Update character display
    const img = document.getElementById('characterImg');
    const placeholder = document.getElementById('characterPlaceholder');
    
    // Preload the new image
    const loadedUrl = await preloadImage(result.imageUrl);
    if (loadedUrl) {
      img.src = loadedUrl;
      img.style.display = 'block';
      img.classList.remove('loading-img');
      placeholder.style.display = 'none';
    }
    
    document.getElementById('characterDesc').textContent = result.textDesc;
    document.getElementById('dataCascade').textContent = `Stage ${cascadeStage + 1}/4 · ${stageNames[cascadeStage]}`;
    
    updateCascadeDots(cascadeStage, 'active');
  } else {
    updateCascadeDots(cascadeStage, 'active');
    document.getElementById('characterDesc').textContent = '[The wanderer pauses. The path is unclear.]';
  }
  
  cascadeStage++;
  
  // Schedule next stage
  if (cascadeStage < MAX_CASCADE_STAGES) {
    const remaining = (MAX_CASCADE_STAGES - cascadeStage) * (CASCADE_INTERVAL / 1000);
    document.getElementById('cascadeTimer').textContent = `Next: ${CASCADE_INTERVAL / 1000}s`;
    startCountdown();
    cascadeTimer = setTimeout(advanceCascade, CASCADE_INTERVAL);
  } else {
    stopCascade();
  }
}

function startCountdown() {
  let remaining = CASCADE_INTERVAL / 1000;
  const timerEl = document.getElementById('cascadeTimer');
  const interval = setInterval(() => {
    remaining--;
    if (remaining <= 0 || !cascadeRunning) {
      clearInterval(interval);
      return;
    }
    timerEl.textContent = `Next: ${remaining}s`;
  }, 1000);
}

function updateCascadeDots(activeStage, state) {
  for (let i = 0; i < MAX_CASCADE_STAGES; i++) {
    const dot = document.getElementById(`cascadeDot${i}`);
    if (!dot) continue;
    dot.classList.remove('active', 'generating');
    if (i === activeStage && state === 'generating') dot.classList.add('generating');
    else if (i < activeStage || (i === activeStage && state === 'active')) dot.classList.add('active');
  }
}

function toggleCascade() {
  if (cascadeRunning) {
    stopCascade();
  } else {
    startCascade();
  }
}

function startCascade() {
  if (!sceneData) return;
  
  cascadeRunning = true;
  cascadeStage = 0;
  characterHistory = [];
  
  // Clear previous
  document.getElementById('evolutionLog').innerHTML = '';
  document.getElementById('characterImg').style.display = 'none';
  document.getElementById('characterPlaceholder').style.display = 'flex';
  document.getElementById('characterPlaceholder').textContent = 'The wanderer approaches...';
  document.getElementById('characterDesc').textContent = '';
  
  // Reset dots
  for (let i = 0; i < MAX_CASCADE_STAGES; i++) {
    updateCascadeDots(i, '');
  }
  
  document.getElementById('cascadeBtn').textContent = '⏹ Stop Cascade';
  document.getElementById('dataCascade').textContent = 'Starting...';
  
  // Show evolution log
  document.getElementById('evolutionLog').style.display = 'block';
  
  // Start immediately
  advanceCascade();
}

function stopCascade() {
  cascadeRunning = false;
  if (cascadeTimer) { clearTimeout(cascadeTimer); cascadeTimer = null; }
  document.getElementById('cascadeBtn').textContent = '▶ Start Cascade';
  document.getElementById('cascadeTimer').textContent = 'Complete';
  document.getElementById('dataCascade').textContent = 
    `Complete · ${cascadeStage} stages`;
  
  // Mark remaining dots as inactive
  for (let i = cascadeStage; i < MAX_CASCADE_STAGES; i++) {
    const dot = document.getElementById(`cascadeDot${i}`);
    if (dot) dot.classList.remove('active', 'generating');
  }
}

// ═══════════════════════════════════
// ELEMENT PROMPTS
// ═══════════════════════════════════

function getElementPrompts() {
  return [
    { label: 'The Tower', prompt: 'A lone ancient stone tower on a hill at twilight, crumbling but still standing, one window glowing with firelight, atmospheric digital painting' },
    { label: 'The Forest', prompt: 'Dark pine forest at the edge of a clearing, mist between the trees, moonlight filtering through branches, moody atmospheric digital painting' },
    { label: 'The Hearth', prompt: 'A small campfire burning in a stone circle, embers rising into the dark, warm glow on surrounding stones, cozy but isolated, digital painting' },
  ];
}

// ═══════════════════════════════════
// RENDER SCENE
// ═══════════════════════════════════

async function generateScene() {
  // Stop any running cascade
  if (cascadeRunning) stopCascade();
  
  const desc = document.getElementById('sceneDesc');
  desc.classList.add('loading');
  desc.textContent = 'The world assembles itself...';
  
  // Fetch all data
  const [apod, solar, moon, weather, tide] = await Promise.all([
    fetchAPOD(), fetchSolarData(), fetchMoonPhase(), fetchWeather(), fetchTide()
  ]);
  
  // Store for cascade use
  sceneData = { apod, solar, moon, weather, tide };
  
  // Set background
  if (apod?.url && apod.url !== lastBackgroundUrl) {
    const loadedUrl = await preloadImage(apod.url);
    if (loadedUrl) {
      document.getElementById('sceneBody').style.backgroundImage = `url(${loadedUrl})`;
      lastBackgroundUrl = loadedUrl;
    }
  }
  
  const scenePrompt = buildScenePrompt(solar, moon, weather, apod, tide);
  
  // Generate scene description
  let sceneText = await pollinationsText(
    `Describe this scene in 3-4 poetic sentences. Use vivid imagery. ${scenePrompt}`
  );
  
  if (!sceneText) {
    sceneText = `The Witch's Foot under a ${moon?.name || 'shifting'} sky. The air holds ${weather?.temp || 'an unknown'} degrees. The tower stands. The fire burns. The world breathes.`;
  }
  
  desc.classList.remove('loading');
  desc.textContent = sceneText;
  
  // Reset character section
  document.getElementById('characterImg').style.display = 'none';
  document.getElementById('characterPlaceholder').style.display = 'flex';
  document.getElementById('characterPlaceholder').textContent = 'The wanderer has not yet arrived.';
  document.getElementById('characterDesc').textContent = '';
  document.getElementById('characterStage').textContent = 'Stage 1 · The Arrival';
  document.getElementById('evolutionLog').innerHTML = '';
  document.getElementById('evolutionLog').style.display = 'none';
  for (let i = 0; i < MAX_CASCADE_STAGES; i++) updateCascadeDots(i, '');
  document.getElementById('cascadeTimer').textContent = '—';
  
  // Element images
  const elements = getElementPrompts();
  const grid = document.getElementById('elementsGrid');
  grid.innerHTML = elements.map(el => `
    <div class="element-card">
      <img src="${IMAGE_SERVICES.pollinations(el.prompt)}" alt="${el.label}" loading="lazy"
           onerror="this.src='${IMAGE_SERVICES.picsum(el.label.replace(/\s/g,''))}'">
      <div class="element-label">${el.label}</div>
    </div>
  `).join('');
  
  // Update data bar
  document.getElementById('dataBg').textContent = apod?.title || '—';
  document.getElementById('dataSolar').textContent = solar?.class || '—';
  document.getElementById('dataMoon').textContent = moon ? `${moon.emoji} ${moon.name} (${moon.phase}%)` : '—';
  document.getElementById('dataWeather').textContent = weather ? `${weather.temp}°C, wind ${weather.wind}km/h` : '—';
  document.getElementById('dataUv').textContent = weather?.uv != null ? `${weather.uv} (${uvLabel(weather.uv)})` : '—';
  document.getElementById('dataSun').textContent = weather
    ? `↑${formatClockTime(weather.sunrise) || '—'} ↓${formatClockTime(weather.sunset) || '—'}` : '—';
  document.getElementById('dataTide').textContent = tide
    ? `${tide.state}, next ${tide.nextType} ${tide.nextTime} (${tide.nextHeight}ft)` : '—';
  document.getElementById('dataCascade').textContent = 'Not started';
  
  // Date
  document.getElementById('sceneDate').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

function toggleDataBar() {
  const bar = document.getElementById('dataBar');
  bar.style.display = bar.style.display === 'none' ? '' : 'none';
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
generateScene();
</script>
