<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Scene · The Living World</title>
<style>
  :root {
    --overlay: rgba(5, 5, 15, 0.75);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Georgia', serif;
    color: #e8e0d0;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    transition: background-image 1s ease;
    position: relative;
    overflow-x: hidden;
  }
  
  /* Dark overlay for readability */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 0;
  }
  
  /* Content */
  .content {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* Header */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header .sigil { font-size: 40px; margin-bottom: 8px; }
  .header h1 { 
    font-size: 22px; 
    letter-spacing: 0.1em; 
    color: #c9a84c;
    margin-bottom: 4px;
  }
  .header .date {
    font-size: 11px;
    color: rgba(200,180,140,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  
  /* Scene Description */
  .scene-description {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.2);
    border-left: 3px solid #c9a84c;
    padding: 24px;
    margin-bottom: 32px;
    font-size: 17px;
    line-height: 1.7;
    font-style: italic;
    color: rgba(220,200,160,0.9);
    text-align: center;
    min-height: 80px;
  }
  .scene-description.loading {
    color: rgba(180,160,100,0.4);
    font-style: normal;
  }
  
  /* Element Images */
  .elements {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .element-card {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.15);
    padding: 12px;
    text-align: center;
  }
  .element-card img {
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    border: 1px solid rgba(200,160,80,0.1);
    background: rgba(0,0,0,0.5);
  }
  .element-label {
    font-size: 10px;
    color: rgba(200,160,100,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 8px;
  }
  
  /* Data Bar */
  .data-bar {
    background: rgba(10, 8, 4, 0.7);
    border: 1px solid rgba(200,160,80,0.15);
    padding: 16px;
    margin-top: auto;
    font-family: monospace;
    font-size: 10px;
    color: rgba(180,160,100,0.5);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
  }
  .data-item strong {
    color: #c9a84c;
    display: block;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  
  /* Buttons */
  .btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .btn {
    background: rgba(20, 15, 8, 0.8);
    border: 1px solid rgba(200,160,80,0.3);
    color: #c9a84c;
    padding: 10px 20px;
    font-family: 'Georgia', serif;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.3s;
  }
  .btn:hover { background: rgba(40, 30, 15, 0.8); border-color: #c9a84c; color: #e0c860; }
</style>
</head>
<body id="sceneBody">

<div class="content">
  
  <div class="header">
    <div class="sigil">🌍</div>
    <h1>The Living World</h1>
    <div class="date" id="sceneDate"></div>
  </div>
  
  <div class="btn-row">
    <button class="btn" onclick="generateScene()">⟳ New Scene</button>
    <button class="btn" onclick="toggleDataBar()">📊 Toggle Data</button>
  </div>
  
  <div class="scene-description loading" id="sceneDesc">
    The world assembles itself. One moment.
  </div>
  
  <div class="elements" id="elementsGrid"></div>
  
  <div class="data-bar" id="dataBar">
    <div class="data-item"><strong>Background</strong><span id="dataBg">—</span></div>
    <div class="data-item"><strong>Solar</strong><span id="dataSolar">—</span></div>
    <div class="data-item"><strong>Moon</strong><span id="dataMoon">—</span></div>
    <div class="data-item"><strong>Weather</strong><span id="dataWeather">—</span></div>
    <div class="data-item"><strong>Scene Prompt</strong><span id="dataPrompt">—</span></div>
  </div>

</div>

<script>
// ═══════════════════════════════════
// FREE IMAGE APIs
// ═══════════════════════════════════

const IMAGE_SERVICES = {
  // Pollinations image generation — free, no key
  pollinations: (prompt) => 
    `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=500&nologo=true`,
  
  // Another free option — picsum placeholder while waiting
  picsum: (seed) => `https://picsum.photos/seed/${seed}/800/500`,
};

// ═══════════════════════════════════
// DATA FETCHERS
// ═══════════════════════════════════

async function fetchAPOD() {
  try {
    const resp = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
    const data = await resp.json();
    if (data.media_type === 'image') {
      return { url: data.url, title: data.title, date: data.date };
    }
    // Fallback: yesterday's image
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
    const fallbackResp = await fetch(`https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date=${yesterday}`);
    const fallback = await fallbackResp.json();
    return { url: fallback.url, title: fallback.title, date: fallback.date };
  } catch(e) {
    return null;
  }
}

async function fetchSolarData() {
  try {
    const resp = await fetch('https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json');
    const rows = await resp.json();
    const longRows = rows.filter(r => r.energy === '0.1-0.8nm');
    if (longRows.length > 0) {
      const latest = longRows[longRows.length - 1];
      const flux = latest.flux;
      let cls = '?';
      if (flux < 1e-7) cls = `A${(flux/1e-8).toFixed(1)}`;
      else if (flux < 1e-6) cls = `B${(flux/1e-7).toFixed(1)}`;
      else if (flux < 1e-5) cls = `C${(flux/1e-6).toFixed(1)}`;
      else if (flux < 1e-4) cls = `M${(flux/1e-5).toFixed(1)}`;
      else cls = `X${(flux/1e-4).toFixed(1)}`;
      return { class: cls, flux: flux?.toExponential(2), time: latest.time_tag };
    }
  } catch(e) {}
  return null;
}

async function fetchMoonPhase() {
  try {
    const now = new Date();
    const lp = 2551443;
    const newMoon = new Date(2026, 4, 18).getTime();
    const phase = ((now.getTime() - newMoon) % lp) / lp;
    const names = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous',
                   'Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
    const idx = Math.floor(phase * 8) % 8;
    const emojis = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
    return { phase: (phase*100).toFixed(1), name: names[idx], emoji: emojis[idx] };
  } catch(e) {}
  return null;
}

async function fetchWeather() {
  try {
    // Witch's Foot — Bucksport, Maine
    const resp = await fetch('https://api.open-meteo.com/v1/forecast?latitude=44.5734&longitude=-68.7956&current_weather=true');
    const data = await resp.json();
    if (data.current_weather) {
      const w = data.current_weather;
      return { temp: w.temperature, wind: w.windspeed, code: w.weathercode };
    }
  } catch(e) {}
  return null;
}

// ═══════════════════════════════════
// BUILD SCENE PROMPT
// ═══════════════════════════════════

function buildScenePrompt(solar, moon, weather, apod) {
  const solarMood = solar?.class?.startsWith('X') ? 'harsh blazing light, intense, dangerous'
    : solar?.class?.startsWith('M') ? 'bright active light, energetic'
    : solar?.class?.startsWith('C') ? 'moderate daylight, steady'
    : 'quiet dim light, calm, still';
  
  const moonMood = moon?.name?.includes('Full') ? 'full moon casting long shadows'
    : moon?.name?.includes('New') ? 'moonless dark night'
    : `moon in ${moon?.name || 'unknown phase'}`;
  
  const weatherDesc = weather?.temp != null 
    ? `${weather.temp}°C, wind ${weather.wind}km/h at the Witch's Foot, Maine`
    : 'the Witch\'s Foot, Maine';
  
  const apodTitle = apod?.title || 'the cosmos';
  
  return `A fantasy landscape scene inspired by "${apodTitle}". ${weatherDesc}. ${solarMood}. ${moonMood}. Ancient stone ruins, a distant tower, a small fire burning. Atmospheric, cinematic, digital painting style. No text, no letters, no words.`;
}

// ═══════════════════════════════════
// GENERATE SCENE ELEMENTS
// ═══════════════════════════════════

function getElementPrompts() {
  return [
    { label: 'The Tower', prompt: 'A lone ancient stone tower on a hill at twilight, crumbling but still standing, one window glowing with firelight, atmospheric digital painting' },
    { label: 'The Forest', prompt: 'Dark pine forest at the edge of a clearing, mist between the trees, moonlight filtering through branches, moody atmospheric digital painting' },
    { label: 'The Hearth', prompt: 'A small campfire burning in a stone circle, embers rising into the dark, warm glow on surrounding stones, cozy but isolated, digital painting' },
  ];
}

// ═══════════════════════════════════
// RENDER SCENE
// ═══════════════════════════════════

async function generateScene() {
  const desc = document.getElementById('sceneDesc');
  desc.classList.add('loading');
  desc.textContent = 'The world assembles itself...';
  
  // Fetch all data
  const [apod, solar, moon, weather] = await Promise.all([
    fetchAPOD(),
    fetchSolarData(),
    fetchMoonPhase(),
    fetchWeather()
  ]);
  
  // Set background
  if (apod?.url) {
    document.getElementById('sceneBody').style.backgroundImage = `url(${apod.url})`;
  }
  
  // Build scene prompt
  const scenePrompt = buildScenePrompt(solar, moon, weather, apod);
  
  // Generate scene description via Pollinations Text API
  let sceneText = '';
  try {
    const resp = await fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: `Describe this scene in 3-4 poetic sentences. Use vivid imagery. ${scenePrompt}` }],
        model: 'openai',
        temperature: 0.9,
        max_tokens: 200
      })
    });
    if (resp.ok) sceneText = (await resp.text()).trim();
  } catch(e) {}
  
  if (!sceneText) {
    sceneText = `The Witch's Foot under a ${moon?.name || 'shifting'} sky. The air holds ${weather?.temp || 'an unknown'} degrees. The tower stands. The fire burns. The world breathes.`;
  }
  
  desc.classList.remove('loading');
  desc.textContent = sceneText;
  
  // Generate element images
  const elements = getElementPrompts();
  const grid = document.getElementById('elementsGrid');
  grid.innerHTML = elements.map(el => `
    <div class="element-card">
      <img src="${IMAGE_SERVICES.pollinations(el.prompt)}" 
           alt="${el.label}" 
           loading="lazy"
           onerror="this.src='${IMAGE_SERVICES.picsum(el.label.replace(/\s/g,''))}'">
      <div class="element-label">${el.label}</div>
    </div>
  `).join('');
  
  // Update data bar
  document.getElementById('dataBg').textContent = apod?.title || '—';
  document.getElementById('dataSolar').textContent = solar?.class || '—';
  document.getElementById('dataMoon').textContent = moon ? `${moon.emoji} ${moon.name} (${moon.phase}%)` : '—';
  document.getElementById('dataWeather').textContent = weather ? `${weather.temp}°C, wind ${weather.wind}km/h` : '—';
  document.getElementById('dataPrompt').textContent = scenePrompt.substring(0, 100) + '...';
  
  // Date
  document.getElementById('sceneDate').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

function toggleDataBar() {
  const bar = document.getElementById('dataBar');
  bar.style.display = bar.style.display === 'none' ? '' : 'none';
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
generateScene();
</script>

</body>
</html>
