<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Scene · The Living World</title>
<style>
  :root { --overlay: rgba(5, 5, 15, 0.7); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Georgia', serif; color: #e8e0d0; min-height: 100vh;
    background: #05050f; position: relative; overflow-x: hidden;
  }
  
  /* Full-bleed scene image */
  .scene-image-container {
    position: fixed; inset: 0; z-index: 0;
  }
  .scene-image-container img {
    width: 100%; height: 100%; object-fit: cover; transition: opacity 1.5s ease;
  }
  .scene-image-container img.loading-img { opacity: 0.3; }
  .scene-image-overlay {
    position: fixed; inset: 0; background: var(--overlay); z-index: 1; pointer-events: none;
  }
  
  /* Content overlaid on scene */
  .content {
    position: relative; z-index: 2; max-width: 900px; margin: 0 auto;
    padding: 40px 28px; min-height: 100vh; display: flex; flex-direction: column;
  }
  
  .header { text-align: center; margin-bottom: 16px; }
  .header .sigil { font-size: 36px; margin-bottom: 4px; }
  .header h1 { font-size: 22px; letter-spacing: 0.1em; color: #c9a84c; margin-bottom: 2px; }
  .header .date { font-size: 11px; color: rgba(200,180,140,0.5); letter-spacing: 0.08em; text-transform: uppercase; }
  
  /* World State — compact */
  .world-state {
    display: flex; gap: 4px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap;
  }
  .ws-item { background: rgba(10, 8, 4, 0.8); padding: 6px 12px; text-align: center; border: 1px solid rgba(200,160,80,0.15); min-width: 70px; }
  .ws-label { font-size: 7px; color: rgba(200,160,100,0.5); letter-spacing: 0.08em; text-transform: uppercase; }
  .ws-value { font-size: 16px; color: #c9a84c; }
  .ws-fill { height: 2px; transition: width 1s ease; margin-top: 2px; }
  .ws-fill.vitality { background: #44cc88; } .ws-fill.luminosity { background: #ffd700; }
  .ws-fill.chaos { background: #ff4444; } .ws-fill.harmony { background: #4488ff; }
  .ws-fill.memory { background: #cc88ff; }
  
  .scene-description {
    background: rgba(10, 8, 4, 0.75); border: 1px solid rgba(200,160,80,0.2);
    border-left: 3px solid #c9a84c; padding: 18px 24px; margin-bottom: 16px;
    font-size: 19px; line-height: 1.7; font-style: italic;
    color: rgba(220,200,160,0.9); text-align: center; min-height: 50px;
  }
  .scene-description.loading { color: rgba(180,160,100,0.4); font-style: normal; }
  
  /* Character Generator */
  .char-gen {
    display: none; background: rgba(10, 8, 4, 0.75); border: 1px solid rgba(200,160,80,0.2);
    border-left: 3px solid #4488ff; padding: 18px 24px; margin-bottom: 16px; text-align: center;
  }
  .char-gen h3 { font-size: 11px; color: #4488ff; letter-spacing: 0.1em; margin-bottom: 12px; text-transform: uppercase; }
  .char-gen .char-details { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .char-gen .char-field { text-align: center; }
  .char-gen .char-field strong { color: #c9a84c; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .char-gen .char-field span { font-size: 15px; color: rgba(220,200,160,0.9); font-style: italic; }
  
  /* Character Section */
  .character-section {
    background: rgba(10, 8, 4, 0.75); border: 1px solid rgba(200,160,80,0.2);
    border-left: 3px solid #c9a84c; padding: 18px 24px; margin-bottom: 16px; text-align: center;
  }
  .character-label { font-size: 10px; color: rgba(200,160,100,0.5); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .character-stage { font-size: 9px; color: #c9a84c; letter-spacing: 0.06em; margin-bottom: 12px; }
  .character-desc { font-size: 15px; font-style: italic; color: rgba(200,180,140,0.8); margin-top: 12px; line-height: 1.6; }
  
  .choices-section { margin-top: 12px; }
  .choices-label { font-size: 9px; color: rgba(200,160,100,0.5); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .choices-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .choice-card {
    background: rgba(10, 8, 4, 0.85); border: 1px solid rgba(200,160,80,0.2);
    padding: 12px; cursor: pointer; text-align: center; transition: all 0.3s;
  }
  .choice-card:hover { background: rgba(40, 30, 15, 0.85); border-color: #c9a84c; }
  .choice-emoji { font-size: 24px; margin-bottom: 4px; }
  .choice-title { font-size: 11px; color: #c9a84c; letter-spacing: 0.06em; margin-bottom: 4px; }
  .choice-desc { font-size: 10px; color: rgba(200,180,140,0.6); font-style: italic; line-height: 1.4; }
  
  .writer-input { margin-top: 12px; }
  .writer-input textarea {
    width: 100%; background: rgba(0,0,0,0.55); border: 1px solid rgba(200,160,80,0.3);
    color: #e8e0d0; padding: 12px; font-family: 'Georgia', serif; font-size: 15px;
    resize: vertical; min-height: 60px; line-height: 1.5;
  }
  .writer-input textarea:focus { outline: none; border-color: #c9a84c; }
  .writer-input textarea::placeholder { color: rgba(180,160,100,0.3); font-style: italic; }
  .writer-row { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .writer-timer { font-size: 12px; color: rgba(200,160,100,0.6); letter-spacing: 0.06em; min-width: 50px; }
  .writer-timer.urgent { color: #ff4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  
  .story-export {
    display: none; background: rgba(10, 8, 4, 0.8); border: 1px solid rgba(200,160,80,0.2);
    border-left: 3px solid #44cc88; padding: 20px; margin-bottom: 16px; text-align: center;
  }
  .story-export h3 { font-size: 12px; color: #44cc88; letter-spacing: 0.1em; margin-bottom: 12px; text-transform: uppercase; }
  .story-text {
    background: rgba(0,0,0,0.45); border: 1px solid rgba(200,160,80,0.1); padding: 18px;
    font-size: 15px; line-height: 1.7; color: rgba(200,180,140,0.8); text-align: left;
    max-height: 350px; overflow-y: auto; margin-bottom: 12px;
  }
  .story-text .human-line { color: #44cc88; }
  .story-text .stage-marker { color: #c9a84c; font-size: 10px; letter-spacing: 0.08em; display: block; margin-top: 14px; margin-bottom: 4px; }
  .story-text .choice-marker { color: #4488ff; font-size: 10px; display: block; margin-bottom: 4px; }
  
  .btn-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .btn {
    background: rgba(20, 15, 8, 0.8); border: 1px solid rgba(200,160,80,0.3);
    color: #c9a84c; padding: 8px 16px; font-family: 'Georgia', serif;
    font-size: 12px; cursor: pointer; letter-spacing: 0.06em; transition: all 0.3s;
  }
  .btn:hover { background: rgba(40, 30, 15, 0.8); border-color: #c9a84c; color: #e0c860; }
  .btn.continue-btn { border-color: #44cc88; color: #44cc88; font-weight: bold; }
  .btn.continue-btn:hover { background: #44cc88; color: #05050f; }
  .btn.finish-btn { border-color: #cc88ff; color: #cc88ff; }
  .btn.finish-btn:hover { background: #cc88ff; color: #05050f; }
  
  .stats-row { text-align: center; font-size: 10px; color: rgba(200,180,140,0.4); letter-spacing: 0.06em; margin-bottom: 12px; }
  .stats-row span { color: #c9a84c; }
  
  .data-bar {
    background: rgba(10, 8, 4, 0.8); border: 1px solid rgba(200,160,80,0.15); padding: 14px;
    margin-top: auto; font-family: monospace; font-size: 10px; color: rgba(180,160,100,0.5);
    display: none; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px;
  }
  .data-bar.visible { display: grid; }
  .data-item strong { color: #c9a84c; display: block; font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
  
  @media (max-width: 600px) {
    .choices-grid { grid-template-columns: 1fr; }
    .scene-description { font-size: 16px; }
    .content { padding: 24px 16px; }
  }
</style>
</head>
<body>

<div class="scene-image-container">
  <img id="sceneImage" src="" alt="Scene" class="loading-img" style="display:none;">
  <div class="scene-image-overlay"></div>
</div>

<div class="content">
  
  <div class="header">
    <div class="sigil">🌍</div>
    <h1>The Living World</h1>
    <div class="date" id="sceneDate"></div>
  </div>
  
  <div class="stats-row">
    Stories: <span id="statsStories">0</span> · Stages: <span id="statsContributions">0</span>
  </div>
  
  <div class="btn-row">
    <button class="btn" onclick="generateScene()">⟳ New Scene</button>
    <button class="btn" id="cascadeBtn" onclick="toggleCascade()">▶ Start Story</button>
    <button class="btn" onclick="toggleDataBar()">📊 Data</button>
    <button class="btn" id="droneToggle" onclick="toggleDrone()">🎧 Tone: off</button>
  </div>

  <div class="world-state" id="worldState">
    <div class="ws-item"><div class="ws-label">Vitality</div><div class="ws-value" id="wsVitality">—</div><div class="ws-fill vitality" id="wsBarVitality" style="width:0%"></div></div>
    <div class="ws-item"><div class="ws-label">Luminosity</div><div class="ws-value" id="wsLuminosity">—</div><div class="ws-fill luminosity" id="wsBarLuminosity" style="width:0%"></div></div>
    <div class="ws-item"><div class="ws-label">Chaos</div><div class="ws-value" id="wsChaos">—</div><div class="ws-fill chaos" id="wsBarChaos" style="width:0%"></div></div>
    <div class="ws-item"><div class="ws-label">Harmony</div><div class="ws-value" id="wsHarmony">—</div><div class="ws-fill harmony" id="wsBarHarmony" style="width:0%"></div></div>
    <div class="ws-item"><div class="ws-label">Memory</div><div class="ws-value" id="wsMemory">—</div><div class="ws-fill memory" id="wsBarMemory" style="width:0%"></div></div>
  </div>
  
  <div class="scene-description loading" id="sceneDesc">The world assembles itself.</div>
  
  <div class="char-gen" id="charGen">
    <h3>✦ Character ✦</h3>
    <div class="char-details">
      <div class="char-field"><strong>Name</strong><span id="charName">—</span></div>
      <div class="char-field"><strong>Setting</strong><span id="charSetting">—</span></div>
      <div class="char-field"><strong>Object</strong><span id="charObject">—</span></div>
    </div>
  </div>
  
  <div class="story-export" id="storyExport">
    <h3>✦ Your Story ✦</h3>
    <div class="story-text" id="storyText"></div>
    <div class="btn-row">
      <button class="btn" onclick="copyStory()">📋 Copy</button>
      <button class="btn" onclick="downloadStory()">⬇ Download</button>
      <button class="btn" onclick="generateScene()">⟳ New Scene</button>
    </div>
  </div>
  
  <div class="character-section" id="characterSection">
    <div class="character-label">✦ <span id="characterNameLabel">The Wanderer</span> ✦</div>
    <div class="character-stage" id="characterStage">Stage 1</div>
    <div class="character-desc" id="characterDesc"></div>
    
    <div class="choices-section" id="choicesSection">
      <div class="choices-label">Where next?</div>
      <div class="choices-grid" id="choicesGrid"></div>
    </div>
    
    <div class="writer-input" id="writerInput">
      <textarea id="writerTextarea" placeholder="What happens? Write a line of dialogue or action..."></textarea>
      <div class="writer-row">
        <button class="btn continue-btn" onclick="submitWriting()">▶ Continue</button>
        <button class="btn finish-btn" onclick="finishStory()">✦ Finish</button>
        <span class="writer-timer" id="writerTimer">60s</span>
      </div>
    </div>
  </div>
  
  <div class="data-bar" id="dataBar">
    <div class="data-item"><strong>Solar</strong><span id="dataSolar">—</span></div>
    <div class="data-item"><strong>Moon</strong><span id="dataMoon">—</span></div>
    <div class="data-item"><strong>Weather</strong><span id="dataWeather">—</span></div>
    <div class="data-item"><strong>Sun</strong><span id="dataSun">—</span></div>
    <div class="data-item"><strong>Tide</strong><span id="dataTide">—</span></div>
    <div class="data-item"><strong>Quakes</strong><span id="dataQuakes">—</span></div>
    <div class="data-item"><strong>ISS</strong><span id="dataIss">—</span></div>
    <div class="data-item"><strong>Stage</strong><span id="dataCascade">—</span></div>
  </div>

</div>

<script>
// ═══════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════
const LAT=44.5734,LON=-68.7956,NOAA_TIDE_STATION='8414684';
const WRITE_TIME=60;
const MEMORY_KEY='gaia_world_memory',STATS_KEY='gaia_writer_stats',GENDER_KEY='gaia_wanderer_gender';
let renderGuard=false;
const pollinationsImg=(p,w=1200,h=700)=>`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=${w}&height=${h}&nologo=true`;

let cascadeRunning=false,countdownTimer=null,cascadeStage=0;
let characterHistory=[],humanLines=[],choiceHistory=[],sceneData=null,worldState=null;
let currentCountdown=0,characterData=null,currentSceneImage=null;

// ═══════════════════════════════════
// GENDER TRACKING
// ═══════════════════════════════════
function getStoredGender(){try{return localStorage.getItem(GENDER_KEY)||'she';}catch(e){return'she';}}
function flipStoredGender(){const g=getStoredGender()==='she'?'he':'she';try{localStorage.setItem(GENDER_KEY,g);}catch(e){}return g;}
function pronouns(g){return{subj:g,obj:g==='she'?'her':'him',poss:g==='she'?'her':'his',refl:g==='she'?'herself':'himself'};}

// ═══════════════════════════════════
// STATS
// ═══════════════════════════════════
function getStats(){try{return JSON.parse(localStorage.getItem(STATS_KEY))||{stories:0,stages:0};}catch(e){return{stories:0,stages:0};}}
function incStories(){const s=getStats();s.stories++;localStorage.setItem(STATS_KEY,JSON.stringify(s));return s;}
function incStages(){const s=getStats();s.stages++;localStorage.setItem(STATS_KEY,JSON.stringify(s));return s;}
function updateStats(){const s=getStats();document.getElementById('statsStories').textContent=s.stories;document.getElementById('statsContributions').textContent=s.stages;}

// ═══════════════════════════════════
// WORLD STATE ENGINE
// ═══════════════════════════════════
function norm(v){return Math.round(Math.max(0,Math.min(1,v))*100);}
function getMemory(){try{const s=JSON.parse(localStorage.getItem(MEMORY_KEY));if(s)return s;}catch(e){}return{daysVisited:0,pastStates:[],lastVisit:null};}
function updateMemory(ws){const m=getMemory();const today=new Date().toISOString().split('T')[0];if(m.lastVisit!==today){m.daysVisited++;m.lastVisit=today;m.pastStates.push({date:today,v:ws.vitality,l:ws.luminosity,c:ws.chaos,h:ws.harmony});if(m.pastStates.length>30)m.pastStates.shift();}try{localStorage.setItem(MEMORY_KEY,JSON.stringify(m));}catch(e){}return m;}
function calcWorld(solar,moon,weather,tide,quakes,iss){
  const day=weather?.sunrise&&weather?.sunset?new Date()>=new Date(weather.sunrise)&&new Date()<=new Date(weather.sunset):new Date().getHours()>=6&&new Date().getHours()<20;
  const sr=solar?.class?.charAt(0)==='X'?5:solar?.class?.charAt(0)==='M'?4:solar?.class?.charAt(0)==='C'?3:solar?.class?.charAt(0)==='B'?2:1;
  const mi=moon?.phase?parseFloat(moon.phase)/100:0.5;
  const v=norm((weather?.uv||3)/11*0.4+(weather?.temp>15?0.3:weather?.temp>5?0.2:0.1)*0.4+(mi>0.5?0.2:0.1)*0.2);
  const l=norm(sr/5*0.4+mi*0.3+(day?0.3:0.1));
  const c=norm((weather?.wind||10)/60*0.3+(sr>=4?0.4:sr===3?0.2:0)*0.3+(quakes?.count24h>50?0.3:quakes?.count24h>10?0.15:0)*0.2+(tide?.state==='rising'&&(weather?.wind||0)>30?0.2:0.1)*0.2);
  const h=norm((1-c/100)*0.5+((weather?.temp||15)>10&&(weather?.temp||15)<25?0.3:0.1)*0.3+(mi>0.3&&mi<0.7?0.2:0.1)*0.2);
  const mo=getMemory();const mm=norm(Math.min(mo.daysVisited/30,1)*0.5+(mo.pastStates.length>0?0.5:0));
  return{vitality:v,luminosity:l,chaos:c,harmony:h,memory:mm,memoryObj:mo,isDaytime:day,solarRank:sr,moonIllum:mi};
}
function updateWorldDisplay(ws){
  document.getElementById('wsVitality').textContent=ws.vitality+'%';
  document.getElementById('wsLuminosity').textContent=ws.luminosity+'%';
  document.getElementById('wsChaos').textContent=ws.chaos+'%';document.getElementById('wsChaos').style.color=ws.chaos>60?'#ff4444':ws.chaos>30?'#cc8844':'#c9a84c';
  document.getElementById('wsHarmony').textContent=ws.harmony+'%';
  document.getElementById('wsMemory').textContent=ws.memory+'%';
  ['Vitality','Luminosity','Chaos','Harmony','Memory'].forEach(k=>{document.getElementById('wsBar'+k).style.width=ws[k.toLowerCase()]+'%';});
}
function worldNarrative(ws){
  const p=[];
  if(ws.vitality>70)p.push('The land pulses with life.');else if(ws.vitality>40)p.push('The world breathes steadily.');else p.push('The land is thin. Survival is earned.');
  if(ws.luminosity>70)p.push('Light floods every corner.');else if(ws.luminosity>40)p.push('Shadows and light trade places.');else p.push('Darkness holds sway.');
  if(ws.chaos>70)p.push('The world churns. Storms gather.');else if(ws.chaos>40)p.push('Unrest simmers beneath.');else p.push('Stillness reigns.');
  if(ws.harmony>70)p.push('All things find their place.');else if(ws.harmony>40)p.push('Balance holds, barely.');else p.push('Discord threads through every alliance.');
  if(ws.memory>70)p.push('The past is thick here.');else if(ws.memory>30)p.push('Echoes of past days linger.');else p.push('This place is young.');
  return p.join(' ');
}

// ═══════════════════════════════════
// DATA FETCHERS
// ═══════════════════════════════════
async function fetchAPOD(){const today=new Date().toISOString().split('T')[0];try{const c=JSON.parse(localStorage.getItem('apod_cache')||'null');if(c&&c.date===today&&c.url)return c;}catch(e){}try{const r=await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');const d=await r.json();if(r.ok&&d.media_type==='image'&&d.url){const res={url:d.url,title:d.title,date:today};try{localStorage.setItem('apod_cache',JSON.stringify(res));}catch(e){}return res;}throw new Error('APOD unavailable');}catch(e){return{url:pollinationsImg(`deep space nebula, cosmic, stars, seed ${today}`,800,500),title:'Cosmic backdrop',date:today};}}
function preloadImage(url){return new Promise(r=>{if(!url)return r(null);const i=new Image();i.onload=()=>r(url);i.onerror=()=>r(null);i.src=url;});}
async function fetchSolarData(){try{const r=await fetch('https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json');const rows=await r.json();const lr=rows.filter(r=>r.energy==='0.1-0.8nm');if(lr.length>0){const l=lr[lr.length-1],f=l.flux;return{class:f<1e-7?`A${(f/1e-8).toFixed(1)}`:f<1e-6?`B${(f/1e-7).toFixed(1)}`:f<1e-5?`C${(f/1e-6).toFixed(1)}`:f<1e-4?`M${(f/1e-5).toFixed(1)}`:`X${(f/1e-4).toFixed(1)}`,flux:f?.toExponential(2),time:l.time_tag};}}catch(e){}return null;}
async function fetchMoonPhase(){try{const n=new Date(),lp=2551443,nm=new Date(2026,4,18).getTime(),p=((n.getTime()-nm)%lp)/lp;const names=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];const idx=Math.floor(p*8)%8;return{phase:(p*100).toFixed(1),name:names[idx],emoji:['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][idx]};}catch(e){}return null;}
async function fetchWeather(){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,wind_speed_10m,uv_index&daily=sunrise,sunset&timezone=auto`);const d=await r.json(),cur=d.current||{},daily=d.daily||{};return{temp:cur.temperature_2m,wind:cur.wind_speed_10m,uv:cur.uv_index,sunrise:daily.sunrise?.[0],sunset:daily.sunset?.[0]};}catch(e){}return null;}
function uvLabel(uv){if(uv==null)return null;return uv<3?'low':uv<6?'moderate':uv<8?'high':uv<11?'very high':'extreme';}
function formatClockTime(iso){return iso?new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):null;}
async function fetchTide(){const today=new Date().toISOString().split('T')[0];const base=`https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=hera&station=${NOAA_TIDE_STATION}&time_zone=lst_ld&units=english&interval=hilo&format=json&date=${today}`;for(const datum of['MLLW','STND']){try{const r=await fetch(`${base}&datum=${datum}`),d=await r.json();if(!r.ok||d.error)continue;const preds=d.predictions||[];if(!preds.length)continue;const now=new Date();let next=null;for(const p of preds){if(new Date(p.t.replace(' ','T'))>now){next=p;break;}}return{state:next?(next.type==='H'?'rising':'falling'):'unknown',nextType:next?.type==='H'?'high':'low',nextTime:next?formatClockTime(next.t.replace(' ','T')):null,nextHeight:next?parseFloat(next.v).toFixed(1):null};}catch(e){}}return null;}
async function fetchEarthquakes(){try{const r=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson'),d=await r.json();const q=d.features||[],s=q.length>0?q.reduce((a,b)=>b.properties.mag>a.properties.mag?b:a):null;return{count24h:q.length,strongest_mag:s?.properties?.mag,strongest_place:s?.properties?.place};}catch(e){}return null;}
async function fetchISS(){try{const r=await fetch('https://api.open-notify.org/iss-now.json'),d=await r.json();return{lat:parseFloat(d.iss_position.latitude).toFixed(1),lon:parseFloat(d.iss_position.longitude).toFixed(1),overhead:Math.abs(parseFloat(d.iss_position.latitude)-LAT)<15&&Math.abs(parseFloat(d.iss_position.longitude)-LON)<15};}catch(e){}return null;}

// ═══════════════════════════════════
// BINAURAL AMBIENT TONE
// ═══════════════════════════════════
let audioCtx=null,droneOscL=null,droneOscR=null,droneGain=null,dronePlaying=false,currentBeatHz=10,currentBand='alpha';
function ensureAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function computeBrainwaveTarget(solar,weather,tide){const isDaytime=weather?.sunrise&&weather?.sunset?new Date()>=new Date(weather.sunrise)&&new Date()<=new Date(weather.sunset):new Date().getHours()>=6&&new Date().getHours()<20;const band=isDaytime?'alpha':'theta',[lo,hi]=band==='alpha'?[8,12]:[4,8];let solarPos=solar?.class?.startsWith('X')||solar?.class?.startsWith('M')?0.9:solar?.class?.startsWith('C')?0.6:0.2;const tideNudge=tide?.state==='rising'?0.05:tide?.state==='falling'?-0.05:0;return{band,hz:Math.round((lo+(hi-lo)*Math.min(1,Math.max(0,solarPos+tideNudge)))*10)/10};}
function startDrone(carrierHz,beatHz){const ctx=ensureAudioCtx();droneOscL=ctx.createOscillator();droneOscR=ctx.createOscillator();const pL=ctx.createStereoPanner(),pR=ctx.createStereoPanner();pL.pan.value=-1;pR.pan.value=1;droneGain=ctx.createGain();droneGain.gain.value=0;droneOscL.type='sine';droneOscR.type='sine';droneOscL.frequency.value=carrierHz;droneOscR.frequency.value=carrierHz+beatHz;droneOscL.connect(pL).connect(droneGain);droneOscR.connect(pR).connect(droneGain);droneGain.connect(ctx.destination);droneOscL.start();droneOscR.start();droneGain.gain.linearRampToValueAtTime(0.04,ctx.currentTime+2);dronePlaying=true;}
function stopDrone(){if(!dronePlaying||!droneGain)return;droneGain.gain.linearRampToValueAtTime(0,ensureAudioCtx().currentTime+1);setTimeout(()=>{try{droneOscL.stop();droneOscR.stop();}catch(e){}},1100);dronePlaying=false;}
function updateDroneFrequency(carrierHz,beatHz){if(!dronePlaying||!droneOscR)return;droneOscR.frequency.linearRampToValueAtTime(carrierHz+beatHz,ensureAudioCtx().currentTime+3);}
function toggleDrone(){const btn=document.getElementById('droneToggle');if(dronePlaying){stopDrone();btn.textContent='🎧 Tone: off';}else{startDrone(180,currentBeatHz);btn.textContent=`🎧 Tone: ${currentBand} ${currentBeatHz}Hz`;}}

// ═══════════════════════════════════
// POLLINATIONS
// ═══════════════════════════════════
async function pollinationsText(prompt){try{const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],model:'openai',temperature:0.9,max_tokens:250})});if(r.ok)return(await r.text()).trim();}catch(e){}return null;}

// ═══════════════════════════════════
// CHARACTER GENERATOR
// ═══════════════════════════════════
async function generateCharacter(){
  if(!sceneData||!worldState)return null;
  const gender=flipStoredGender();const pr=pronouns(gender);
  const narrative=worldNarrative(worldState);
  const apod=sceneData.apod;
  
  const prompt=`Create a character for a fantasy story. The world: ${narrative}. The sky shows "${apod?.title||'the cosmos'}". Generate: 1. A name (real name, not "Wanderer"). 2. A specific setting where ${pr.subj} begins. 3. A unique object ${pr.subj} carries. 4. Brief physical description. 5. Gender: ${gender}. Format as: Name: [name] | Setting: [setting] | Object: [object] | Description: [description] | Gender: ${gender}`;
  
  const result=await pollinationsText(prompt);
  if(!result)return null;
  
  const name=(result.match(/Name:\s*(.+?)(?:\s*[|\n]|$)/i)||[])[1]?.trim()||'Kael';
  const setting=(result.match(/Setting:\s*(.+?)(?:\s*[|\n]|$)/i)||[])[1]?.trim()||'an unknown land';
  const object=(result.match(/Object:\s*(.+?)(?:\s*[|\n]|$)/i)||[])[1]?.trim()||'a weathered compass';
  const description=(result.match(/Description:\s*(.+?)(?:\s*[|\n]|$)/i)||[])[1]?.trim()||result;
  
  const charData={name,setting,object,description,gender};
  
  document.getElementById('charName').textContent=name;
  document.getElementById('charSetting').textContent=setting;
  document.getElementById('charObject').textContent=object;
  document.getElementById('characterNameLabel').textContent=name;
  document.getElementById('charGen').style.display='block';
  
  return charData;
}

// ═══════════════════════════════════
// SCENE IMAGE GENERATOR
// ═══════════════════════════════════
async function generateSceneImage(stage,charDesc,choice=null){
  if(!worldState||!characterData)return null;
  const pr=pronouns(characterData.gender);
  const narrative=worldNarrative(worldState);
  const {name,object,setting}=characterData;
  
  let prompt;
  if(stage===0){
    prompt=`A wide cinematic fantasy landscape. ${name} (${pr.subj}) stands at ${setting}, carrying ${object}. ${charDesc}. The world: ${narrative}. Ancient stone ruins, a distant tower, a small fire burning. Atmospheric, environmental storytelling, digital painting, wide angle, no text, no words.`;
  }else{
    const choiceContext=choice?`${pr.subj} is at "${choice.title}".`:''; 
    prompt=`The same landscape. ${name} has changed: ${charDesc}. ${choiceContext} The world: ${narrative}. Same location, same character, evolved appearance. Consistent art style, environmental storytelling, digital painting, wide angle, no text.`;
  }
  
  return pollinationsImg(prompt,1200,700);
}

async function updateSceneImage(url){
  if(!url)return;
  const loadedUrl=await preloadImage(url);
  if(loadedUrl){
    const img=document.getElementById('sceneImage');
    img.src=loadedUrl;img.style.display='block';img.classList.remove('loading-img');
    currentSceneImage=loadedUrl;
  }
}

// ═══════════════════════════════════
// CHOICES
// ═══════════════════════════════════
async function generateChoices(stage,prevDesc,humanInput){
  if(!sceneData||!worldState||!characterData)return null;
  const pr=pronouns(characterData.gender);
  const narrative=worldNarrative(worldState);
  const {name,object}=characterData;
  
  const prompt=`${name} (${pr.subj}) is on a journey. Previously: "${prevDesc}". ${humanInput?`${pr.subj} did: "${humanInput}".`:''} ${pr.subj} carries ${object}. The world: ${narrative}. Stage ${stage+1}. Generate THREE distinct choices for where ${pr.subj} goes next. Short location name + one sentence description. Format: "Choice 1: [Location] — [Description]. Choice 2: [Location] — [Description]. Choice 3: [Location] — [Description]."`;
  
  const result=await pollinationsText(prompt);
  if(!result)return null;
  
  const choices=[];const lines=result.split(/\d+\.\s*|Choice\s*\d+:\s*/i).filter(l=>l.trim().length>10);
  for(let i=0;i<Math.min(3,lines.length);i++){const line=lines[i].trim();const d=line.indexOf('—');if(d>0)choices.push({title:line.substring(0,d).trim(),desc:line.substring(d+1).trim()});else choices.push({title:`Path ${i+1}`,desc:line});}
  while(choices.length<3)choices.push({title:['The Tower','The Forest','The Hearth'][choices.length],desc:['A light burns in the highest window.','An older path opens between the trees.','Smoke rises from a chimney nearby.'][choices.length]});
  return choices;
}

function showChoices(choices){const g=document.getElementById('choicesGrid');g.innerHTML=choices.map((c,i)=>`<div class="choice-card" onclick="selectChoice(${i})"><div class="choice-emoji">${['🏰','🌲','🔥'][i]||'🚪'}</div><div class="choice-title">${c.title}</div><div class="choice-desc">${c.desc}</div></div>`).join('');document.getElementById('choicesSection').style.display='block';}
function hideChoices(){document.getElementById('choicesSection').style.display='none';}

// ═══════════════════════════════════
// WRITER INPUT
// ═══════════════════════════════════
function showWriterInput(){const i=document.getElementById('writerInput');i.style.display='block';document.getElementById('writerTextarea').value='';document.getElementById('writerTextarea').focus();startCountdown();}
function hideWriterInput(){document.getElementById('writerInput').style.display='none';stopCountdown();}
function startCountdown(){currentCountdown=WRITE_TIME;const t=document.getElementById('writerTimer');t.textContent=currentCountdown+'s';t.classList.remove('urgent');if(countdownTimer)clearInterval(countdownTimer);countdownTimer=setInterval(()=>{currentCountdown--;t.textContent=currentCountdown+'s';if(currentCountdown<=15)t.classList.add('urgent');if(currentCountdown<=0){clearInterval(countdownTimer);countdownTimer=null;submitWriting(true);}},1000);}
function stopCountdown(){if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}document.getElementById('writerTimer').classList.remove('urgent');}

// ═══════════════════════════════════
// CASCADE
// ═══════════════════════════════════
let currentChoices=null;

async function selectChoice(index){if(!currentChoices||index>=currentChoices.length)return;const c=currentChoices[index];choiceHistory.push(c);hideChoices();showWriterInput();}
function submitWriting(isAuto=false){stopCountdown();const ta=document.getElementById('writerTextarea');const hi=ta.value.trim();if(hi){humanLines.push(hi);incStages();updateStats();}else if(isAuto){humanLines.push('[Silence.]');}hideWriterInput();advanceCascade(hi||null);}
function finishStory(){stopCountdown();hideWriterInput();hideChoices();stopCascade();showStoryExport();}

async function advanceCascade(humanInput=null){
  if(!cascadeRunning)return;
  
  const choice=cascadeStage>0&&choiceHistory.length>0?choiceHistory[choiceHistory.length-1]:null;
  
  // Generate character description for this stage
  const pr=pronouns(characterData.gender);
  const narrative=worldNarrative(worldState);
  const {name,object,description:baseDesc}=characterData;
  
  let charPrompt;
  if(cascadeStage===0){
    charPrompt=`${name} (${pr.subj}) begins at ${characterData.setting}, carrying ${object}. Appearance: ${baseDesc}. The world: ${narrative}. Describe ${pr.subj} in this moment—appearance, posture, what ${pr.subj} is doing. 2-3 sentences. Use "${pr.subj}".`;
  }else{
    const prev=characterHistory[characterHistory.length-1]||baseDesc;
    let ctx=`${name} carries ${object}. `;
    if(choice)ctx+=`${pr.subj} chose: "${choice.title} — ${choice.desc}". `;
    if(humanInput)ctx+=`${pr.subj} did: "${humanInput}". `;
    charPrompt=`${name} on a journey. Previously: "${prev}". ${ctx}The world: ${narrative}. Stage ${cascadeStage+1}. Describe how ${pr.subj} has CHANGED—appearance, possessions, posture, or the object. Core identity (${name}, ${object}) stays but evolves. 2-3 sentences. Use "${pr.subj}".`;
  }
  
  const charDesc=await pollinationsText(charPrompt);
  if(!charDesc){stopCascade();return;}
  characterHistory.push(charDesc);
  
  // Generate scene image with character embedded
  const sceneUrl=await generateSceneImage(cascadeStage,charDesc,choice);
  if(sceneUrl)await updateSceneImage(sceneUrl);
  
  // Update UI
  document.getElementById('characterDesc').textContent=charDesc;
  document.getElementById('characterStage').textContent=`Stage ${cascadeStage+1}`;
  document.getElementById('dataCascade').textContent=`Stage ${cascadeStage+1}`;
  
  cascadeStage++;
  
  // Generate new choices
  const prevDesc=characterHistory[characterHistory.length-1]||baseDesc;
  currentChoices=await generateChoices(cascadeStage,prevDesc,humanInput);
  if(currentChoices)showChoices(currentChoices);else showWriterInput();
}

function showStoryExport(){
  document.getElementById('storyExport').style.display='block';
  document.getElementById('characterSection').style.display='none';
  document.getElementById('charGen').style.display='none';
  document.getElementById('dataCascade').textContent=`Complete · ${cascadeStage} stages`;
  
  let html='';
  if(characterData){html+=`<span class="stage-marker">— ${characterData.name} —</span>\nSetting: ${characterData.setting} · Object: ${characterData.object}\n\n`;}
  for(let i=0;i<characterHistory.length;i++){html+=`<span class="stage-marker">— Stage ${i+1} —</span>\n`;if(choiceHistory[i])html+=`<span class="choice-marker">🚪 ${choiceHistory[i].title} — ${choiceHistory[i].desc}</span>\n`;html+=`${characterHistory[i]}\n`;if(humanLines[i])html+=`<span class="human-line">✏️ ${humanLines[i]}</span>\n`;}
  document.getElementById('storyText').innerHTML=html;
  incStories();updateStats();
}
function copyStory(){const t=document.getElementById('storyText').innerText;navigator.clipboard.writeText(t).then(()=>alert('Copied!')).catch(()=>alert('Could not copy.'));}
function downloadStory(){const t=document.getElementById('storyText').innerText;const b=new Blob([t],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`living-world-${Date.now()}.txt`;a.click();URL.revokeObjectURL(u);}

function toggleCascade(){cascadeRunning?stopCascade():startCascade();}
async function startCascade(){
  if(!sceneData)return;
  cascadeRunning=true;cascadeStage=0;characterHistory=[];humanLines=[];choiceHistory=[];currentChoices=null;
  
  characterData=await generateCharacter();
  if(!characterData){alert('Could not generate character.');cascadeRunning=false;return;}
  
  document.getElementById('storyExport').style.display='none';
  document.getElementById('characterSection').style.display='';
  document.getElementById('characterDesc').textContent='';
  hideChoices();hideWriterInput();
  document.getElementById('cascadeBtn').textContent='⏹ Stop';
  document.getElementById('dataCascade').textContent='Generating...';
  advanceCascade(null);
}
function stopCascade(){cascadeRunning=false;stopCountdown();hideWriterInput();hideChoices();document.getElementById('cascadeBtn').textContent='▶ Start Story';document.getElementById('dataCascade').textContent=`Stopped · ${cascadeStage} stages`;}

// ═══════════════════════════════════
// RENDER SCENE
// ═══════════════════════════════════
async function generateScene(){
  if(renderGuard)return;renderGuard=true;
  if(cascadeRunning)stopCascade();
  
  const desc=document.getElementById('sceneDesc');desc.classList.add('loading');desc.textContent='The world assembles...';
  
  const[apod,solar,moon,weather,tide,quakes,iss]=await Promise.all([fetchAPOD(),fetchSolarData(),fetchMoonPhase(),fetchWeather(),fetchTide(),fetchEarthquakes(),fetchISS()]);
  sceneData={apod,solar,moon,weather,tide,quakes,iss};
  worldState=calcWorld(solar,moon,weather,tide,quakes,iss);
  const memory=updateMemory(worldState);worldState.memoryObj=memory;
  updateWorldDisplay(worldState);updateStats();
  
  // Generate initial scene image from APOD
  if(apod?.url){await updateSceneImage(apod.url);}
  
  const narrative=worldNarrative(worldState);
  const issOverhead=iss?.overhead?' The ISS passes silently overhead.':'';
  let sceneText=await pollinationsText(`Describe this scene in 3-4 poetic sentences. ${narrative}.${issOverhead} The sky shows "${apod?.title||'the cosmos'}".`);
  if(!sceneText)sceneText=`The Witch's Foot under a ${moon?.name||'shifting'} sky. ${narrative}`;
  desc.classList.remove('loading');desc.textContent=sceneText;
  
  document.getElementById('charGen').style.display='none';
  document.getElementById('characterDesc').textContent='';
  document.getElementById('characterStage').textContent='Stage 1';
  document.getElementById('characterNameLabel').textContent='The Wanderer';
  document.getElementById('storyExport').style.display='none';
  document.getElementById('characterSection').style.display='';
  hideChoices();hideWriterInput();
  document.getElementById('cascadeBtn').textContent='▶ Start Story';
  document.getElementById('dataCascade').textContent='Not started';
  characterData=null;characterHistory=[];humanLines=[];choiceHistory=[];
  
  document.getElementById('dataSolar').textContent=solar?.class||'—';
  document.getElementById('dataMoon').textContent=moon?`${moon.emoji} ${moon.name}`:'—';
  document.getElementById('dataWeather').textContent=weather?`${weather.temp}°C, ${weather.wind}km/h`:'—';
  document.getElementById('dataSun').textContent=weather?`↑${formatClockTime(weather.sunrise)||'—'} ↓${formatClockTime(weather.sunset)||'—'}`:'—';
  document.getElementById('dataTide').textContent=tide?`${tide.state} ${tide.nextType||''}`:'—';
  document.getElementById('dataQuakes').textContent=quakes?`${quakes.count24h} today, M${quakes.strongest_mag}`:'—';
  document.getElementById('dataIss').textContent=iss?`${iss.lat},${iss.lon}${iss.overhead?' · OVERHEAD':''}`:'—';
  document.getElementById('sceneDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  
  renderGuard=false;
}

function toggleDataBar(){document.getElementById('dataBar').classList.toggle('visible');}
generateScene();
