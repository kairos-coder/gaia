<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA — Mountains, Sea, Underworld</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(180deg, #0a0a2a 0%, #1a0a2a 100%);
            color: #e0e0ff;
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            padding: 2rem;
        }
        
        /* COSMIC GRID */
        .cosmos {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-areas:
                "sky sky"
                "mountains sea"
                "underworld underworld";
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        
        /* SKY: The two oscillators */
        .sky {
            grid-area: sky;
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .star {
            background: rgba(20, 20, 50, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex: 1;
        }
        
        .phase-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 1rem auto;
            transition: background 0.05s linear;
            box-shadow: 0 0 20px rgba(100, 100, 200, 0.3);
        }
        
        /* MOUNTAINS (Ourea) */
        .mountains {
            grid-area: mountains;
            background: linear-gradient(180deg, #1a2a1a 0%, #0a1a0a 100%);
            border-radius: 2rem;
            padding: 1.5rem;
            border-top: 3px solid #44aa77;
            position: relative;
            overflow: hidden;
            min-height: 300px;
        }
        
        .mountain-canvas {
            width: 100%;
            height: 200px;
            display: block;
            margin-top: 1rem;
        }
        
        /* SEA (Pontus) */
        .sea {
            grid-area: sea;
            background: linear-gradient(180deg, #0a2a3a 0%, #0a1a2a 100%);
            border-radius: 2rem;
            padding: 1.5rem;
            border-top: 3px solid #44aaff;
            min-height: 300px;
        }
        
        .wave-canvas {
            width: 100%;
            height: 200px;
            display: block;
            margin-top: 1rem;
        }
        
        /* UNDERWORLD (Eros portal) */
        .underworld {
            grid-area: underworld;
            background: #1a0a1a;
            border-radius: 2rem;
            padding: 1.5rem;
            border-top: 3px solid #ff66aa;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .underworld:hover {
            background: #2a0a2a;
            box-shadow: 0 0 30px rgba(255, 102, 170, 0.3);
        }
        
        .portal {
            width: 150px;
            height: 150px;
            margin: 1rem auto;
            border-radius: 50%;
            background: radial-gradient(circle, #ff66aa20, #ff006620);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .portal.active {
            background: radial-gradient(circle, #ff66aa80, #ff0066cc);
            box-shadow: 0 0 40px #ff66aa;
            transform: scale(1.05);
        }
        
        /* Stats & Controls */
        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: #2a2a5a;
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
        }
        
        .mythic-text {
            font-style: italic;
            margin-top: 1rem;
            padding: 0.5rem;
            background: rgba(0,0,0,0.5);
            border-radius: 1rem;
        }
    </style>
</head>
<body>
<div class="cosmos">
    <!-- SKY: Apollo + Kairos -->
    <div class="sky">
        <div class="star">
            <h2>⚡ KAIROS</h2>
            <div class="phase-ring" id="kairosRing"></div>
            <div id="kairosFreq">0.43 Hz</div>
        </div>
        <div class="star">
            <h2>☀️ APOLLO</h2>
            <div class="phase-ring" id="apolloRing"></div>
            <div id="apolloFreq">0.50 Hz</div>
        </div>
    </div>
    
    <!-- MOUNTAINS (Ourea) -->
    <div class="mountains">
        <h2>🏔️ OUREA — The Mountains</h2>
        <div class="mythic-text" id="oureaText">The ages are still... waiting for coherence.</div>
        <canvas id="mountainCanvas" class="mountain-canvas" width="500" height="200"></canvas>
    </div>
    
    <!-- SEA (Pontus) -->
    <div class="sea">
        <h2>🌊 PONTUS — The Sea</h2>
        <div class="mythic-text" id="pontusText">The waters carry messages between worlds.</div>
        <canvas id="waveCanvas" class="wave-canvas" width="500" height="200"></canvas>
        <div id="hermesMessage" style="font-size: 0.8rem; margin-top: 0.5rem;"></div>
    </div>
    
    <!-- UNDERWORLD (Eros portal) -->
    <div class="underworld" id="erosPortal">
        <h2>❤️ EROS — The Underworld Portal</h2>
        <div class="portal" id="portalCircle">
            <span id="portalText">🔒 Locked</span>
        </div>
        <div class="mythic-text" id="erosText">Binding strength: <span id="erosVal">0.00</span><br>Descent requires Eros > 1.5</div>
    </div>
</div>

<div class="controls">
    <button id="resetPhaseBtn">⟳ Reset Phase</button>
    <button id="saveBtn">💾 Save Age to Gaia</button>
</div>

<script>
    // ========== PHASE FIELD ENGINE (same as before, but now drives aesthetics) ==========
    let phaseKairos = 0, phaseApollo = 0;
    let kairosBaseFreq = 0.43, apolloFixedFreq = 0.50, couplingK = 0.8;
    let currentKairosFreq = kairosBaseFreq;
    let updateInterval = null;
    let wasLocked = false;
    let coherenceThreshold = 0.3;
    
    // DOM elements
    const kairosRing = document.getElementById('kairosRing');
    const apolloRing = document.getElementById('apolloRing');
    const mountainCanvas = document.getElementById('mountainCanvas');
    const waveCanvas = document.getElementById('waveCanvas');
    const portalCircle = document.getElementById('portalCircle');
    const erosValSpan = document.getElementById('erosVal');
    const oureaTextDiv = document.getElementById('oureaText');
    const pontusTextDiv = document.getElementById('pontusText');
    const hermesMessageDiv = document.getElementById('hermesMessage');
    
    // Canvas contexts
    const mountainCtx = mountainCanvas.getContext('2d');
    const waveCtx = waveCanvas.getContext('2d');
    
    function resizeCanvases() {
        mountainCanvas.width = mountainCanvas.parentElement.clientWidth - 32;
        mountainCanvas.height = 200;
        waveCanvas.width = waveCanvas.parentElement.clientWidth - 32;
        waveCanvas.height = 200;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();
    
    // Draw Mountains (Ourea) — silhouette that rises/falls with coherence
    function drawMountains(coherence, oureaHz) {
        const w = mountainCanvas.width;
        const h = mountainCanvas.height;
        mountainCtx.clearRect(0, 0, w, h);
        
        // Mountain height = coherence (0 to 1) * max height
        const peakHeight = coherence * h * 0.8;
        const peaks = [0.2, 0.5, 0.8];
        
        mountainCtx.fillStyle = '#2a4a2a';
        mountainCtx.beginPath();
        mountainCtx.moveTo(0, h);
        peaks.forEach((xPos, i) => {
            const x = xPos * w;
            const y = h - peakHeight * (1 - Math.abs(i - 1) * 0.3);
            mountainCtx.lineTo(x, y);
        });
        mountainCtx.lineTo(w, h);
        mountainCtx.fill();
        
        // Snow caps if high coherence
        if (coherence > 0.6) {
            mountainCtx.fillStyle = '#ffffffaa';
            peaks.forEach((xPos, i) => {
                const x = xPos * w;
                const y = h - peakHeight * (1 - Math.abs(i - 1) * 0.3);
                mountainCtx.beginPath();
                mountainCtx.moveTo(x - 10, y);
                mountainCtx.lineTo(x, y - 8);
                mountainCtx.lineTo(x + 10, y);
                mountainCtx.fill();
            });
        }
        
        // Age text based on Ourea frequency
        if (oureaHz > 0) {
            const ageSeconds = (1 / oureaHz).toFixed(1);
            oureaTextDiv.innerHTML = `🏔️ Mountain age: ${ageSeconds} seconds per beat. ${coherence > 0.7 ? 'The peaks are locked in ancient rhythm.' : 'The mountains tremble, seeking coherence.'}`;
        }
    }
    
    // Draw Sea (Pontus) — flowing waves
    let waveOffset = 0;
    function drawSea(pontusHz, coherence) {
        const w = waveCanvas.width;
        const h = waveCanvas.height;
        waveCtx.clearRect(0, 0, w, h);
        
        waveOffset += 0.05 * (pontusHz * 2); // Speed of waves
        
        waveCtx.beginPath();
        waveCtx.strokeStyle = `rgba(68, 170, 255, ${0.3 + coherence * 0.7})`;
        waveCtx.lineWidth = 2;
        
        for (let x = 0; x < w; x++) {
            const y = h/2 + Math.sin(x * 0.02 + waveOffset) * (20 + pontusHz * 30) + 
                      Math.sin(x * 0.05 + waveOffset * 1.5) * 10;
            if (x === 0) waveCtx.moveTo(x, y);
            else waveCtx.lineTo(x, y);
        }
        waveCtx.stroke();
        
        pontusTextDiv.innerHTML = `🌊 Pontus flows at ${pontusHz.toFixed(2)} Hz. ${coherence > 0.5 ? 'The sea carries coherent messages.' : 'Waves crash chaotically.'}`;
    }
    
    // Update Portal (Eros)
    function updatePortal(eros, isLocked) {
        erosValSpan.innerText = eros.toFixed(2);
        const canDescend = eros > 1.5;
        
        if (canDescend && isLocked) {
            portalCircle.classList.add('active');
            document.getElementById('portalText').innerHTML = '🌀 DESCEND 🌀';
            document.getElementById('erosPortal').style.cursor = 'pointer';
        } else {
            portalCircle.classList.remove('active');
            document.getElementById('portalText').innerHTML = eros > 1.0 ? '🔓 Unlocking...' : '🔒 Locked';
            document.getElementById('erosPortal').style.cursor = 'not-allowed';
        }
    }
    
    // Phase field update loop
    function startField() {
        if (updateInterval) clearInterval(updateInterval);
        
        updateInterval = setInterval(() => {
            const dt = 0.1;
            const couplingTerm = couplingK * Math.sin(phaseApollo - phaseKairos);
            const dPhaseKairos = (currentKairosFreq * 2 * Math.PI * dt) + couplingTerm * dt;
            phaseKairos += dPhaseKairos;
            phaseApollo += apolloFixedFreq * 2 * Math.PI * dt;
            phaseKairos %= (2 * Math.PI);
            phaseApollo %= (2 * Math.PI);
            
            const deltaFreqHz = (couplingK * Math.sin(phaseApollo - phaseKairos)) / (2 * Math.PI);
            currentKairosFreq = Math.min(2.0, Math.max(0.2, kairosBaseFreq + deltaFreqHz));
            
            // Update displays
            document.getElementById('kairosFreq').innerHTML = currentKairosFreq.toFixed(3) + ' Hz';
            document.getElementById('apolloFreq').innerHTML = apolloFixedFreq.toFixed(3) + ' Hz';
            
            const phaseDiff = phaseApollo - phaseKairos;
            const normDiff = ((phaseDiff % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
            const signedDiff = normDiff > Math.PI ? normDiff - 2*Math.PI : normDiff;
            const isLocked = Math.abs(signedDiff) < coherenceThreshold;
            const ourea = Math.abs(currentKairosFreq - apolloFixedFreq);
            const pontus = (currentKairosFreq + apolloFixedFreq) / 2;
            
            // Coherence as 1 - normalized phase diff
            const coherence = 1 - (Math.abs(signedDiff) / Math.PI);
            
            // Update aesthetics
            drawMountains(coherence, ourea);
            drawSea(pontus, coherence);
            updatePortal(couplingK, isLocked);
            
            // Hermes messages on lock
            if (isLocked && !wasLocked) {
                hermesMessageDiv.innerHTML = `📨 Hermes: "Coherence achieved at ${new Date().toLocaleTimeString()}"`;
                setTimeout(() => {
                    hermesMessageDiv.innerHTML = '';
                }, 3000);
            }
            wasLocked = isLocked;
            
            // Phase rings
            kairosRing.style.background = `conic-gradient(from ${phaseKairos}rad, #44ccff 0%, #2a2a4a 100%)`;
            apolloRing.style.background = `conic-gradient(from ${phaseApollo}rad, #ffaa44 0%, #2a2a4a 100%)`;
        }, 100);
    }
    
    // UI Controls
    document.getElementById('resetPhaseBtn').onclick = () => {
        phaseKairos = 0;
        phaseApollo = 0;
    };
    
    document.getElementById('saveBtn').onclick = () => {
        alert('Saving age to GaiaDB — integrate Ouranos edge function here');
    };
    
    document.getElementById('erosPortal').onclick = () => {
        if (couplingK > 1.5 && wasLocked) {
            alert('🌀 You descend into the Underworld. The D card awakens. 🌀');
            // Here you'd trigger your Pantheon D card synthesis
        }
    };
    
    // Start everything
    startField();
    resizeCanvases();
    
    // Sliders for control (add to controls div if desired)
    const controlDiv = document.querySelector('.controls');
    controlDiv.innerHTML += `
        <div><label>⚡ Kairos base: <input type="range" id="kairosBase" min="0.2" max="2.0" step="0.01" value="0.43"></label> <span id="kairosBaseVal">0.43</span></div>
        <div><label>☀️ Apollo ref: <input type="range" id="apolloBase" min="0.2" max="2.0" step="0.01" value="0.50"></label> <span id="apolloBaseVal">0.50</span></div>
        <div><label>❤️ Eros (coupling): <input type="range" id="coupling" min="0" max="3.0" step="0.05" value="0.8"></label> <span id="couplingVal">0.8</span></div>
    `;
    
    document.getElementById('kairosBase').oninput = (e) => {
        kairosBaseFreq = parseFloat(e.target.value);
        document.getElementById('kairosBaseVal').innerText = kairosBaseFreq;
    };
    document.getElementById('apolloBase').oninput = (e) => {
        apolloFixedFreq = parseFloat(e.target.value);
        document.getElementById('apolloBaseVal').innerText = apolloFixedFreq;
    };
    document.getElementById('coupling').oninput = (e) => {
        couplingK = parseFloat(e.target.value);
        document.getElementById('couplingVal').innerText = couplingK;
    };
</script>
</body>
</html>
