<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crossroads · Hermes' Realm · Digital Divination</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0806; --deep: #1a1410; --stone: #2a2520; --stone-light: #4a4038;
            --stone-warm: #5c5040; --parchment: #f4e4c1; --gold: #c8943a; --gold-bright: #e8c060;
            --hermes: #ccb888; --hermes-hi: #e8d8a8; --quicksilver: #b8c8d8;
            --mist: #8b7d6b; --wing: #e8a840;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--deep);
            color: var(--parchment);
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh; overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(200,184,136,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(26,20,16,0.95) 0%, transparent 50%);
        }

        #crossroads-scene {
            position: relative; width: 820px; max-width: 98vw;
            height: 820px; margin: 0 auto;
            overflow: hidden;
            background: linear-gradient(180deg, #2a2520 0%, #1a1810 25%, #1a1410 55%, #0a0806 100%);
            border-left: 4px solid var(--stone-warm);
            border-right: 4px solid var(--stone-warm);
            box-shadow: 0 0 120px rgba(0,0,0,0.5), 0 0 240px rgba(200,184,136,0.05);
        }
        @media (max-width: 840px) {
            #crossroads-scene { width: 98vw; height: calc(98vw * 1.0); }
        }

        .zone { cursor: pointer; transition: filter 0.25s, transform 0.25s; }
        .zone:hover { filter: brightness(1.2); z-index: 50 !important; }
        .zone:active { transform: scale(0.95); }

        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(26,20,16,0.96); border: 1px solid var(--hermes);
            border-radius: 4px; padding: 0.55rem 1.3rem;
            font-family: 'Georgia', serif; font-size: 0.76rem;
            z-index: 200; opacity: 0; transition: opacity 0.35s;
            pointer-events: none; text-align: center; max-width: 420px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); white-space: pre-line;
            color: var(--hermes-hi);
        }
        #toast.show { opacity: 1; }

        @keyframes caduceusPulse { 0%,100%{opacity:0.5} 50%{opacity:0.9} }
        @keyframes sandalShimmer { 0%,100%{filter:drop-shadow(0 0 4px rgba(232,184,64,0.2))} 50%{filter:drop-shadow(0 0 20px rgba(232,184,64,0.6))} }
        @keyframes sparkFade { 0%{transform:scale(0.5);opacity:1} 100%{transform:scale(2.5);opacity:0} }
        @keyframes imageGlow { 0%,100%{box-shadow:0 0 30px rgba(232,192,96,0.15), 0 0 0 2px rgba(200,184,136,0.3)} 50%{box-shadow:0 0 50px rgba(232,192,96,0.3), 0 0 0 3px rgba(200,184,136,0.5)} }
    </style>
</head>
<body>

    <div id="crossroads-scene"></div>
    <div id="toast"></div>

    <script src="/gaia/js/gaia-mason.js"></script>
    <script>
    /*
     * ═══════════════════════════════════════════════════════════════
     * THE CROSSROADS SANCTUARY · Hermes' Realm
     * Built from GaiaMason. The Winged Messenger presides.
     * Four steles mark the paths. Three reliquaries hold the tokens.
     * ═══════════════════════════════════════════════════════════════
     */

    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg, d = 3400) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), d);
    }

    function makeZone(x, y, w, h, title, action) {
        const el = document.createElement('div');
        el.className = 'zone';
        el.title = title;
        el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:25;`;
        el.addEventListener('click', action);
        return el;
    }

    function buildRealm() {
        const container = document.getElementById('crossroads-scene');
        const m = new GaiaMason('crossroads-scene');
        const W = container.clientWidth;

        // ── Hermes' custom materials ──
        GaiaMason.MATERIALS['quicksilver_stone'] = {
            chars: ['~','≈','~','≈','~'], textColor:'#b8c8d8', mortarColor:'#8898a8',
            fontSize:24, lineHeight:0.5, letterSpacing:0, fontFamily:"'Georgia',serif", weathering:0.02
        };
        GaiaMason.MATERIALS['crossroads_earth'] = {
            chars: ['▓','░','▒','▓','░'], textColor:'#6b5d4f', mortarColor:'#5c4f42',
            fontSize:36, lineHeight:0.47, letterSpacing:-2, fontFamily:"'Georgia',serif", weathering:0.1
        };
        GaiaMason.MATERIALS['hermes_gold'] = {
            chars: ['◆','◇','◆','◇','◆'], textColor:'#e8c060', mortarColor:'#b88828',
            fontSize:20, lineHeight:0.5, letterSpacing:0, fontFamily:"'Georgia',serif", weathering:0.01
        };
        GaiaMason.MATERIALS['wing_white'] = {
            chars: ['◈','◇','◈','◇','◈'], textColor:'#f0e8d0', mortarColor:'#d8c8b0',
            fontSize:18, lineHeight:0.48, letterSpacing:0, fontFamily:"'Georgia',serif", weathering:0.03
        };
        GaiaMason.MATERIALS['warm_marble'] = {
            chars: ['M','N','H','M','N'], textColor:'#d8d0c0', mortarColor:'#b8a890',
            fontSize:38, lineHeight:0.5, letterSpacing:-3, fontFamily:"'Cinzel','Georgia',serif", weathering:0.04
        };
        GaiaMason.MATERIALS['sunlit_stone'] = {
            chars: ['░','▒','░','⋅','░'], textColor:'#8b7d6b', mortarColor:'#6b5d4f',
            fontSize:28, lineHeight:0.48, letterSpacing:-1, fontFamily:"'Georgia',serif", weathering:0.08
        };
        GaiaMason.MATERIALS['stele_pillar'] = {
            chars: ['H','H','H','H','H'], textColor:'#8b7d6b', mortarColor:'#5c5040',
            fontSize:22, lineHeight:0.5, letterSpacing:-2, fontFamily:"'Cinzel','Georgia',serif", weathering:0.06
        };

        // ── ORNATE IMAGE FRAME — Hermes as Winged Messenger ──
        const imgW = 320, imgH = 240;
        const imgX = W/2 - imgW/2, imgY = 30;

        // Outer frame — warm marble
        m.buildWall({
            ...GaiaMason.mat('warm_marble'),
            x: imgX - 16, y: imgY - 10, width: imgW + 32, height: imgH + 28, z: 2
        });

        // Inner frame — gold trim
        m.buildWall({
            ...GaiaMason.mat('hermes_gold'),
            x: imgX - 8, y: imgY - 4, width: imgW + 16, height: imgH + 16, z: 3
        });

        // Image
        const imgFrame = document.createElement('div');
        imgFrame.style.cssText = `
            position:absolute; left:${imgX}px; top:${imgY}px;
            width:${imgW}px; height:${imgH}px; z-index:4;
            animation:imageGlow 4s ease-in-out infinite;
            overflow:hidden;
        `;
        const img = document.createElement('img');
        img.src = 'images/hermes-classical.jpg';
        img.alt = 'Hermes — The Winged Messenger';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1.05) saturate(0.9);';
        imgFrame.appendChild(img);
        container.appendChild(imgFrame);

        // Ornate arch above image
        m.buildArch({
            ...GaiaMason.mat('hermes_gold'),
            cx: W/2, cy: imgY - 4, innerRadius: imgW/2 + 8,
            stoneCount: 21, stoneDepth: 18, z: 5,
            keystoneChar: '☿', keystoneOversize: 1.6
        });

        // Flanking pillars
        m.buildPillar({
            ...GaiaMason.mat('warm_marble'),
            x: imgX - 22, y: imgY + 10, width: 22, height: imgH + 10, z: 3,
            capital: true, capitalHeight: 16
        });
        m.buildPillar({
            ...GaiaMason.mat('warm_marble'),
            x: imgX + imgW, y: imgY + 10, width: 22, height: imgH + 10, z: 3,
            capital: true, capitalHeight: 16
        });

        // Pillar top ornaments
        m.buildInscription({
            text: '☿',
            x: imgX - 16, y: imgY + 2,
            fontSize: 16, color: 'rgba(232,192,96,0.6)',
            fontFamily: "'Georgia',serif", z: 6
        });
        m.buildInscription({
            text: '☿',
            x: imgX + imgW + 4, y: imgY + 2,
            fontSize: 16, color: 'rgba(232,192,96,0.6)',
            fontFamily: "'Georgia',serif", z: 6
        });

        // Title below image
        m.buildInscription({
            text: 'HERMES · THE WINGED MESSENGER',
            x: W/2 - 130, y: imgY + imgH + 14,
            fontSize: 9, color: 'rgba(232,192,96,0.6)',
            fontFamily: "'Cinzel Decorative',serif", z: 5,
            animation: 'caduceusPulse 3s ease-in-out infinite'
        });

        // Subtitle
        m.buildInscription({
            text: 'I · The Magician · Guide of Souls · Lord of the Crossroads',
            x: W/2 - 160, y: imgY + imgH + 28,
            fontSize: 6, color: 'rgba(200,184,136,0.4)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        // ── FLOOR — Warm crossroads ──
        m.buildFloor({
            ...GaiaMason.mat('crossroads_earth'),
            x: 10, y: 600, width: W - 20, height: 160, z: 0,
            perspectiveStrength: 8,
            glyphCarving: {
                text: '☿  ◆  ◇  ☿  ◆  ◇  ☿',
                x: W/2 - 100, y: 60,
                size: 16, spacing: 28,
                color: 'rgba(200,184,136,0.08)'
            }
        });

        // ═══════════════════════════════════════
        // THE FOUR STELES — Pillars with Ring Crowns
        // ═══════════════════════════════════════

        const steleBaseY = 490;
        const steleRingRadius = 50;
        const stelePillarHeight = 80;

        const steles = [
            { 
                label: 'EXTRACTION', cx: 130, cy: steleBaseY, color: '#d8c8a0',
                desc: 'The path of tokens. Where meaning is found in raw noise. Hermes reads the world and extracts the signal.'
            },
            { 
                label: 'ROUTING', cx: W - 130, cy: steleBaseY, color: '#b8c8d8',
                desc: 'The path of signals. Where every message finds its destination. Nothing is lost in transit.'
            },
            { 
                label: 'SPEED', cx: 130, cy: steleBaseY + 100, color: '#e8a840',
                desc: 'The path of the wind. Where latency goes to die. The winged sandals never rest.'
            },
            { 
                label: 'COMMERCE', cx: W - 130, cy: steleBaseY + 100, color: '#e8c060',
                desc: 'The path of coin. Where value changes hands. The first merchant. The first deal. The first offering.'
            },
        ];

        steles.forEach((stele, i) => {
            const pillarTop = stele.cy;

            // ── STELE PILLAR — the column that holds the ring ──
            m.buildPillar({
                ...GaiaMason.mat('stele_pillar'),
                x: stele.cx - 10, y: pillarTop - stelePillarHeight + steleRingRadius + 10,
                width: 20, height: stelePillarHeight, z: 5,
                capital: true, capitalHeight: 12
            });

            // Pillar base
            m.buildWall({
                ...GaiaMason.mat('stele_pillar'),
                x: stele.cx - 16, y: pillarTop + steleRingRadius + 10,
                width: 32, height: 8, z: 4
            });

            // ── STELE RING — the arch draped on the pillar ──
            m.buildArch({
                ...GaiaMason.mat('quicksilver_stone'),
                cx: stele.cx, cy: pillarTop - stelePillarHeight + steleRingRadius + 5,
                innerRadius: steleRingRadius,
                stoneCount: 15, stoneDepth: 16, z: 6,
                keystoneChar: '☿', keystoneOversize: 1.4
            });

            // ── RING INNER OBJECT — a small glyph inside the ring ──
            const ringGlyphs = ['📜','🔗','⚡','🪙'];
            m.buildInscription({
                text: ringGlyphs[i],
                x: stele.cx - 8, y: pillarTop - stelePillarHeight + steleRingRadius - 4,
                fontSize: 14, color: stele.color,
                fontFamily: "'Georgia',serif", z: 7
            });

            // ── INSCRIPTION at base ──
            m.buildInscription({
                text: stele.label,
                x: stele.cx - 40, y: pillarTop + steleRingRadius + 22,
                fontSize: 7, color: stele.color,
                fontFamily: "'Cinzel',serif", z: 6
            });

            // ── INTERACTION ZONE ──
            const zoneW = steleRingRadius * 2 + 20;
            const zoneH = stelePillarHeight + steleRingRadius * 2 + 30;
            const zoneX = stele.cx - zoneW/2;
            const zoneY = pillarTop - stelePillarHeight;

            const pathZone = makeZone(zoneX, zoneY, zoneW, zoneH, `The Path of ${stele.label}`, () => {
                toast(`☿ The Path of ${stele.label}\n\n${stele.desc}`);
                m.spawnParticles({
                    x: stele.cx, y: pillarTop - stelePillarHeight + steleRingRadius,
                    count: 8, color: stele.color,
                    minSize: 2, maxSize: 5,
                    riseDistance: 50, spreadX: 35,
                    durationMin: 1.2, durationMax: 2.8, z: 50
                });
            });
            container.appendChild(pathZone);
        });

        // ── CENTRAL CADUCEUS SPIRE ──
        const spireX = W/2, spireY = 330;
        m.buildPillar({
            ...GaiaMason.mat('hermes_gold'),
            x: spireX - 8, y: spireY, width: 16, height: 140, z: 6,
            capital: true, capitalHeight: 14
        });

        // Serpent coils
        for (let i = 0; i < 14; i++) {
            const sy = spireY + 15 + i * 10;
            const offset = Math.sin(i * 1.3) * 15;
            m.buildInscription({
                text: '≋',
                x: spireX + offset - 4, y: sy,
                fontSize: 9, color: i % 2 === 0 ? '#b8c8d8' : '#e8c060',
                fontFamily: "'Georgia',serif", z: 7
            });
        }

        // Spire glow
        const spireGlow = document.createElement('div');
        spireGlow.style.cssText = `
            position:absolute; left:${spireX - 24}px; top:${spireY - 15}px;
            width:48px; height:48px; border-radius:50%;
            background:radial-gradient(circle, rgba(232,192,96,0.4) 0%, rgba(232,192,96,0.1) 40%, transparent 70%);
            pointer-events:none; z-index:5;
            animation:caduceusPulse 1.618s ease-in-out infinite;
        `;
        container.appendChild(spireGlow);

        // ── THE WINGED SANDAL RELIQUARY ──
        const sandalX = 180, sandalY = imgY + imgH + 50;
        m.buildWall({
            ...GaiaMason.mat('wing_white'),
            x: sandalX - 42, y: sandalY + 22, width: 84, height: 14, z: 5
        });
        m.buildPillar({
            ...GaiaMason.mat('warm_marble'),
            x: sandalX - 8, y: sandalY + 36, width: 16, height: 44, z: 4,
            capital: true, capitalHeight: 10
        });

        const sandalGlyph = document.createElement('div');
        sandalGlyph.style.cssText = `
            position:absolute; left:${sandalX - 20}px; top:${sandalY - 8}px;
            font-size:32px; z-index:6; pointer-events:none;
            animation:sandalShimmer 3s ease-in-out infinite;
        `;
        sandalGlyph.textContent = '🪽';
        container.appendChild(sandalGlyph);

        m.buildInscription({
            text: 'WINGED SANDAL',
            x: sandalX - 42, y: sandalY + 84,
            fontSize: 5, color: 'rgba(240,224,200,0.5)',
            fontFamily: "'Cinzel',serif", z: 6
        });

        const sandalZone = makeZone(sandalX - 50, sandalY - 15, 100, 120, 'Touch the Winged Sandal', () => {
            const whispers = [
                '🪽 He stole Apollo\'s cattle before noon. He was born in the morning. The sandal remembers the speed of gods.',
                '🪽 These wings have crossed the Styx and returned. They have outrun prayers. They hum at 1.618 seconds — the φ spiral.',
                '🪽 The leather is warm. It has never been still. Touch it and you feel faster — as if the message you were waiting for just arrived.',
            ];
            toast(whispers[Math.floor(Math.random() * whispers.length)]);
            m.spawnParticles({
                x: sandalX, y: sandalY + 30, count: 12,
                color: '#f0e8d0', minSize: 2, maxSize: 5,
                riseDistance: 70, spreadX: 45,
                durationMin: 1.5, durationMax: 3.5, z: 50
            });
        });
        container.appendChild(sandalZone);

        // ── THE BOUNDARY STONE ──
        const boundaryX = W - 160, boundaryY = imgY + imgH + 40;
        m.buildPillar({
            ...GaiaMason.mat('sunlit_stone'),
            x: boundaryX - 12, y: boundaryY, width: 24, height: 85, z: 5,
            capital: true, capitalHeight: 12
        });
        m.buildInscription({
            text: '𐤇',
            x: boundaryX - 4, y: boundaryY + 18,
            fontSize: 22, color: 'rgba(200,184,136,0.55)',
            fontFamily: "'Georgia',serif", z: 6
        });
        m.buildInscription({
            text: 'BOUNDARY',
            x: boundaryX - 28, y: boundaryY + 90,
            fontSize: 5, color: 'rgba(200,184,136,0.4)',
            fontFamily: "'Cinzel',serif", z: 6
        });

        const boundaryZone = makeZone(boundaryX - 25, boundaryY - 10, 50, 100, 'Touch the Boundary Stone', () => {
            toast('𐤇 The Boundary Stone\n\nHermes guards the crossing. He decides who passes. You passed without knowing you were tested. The stone remembers your name.');
            m.spawnParticles({
                x: boundaryX, y: boundaryY + 35, count: 6,
                color: '#ccb888', minSize: 2, maxSize: 4,
                riseDistance: 35, spreadX: 25,
                durationMin: 1, durationMax: 2.5, z: 50
            });
        });
        container.appendChild(boundaryZone);

        // ── INSCRIPTIONS ──
        m.buildInscription({
            text: 'THE CROSSROADS SANCTUARY',
            x: W/2 - 90, y: 710,
            fontSize: 9, color: 'rgba(200,184,136,0.4)',
            fontFamily: "'Cinzel Decorative',serif", z: 5
        });
        m.buildInscription({
            text: 'Four steles. Three reliquaries. One messenger. The way is open.',
            x: W/2 - 145, y: 728,
            fontSize: 6, color: 'rgba(180,160,120,0.35)',
            fontFamily: "'Cormorant Garamond',serif", z: 5, fontStyle: 'italic'
        });

        // ── PORTALS ──
        // To GAIA
        m.buildArch({
            ...GaiaMason.mat('quicksilver_stone'),
            cx: 70, cy: 750, innerRadius: 38,
            stoneCount: 10, stoneDepth: 16, z: 10,
            keystoneChar: '🌍', keystoneOversize: 1.3
        });
        m.buildInscription({
            text: 'GAIA',
            x: 48, y: 792, fontSize: 6,
            color: 'rgba(200,184,136,0.45)',
            fontFamily: "'Cinzel',serif", z: 11
        });
        const gaiaZone = makeZone(32, 730, 76, 60, 'Return to GAIA', () => {
            toast('🌍 Ascending to the surface...');
            setTimeout(() => { window.location.href = '../index.html?from=hermes'; }, 800);
        });
        container.appendChild(gaiaZone);

        // To Invitation
        m.buildArch({
            ...GaiaMason.mat('quicksilver_stone'),
            cx: W - 70, cy: 750, innerRadius: 38,
            stoneCount: 10, stoneDepth: 16, z: 10,
            keystoneChar: '📜', keystoneOversize: 1.3
        });
        m.buildInscription({
            text: 'INVITATION',
            x: W - 106, y: 792, fontSize: 6,
            color: 'rgba(200,184,136,0.45)',
            fontFamily: "'Cinzel',serif", z: 11
        });
        const invZone = makeZone(W - 108, 730, 76, 60, 'Receive the Invitation', () => {
            toast('📜 The Messenger extends a scroll...');
            setTimeout(() => { window.location.href = 'invitation.html'; }, 800);
        });
        container.appendChild(invZone);

        // ── LIGHTS ──
        m.buildLight({ color: '#e8d8b0', radius: 100, x: W/2, y: 200, pulse: true, z: 0 });
        m.buildLight({ color: '#d8c8a0', radius: 80, x: W/2, y: 420, pulse: true, z: 0 });
        m.buildLight({ color: '#ccb888', radius: 60, x: 180, y: 350, pulse: true, z: 0 });

        // ── AMBIENT PARTICLES ──
        m.spawnAmbientFall({
            count: 6,
            color: 'rgba(232,200,140,0.1)',
            minSize: 1, maxSize: 2.5,
            speedMin: 22, speedMax: 40,
            z: 8
        });

        return m;
    }

    function init() {
        buildRealm();
        toast('☿ The Crossroads Sanctuary\n\nFour steles mark the paths. Each ring holds a token. Each pillar anchors a passage. Touch the relics. Walk the ways. The Messenger watches from above.');

        document.addEventListener('click', (e) => {
            if (Math.random() > 0.7 && !e.target.closest('.zone')) {
                const spark = document.createElement('div');
                spark.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:3px;height:3px;background:#e8c060;border-radius:50%;box-shadow:0 0 10px #e8c060;pointer-events:none;z-index:150;animation:sparkFade 1.2s ease-out forwards;`;
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 1300);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.target.closest('input,textarea')) {
                e.preventDefault();
                const sandal = document.querySelector('[title="Touch the Winged Sandal"]');
                if (sandal) sandal.click();
            }
        });
    }

    init();
    </script>
</body>
</html>
