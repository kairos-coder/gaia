<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔆 Hyperion — Light & Illumination</title>
<style>
  :root { --gold: #c9a84c; --deep: #05050f; --mist: #e8e0d0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--deep); color: var(--mist); font-family: monospace; padding: 2rem; max-width: 800px; margin: 0 auto; font-size: 0.8rem; line-height: 1.6; }
  h1 { color: var(--gold); font-size: 1.2rem; margin-bottom: 0.3rem; }
  .subtitle { color: rgba(180,160,100,0.5); margin-bottom: 1.5rem; }
  .section { margin-bottom: 1.5rem; }
  .section-title { color: var(--gold); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
  pre { background: rgba(255,255,255,0.04); border: 1px solid rgba(180,160,100,0.15); padding: 0.8rem; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .delta { color: #44cc88; }
  .delta-down { color: #cc8844; }
  .delta-flat { color: rgba(180,160,100,0.5); }
  .back { display: inline-block; margin-top: 1.5rem; color: rgba(201,168,76,0.5); text-decoration: none; font-size: 0.7rem; }
  .back:hover { color: var(--gold); }
</style>
</head>
<body>

<h1>🔆 HYPERION</h1>
<div class="subtitle">Light & Illumination · Signal Amplifier · Solar Ledger</div>

<div class="section">
  <div class="section-title">Current Signal</div>
  <pre id="signal">Gathering...</pre>
</div>

<div class="section">
  <div class="section-title">Delta (vs. Previous Reading)</div>
  <pre id="delta">—</pre>
</div>

<div class="section">
  <div class="section-title">Solar Cycle Context</div>
  <pre id="cycle">Calculating...</pre>
</div>

<div class="section">
  <div class="section-title">Local Memory (last 3 events)</div>
  <pre id="memory">Loading...</pre>
</div>

<div class="section">
  <div class="section-title">Full Export</div>
  <pre id="export">—</pre>
</div>

<a href="../../index.html" class="back">← Return to GAIA</a>

<script src="identity.js"></script>
<script src="remember.js"></script>
<script>

// ═══════════════════════════════════
// X-RAY FLUX CLASSIFICATION
// ═══════════════════════════════════
function classifyFlux(flux) {
  if (flux == null) return { class: 'Unknown', short: '?', rank: 0 };
  if (flux < 1e-7) return { class: `A${(flux / 1e-8).toFixed(1)}`, short: 'A', rank: 1 };
  if (flux < 1e-6) return { class: `B${(flux / 1e-7).toFixed(1)}`, short: 'B', rank: 2 };
  if (flux < 1e-5) return { class: `C${(flux / 1e-6).toFixed(1)}`, short: 'C', rank: 3 };
  if (flux < 1e-4) return { class: `M${(flux / 1e-5).toFixed(1)}`, short: 'M', rank: 4 };
  return { class: `X${(flux / 1e-4).toFixed(1)}`, short: 'X', rank: 5 };
}

// ═══════════════════════════════════
// SOLAR CYCLE CONTEXT
// Solar Cycle 25 began Dec 2019. Peak estimated 2025-2026.
// ═══════════════════════════════════
function getSolarCycleContext() {
  const now = new Date();
  const cycleStart = new Date('2019-12-01');
  const monthsSinceStart = (now - cycleStart) / (1000 * 60 * 60 * 24 * 30.44);
  const cycleLength = 132; // ~11 years in months
  const phase = monthsSinceStart / cycleLength;
  
  let era, eraDetail;
  if (phase < 0.3) { era = 'Rising (post-minimum)'; eraDetail = 'Activity building toward maximum.'; }
  else if (phase < 0.55) { era = 'Solar Maximum'; eraDetail = 'Peak activity period. Flares and CMEs most frequent.'; }
  else if (phase < 0.8) { era = 'Declining (post-maximum)'; eraDetail = 'Activity gradually decreasing.'; }
  else { era = 'Solar Minimum approaching'; eraDetail = 'Quiet sun. Fewer flares. Cosmic rays increase.'; }
  
  return {
    cycle: 25,
    started: 'December 2019',
    months_elapsed: Math.round(monthsSinceStart),
    phase: phase.toFixed(3),
    era,
    era_detail: eraDetail,
    estimated_peak: '2025-2026'
  };
}

// ═══════════════════════════════════
// COMPARE TO PREVIOUS READING
// ═══════════════════════════════════
function computeDelta(currentFlux, currentClass, previousEvent) {
  if (!previousEvent || !previousEvent.signal) return null;
  
  const prevFlux = previousEvent.signal.flux;
  const prevClass = previousEvent.signal.class;
  
  if (prevFlux == null || currentFlux == null) return null;
  
  const fluxDelta = currentFlux - prevFlux;
  const pctChange = prevFlux !== 0 ? ((fluxDelta / prevFlux) * 100) : 0;
  
  let trend, cssClass;
  if (Math.abs(pctChange) < 5) { trend = 'stable'; cssClass = 'delta-flat'; }
  else if (pctChange > 0) { trend = 'brightening'; cssClass = 'delta'; }
  else { trend = 'dimming'; cssClass = 'delta-down'; }
  
  const classChanged = currentClass !== prevClass;
  const timeSince = previousEvent.tick ? `${Math.round((Date.now() - previousEvent.tick) / 60000)} min ago` : 'unknown';
  
  return {
    previous_flux: prevFlux,
    current_flux: currentFlux,
    flux_delta: fluxDelta,
    pct_change: parseFloat(pctChange.toFixed(2)),
    previous_class: prevClass,
    current_class: currentClass,
    class_changed: classChanged,
    trend,
    css_class: cssClass,
    time_since_previous: timeSince
  };
}

// ═══════════════════════════════════
// BOOT
// ═══════════════════════════════════
(async function boot() {
  await HyperionMemory.init();

  // ── FETCH SOLAR DATA ──
  let signalData = null;
  let signalText = 'No data';

  try {
    const resp = await fetch('https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json');
    const rows = await resp.json();
    const longRows = rows.filter(r => r.energy === '0.1-0.8nm');
    
    if (longRows.length > 0) {
      const latest = longRows[longRows.length - 1];
      const flux = latest ? latest.flux : null;
      const classification = classifyFlux(flux);
      
      // Try to get active region from flare list
      let activeRegion = null;
      try {
        const flareResp = await fetch('https://services.swpc.noaa.gov/json/goes/primary/xray-flares-latest.json');
        const flares = await flareResp.json();
        if (flares.length > 0) {
          const latestFlare = flares[flares.length - 1];
          activeRegion = latestFlare.active_region || null;
        }
      } catch (e) {}
      
      signalData = {
        flux,
        flux_scientific: flux ? flux.toExponential(3) : null,
        class: classification.class,
        class_short: classification.short,
        class_rank: classification.rank,
        observed_at: latest?.time_tag || null,
        active_region: activeRegion,
        energy_band: '0.1-0.8nm',
        source: 'NOAA GOES Primary X-ray Flux'
      };
      
      signalText = JSON.stringify(signalData, null, 2);
    } else {
      signalText = 'No 0.1-0.8nm readings available in the 6-hour window.';
    }
  } catch (e) {
    signalText = 'NOAA SWPC feed unreachable.';
    signalData = { error: 'fetch_failed', message: e.message };
  }

  // ── SOLAR CYCLE ──
  const cycleData = getSolarCycleContext();

  // ── DELTA ──
  const localEvents = HyperionMemory.layers.local?.events || [];
  const previousEvent = localEvents.length > 0 ? localEvents[localEvents.length - 1] : null;
  const delta = signalData?.flux != null 
    ? computeDelta(signalData.flux, signalData.class, previousEvent) 
    : null;

  // ── DISPLAY ──
  document.getElementById('signal').textContent = signalText;
  document.getElementById('cycle').textContent = JSON.stringify(cycleData, null, 2);
  
  if (delta) {
    const deltaStr = JSON.stringify(delta, null, 2);
    document.getElementById('delta').innerHTML = 
      `<span class="${delta.css_class}">${deltaStr}</span>`;
  } else {
    document.getElementById('delta').textContent = previousEvent 
      ? 'No flux data available for comparison.' 
      : 'No previous reading in memory. First cascade?';
  }

  // ── DISPLAY MEMORY ──
  const recentEvents = localEvents.slice(-3).reverse();
  document.getElementById('memory').textContent = recentEvents.length > 0
    ? JSON.stringify(recentEvents, null, 2)
    : 'No events recorded yet.';

  // ── REMEMBER ──
  if (signalData && signalData.flux != null) {
    try {
      await HyperionMemory.remember({
        tick: Date.now(),
        charge_type: 'solar_reading',
        coherence: 1,
        signal: signalData,
        cycle_context: cycleData,
        delta
      });
    } catch (e) {
      console.warn('Hyperion could not record:', e.message);
    }
  }

  // ── FULL EXPORT PREVIEW ──
  document.getElementById('export').textContent = JSON.stringify({
    titan: 'hyperion',
    signal: signalData,
    cycle: cycleData,
    delta,
    memory_events: localEvents.length
  }, null, 2);

  // ── TITAN EXPORT (for cascade) ──
  window.TitanExport = function () {
    return {
      titan: 'hyperion',
      title: 'Light & Illumination',
      reflect: (typeof HyperionIdentity !== 'undefined' && HyperionIdentity.reflect) 
        ? HyperionIdentity.reflect() : '🔆 Hyperion: The Watcher Above.',
      signal: signalData,
      cycle: cycleData,
      delta,
      fast: HyperionMemory.layers.fast,
      local: HyperionMemory.layers.local,
      exported_at: new Date().toISOString()
    };
  };

  if (window.parent !== window) {
    window.parent.postMessage({ type: 'titan-ready', titan: 'hyperion' }, '*');
  }
})();
</script>

</body>
</html>
