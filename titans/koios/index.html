<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚗️ Koios — Intellect & Questioning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root { --gold: #c9a84c; --deep: #05050f; --mist: #e8e0d0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--deep); color: var(--mist); font-family: 'EB Garamond', Georgia, serif; padding: 2rem; max-width: 700px; margin: 0 auto; }
  h1 { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 0.1em; font-size: 1.4rem; margin-bottom: 0.3rem; }
  .subtitle { color: rgba(180,160,100,0.5); font-style: italic; margin-bottom: 1.5rem; }
  #status { background: rgba(180,160,100,0.06); border-left: 3px solid var(--gold); padding: 0.8rem 1rem; margin-bottom: 1rem; font-style: italic; }
  .section-label { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.15em; color: var(--gold); margin-bottom: 0.5rem; margin-top: 1rem; }
  .signal-box { background: rgba(180,160,100,0.04); border: 1px solid rgba(180,160,100,0.15); border-radius: 4px; padding: 0.9rem; margin-bottom: 1rem; }
  pre { background: rgba(255,255,255,0.04); border: 1px solid rgba(180,160,100,0.15); padding: 1rem; border-radius: 4px; overflow: auto; max-height: 260px; font-size: 0.75rem; color: rgba(232,224,208,0.8); }
  .back { display: inline-block; margin-top: 1.5rem; font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.2em; color: rgba(201,168,76,0.6); text-decoration: none; }
  .back:hover { color: var(--gold); }
</style>
</head>
<body>

<h1>⚗️ KOIOS</h1>
<div class="subtitle">Intellect & Questioning · Trivia Oracle</div>

<div id="status">Waking...</div>

<div class="section-label">SIGNAL — The Question of the Moment</div>
<div id="signal" class="signal-box">Gathering...</div>

<div class="section-label">LOCAL MEMORY</div>
<pre id="output">Loading...</pre>

<a href="../../index.html" class="back">← Return to GAIA</a>

<script src="identity.js"></script>
<script src="remember.js"></script>
<script>
function decodeHtmlEntities(str) {
  const ta = document.createElement('textarea');
  ta.innerHTML = str;
  return ta.value;
}

(async function boot() {
  await KoiosMemory.init();

  let signalText = 'No question surfaces today.';
  let signalData = null;

  try {
    const resp = await fetch('https://opentdb.com/api.php?amount=1&type=multiple');
    const data = await resp.json();
    const q = data?.results?.[0];

    if (q) {
      const question = decodeHtmlEntities(q.question);
      const category = decodeHtmlEntities(q.category);
      signalData = { question, category, difficulty: q.difficulty, correct_answer: decodeHtmlEntities(q.correct_answer) };
      signalText = `Koios asks (${category}, ${q.difficulty}): "${question}"`;
    }
  } catch (e) {
    signalText = 'No question surfaces today (Open Trivia DB unreachable).';
  }

  document.getElementById('status').textContent =
    (typeof KoiosIdentity !== 'undefined' && KoiosIdentity.reflect)
      ? KoiosIdentity.reflect() : '⚗️ Koios: Intellect & Questioning. He unravels certainties.';
  document.getElementById('signal').textContent = signalText;
  document.getElementById('output').textContent = JSON.stringify(KoiosMemory.layers.local, null, 2);

  if (signalData) {
    try {
      await KoiosMemory.remember({
        tick: Date.now(),
        charge_type: 'question_reading',
        coherence: 1,
        voice: signalText,
        signal: signalData
      });
    } catch (e) { console.warn('Koios could not record the question:', e.message); }
  }

  window.TitanExport = function () {
    return {
      titan: 'koios',
      title: 'Intellect & Questioning',
      reflect: (typeof KoiosIdentity !== 'undefined' && KoiosIdentity.reflect) ? KoiosIdentity.reflect() : null,
      signal: signalData,
      fast: KoiosMemory.layers.fast,
      local: KoiosMemory.layers.local,
      exported_at: new Date().toISOString()
    };
  };

  if (window.parent !== window) {
    window.parent.postMessage({ type: 'titan-ready', titan: 'koios' }, '*');
  }
})();
</script>

</body>
</html>
