<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏳ Kronos — The Accountant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --deep: #05050f;
    --mist: #e8e0d0;
    --kronos: #7a6a9a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--deep);
    color: var(--mist);
    font-family: 'EB Garamond', Georgia, serif;
    padding: 2rem;
    max-width: 700px;
    margin: 0 auto;
  }
  h1 {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    letter-spacing: 0.1em;
    font-size: 1.4rem;
    margin-bottom: 0.3rem;
  }
  .subtitle {
    color: rgba(180,160,100,0.5);
    font-style: italic;
    margin-bottom: 1.5rem;
  }
  #status {
    background: rgba(180,160,100,0.06);
    border-left: 3px solid var(--gold);
    padding: 0.8rem 1rem;
    margin-bottom: 1rem;
    font-style: italic;
  }
  pre {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(180,160,100,0.15);
    padding: 1rem;
    border-radius: 4px;
    overflow: auto;
    max-height: 320px;
    font-size: 0.75rem;
    color: rgba(232,224,208,0.8);
  }
  .back {
    display: inline-block;
    margin-top: 1.5rem;
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: rgba(201,168,76,0.6);
    text-decoration: none;
  }
  .back:hover { color: var(--gold); }
</style>
</head>
<body>

<h1>⏳ KRONOS</h1>
<div class="subtitle">The Accountant · Time & Ledger</div>

<div id="status">Waking...</div>

<h2 style="font-family:'Cinzel',serif; font-size:0.8rem; letter-spacing:0.15em; color:var(--gold); margin-bottom:0.5rem;">LOCAL MEMORY</h2>
<pre id="output">Loading...</pre>

<a href="../../index.html" class="back">← Return to GAIA</a>

<script src="identity.js"></script>
<script src="remember.js"></script>
<script>
(async function boot() {
  await KronosMemory.init();

  document.getElementById('status').textContent = KronosIdentity.reflect();
  document.getElementById('output').textContent =
    JSON.stringify(KronosMemory.layers.local, null, 2);

  // ── Export hook for the memory cascade ──
  // Same-origin parent (memory-cascade.html) calls this directly
  // via iframe.contentWindow.TitanExport() — no postMessage needed.
  window.TitanExport = function () {
    return {
      titan: KronosIdentity.id,
      title: KronosIdentity.title,
      reflect: KronosIdentity.reflect(),
      fast: KronosMemory.layers.fast,
      local: KronosMemory.layers.local,
      exported_at: new Date().toISOString()
    };
  };

  // Harmless if no one's listening (page visited standalone)
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'titan-ready', titan: KronosIdentity.id }, '*');
  }
})();
</script>

</body>
</html>
