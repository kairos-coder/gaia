<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏳ Kronos · Gatekeeper API</title>
  <style>
    :root {
      --bg: #07090c; --surface: #141b22; --text: #c0ccd8; --text-dim: #6a7a8a;
      --accent: #c9a85c; --accent-dim: #6b5a32; --border: rgba(138,155,176,0.15);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Courier New',monospace; padding:1.5rem; min-height:100vh; }
    h1 { color:var(--accent); font-size:0.9rem; margin-bottom:0.25rem; }
    .subtitle { color:var(--text-dim); font-size:0.65rem; margin-bottom:1.5rem; }
    .endpoint { font-size:0.65rem; color:var(--text-dim); margin-bottom:0.3rem; padding:0.3rem 0.5rem; background:var(--surface); border-left:2px solid var(--accent); }
    .endpoint a { color:var(--accent); text-decoration:none; }
    pre { background:var(--surface); border:1px solid var(--border); padding:1rem; font-size:0.7rem; line-height:1.5; white-space:pre-wrap; max-height:70vh; overflow-y:auto; }
  </style>
</head>
<body>
  <h1>⏳ Kronos · Gatekeeper API</h1>
  <p class="subtitle">Immutable Ledger · Query Validation · Titan Memory Router</p>
  <div class="endpoint"><a href="?view=ledger">?view=ledger</a> — Full immutable ledger</div>
  <div class="endpoint"><a href="?view=ledger&type=judge&limit=5">?view=ledger&type=judge&limit=5</a> — Filtered</div>
  <div class="endpoint"><a href="?view=stats">?view=stats</a> — Statistics</div>
  <pre id="output">{}</pre>

  <script>
    // ═══════════════════════════════════════════
    // KRONOS GATEKEEPER — Shared localStorage engine
    // All pages on this origin use these same functions
    // ═══════════════════════════════════════════
    
    const LEDGER_KEY = 'kronos_memory';
    
    // Expose on window so other pages can use directly
    window.KronosGatekeeper = {
      
      loadLedger() {
        const s = localStorage.getItem(LEDGER_KEY);
        return s ? JSON.parse(s) : { events: [], last_tick: 0, total_events: 0 };
      },
      
      saveLedger(ledger) {
        localStorage.setItem(LEDGER_KEY, JSON.stringify(ledger));
      },
      
      log(olympian, operation, queryParams, responseSummary, meta = {}) {
        const ledger = this.loadLedger();
        const entry = {
          entry_id: `kronos_${String(ledger.total_events + 1).padStart(4, '0')}`,
          tick: ledger.total_events + 1,
          timestamp: new Date().toISOString(),
          olympian, operation,
          query_params: queryParams,
          response_summary: responseSummary,
          titan_routes: meta.titan_routes || []
        };
        ledger.events.push(entry);
        ledger.last_tick = entry.tick;
        ledger.total_events = ledger.events.length;
        if (ledger.events.length > 2000) ledger.events = ledger.events.slice(-2000);
        this.saveLedger(ledger);
        return entry;
      },
      
      getLedger(type, limit = 25) {
        const ledger = this.loadLedger();
        let events = ledger.events;
        if (type) events = events.filter(e => e.operation === type || e.type === type);
        return events.slice(-limit).reverse();
      },
      
      getStats() {
        const ledger = this.loadLedger();
        const byOlympian = {}, byOperation = {};
        for (const e of ledger.events) {
          byOlympian[e.olympian] = (byOlympian[e.olympian] || 0) + 1;
          byOperation[e.operation] = (byOperation[e.operation] || 0) + 1;
        }
        return { total_entries: ledger.total_events, last_tick: ledger.last_tick, by_olympian: byOlympian, by_operation: byOperation };
      }
    };

    // ─── API Handler ────────────────────────────────────────────────────
    (function handleRequest() {
      const p = new URLSearchParams(window.location.search);
      const view = p.get('view') || 'ledger';
      const type = p.get('type') || '';
      const limit = parseInt(p.get('limit') || '25');
      let result;
      
      if (view === 'ledger') {
        result = { titan: 'kronos', entries: window.KronosGatekeeper.getLedger(type || null, limit), stats: window.KronosGatekeeper.getStats() };
      } else if (view === 'stats') {
        result = { titan: 'kronos', ...window.KronosGatekeeper.getStats() };
      } else {
        result = { error: `Unknown view: ${view}`, valid_views: ['ledger', 'stats'] };
      }
      
      document.getElementById('output').textContent = JSON.stringify(result, null, 2);
    })();
  </script>
</body>
</html>
