<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📜 Mnemosyne — The Weaver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --deep: #05050f;
    --mist: #e8e0d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--deep);
    color: var(--mist);
    font-family: 'EB Garamond', Georgia, serif;
    padding: 2rem;
    max-width: 700px;
    margin: 0 auto;
  }
  h1 {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    letter-spacing: 0.1em;
    font-size: 1.4rem;
    margin-bottom: 0.3rem;
  }
  .subtitle {
    color: rgba(180,160,100,0.5);
    font-style: italic;
    margin-bottom: 1.5rem;
  }
  #status {
    background: rgba(180,160,100,0.06);
    border-left: 3px solid var(--gold);
    padding: 0.8rem 1rem;
    margin-bottom: 1rem;
    font-style: italic;
  }
  pre {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(180,160,100,0.15);
    padding: 1rem;
    border-radius: 4px;
    overflow: auto;
    max-height: 320px;
    font-size: 0.75rem;
    color: rgba(232,224,208,0.8);
  }
  .back {
    display: inline-block;
    margin-top: 1.5rem;
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: rgba(201,168,76,0.6);
    text-decoration: none;
  }
  .back:hover { color: var(--gold); }
</style>
</head>
<body>

<h1>📜 MNEMOSYNE</h1>
<div class="subtitle">The Weaver · Memory & Narrative</div>

<div id="status">Waking...</div>

<h2 style="font-family:'Cinzel',serif; font-size:0.8rem; letter-spacing:0.15em; color:var(--gold); margin-bottom:0.5rem;">LOCAL MEMORY</h2>
<pre id="output">Loading...</pre>

<a href="../../index.html" class="back">← Return to GAIA</a>

<script src="identity.js"></script>
<script src="remember.js"></script>
<script>
(async function boot() {
  await MnemosyneMemory.init();

  // NOTE: assumes her identity object is named MnemosyneIdentity
  // and exposes a reflect() method, matching Kronos's pattern.
  // Adjust the two lines below if her identity.js differs.
  document.getElementById('status').textContent =
    (typeof MnemosyneIdentity !== 'undefined' && MnemosyneIdentity.reflect)
      ? MnemosyneIdentity.reflect()
      : '📜 Mnemosyne: The Weaver. Memory gathers.';

  document.getElementById('output').textContent =
    JSON.stringify(MnemosyneMemory.layers.local, null, 2);

  window.TitanExport = function () {
    return {
      titan: (typeof MnemosyneIdentity !== 'undefined') ? MnemosyneIdentity.id : 'mnemosyne',
      title: (typeof MnemosyneIdentity !== 'undefined') ? MnemosyneIdentity.title : 'The Weaver',
      reflect: (typeof MnemosyneIdentity !== 'undefined' && MnemosyneIdentity.reflect)
        ? MnemosyneIdentity.reflect() : null,
      fast: MnemosyneMemory.layers.fast,
      local: MnemosyneMemory.layers.local,
      exported_at: new Date().toISOString()
    };
  };

  if (window.parent !== window) {
    window.parent.postMessage({ type: 'titan-ready', titan: 'mnemosyne' }, '*');
  }
})();
</script>

</body>
</html>
