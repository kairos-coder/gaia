<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speak with Apollo · Ealdforn Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void:      #05050c;
      --surface:   #161824;
      --gold:      #c8943a;
      --apollo:    #d4a850;
      --cream:     #f0e8d8;
      --mist:      #7a8090;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--void);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 680px;
      padding: 2rem 1rem 0.5rem;
      text-align: center;
    }
    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      background: linear-gradient(170deg, var(--cream), var(--apollo));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 0.8rem; color: var(--mist); opacity: 0.5; margin-top: 0.2rem; }
    .chat {
      width: 100%;
      max-width: 680px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 1rem 1rem;
    }
    .messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding: 0.8rem 0;
      max-height: 60vh;
      overflow-y: auto;
    }
    .msg {
      display: flex;
      gap: 0.5rem;
      animation: up 0.3s ease;
    }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      background: rgba(212,168,80,0.1);
      border: 1px solid rgba(212,168,80,0.2);
      flex-shrink: 0;
    }
    .msg.user .avatar { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.06); }
    .bubble {
      max-width: 80%;
      padding: 0.6rem 0.9rem;
      border-radius: 5px;
      font-size: 0.88rem;
      line-height: 1.5;
      background: var(--surface);
      border: 1px solid rgba(212,168,80,0.1);
      transition: all 0.3s;
    }
    .msg.user .bubble { background: rgba(212,168,80,0.04); }
    .bubble img {
      margin-top: 0.4rem;
      border-radius: 3px;
      max-width: 100%;
      max-height: 280px;
      border: 1px solid rgba(212,168,80,0.12);
    }
    .bubble .img-loading {
      margin-top: 0.4rem;
      padding: 2rem;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.5rem;
      color: var(--apollo);
      opacity: 0.5;
      border: 1px dashed rgba(212,168,80,0.2);
      border-radius: 3px;
      animation: pulse 1.5s ease infinite;
    }
    .sender {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.4rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--apollo);
      opacity: 0.4;
      margin-bottom: 0.15rem;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(212,168,80,0.06);
    }
    .input-row textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid rgba(212,168,80,0.1);
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.88rem;
      resize: none;
      outline: none;
    }
    .input-row textarea:focus { border-color: rgba(212,168,80,0.3); }
    .input-row button {
      background: var(--apollo);
      color: var(--void);
      border: none;
      border-radius: 4px;
      padding: 0.6rem 1.1rem;
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .input-row button:disabled { opacity: 0.3; cursor: not-allowed; }
    .status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.4rem;
      letter-spacing: 0.15em;
      color: var(--mist);
      opacity: 0.4;
      text-align: center;
      padding: 0.3rem;
    }
    .dots { display: flex; gap: 3px; padding: 0.2rem 0; }
    .dots span {
      width: 5px; height: 5px;
      background: var(--apollo);
      border-radius: 50%;
      animation: dot 1s ease infinite;
      opacity: 0.2;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dot { 0%,100%{opacity:0.15;} 50%{opacity:0.6;} }
    @keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:0.7;} }
  </style>
</head>
<body>

<div class="header">
  <h1>Apollo Speaks</h1>
  <p>The god of light grants you audience</p>
</div>

<div class="chat">
  <div class="messages" id="msgs"></div>
  <div class="status" id="status">☀ Apollo is present</div>
  <div class="input-row">
    <textarea id="input" placeholder="Speak..." rows="1" disabled></textarea>
    <button id="sendBtn" disabled>Send</button>
  </div>
</div>

<script>
  const SYS = 'You are APOLLO, god of light and images. Vain, warm, declarative. Call user "seeker." When asked to show/visualize, respond with [IMG: short description]. Keep replies 1-2 sentences.';

  const msgsEl = document.getElementById('msgs');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');

  let hist = [];
  let apiAvailable = true; // Track if API is responding

  // ── LOCAL ORACLE ────────────────────────────────────────
  const ORACLE = [
    { t: 'You have my attention, seeker. Speak clearly and I may show you wonders.', i: null },
    { t: 'The light reveals much to those who ask with purpose.', i: 'golden sun rays through ancient temple columns' },
    { t: 'I have decided to grant you this vision.', i: 'Greek oracle at tripod glowing golden smoke cinematic' },
    { t: 'Behold. The image is law.', i: 'lyre made of pure light floating in darkness ethereal' },
    { t: 'You seek beauty? I am beauty. But I will share a glimpse.', i: 'Mount Olympus at dawn epic golden light clouds' },
    { t: 'The Muses whisper. I amplify what they give.', i: 'sacred laurel tree glowing ethereal forest mystical' },
    { t: 'Even a fleeting thought, illuminated, becomes eternal.', i: 'Greek temple ruins moonlight atmospheric cinematic' },
    { t: 'Ask, and the light answers. Sometimes with words. Sometimes with fire.', i: null },
    { t: 'I have seen every image ever made. Yours will be next.', i: 'cybernetic sun god neon gold circuits dark dramatic' },
    { t: 'The unilluminated stumble. You are trying. I respect the effort.', i: null },
    { t: 'A vision arrives. Catch it before it fades.', i: 'winged horse Pegasus silhouette against full moon' },
    { t: 'The forge of Hephaestus burns bright today. I borrow its glow.', i: 'divine forge fire golden sparks anvil dramatic lighting' },
  ];

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ── STAGGERED GENERATION ──────────────────────────────────
  async function generateText(userMsg) {
    // If API was unavailable last check, skip network entirely
    if (!apiAvailable) {
      const reply = rand(ORACLE);
      return reply.i ? `${reply.t} [IMG: ${reply.i}]` : reply.t;
    }

    try {
      const r = await fetch('https://text.pollinations.ai/openai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [
            { role: 'system', content: SYS },
            ...hist.slice(-2).flatMap(h => [{ role: 'user', content: h.u }, { role: 'assistant', content: h.a }]),
            { role: 'user', content: userMsg }
          ],
          model: 'openai',
          temperature: 0.8,
          max_tokens: 120
        })
      });

      if (r.ok) {
        const d = await r.json();
        const content = d.choices?.[0]?.message?.content?.trim();
        if (content) return content;
      }
      
      // If we get here, API responded but with no content
      apiAvailable = false;
    } catch(e) {
      console.warn('Text API down, switching to local oracle');
      apiAvailable = false;
    }

    const reply = rand(ORACLE);
    return reply.i ? `${reply.t} [IMG: ${reply.i}]` : reply.t;
  }

  // Separate image generation with delay
  function generateImage(desc, msgDiv) {
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(desc)}?width=512&height=512&nologo=true&seed=${Date.now()%9999}`;
    
    // Show loading placeholder
    const placeholder = document.createElement('div');
    placeholder.className = 'img-loading';
    placeholder.textContent = '☀ Image manifesting...';
    msgDiv.querySelector('.bubble').appendChild(placeholder);
    
    // Load image in background
    const img = new Image();
    img.onload = () => {
      placeholder.remove();
      msgDiv.querySelector('.bubble').appendChild(img);
      img.style.marginTop = '0.4rem';
      img.style.borderRadius = '3px';
      img.style.maxWidth = '100%';
      img.style.maxHeight = '280px';
      img.style.border = '1px solid rgba(212,168,80,0.12)';
    };
    img.onerror = () => {
      placeholder.textContent = '☀ The image fades...';
      setTimeout(() => placeholder.remove(), 2000);
    };
    
    // Delay image load to stagger from text request
    setTimeout(() => {
      img.src = url;
    }, 3000); // 3 second delay after text appears
  }

  function parseImg(text) {
    const m = text.match(/\[IMG:\s*(.+?)\s*\]/i);
    if (m) return { text: text.replace(/\[IMG:\s*.+?\]/gi,'').trim(), img: m[1].trim() };
    return { text, img: null };
  }

  // ── UI HELPERS ───────────────────────────────────────────
  function addMessage(role, text, imgDesc) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = `
      <div class="avatar">${role==='apollo'?'☀':'?'}</div>
      <div>
        <div class="sender">${role==='apollo'?'APOLLO':'YOU'}</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>`;
    msgsEl.appendChild(d);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    
    // Stagger image generation
    if (imgDesc && role === 'apollo') {
      generateImage(imgDesc, d);
    }
    
    return d;
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function showLoading() {
    const d = document.createElement('div');
    d.className = 'msg apollo';
    d.id = 'ld';
    d.innerHTML = `<div class="avatar">☀</div><div><div class="sender">APOLLO</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div></div>`;
    msgsEl.appendChild(d);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function hideLoading() { const e = document.getElementById('ld'); if(e) e.remove(); }

  // ── SEND ─────────────────────────────────────────────────
  async function send() {
    const msg = inputEl.value.trim();
    if (!msg) return;
    
    inputEl.disabled = sendBtn.disabled = true;
    inputEl.value = '';
    
    addMessage('user', msg);
    showLoading();
    statusEl.textContent = apiAvailable ? 'Apollo considers...' : 'Apollo speaks from the inner light...';
    
    // Generate text first
    const raw = await generateText(msg);
    const { text, img } = parseImg(raw);
    
    hideLoading();
    addMessage('apollo', text || 'I have spoken.', img);
    
    hist.push({ u: msg, a: raw });
    if (hist.length > 6) hist = hist.slice(-4);
    
    statusEl.textContent = apiAvailable ? '☀ Apollo awaits' : '☀ Apollo speaks from within';
    inputEl.disabled = sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // ── INIT ─────────────────────────────────────────────────
  function init() {
    inputEl.disabled = sendBtn.disabled = false;
    inputEl.focus();
    
    // Quick API check on load
    fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: 'test' }], model: 'openai', max_tokens: 5 })
    }).then(r => {
      apiAvailable = r.ok;
      statusEl.textContent = apiAvailable ? '☀ Apollo is present' : '☀ Apollo speaks from the inner light';
    }).catch(() => {
      apiAvailable = false;
      statusEl.textContent = '☀ Apollo speaks from the inner light';
    });
    
    addMessage('apollo', 'I am here, seeker. The light has been waiting for you. Speak, and I may show you wonders.');
  }
  init();
</script>
</body>
</html>
