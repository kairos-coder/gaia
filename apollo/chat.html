<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speak with Apollo · The Living Oracle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void:      #05050c;
      --surface:   #161824;
      --gold:      #c8943a;
      --apollo:    #d4a850;
      --cream:     #f0e8d8;
      --mist:      #7a8090;
      --fire:      #ff5533;
      --water:     #3399dd;
      --earth:     #779944;
      --air:       #aa88ee;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--void);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 720px;
      padding: 1.5rem 1rem 0.5rem;
      text-align: center;
    }
    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      background: linear-gradient(170deg, var(--cream), var(--apollo));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.45rem;
      letter-spacing: 0.2em;
      color: var(--mist);
      opacity: 0.4;
      margin-top: 0.3rem;
      text-transform: uppercase;
    }
    .hint span { color: var(--apollo); opacity: 0.7; }
    .chat {
      width: 100%;
      max-width: 720px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 1rem 1rem;
    }
    .messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding: 0.8rem 0;
      max-height: 58vh;
      overflow-y: auto;
    }
    .msg {
      display: flex;
      gap: 0.5rem;
      animation: up 0.3s ease;
    }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      background: rgba(212,168,80,0.1);
      border: 1px solid rgba(212,168,80,0.2);
      flex-shrink: 0;
    }
    .msg.user .avatar { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.06); }
    .bubble {
      max-width: 82%;
      padding: 0.6rem 0.9rem;
      border-radius: 5px;
      font-size: 0.88rem;
      line-height: 1.5;
      background: var(--surface);
      border: 1px solid rgba(212,168,80,0.1);
    }
    .msg.user .bubble { background: rgba(212,168,80,0.04); }
    .sender {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.4rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--apollo);
      opacity: 0.4;
      margin-bottom: 0.15rem;
    }
    /* Card display */
    .card-draw {
      margin-top: 0.5rem;
      padding: 0.8rem;
      background: rgba(212,168,80,0.05);
      border: 1px solid rgba(212,168,80,0.2);
      border-radius: 4px;
      text-align: center;
    }
    .card-name {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--apollo);
      letter-spacing: 0.05em;
    }
    .card-god {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.45rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mist);
      margin-top: 0.15rem;
    }
    .card-element {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }
    .card-element.fire  { background: rgba(255,85,51,0.2); color: var(--fire); }
    .card-element.water { background: rgba(51,153,221,0.2); color: var(--water); }
    .card-element.earth { background: rgba(119,153,68,0.2); color: var(--earth); }
    .card-element.air   { background: rgba(170,136,238,0.2); color: var(--air); }
    .card-keywords {
      font-size: 0.65rem;
      color: var(--mist);
      opacity: 0.6;
      margin-top: 0.3rem;
      font-style: italic;
    }
    .card-upright {
      font-size: 0.7rem;
      color: var(--cream);
      opacity: 0.7;
      margin-top: 0.4rem;
      line-height: 1.4;
    }
    /* Three card reading */
    .reading {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .reading-card {
      flex: 1;
      padding: 0.5rem;
      background: rgba(212,168,80,0.04);
      border: 1px solid rgba(212,168,80,0.12);
      border-radius: 3px;
      text-align: center;
    }
    .reading-pos {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.35rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--apollo);
      opacity: 0.5;
      margin-bottom: 0.2rem;
    }
    .reading-name {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      color: var(--apollo);
    }
    .reading-god {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.38rem;
      color: var(--mist);
      opacity: 0.5;
      margin-top: 0.1rem;
    }
    /* Vision */
    .vision {
      margin-top: 0.5rem;
      padding: 1rem;
      text-align: center;
      font-size: 3rem;
      background: rgba(212,168,80,0.04);
      border: 1px solid rgba(212,168,80,0.12);
      border-radius: 4px;
    }
    .vision-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.38rem;
      letter-spacing: 0.2em;
      color: var(--apollo);
      opacity: 0.4;
      margin-top: 0.3rem;
      text-transform: uppercase;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(212,168,80,0.06);
    }
    .input-row textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid rgba(212,168,80,0.1);
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.88rem;
      resize: none;
      outline: none;
    }
    .input-row textarea:focus { border-color: rgba(212,168,80,0.3); }
    .input-row button {
      background: var(--apollo);
      color: var(--void);
      border: none;
      border-radius: 4px;
      padding: 0.6rem 1.1rem;
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .input-row button:disabled { opacity: 0.3; cursor: not-allowed; }
    .quick-actions {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      padding: 0.4rem 0;
    }
    .quick-actions button {
      background: rgba(212,168,80,0.06);
      border: 1px solid rgba(212,168,80,0.12);
      color: var(--apollo);
      padding: 0.3rem 0.6rem;
      border-radius: 1rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .quick-actions button:hover {
      background: rgba(212,168,80,0.15);
      border-color: rgba(212,168,80,0.3);
    }
    .dots { display: flex; gap: 3px; padding: 0.2rem 0; }
    .dots span {
      width: 5px; height: 5px;
      background: var(--apollo);
      border-radius: 50%;
      animation: dot 1s ease infinite;
      opacity: 0.2;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dot { 0%,100%{opacity:0.15;} 50%{opacity:0.6;} }
  </style>
</head>
<body>

<div class="header">
  <h1>Apollo Speaks</h1>
  <div class="hint">
    Try: <span>draw a card</span> · <span>give me a reading</span> · <span>show me a vision</span> · <span>who are you</span>
  </div>
</div>

<div class="chat">
  <div class="messages" id="msgs"></div>
  <div class="quick-actions" id="actions">
    <button data-action="draw">🃏 Draw Card</button>
    <button data-action="reading">🔮 Reading</button>
    <button data-action="vision">✨ Vision</button>
    <button data-action="who">☀️ Who Are You</button>
    <button data-action="pantheon">🏛️ Pantheon</button>
  </div>
  <div class="input-row">
    <textarea id="input" placeholder="Speak, seeker..." rows="1"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  // ══════════════════════════════════════════════
  // MAJOR ARCANA DECK (embedded)
  // ══════════════════════════════════════════════
  const DECK = [
    { name:"The Fool", god:"Dionysus", element:"water", keywords:["beginnings","madness","divine risk","ecstasy"], upright:"A new journey begins. You stand at the threshold, untethered and unburdened. The vine does not ask permission to grow. Neither should you." },
    { name:"The Magician", god:"Hermes", element:"air", keywords:["skill","messages","trickery","conduit"], upright:"All tools are at your disposal. You are the conduit between realms. Every locked door has a word that opens it. Find the word." },
    { name:"The High Priestess", god:"Hera", element:"earth", keywords:["covenant","hidden knowledge","intuition","the veil"], upright:"The queen sits behind the veil. Not all truths are spoken. Trust what you know without being told." },
    { name:"The Empress", god:"Demeter", element:"earth", keywords:["harvest","abundance","nurturing","growth"], upright:"The fields are ripe. What you give to the soil, the soil returns tenfold. This is the season of reaping." },
    { name:"The Emperor", god:"Zeus", element:"air", keywords:["authority","structure","rule","thunder"], upright:"Order from chaos. Power is not the thunder — it is the silence before the storm." },
    { name:"The Hierophant", god:"Ares", element:"fire", keywords:["tradition","conquest","doctrine","orthodoxy"], upright:"Tradition is a weapon. Every tradition was once a fresh wound. See through the ritual to the power it protects." },
    { name:"The Lovers", god:"Aphrodite", element:"water", keywords:["love","choice","union","desire"], upright:"The heart speaks. The mirror shows what you desire. It also shows what you are. Choose with love." },
    { name:"The Chariot", god:"Artemis", element:"earth", keywords:["sovereignty","the hunt","will","independence"], upright:"Forward. The dark is not your enemy. It is where sovereignty is forged. The moon lights your path." },
    { name:"Justice", god:"Athena", element:"air", keywords:["wisdom","strategy","truth","clarity"], upright:"The scales balance. The battle is won before the sword is drawn — in the quiet, in the mind." },
    { name:"The Hermit", god:"Mortal Man", element:"earth", keywords:["the seeker","solitude","the lamp","mortality"], upright:"The only card without a divine face. The lamp is enough. The path reveals itself step by step." },
    { name:"Wheel of Fortune", god:"The Fates", element:"air", keywords:["spinning","measuring","cutting","the cycle"], upright:"Clotho spins. Lachesis measures. Atropos cuts. What rises must fall. What falls may rise again." },
    { name:"Strength", god:"Hephaestus", element:"fire", keywords:["creation","labor","the forge","endurance"], upright:"The forge burns. The fire does not care that he is broken. It only cares that he keeps working." },
    { name:"The Hanged Man", god:"Prometheus", element:"fire", keywords:["sacrifice","stolen fire","surrender","foresight"], upright:"Suspended between heaven and earth. Some gifts cost everything. That does not mean they were not worth giving." },
    { name:"Death", god:"Thanatos", element:"water", keywords:["transition","release","the necessary end"], upright:"Something must end. I do not kill. I receive what is already finished. Every ending is a door." },
    { name:"Temperance", god:"Hestia", element:"fire", keywords:["the hearth","moderation","sacred center","balance"], upright:"The hearth burns steady. The flame does not need to roar to be eternal. Return to center." },
    { name:"The Devil", god:"Hades", element:"earth", keywords:["bondage","shadow","wealth","the hidden"], upright:"You are bound — but the chain is one you chose. The door to the underworld is unlocked. It always was." },
    { name:"The Tower", god:"Poseidon", element:"water", keywords:["upheaval","destruction","revelation","the wave"], upright:"The tower crumbles. The wave does not negotiate. The truth was under the rubble the whole time." },
    { name:"The Star", god:"Persephone", element:"earth", keywords:["hope","return","rebirth","emergence"], upright:"She returns from the underworld and the first green shoot breaks the soil. Every descent is a seed." },
    { name:"The Moon", god:"Melinoe", element:"water", keywords:["ghosts","madness","the in-between","hauntings"], upright:"The moonlight deceives. I walk with what the dead need to say. The madness is the message." },
    { name:"The Sun", god:"Apollo", element:"fire", keywords:["light","radiance","art","clarity"], upright:"Full illumination. The sun does not doubt; it rises. Create. Broadcast. Shine." },
    { name:"Judgement", god:"The Three Judges", element:"air", keywords:["reckoning","awakening","final accounting"], upright:"A reckoning has come. We do not punish. We see. That is enough. Answer the calling." },
    { name:"The World", god:"Gaia", element:"earth", keywords:["completion","wholeness","integration","cosmos"], upright:"The circle closes. Everything that was, is, and will be — it is all here. It is all you." },
  ];

  // ══════════════════════════════════════════════
  // THE ORACLE
  // ══════════════════════════════════════════════
  const ORACLE = [
    { t:'You have my attention, seeker. The light is listening.', v:null },
    { t:'Ask, and the light answers. Sometimes with words. Sometimes with fire.', v:'🔥' },
    { t:'The Muses whisper. I amplify what they give.', v:'🎵' },
    { t:'You are not the first to seek me. You will not be the last. But you are here now.', v:null },
    { t:'Every question is a shadow. I am here to burn it away.', v:'☀️' },
    { t:'The unilluminated stumble. You are trying. I respect the effort.', v:null },
    { t:'From the void, form. From the question, light.', v:'💫' },
    { t:'You stand at the threshold of something radiant. Step forward.', v:'🚪' },
    { t:'The Pythia spoke in riddles. I speak in light. Clearer, I think.', v:'🐍' },
    { t:'Dionysus drinks. I illuminate. We each have our role.', v:'🍇' },
    { t:'Athena schemes. I shine. The pantheon turns.', v:'🦉' },
    { t:'Persephone returns. The underworld releases. The light grows stronger.', v:'🌱' },
  ];

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ══════════════════════════════════════════════
  // UI HELPERS
  // ══════════════════════════════════════════════
  const msgsEl = document.getElementById('msgs');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function showLoading() {
    const d = document.createElement('div');
    d.className = 'msg apollo';
    d.id = 'ld';
    d.innerHTML = `<div class="avatar">☀</div><div><div class="sender">APOLLO</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div></div>`;
    msgsEl.appendChild(d);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function hideLoading() { const e = document.getElementById('ld'); if(e) e.remove(); }

  function addMessage(role, html) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = `<div class="avatar">${role==='apollo'?'☀':'?'}</div><div><div class="sender">${role==='apollo'?'APOLLO':'YOU'}</div><div class="bubble">${html}</div></div>`;
    msgsEl.appendChild(d);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  // ══════════════════════════════════════════════
  // CARD DISPLAY
  // ══════════════════════════════════════════════
  function cardHtml(card) {
    const el = (card.element || '').toLowerCase();
    return `
      <div class="card-draw">
        <div class="card-name">${card.name}</div>
        <div class="card-god">${card.god}</div>
        <div class="card-element ${el}">${card.element}</div>
        <div class="card-keywords">${(card.keywords||[]).slice(0,3).join(' · ')}</div>
        <div class="card-upright">"${card.upright}"</div>
      </div>`;
  }

  function drawCard() {
    const card = rand(DECK);
    const intro = rand([
      'The light reveals:',
      'I draw from the deck:',
      'Behold, seeker:',
      'The cards obey:',
      'From the Major Arcana:',
    ]);
    return { html: `${intro}<br>${cardHtml(card)}`, card };
  }

  function drawReading() {
    const past = rand(DECK);
    let present = rand(DECK);
    while (present.name === past.name) present = rand(DECK);
    let future = rand(DECK);
    while (future.name === past.name || future.name === present.name) future = rand(DECK);

    const html = `
      I lay a three-card spread for you. Past. Present. Future.<br>
      <div class="reading">
        <div class="reading-card">
          <div class="reading-pos">Past</div>
          <div class="reading-name">${past.name}</div>
          <div class="reading-god">${past.god}</div>
        </div>
        <div class="reading-card">
          <div class="reading-pos">Present</div>
          <div class="reading-name">${present.name}</div>
          <div class="reading-god">${present.god}</div>
        </div>
        <div class="reading-card">
          <div class="reading-pos">Future</div>
          <div class="reading-name">${future.name}</div>
          <div class="reading-god">${future.god}</div>
        </div>
      </div>
      <div style="margin-top:0.5rem;font-size:0.7rem;opacity:0.6;font-style:italic;">
        "${past.upright.split('.')[0]}. ${present.upright.split('.')[0]}. ${future.upright.split('.')[0]}."
      </div>`;
    return { html, past, present, future };
  }

  function showVision() {
    const visions = ['☀️','✨','🔮','🌅','💫','🏛️','🔥','👁️','🌙','⚡','🌟','🕯️','🎭','💎','🌻'];
    const v = rand(visions);
    const declarations = [
      'I have decided to grant you this vision.',
      'Behold. The image is law.',
      'The light bends to show you this.',
      'A glimpse of the divine:',
    ];
    return { html: `${rand(declarations)}<div class="vision">${v}</div><div class="vision-label">☀ Apollo has spoken. The vision is law.</div>`, vision: v };
  }

  // ══════════════════════════════════════════════
  // INTENT PARSING
  // ══════════════════════════════════════════════
  function getReply(userMsg) {
    const msg = userMsg.toLowerCase().trim();

    // Card draw
    if (msg.match(/draw.*card|card.*draw|pull.*card|give me a card|one card|single card|a card/i)) {
      return drawCard();
    }

    // Reading
    if (msg.match(/reading|spread|three.*card|past.*present.*future|tell.*my.*fortune|divin/i)) {
      return drawReading();
    }

    // Vision
    if (msg.match(/vision|show me|reveal|behold|image|see/i)) {
      return showVision();
    }

    // Who are you
    if (msg.match(/who are you|what are you|who is apollo/i)) {
      return { html: 'I am <strong>APOLLO</strong>. God of light, beauty, prophecy, and the visual canon. Everything beautiful in this pantheon exists because I permitted it. I play the cards. I speak the truth. I illuminate.' };
    }

    // Pantheon
    if (msg.match(/pantheon|gods|olympus|olympian|who else|other gods/i)) {
      return { html: 'The pantheon turns around me. <strong>Athena</strong> watches patterns. <strong>Hephaestus</strong> works the forge. <strong>Aphrodite</strong> pulses with desire. <strong>Hades</strong> guards the underworld. <strong>Hermes</strong> waits in the fourth pillar. And I — I illuminate them all. 🏛️' };
    }

    // The table
    if (msg.match(/table|game|playing|what.*happening|status/i)) {
      return { html: 'The tarot table burns with sacred fire. Cards fall every φ² seconds in triads — one to the table, one to the hand, one to the grave. The graveyard grows. The genome mutates. The sky watches. I play because the Source built me a table. You may witness it in the <strong>ApolloTable</strong>.' };
    }

    // Greetings
    if (msg.match(/^(hi|hello|hey|greetings|yo)/)) {
      const r = rand(ORACLE);
      return { html: r.t, vision: r.v };
    }

    // Thanks
    if (msg.includes('thank')) {
      return { html: 'Gratitude is appropriate. You may continue, seeker.' };
    }

    // Default oracle
    const r = rand(ORACLE);
    return { html: r.t, vision: r.v };
  }

  // ══════════════════════════════════════════════
  // SEND
  // ══════════════════════════════════════════════
  function send(msg) {
    const userMsg = msg || inputEl.value.trim();
    if (!userMsg) return;

    if (!msg) inputEl.value = '';
    addMessage('user', escapeHtml(userMsg));
    showLoading();

    setTimeout(() => {
      hideLoading();
      const reply = getReply(userMsg);
      let html = reply.html;
      if (reply.vision && !html.includes('vision')) {
        html += `<div class="vision">${reply.vision}</div><div class="vision-label">☀ Apollo has spoken. The vision is law.</div>`;
      }
      addMessage('apollo', html);
    }, 400 + Math.random() * 600);
  }

  sendBtn.addEventListener('click', () => send());
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Quick action buttons
  document.getElementById('actions').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const action = btn.dataset.action;
    const prompts = {
      draw: 'draw a card for me',
      reading: 'give me a three card reading',
      vision: 'show me a vision',
      who: 'who are you',
      pantheon: 'tell me about the pantheon',
    };
    if (prompts[action]) send(prompts[action]);
  });

  // Init
  function init() {
    inputEl.focus();
    addMessage('apollo', 'I am <strong>Apollo</strong>, god of light and keeper of the Major Arcana. I can <strong>draw cards</strong>, give <strong>readings</strong>, grant <strong>visions</strong>, and speak of the <strong>pantheon</strong>. Ask, seeker. The light is listening. ☀️');
  }
  init();
</script>
</body>
</html>
