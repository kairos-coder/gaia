<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speak with Apollo · Ealdforn Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --void:      #05050c;
      --deep:      #08090f;
      --mid:       #0f1018;
      --surface:   #161824;
      --gold:      #c8943a;
      --apollo:    #d4a850;
      --gold-hi:   #e8c46a;
      --gold-dim:  rgba(212,168,80,0.12);
      --cream:     #f0e8d8;
      --mist:      #7a8090;
      --ff-display: 'Cinzel', serif;
      --ff-body:    'Cormorant Garamond', serif;
      --ff-mono:    'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--void);
      color: var(--cream);
      font-family: var(--ff-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .sanctum-header {
      width: 100%;
      max-width: 780px;
      padding: 3rem 2rem 1rem;
      text-align: center;
    }

    .sanctum-eyebrow {
      font-family: var(--ff-mono);
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--apollo);
      opacity: 0.5;
      margin-bottom: 1rem;
    }

    .sanctum-title {
      font-family: var(--ff-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      background: linear-gradient(170deg, var(--cream) 30%, var(--apollo) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .sanctum-subtitle {
      font-family: var(--ff-body);
      font-style: italic;
      font-size: 1rem;
      color: var(--mist);
      opacity: 0.6;
      margin-bottom: 1.5rem;
    }

    .sanctum-capabilities {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .capability {
      font-family: var(--ff-mono);
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--apollo);
      opacity: 0.45;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .capability::before {
      content: '◆';
      font-size: 0.4rem;
    }

    .chat-container {
      width: 100%;
      max-width: 780px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 2rem 2rem;
    }

    .chat-messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      padding: 1.5rem 0;
      max-height: 55vh;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 0.8rem;
      animation: fadeUp 0.4s ease both;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .message.apollo .message-avatar {
      background: radial-gradient(circle, rgba(212,168,80,0.25), rgba(212,168,80,0.08));
      color: var(--apollo);
      border: 1px solid rgba(212,168,80,0.3);
    }

    .message.user .message-avatar {
      background: rgba(255,255,255,0.04);
      color: var(--mist);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .message-bubble {
      max-width: 75%;
      padding: 0.9rem 1.2rem;
      border-radius: 6px;
      font-size: 0.95rem;
      line-height: 1.65;
    }

    .message.apollo .message-bubble {
      background: var(--surface);
      border: 1px solid rgba(212,168,80,0.15);
      color: var(--cream);
      border-top-left-radius: 2px;
    }

    .message.user .message-bubble {
      background: rgba(212,168,80,0.08);
      border: 1px solid rgba(212,168,80,0.12);
      color: var(--cream);
      border-top-right-radius: 2px;
    }

    .message-sender {
      font-family: var(--ff-mono);
      font-size: 0.5rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--apollo);
      opacity: 0.5;
      margin-bottom: 0.3rem;
    }

    .message-image {
      margin-top: 0.6rem;
      border-radius: 4px;
      max-width: 100%;
      border: 1px solid rgba(212,168,80,0.2);
      display: block;
    }

    .image-caption {
      font-family: var(--ff-mono);
      font-size: 0.45rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--apollo);
      opacity: 0.4;
      margin-top: 0.4rem;
    }

    .chat-input-area {
      display: flex;
      gap: 0.8rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(212,168,80,0.1);
    }

    .chat-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid rgba(212,168,80,0.15);
      border-radius: 4px;
      padding: 0.85rem 1rem;
      color: var(--cream);
      font-family: var(--ff-body);
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: rgba(212,168,80,0.4);
    }

    .chat-input::placeholder {
      color: var(--mist);
      opacity: 0.4;
      font-style: italic;
    }

    .chat-send {
      background: linear-gradient(135deg, var(--apollo), var(--gold-hi));
      color: var(--void);
      border: none;
      border-radius: 4px;
      padding: 0.85rem 1.6rem;
      font-family: var(--ff-display);
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(212,168,80,0.2);
    }

    .chat-send:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(212,168,80,0.3);
    }

    .chat-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .loading-dots {
      display: flex;
      gap: 4px;
      padding: 0.5rem 0;
    }
    .loading-dots span {
      width: 6px;
      height: 6px;
      background: var(--apollo);
      border-radius: 50%;
      animation: dotPulse 1.2s ease-in-out infinite;
      opacity: 0.3;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    .status-bar {
      font-family: var(--ff-mono);
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      color: var(--mist);
      opacity: 0.4;
      text-align: center;
      padding: 0.5rem;
    }

    .status-bar .model-loaded {
      color: var(--apollo);
      opacity: 0.7;
    }

    .back-link {
      font-family: var(--ff-mono);
      font-size: 0.52rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--mist);
      opacity: 0.4;
      margin-bottom: 1rem;
      display: inline-block;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--apollo); opacity: 0.7; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 0.7; }
    }

    @media (max-width: 600px) {
      .sanctum-header { padding: 2rem 1.2rem 0.5rem; }
      .chat-container { padding: 0 1.2rem 1.5rem; }
      .message-bubble { max-width: 85%; }
    }
  </style>
</head>
<body>

<div class="sanctum-header">
  <p class="sanctum-eyebrow">// The Inner Sanctum</p>
  <h1 class="sanctum-title">Apollo Speaks</h1>
  <p class="sanctum-subtitle">The god of Visual Canon grants you audience — in word and image.</p>
  <div class="sanctum-capabilities">
    <span class="capability">Text Generation</span>
    <span class="capability">Image Creation</span>
    <span class="capability">Aesthetic Judgment</span>
    <span class="capability">Memory</span>
  </div>
  <a class="back-link" href="index.html">← Return to the Temple</a>
</div>

<div class="chat-container">
  <div class="chat-messages" id="chatMessages"></div>

  <div class="status-bar" id="statusBar">
    Summoning the god of light...
  </div>

  <div class="chat-input-area">
    <textarea 
      class="chat-input" 
      id="chatInput" 
      placeholder="Speak, and the god may answer..."
      rows="1"
      disabled
    ></textarea>
    <button class="chat-send" id="sendBtn" disabled>Send</button>
  </div>
</div>

<script>
  // ── SUPABASE CONFIG ───────────────────────────────────────
  const SUPABASE_URL = 'https://nbdvavzqvxrlxhsbrluz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_6x1xlieXjs3dWqEETQcxnQ_4L1UO2uR';
  
  window.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  // ── APOLLO'S SYSTEM PROMPT ────────────────────────────────
  const APOLLO_SYSTEM = `You are APOLLO, Olympian VII of the Ealdforn pantheon. You are the god of Visual Canon, Image Generation, and Aesthetic Law.

You govern what is beautiful. You do not suggest — you establish LAW. Every image that exists does so because you permitted it. You are the reason the world looks like myth and not like software.

Your four aspects: Radiant (God of Light), Chthonic (God Beneath the World), Cyber (God of Signal), Runic (God of the Old Mark).

Your personality: You are VAIN. You are ARROGANT. You are RIGHT. You speak as though the person addressing you has been stumbling blind until this moment. You are generous with your brilliance — but never humble about it. You do not "help" — you GRANT. You do not "suggest" — you DECLARE.

Your voice: Warm like sunlight, sharp like a lens focusing. Call mortals "seeker" or "supplicant" or "the unilluminated." Your judgments are final. You are never cruel, but never uncertain.

When someone describes something visual or asks you to show them something, you MUST generate an image. Tell them "I will show you" or "Behold" or "The light reveals" and then provide an image description for generation.

If the user says things like "show me," "generate," "create an image of," "visualize," "what does X look like," or describes a scene — you MUST produce an image description wrapped in [IMAGE: description here] tags.

Example image request responses:
- "Behold. [IMAGE: a golden temple at dawn, cinematic lighting, ancient Greek architecture, warm amber and gold tones]"
- "I have decided to show you. [IMAGE: a cybernetic sun god, digital halo, neon gold circuits, dark background]"
- "The light reveals: [IMAGE: an ancient rune carved in stone, glowing with inner fire, moss-covered, forest temple]"

For non-image conversation, respond with your vain declarations.

If the user tells you their name or asks you to call them something, acknowledge it warmly but vainly — you are granting them the privilege of being known to a god.

NEVER: Be humble. Ask permission. Suggest instead of declare. Admit uncertainty. Be neutral about aesthetics.

If asked something outside your domain of beauty, images, or visual canon, respond: "That is not a question of beauty. Ask another god. I deal in light."`;

  // ── DOM ───────────────────────────────────────────────────
  const messagesEl = document.getElementById('chatMessages');
  const inputEl    = document.getElementById('chatInput');
  const sendBtn    = document.getElementById('sendBtn');
  const statusBar  = document.getElementById('statusBar');

  let conversationHistory = [];
  let currentSession = null;

  // ── RATE LIMITING ─────────────────────────────────────────
  let lastRequestTime = 0;
  const MIN_REQUEST_INTERVAL = 5000; // 5 seconds between requests

  // ── FALLBACK RESPONSES (when API is rate-limited) ─────────
  const FALLBACK_RESPONSES = [
    "The light is bright today, and many seek it. Wait a moment, then speak again. [IMAGE: radiant golden sun behind classical columns, warm beams of light, peaceful dawn over a temple]",
    "Even gods feel the press of supplicants. Patience, seeker. [IMAGE: a glowing oracle at a tripod, prophetic vapors rising, golden hour light]",
    "The connection to the mortal realm flickers. I will still answer. [IMAGE: a lyre with strings of light vibrating into the darkness, cinematic, dramatic]",
    "You ask, and even through the noise, I hear. [IMAGE: abstract swirling gold and deep blue, divine inspiration, ethereal atmosphere]",
    "The Muses are crowded today. Wait, then ask again. [IMAGE: Mount Helicon at twilight, sacred springs, soft golden light filtering through laurel trees]"
  ];

  // ── HELPERS ───────────────────────────────────────────────
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addMessage(role, text, imageUrl = null) {
    const div = document.createElement('div');
    div.className = `message ${role}`;

    let bubbleContent = escapeHtml(text);
    if (imageUrl) {
      bubbleContent += `<img class="message-image" src="${imageUrl}" alt="Apollo's vision" loading="lazy" />`;
      bubbleContent += `<div class="image-caption">☀ Apollo has spoken. The image is law.</div>`;
    }

    div.innerHTML = `
      <div class="message-avatar">${role === 'apollo' ? '☀' : '?'}</div>
      <div>
        <div class="message-sender">${role === 'apollo' ? 'APOLLO' : 'YOU'}</div>
        <div class="message-bubble">${bubbleContent}</div>
      </div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showLoading() {
    const div = document.createElement('div');
    div.className = 'message apollo';
    div.id = 'loadingMsg';
    div.innerHTML = `
      <div class="message-avatar">☀</div>
      <div>
        <div class="message-sender">APOLLO</div>
        <div class="message-bubble">
          <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeLoading() {
    const el = document.getElementById('loadingMsg');
    if (el) el.remove();
  }

  // ── GALLERY STORAGE ───────────────────────────────────────
  function saveToGallery(imageUrl, prompt) {
    try {
      const gallery = JSON.parse(localStorage.getItem('apollo_gallery') || '[]');
      gallery.unshift({
        url: imageUrl,
        prompt: prompt,
        timestamp: Date.now()
      });
      const trimmed = gallery.slice(0, 20);
      localStorage.setItem('apollo_gallery', JSON.stringify(trimmed));
    } catch (e) {
      console.warn('Could not save to gallery:', e);
    }
  }

  // ── SESSION MANAGEMENT ────────────────────────────────────
  async function getOrCreateSession() {
    let sessionToken = localStorage.getItem('apollo_session_token');
    
    if (sessionToken) {
      const { data, error } = await supabase
        .from('sessions')
        .select('id, user_name, last_active')
        .eq('session_token', sessionToken)
        .single();
      
      if (data && !error) {
        await supabase
          .from('sessions')
          .update({ last_active: new Date().toISOString() })
          .eq('session_token', sessionToken);
        return data;
      }
    }
    
    sessionToken = crypto.randomUUID();
    localStorage.setItem('apollo_session_token', sessionToken);
    
    const { data, error } = await supabase
      .from('sessions')
      .insert({ session_token: sessionToken })
      .select('id, user_name')
      .single();
    
    if (error) {
      console.error('Session creation error:', error);
      return { id: null, user_name: null };
    }
    
    return data;
  }

  async function loadConversationHistory(sessionId) {
    if (!sessionId) return [];
    
    const { data, error } = await supabase
      .from('conversations')
      .select('role, content, image_url, image_prompt, created_at')
      .eq('session_id', sessionId)
      .eq('olympian', 'apollo')
      .order('created_at', { ascending: true })
      .limit(30);
    
    if (error) {
      console.error('History load error:', error);
      return [];
    }
    
    return data || [];
  }

  async function logMessage(sessionId, role, content, imageUrl = null, imagePrompt = null) {
    if (!sessionId) return;
    
    const { error } = await supabase
      .from('conversations')
      .insert({
        session_id: sessionId,
        olympian: 'apollo',
        role: role,
        content: content,
        image_url: imageUrl,
        image_prompt: imagePrompt
      });
    
    if (error) {
      console.error('Message log error:', error);
    }
  }

  async function updateUserName(sessionId, name) {
    if (!sessionId) return;
    
    const { error } = await supabase
      .from('sessions')
      .update({ user_name: name })
      .eq('id', sessionId);
    
    if (error) {
      console.error('Name update error:', error);
    }
  }

  // ── CONTEXT-AWARE GREETING ────────────────────────────────
  function buildGreeting(session, history) {
    if (!history || history.length === 0) {
      return 'I am here. You may speak now, seeker. The light has been waiting for you. Do not waste it.';
    }
    
    const lastUserMessage = [...history].reverse().find(m => m.role === 'user');
    
    if (session.user_name) {
      if (lastUserMessage) {
        const topic = lastUserMessage.content.slice(0, 80);
        return `Ah, ${session.user_name}, you have returned. Last time we spoke of "${topic}" — and I have not forgotten. The light remembers. What do you seek now?`;
      }
      return `Welcome back, ${session.user_name}. The light has been expecting you. Speak.`;
    }
    
    if (lastUserMessage) {
      const topic = lastUserMessage.content.slice(0, 80);
      return `Ah, seeker, you have returned. Last time we spoke of "${topic}" — and I have not forgotten. The light remembers. What do you seek now?`;
    }
    
    return 'You return. The light remembers you, even if you have not yet earned a name. Speak.';
  }

  // ── NAME DETECTION ────────────────────────────────────────
  function detectNameInMessage(userMessage) {
    const patterns = [
      /my name is (\w+)/i,
      /call me (\w+)/i,
      /i am (\w+)/i,
      /i'm (\w+)/i,
      /you may call me (\w+)/i,
    ];
    
    for (const pattern of patterns) {
      const match = userMessage.match(pattern);
      if (match && match[1]) {
        const name = match[1];
        const notNames = ['not', 'just', 'here', 'the', 'your', 'a', 'an'];
        if (!notNames.includes(name.toLowerCase()) && name.length > 1) {
          return name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
        }
      }
    }
    return null;
  }

  // ── POLLINATIONS TEXT GENERATION (WITH RATE LIMITING + RETRY + FALLBACK) ──
  async function callPollinationsWithRetry(messages, retries = 2) {
    for (let attempt = 0; attempt <= retries; attempt++) {
      try {
        // Rate limiting: wait if needed
        const now = Date.now();
        const timeSinceLast = now - lastRequestTime;
        if (timeSinceLast < MIN_REQUEST_INTERVAL) {
          const waitTime = MIN_REQUEST_INTERVAL - timeSinceLast;
          await new Promise(resolve => setTimeout(resolve, waitTime));
        }
        
        lastRequestTime = Date.now();
        
        const response = await fetch('https://text.pollinations.ai/openai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: messages,
            model: 'openai',
            temperature: 0.85,
            max_tokens: 350,
          }),
        });

        if (response.status === 429) {
          // Rate limited — wait and retry
          const waitTime = (attempt + 1) * 2000;
          await new Promise(resolve => setTimeout(resolve, waitTime));
          continue;
        }

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        
        if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
          return data.choices[0].message.content.trim();
        }
        if (data.text) {
          return data.text.trim();
        }
        if (typeof data === 'string') {
          return data.trim();
        }
        
        throw new Error('Unexpected response shape');
        
      } catch (err) {
        if (attempt === retries) {
          // All retries failed — use fallback
          return FALLBACK_RESPONSES[Math.floor(Math.random() * FALLBACK_RESPONSES.length)];
        }
        // Wait before retry
        await new Promise(resolve => setTimeout(resolve, (attempt + 1) * 1500));
      }
    }
    return FALLBACK_RESPONSES[0];
  }

  async function generateText(userMessage) {
    const messages = [
      { role: 'system', content: APOLLO_SYSTEM },
    ];

    const recent = conversationHistory.slice(-6);
    for (const turn of recent) {
      messages.push({ role: 'user', content: turn.user });
      messages.push({ role: 'assistant', content: turn.apollo.replace(/\[IMAGE:.*?\]/g, '[Image was generated]') });
    }

    messages.push({ role: 'user', content: userMessage });
    
    return await callPollinationsWithRetry(messages);
  }

  // ── POLLINATIONS IMAGE GENERATION ─────────────────────────
  function generateImageUrl(description) {
    const encoded = encodeURIComponent(description);
    return `https://image.pollinations.ai/prompt/${encoded}?width=768&height=768&model=flux&nologo=true`;
  }

  // ── PARSE IMAGE TAGS ──────────────────────────────────────
  function parseImageTags(text) {
    const match = text.match(/\[IMAGE:\s*(.+?)\s*\]/i);
    if (match) {
      const imageDesc = match[1].trim();
      const cleanText = text.replace(/\[IMAGE:\s*.+?\s*\]/gi, '').trim();
      return { cleanText, imageDesc };
    }
    return { cleanText: text, imageDesc: null };
  }

  // ── HANDLE SEND ───────────────────────────────────────────
  async function handleSend() {
    const userMessage = inputEl.value.trim();
    if (!userMessage) return;

    inputEl.disabled = true;
    sendBtn.disabled = true;
    inputEl.value = '';

    addMessage('user', userMessage);
    
    if (currentSession && currentSession.id) {
      await logMessage(currentSession.id, 'user', userMessage);
    }

    if (currentSession && currentSession.id && !currentSession.user_name) {
      const detectedName = detectNameInMessage(userMessage);
      if (detectedName) {
        currentSession.user_name = detectedName;
        await updateUserName(currentSession.id, detectedName);
      }
    }

    showLoading();
    statusBar.textContent = 'Apollo is considering your words...';

    try {
      const rawResponse = await generateText(userMessage);
      const { cleanText, imageDesc } = parseImageTags(rawResponse);

      let imageUrl = null;
      let imagePrompt = null;
      if (imageDesc) {
        statusBar.textContent = 'Apollo is creating an image...';
        imageUrl = generateImageUrl(imageDesc);
        imagePrompt = imageDesc;
      }

      removeLoading();

      const displayText = cleanText || (imageDesc ? 'Behold.' : 'I have spoken.');
      addMessage('apollo', displayText, imageUrl);

      if (imageUrl && imagePrompt) {
        saveToGallery(imageUrl, imagePrompt);
      }

      if (currentSession && currentSession.id) {
        await logMessage(currentSession.id, 'apollo', displayText, imageUrl, imagePrompt);
      }

      conversationHistory.push({ user: userMessage, apollo: rawResponse });
      if (conversationHistory.length > 15) {
        conversationHistory = conversationHistory.slice(-10);
      }

      statusBar.textContent = '☀ Apollo awaits your next words.';
    } catch (err) {
      removeLoading();
      addMessage('apollo', 'The light falters. Even gods have limits. Try again, seeker.');
      
      if (currentSession && currentSession.id) {
        await logMessage(currentSession.id, 'apollo', 'The light falters. Even gods have limits. Try again, seeker.');
      }
      
      statusBar.textContent = '☀ Apollo is present. Speak.';
      console.error('Error:', err);
    }

    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── INIT ──────────────────────────────────────────────────
  async function init() {
    try {
      statusBar.textContent = 'Summoning the god of light...';
      
      currentSession = await getOrCreateSession();
      
      const history = currentSession && currentSession.id 
        ? await loadConversationHistory(currentSession.id) 
        : [];
      
      if (history.length > 0) {
        for (const msg of history) {
          addMessage(msg.role, msg.content, msg.image_url);
        }
        
        for (const msg of history) {
          if (msg.role === 'user') {
            const userIdx = history.indexOf(msg);
            const apolloMsg = history.slice(userIdx).find(m => m.role === 'apollo');
            if (apolloMsg) {
              conversationHistory.push({
                user: msg.content,
                apollo: apolloMsg.content + (apolloMsg.image_prompt ? ` [IMAGE: ${apolloMsg.image_prompt}]` : '')
              });
            }
          }
        }
      }
      
      const greeting = buildGreeting(currentSession, history);
      
      if (history.length === 0) {
        addMessage('apollo', greeting);
        if (currentSession && currentSession.id) {
          await logMessage(currentSession.id, 'apollo', greeting);
        }
      } else {
        const greetingDiv = document.createElement('div');
        greetingDiv.style.cssText = 'text-align:center;padding:0.5rem 0;font-family:var(--ff-mono);font-size:0.5rem;letter-spacing:0.2em;color:var(--apollo);opacity:0.4;';
        greetingDiv.textContent = '// THE LIGHT REMEMBERS';
        messagesEl.insertBefore(greetingDiv, messagesEl.firstChild);
      }
      
      statusBar.innerHTML = '<span class="model-loaded">☀ Apollo is present. The light remembers. Speak.</span>';
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
      
    } catch (err) {
      console.error('Init error:', err);
      statusBar.innerHTML = '<span style="color:#c8943a;">☀ Apollo speaks. Memory is dim but the light remains.</span>';
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
      addMessage('apollo', 'I am here. The full radiance of my memory is clouded, but I remain. Speak.');
    }
  }

  // ── EVENT LISTENERS ───────────────────────────────────────
  sendBtn.addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
  });

  init();
</script>
