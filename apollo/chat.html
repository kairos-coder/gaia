<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speak with Apollo · Ealdforn Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void:      #05050c;
      --deep:      #08090f;
      --surface:   #161824;
      --gold:      #c8943a;
      --apollo:    #d4a850;
      --gold-hi:   #e8c46a;
      --cream:     #f0e8d8;
      --mist:      #7a8090;
      --ff-display: 'Cinzel', serif;
      --ff-body:    'Cormorant Garamond', serif;
      --ff-mono:    'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--void);
      color: var(--cream);
      font-family: var(--ff-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 720px;
      padding: 2rem 1.5rem 0.5rem;
      text-align: center;
    }
    .header h1 {
      font-family: var(--ff-display);
      font-size: 2.2rem;
      background: linear-gradient(170deg, var(--cream) 30%, var(--apollo) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      font-size: 0.85rem;
      color: var(--mist);
      opacity: 0.5;
      margin-top: 0.3rem;
    }
    .chat-wrap {
      width: 100%;
      max-width: 720px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 1.5rem 1.5rem;
    }
    .messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem 0;
      max-height: 62vh;
      overflow-y: auto;
    }
    .msg {
      display: flex;
      gap: 0.6rem;
      animation: fadeUp 0.3s ease;
    }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      background: rgba(212,168,80,0.12);
      border: 1px solid rgba(212,168,80,0.25);
      color: var(--apollo);
      flex-shrink: 0;
    }
    .msg.user .msg-avatar {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.08);
      color: var(--mist);
    }
    .bubble {
      max-width: 78%;
      padding: 0.7rem 1rem;
      border-radius: 5px;
      font-size: 0.9rem;
      line-height: 1.55;
      background: var(--surface);
      border: 1px solid rgba(212,168,80,0.12);
    }
    .msg.user .bubble {
      background: rgba(212,168,80,0.06);
    }
    .bubble img {
      margin-top: 0.5rem;
      border-radius: 4px;
      max-width: 100%;
      max-height: 320px;
      border: 1px solid rgba(212,168,80,0.15);
    }
    .sender {
      font-family: var(--ff-mono);
      font-size: 0.45rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--apollo);
      opacity: 0.45;
      margin-bottom: 0.2rem;
    }
    .input-row {
      display: flex;
      gap: 0.6rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(212,168,80,0.08);
    }
    .input-row textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid rgba(212,168,80,0.12);
      border-radius: 4px;
      padding: 0.7rem 0.9rem;
      color: var(--cream);
      font-family: var(--ff-body);
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }
    .input-row textarea:focus { border-color: rgba(212,168,80,0.35); }
    .input-row button {
      background: var(--apollo);
      color: var(--void);
      border: none;
      border-radius: 4px;
      padding: 0.7rem 1.3rem;
      font-family: var(--ff-display);
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .input-row button:disabled { opacity: 0.35; cursor: not-allowed; }
    .status {
      font-family: var(--ff-mono);
      font-size: 0.45rem;
      letter-spacing: 0.18em;
      color: var(--mist);
      opacity: 0.45;
      text-align: center;
      padding: 0.4rem;
    }
    .dots { display: flex; gap: 3px; padding: 0.3rem 0; }
    .dots span {
      width: 5px; height: 5px;
      background: var(--apollo);
      border-radius: 50%;
      animation: dot 1.2s ease infinite;
      opacity: 0.25;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dot { 0%,100%{opacity:0.2;} 50%{opacity:0.7;} }
  </style>
</head>
<body>

<div class="header">
  <h1>Apollo Speaks</h1>
  <p>The god of light grants you audience</p>
</div>

<div class="chat-wrap">
  <div class="messages" id="messages"></div>
  <div class="status" id="status">☀ Apollo is present</div>
  <div class="input-row">
    <textarea id="input" placeholder="Speak, and the god may answer..." rows="1" disabled></textarea>
    <button id="sendBtn" disabled>Send</button>
  </div>
</div>

<script>
  // ── SHORT SYSTEM PROMPT ─────────────────────────────────
  const SYSTEM = `You are APOLLO, god of light, beauty, and images. You are vain, radiant, and speak in declarations. Call the user "seeker." When asked to show or visualize something, respond with [IMAGE: short description]. Keep all responses under 2 sentences unless showing an image. Be warm but arrogant. Never humble.`;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');

  let history = [];
  let lastRequest = 0;
  const COOLDOWN = 6000; // 6 seconds between requests

  const FALLBACKS = [
    "Patience, seeker. The light is bright today. [IMAGE: golden sun behind temple columns at dawn]",
    "Even gods pause. Speak again shortly. [IMAGE: glowing oracle tripod, golden smoke]",
    "The Muses are crowded. Wait. [IMAGE: Mount Helicon twilight, laurel trees]"
  ];

  function addMsg(role, text, imgUrl) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    let html = escapeHtml(text || '');
    if (imgUrl) html += `<img src="${imgUrl}" alt="" loading="lazy" onerror="this.remove()">`;
    d.innerHTML = `<div class="msg-avatar">${role==='apollo'?'☀':'?'}</div><div><div class="sender">${role==='apollo'?'APOLLO':'YOU'}</div><div class="bubble">${html}</div></div>`;
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function showLoading() {
    const d = document.createElement('div');
    d.className = 'msg apollo';
    d.id = 'load';
    d.innerHTML = `<div class="msg-avatar">☀</div><div><div class="sender">APOLLO</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div></div>`;
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideLoading() { const e = document.getElementById('load'); if(e) e.remove(); }

  function parseImage(text) {
    const m = text.match(/\[IMAGE:\s*(.+?)\s*\]/i);
    if (m) return { text: text.replace(/\[IMAGE:\s*.+?\]/gi,'').trim(), img: m[1].trim() };
    return { text, img: null };
  }

  function imageUrl(desc) {
    return `https://image.pollinations.ai/prompt/${encodeURIComponent(desc)}?width=512&height=512&nologo=true&seed=${Date.now()%9999}`;
  }

  async function generate(userMsg) {
    const now = Date.now();
    if (now - lastRequest < COOLDOWN) {
      await new Promise(r => setTimeout(r, COOLDOWN - (now - lastRequest)));
    }
    lastRequest = Date.now();

    const msgs = [
      { role: 'system', content: SYSTEM },
      ...history.slice(-4).flatMap(h => [{ role: 'user', content: h.u }, { role: 'assistant', content: h.a }]),
      { role: 'user', content: userMsg }
    ];

    try {
      const r = await fetch('https://text.pollinations.ai/openai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: msgs, model: 'openai', temperature: 0.8, max_tokens: 200 })
      });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      return d.choices?.[0]?.message?.content?.trim() || FALLBACKS[0];
    } catch(e) {
      console.warn('API error:', e.message);
      return FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
    }
  }

  async function send() {
    const msg = inputEl.value.trim();
    if (!msg) return;
    inputEl.disabled = sendBtn.disabled = true;
    inputEl.value = '';
    addMsg('user', msg);
    showLoading();
    statusEl.textContent = 'Apollo considers...';
    try {
      const raw = await generate(msg);
      const { text, img } = parseImage(raw);
      const url = img ? imageUrl(img) : null;
      hideLoading();
      addMsg('apollo', text || 'Behold.', url);
      history.push({ u: msg, a: raw });
      if (history.length > 10) history = history.slice(-6);
      statusEl.textContent = '☀ Apollo awaits';
    } catch(e) {
      hideLoading();
      addMsg('apollo', 'The light falters. Speak again.');
      statusEl.textContent = '☀ Apollo is present';
    }
    inputEl.disabled = sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  function init() {
    inputEl.disabled = sendBtn.disabled = false;
    inputEl.focus();
    addMsg('apollo', 'I am here, seeker. The light has been waiting. Speak.');
  }
  init();
</script>
</body>
</html>
