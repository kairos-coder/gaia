<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOLLO · The Living Tarot Table</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Fira+Code:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        /* ══════════════════════════════════════════
           TOKENS
        ══════════════════════════════════════════ */
        :root {
            --black:      #07080f;
            --deep:       #0d0f18;
            --surface:    #141820;
            --surface-2:  #1a1f2e;
            --surface-3:  #1f2538;
            --border:     rgba(201,168,76,0.14);
            --border-hi:  rgba(201,168,76,0.35);

            --gold:       #c9a84c;
            --gold-hi:    #f0d080;
            --gold-dim:   rgba(201,168,76,0.35);
            --sun:        #ffcc44;

            --text:       #c8c8c8;
            --text-dim:   rgba(200,190,170,0.45);
            --text-faint: rgba(200,190,170,0.2);

            --fire:   #ff5533;
            --water:  #3399dd;
            --earth:  #779944;
            --air:    #aa88ee;
            --void:   #7755aa;

            --fire-dim:  rgba(255,85,51,0.18);
            --water-dim: rgba(51,153,221,0.18);
            --earth-dim: rgba(119,153,68,0.18);
            --air-dim:   rgba(170,136,238,0.18);
            --void-dim:  rgba(119,85,170,0.18);

            --phi: 1.618;
            --radius: 5px;
            --radius-lg: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--black);
            color: var(--text);
            font-family: 'Fira Code', monospace;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ══════════════════════════════════════════
           PULSE RING — The signature element.
           An SVG ring around the left panel that
           throbs with the dominant element's color.
        ══════════════════════════════════════════ */
        #pulseRing {
            position: fixed;
            top: 0; left: 0;
            width: 380px; height: 100vh;
            pointer-events: none;
            z-index: 50;
            transition: stroke 2.5s ease, opacity 1.5s ease;
        }
        #pulseRing rect {
            fill: none;
            stroke: var(--gold);
            stroke-width: 1.5;
            opacity: 0.18;
            rx: 0;
        }
        #pulseRing.pulsing rect {
            animation: ringPulse 1.8s ease-in-out;
        }
        @keyframes ringPulse {
            0%   { opacity: 0.18; stroke-width: 1.5; }
            30%  { opacity: 0.7;  stroke-width: 2.5; }
            100% { opacity: 0.18; stroke-width: 1.5; }
        }
        #pulseRing.fire   rect { stroke: var(--fire); }
        #pulseRing.water  rect { stroke: var(--water); }
        #pulseRing.earth  rect { stroke: var(--earth); }
        #pulseRing.air    rect { stroke: var(--air); }
        #pulseRing.void   rect { stroke: var(--void); }

        /* ══════════════════════════════════════════
           LAYOUT
        ══════════════════════════════════════════ */
        .apollo-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ══════════════════════════════════════════
           LEFT PANEL
        ══════════════════════════════════════════ */
        .card-panel {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .panel-header {
            padding: 0.9rem 1rem 0.7rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 0.7rem;
        }
        .apollo-name {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.05rem;
            color: var(--gold-hi);
            letter-spacing: 0.2em;
            text-shadow: 0 0 24px rgba(201,168,76,0.4);
            flex-shrink: 0;
        }
        .sky-whisper {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.03em;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: color 2s ease;
        }

        /* Stats */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            border-bottom: 1px solid var(--border);
        }
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.45rem 0.2rem;
            gap: 0.18rem;
            border-right: 1px solid var(--border);
        }
        .stat:last-child { border-right: none; }
        .stat-label {
            font-size: 0.42rem;
            letter-spacing: 0.25em;
            color: var(--text-faint);
            text-transform: uppercase;
        }
        .stat-value {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.95rem;
            color: var(--gold-hi);
            line-height: 1;
        }
        .stat-value.phi-color { color: #ff9944; text-shadow: 0 0 8px rgba(255,153,68,0.4); }
        .stat-value.notes-color { color: var(--air); }
        .stat-value.mana-full  { color: var(--sun); }

        /* Dominance bar — taller, labeled */
        .dominance-section {
            border-bottom: 1px solid var(--border);
            padding: 0.35rem 0.7rem;
        }
        .dominance-track {
            display: flex;
            gap: 3px;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.28rem;
        }
        .dom-segment {
            flex: 1;
            height: 100%;
            background: rgba(255,255,255,0.04);
            transition: flex 1.2s cubic-bezier(0.4,0,0.2,1), background 1.2s ease;
            border-radius: 2px;
        }
        .dom-segment.fire  { background: var(--fire);  box-shadow: 0 0 8px rgba(255,85,51,0.5); }
        .dom-segment.water { background: var(--water); box-shadow: 0 0 8px rgba(51,153,221,0.5); }
        .dom-segment.earth { background: var(--earth); box-shadow: 0 0 8px rgba(119,153,68,0.5); }
        .dom-segment.air   { background: var(--air);   box-shadow: 0 0 8px rgba(170,136,238,0.5); }
        .dom-segment.void  { background: var(--void);  box-shadow: 0 0 8px rgba(119,85,170,0.5); }
        .dominance-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.38rem;
            letter-spacing: 0.18em;
            color: var(--text-faint);
            text-transform: uppercase;
        }
        .dom-label { transition: color 0.8s ease; }
        .dom-label.active.fire  { color: var(--fire); }
        .dom-label.active.water { color: var(--water); }
        .dom-label.active.earth { color: var(--earth); }
        .dom-label.active.air   { color: var(--air); }
        .dom-label.active.void  { color: var(--void); }

        /* Hand */
        .hand-section {
            border-bottom: 1px solid var(--border);
            padding: 0.4rem 0.7rem;
        }
        .section-eyebrow {
            font-size: 0.38rem;
            letter-spacing: 0.3em;
            color: var(--gold-dim);
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }
        .hand-cards {
            display: flex;
            flex-direction: column;
            gap: 0.12rem;
            max-height: 120px;
            overflow-y: auto;
        }
        .mini-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.22rem 0.4rem;
            font-size: 0.48rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: border-color 0.3s, background 0.3s;
        }
        .mini-card.playable {
            border-color: rgba(240,208,128,0.28);
            background: rgba(201,168,76,0.05);
        }
        .mini-card .card-emoji { font-size: 0.85rem; width: 18px; text-align: center; flex-shrink: 0; }
        .mini-card .card-god {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.48rem;
            color: var(--gold-hi);
            flex: 1;
        }
        .mini-card .card-el {
            font-size: 0.38rem;
            letter-spacing: 0.1em;
            opacity: 0.5;
        }
        .mini-card .card-el.fire  { color: var(--fire); }
        .mini-card .card-el.water { color: var(--water); }
        .mini-card .card-el.earth { color: var(--earth); }
        .mini-card .card-el.air   { color: var(--air); }

        /* Table grid */
        .table-section {
            flex: 1;
            overflow: hidden;
            padding: 0.4rem 0.7rem 0.3rem;
            display: flex;
            flex-direction: column;
        }
        .spread-header {
            display: grid;
            grid-template-columns: 24px repeat(4, 1fr);
            gap: 3px;
            margin-bottom: 0.2rem;
        }
        .spread-col-label {
            text-align: center;
            font-size: 0.33rem;
            letter-spacing: 0.18em;
            color: var(--text-faint);
            text-transform: uppercase;
        }
        .tarot-grid {
            display: grid;
            grid-template-columns: 24px repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            flex: 1;
        }
        .row-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.3rem;
            letter-spacing: 0.18em;
            color: var(--text-faint);
            writing-mode: vertical-rl;
            text-transform: uppercase;
        }
        .grid-cell {
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(201,168,76,0.06);
            border-radius: var(--radius);
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border-color 0.5s, background 0.5s;
            overflow: hidden;
        }
        .grid-cell.occupied {
            border-color: rgba(201,168,76,0.2);
            background: rgba(20,24,36,0.85);
        }
        /* elemental tint on occupied cells */
        .grid-cell.occupied.fire  { background: linear-gradient(160deg, rgba(255,85,51,0.06), var(--surface-2)); border-color: rgba(255,85,51,0.25); }
        .grid-cell.occupied.water { background: linear-gradient(160deg, rgba(51,153,221,0.06), var(--surface-2)); border-color: rgba(51,153,221,0.25); }
        .grid-cell.occupied.earth { background: linear-gradient(160deg, rgba(119,153,68,0.06), var(--surface-2)); border-color: rgba(119,153,68,0.25); }
        .grid-cell.occupied.air   { background: linear-gradient(160deg, rgba(170,136,238,0.06), var(--surface-2)); border-color: rgba(170,136,238,0.25); }

        .cell-card {
            text-align: center;
            padding: 0.25rem 0.15rem;
            animation: cardAppear 0.4s cubic-bezier(0.2, 0, 0, 1);
            width: 100%;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.8) translateY(4px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .cell-emoji  { font-size: 1.2rem; line-height: 1.1; }
        .cell-god    { font-family: 'Cinzel Decorative', serif; font-size: 0.46rem; color: var(--gold-hi); letter-spacing: 0.04em; margin-top: 0.1rem; }
        .cell-arcana { font-size: 0.32rem; color: var(--text-faint); letter-spacing: 0.05em; }
        .cell-tokens { display: flex; gap: 0.08rem; justify-content: center; flex-wrap: wrap; margin-top: 0.08rem; }
        .token-dot   { width: 4px; height: 4px; border-radius: 50%; opacity: 0.75; }
        .token-dot.fire  { background: var(--fire); }
        .token-dot.water { background: var(--water); }
        .token-dot.earth { background: var(--earth); }
        .token-dot.air   { background: var(--air); }
        .token-dot.void  { background: var(--void); }
        .cell-value  { position: absolute; top: 2px; right: 4px; font-size: 0.36rem; color: var(--gold-dim); }
        .cell-turns  { position: absolute; bottom: 2px; right: 4px; font-size: 0.3rem; color: var(--text-faint); }
        /* intent badge on newest card */
        .cell-intent {
            position: absolute; top: 2px; left: 3px;
            font-size: 0.28rem; letter-spacing: 0.08em; padding: 0.1rem 0.25rem;
            border-radius: 2px; text-transform: uppercase; opacity: 0.85;
        }
        .cell-intent.offensive { background: rgba(255,85,51,0.2); color: var(--fire); }
        .cell-intent.harmonic  { background: rgba(170,136,238,0.2); color: var(--air); }
        .cell-intent.defensive { background: rgba(51,153,221,0.2); color: var(--water); }
        .cell-intent.clearing  { background: rgba(119,153,68,0.2); color: var(--earth); }
        .cell-intent.synthesis { background: rgba(119,85,170,0.2); color: var(--void); }

        /* Notes panel */
        .notes-section {
            border-top: 1px solid var(--border);
            padding: 0.4rem 0.7rem;
            max-height: 90px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .note-line {
            display: flex;
            gap: 0.4rem;
            padding: 0.12rem 0;
            border-bottom: 1px solid rgba(201,168,76,0.04);
            font-size: 0.38rem;
            line-height: 1.5;
        }
        .note-key   { color: var(--air); opacity: 0.7; flex-shrink: 0; }
        .note-value { color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-turn  { color: var(--text-faint); flex-shrink: 0; }

        /* Memory panel */
        .memory-section {
            border-top: 1px solid var(--border);
            padding: 0.35rem 0.7rem;
            max-height: 65px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .mem-line { font-size: 0.38rem; padding: 0.08rem 0; color: var(--text-faint); }
        .mem-god  { color: rgba(240,208,128,0.5); }

        /* ══════════════════════════════════════════
           RIGHT PANEL
        ══════════════════════════════════════════ */
        .editor-panel {
            display: flex;
            flex-direction: column;
            background: var(--deep);
        }
        .editor-header {
            padding: 0.45rem 0.8rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .editor-title {
            font-size: 0.44rem;
            letter-spacing: 0.28em;
            color: var(--gold-dim);
            text-transform: uppercase;
            flex: 1;
        }

        /* Controls — primary vs utility */
        .controls-primary {
            display: flex;
            gap: 0.2rem;
        }
        .controls-util {
            display: flex;
            gap: 0.2rem;
            padding-left: 0.5rem;
            border-left: 1px solid var(--border);
        }
        .ctrl-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: 'Fira Code', monospace;
            font-size: 0.44rem;
            letter-spacing: 0.08em;
            padding: 0.3rem 0.55rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .ctrl-btn:hover { background: rgba(201,168,76,0.08); border-color: var(--gold); color: var(--gold-hi); }
        .ctrl-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        /* Primary: play/pause are larger */
        .ctrl-btn.primary {
            font-size: 0.5rem;
            padding: 0.3rem 0.7rem;
            border-color: rgba(201,168,76,0.25);
        }
        .ctrl-btn.primary.active {
            background: rgba(201,168,76,0.15);
            border-color: var(--gold);
            color: var(--gold-hi);
            box-shadow: 0 0 12px rgba(201,168,76,0.15);
        }
        .ctrl-btn.phi-btn { border-color: rgba(255,153,68,0.2); color: rgba(255,153,68,0.5); }
        .ctrl-btn.phi-btn:hover { border-color: #ff9944; color: #ff9944; }
        .ctrl-btn.phi-btn.active { border-color: #ff9944; color: #ff9944; }
        .ctrl-btn.deal-btn { border-color: rgba(68,204,136,0.2); color: rgba(68,204,136,0.5); }
        .ctrl-btn.deal-btn:hover { border-color: #44cc88; color: #44cc88; }

        #monacoContainer { flex: 1; }

        /* ══════════════════════════════════════════
           TOAST
        ══════════════════════════════════════════ */
        #toast {
            position: fixed;
            bottom: 1.2rem;
            left: 190px;
            transform: translateX(-50%);
            background: rgba(7,8,15,0.97);
            border: 1px solid var(--gold);
            color: var(--gold-hi);
            padding: 0.45rem 1.1rem;
            border-radius: var(--radius);
            font-family: 'Fira Code', monospace;
            font-size: 0.52rem;
            letter-spacing: 0.1em;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 340px;
        }
        #toast.show        { opacity: 1; }
        #toast.phi-toast   { border-color: #ff9944; color: #ff9944; }
        #toast.emerge-toast{ border-color: #44cc88; color: #44cc88; }
        #toast.deal-toast  { border-color: #44cc88; color: #88ffaa; }
        #toast.note-toast  { border-color: var(--air); color: var(--air); }

        /* ══════════════════════════════════════════
           SCROLLBAR
        ══════════════════════════════════════════ */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 2px; }

        /* ══════════════════════════════════════════
           REDUCED MOTION
        ══════════════════════════════════════════ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        @media (max-width: 820px) {
            .apollo-layout { grid-template-columns: 1fr; grid-template-rows: 50vh 50vh; }
            #pulseRing { width: 100vw; height: 50vh; }
        }
    </style>
</head>
<body>

<!-- Pulse ring SVG — the signature element -->
<svg id="pulseRing" viewBox="0 0 380 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="378" height="798"/>
</svg>

<div class="apollo-layout">

    <!-- ══ LEFT: Oracle Panel ══ -->
    <div class="card-panel">

        <div class="panel-header">
            <div class="apollo-name" id="apolloTitle">☀ APOLLO</div>
            <div class="sky-whisper" id="skyWhisper">The sky is awakening…</div>
        </div>

        <div class="stats-bar">
            <div class="stat"><span class="stat-label">Turn</span><span class="stat-value" id="statTurn">0</span></div>
            <div class="stat"><span class="stat-label">Mana</span><span class="stat-value" id="statMana">0</span></div>
            <div class="stat"><span class="stat-label">Deck</span><span class="stat-value" id="statDeck">22</span></div>
            <div class="stat"><span class="stat-label">Table</span><span class="stat-value" id="statTable">0</span></div>
            <div class="stat"><span class="stat-label">φ</span><span class="stat-value phi-color" id="statPhi">—</span></div>
            <div class="stat"><span class="stat-label">Notes</span><span class="stat-value notes-color" id="statNotes">0</span></div>
        </div>

        <div class="dominance-section">
            <div class="dominance-track">
                <div class="dom-segment" id="domFire"  title="Fire"></div>
                <div class="dom-segment" id="domWater" title="Water"></div>
                <div class="dom-segment" id="domEarth" title="Earth"></div>
                <div class="dom-segment" id="domAir"   title="Air"></div>
                <div class="dom-segment" id="domVoid"  title="Void"></div>
            </div>
            <div class="dominance-labels">
                <span class="dom-label" id="lblFire">Fire</span>
                <span class="dom-label" id="lblWater">Water</span>
                <span class="dom-label" id="lblEarth">Earth</span>
                <span class="dom-label" id="lblAir">Air</span>
                <span class="dom-label" id="lblVoid">Void</span>
            </div>
        </div>

        <div class="hand-section">
            <div class="section-eyebrow">☀ Apollo's Hand</div>
            <div class="hand-cards" id="handCards"></div>
        </div>

        <div class="table-section">
            <div class="spread-header">
                <div></div>
                <div class="spread-col-label">Self</div>
                <div class="spread-col-label">Other</div>
                <div class="spread-col-label">Above</div>
                <div class="spread-col-label">Below</div>
            </div>
            <div class="tarot-grid" id="tarotGrid"></div>
        </div>

        <!-- Apollo's written notes (localStorage) -->
        <div class="notes-section" id="notesSection">
            <div class="section-eyebrow" style="margin-bottom:0.25rem;">📜 Apollo's Notes</div>
            <div id="notesContent"><span style="color:var(--text-faint);font-size:0.38rem;">No notes written yet.</span></div>
        </div>

        <!-- Short-term memory (last plays) -->
        <div class="memory-section">
            <div class="section-eyebrow" style="margin-bottom:0.2rem;">⚙ Recent Plays</div>
            <div id="memoryContent">Awaiting first play…</div>
        </div>

    </div>

    <!-- ══ RIGHT: Living Record ══ -->
    <div class="editor-panel">
        <div class="editor-header">
            <div class="editor-title">📜 The Living Record</div>
            <div class="controls-primary">
                <button class="ctrl-btn primary active" id="btnPlay">▶ Play</button>
                <button class="ctrl-btn primary"        id="btnPause">⏸ Pause</button>
            </div>
            <div class="controls-util">
                <button class="ctrl-btn phi-btn"  id="btnPhi">φ Tick</button>
                <button class="ctrl-btn deal-btn" id="btnDeal">🃏 Deal</button>
                <button class="ctrl-btn"          id="btnClear">🧹 Clear</button>
                <button class="ctrl-btn"          id="btnReset">⟳ Reset</button>
            </div>
        </div>
        <div id="monacoContainer"></div>
    </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="js/apolloDB.js"></script>
<script src="js/apolloMind.js"></script>
<script src="js/apolloSenses.js"></script>
<script src="js/apolloTools.js"></script>
<script src="js/apolloSeed.js"></script>

<script>
// ══════════════════════════════════════════════
// APOLLO TAROT TABLE
// ══════════════════════════════════════════════

const PHI = 1.618033988749895;
const TAU = Math.PI * 2;
const DRAW_INTERVAL          = Math.round(PHI * 1000);
const GOLDEN_TICK            = Math.round(PHI * PHI * 1000);
const TABLE_CLEAR_THRESHOLD  = Math.round(TAU + PHI);

let apollo    = null;
let editor    = null;
let phiCount  = 0;
let skyState  = null;
let lastIntent = null;   // track last played card's intent for badge

const EMOJI_MAP = {
    'Zeus':'⚡','Hera':'🦚','Poseidon':'🌊','Demeter':'🌾','Athena':'🦉',
    'Apollo':'☀️','Artemis':'🏹','Ares':'⚔️','Aphrodite':'💋','Hephaestus':'🔨',
    'Hermes':'🪄','Hestia':'🔥','Dionysus':'🍇','Hades':'💀','Persephone':'🌱',
    'Melinoe':'👻','Thanatos':'🕯️','The Fates':'🧵','Prometheus':'🔓','Gaia':'🌍',
    'Mortal Man':'🧔','The Three Judges':'⚖️'
};
const SPREAD_ROWS = ['Past', 'Present', 'Future'];

// ── Helpers ─────────────────────────────────
function godName(card)  { return card.god || card.ruling_god || card.name || 'Unknown'; }
function godEmoji(card) { return EMOJI_MAP[godName(card)] || '🃏'; }
function cardQuote(card){
    return card.flavor || card.description ||
           (card.keywords && card.keywords[0]) ||
           (card.upright && card.upright.slice(0, 60)) || '…';
}

// ── Pulse ring ──────────────────────────────
function pulseRing(element) {
    const ring = document.getElementById('pulseRing');
    ring.className = '';
    void ring.offsetWidth; // reflow to restart animation
    ring.className = element + ' pulsing';
    // Settle to just the color after animation
    setTimeout(() => {
        ring.classList.remove('pulsing');
    }, 1900);
}

// ── Sky State ───────────────────────────────
async function loadSkyState() {
    if (typeof Observe !== 'undefined') {
        try {
            skyState = await Observe.getSkyState();
            document.getElementById('skyWhisper').textContent =
                typeof ApolloSkyBridge !== 'undefined'
                    ? ApolloSkyBridge.getSkyWhisper(skyState)
                    : 'The sky is watching.';
        } catch(e) {
            document.getElementById('skyWhisper').textContent = 'The sky is silent.';
        }
    }
}

// ── Deck load ───────────────────────────────
async function loadDeck() {
    let deck = null;
    try {
        const r = await fetch('json/major_arcana.json');
        if (r.ok) deck = await r.json();
    } catch(e) {}
    if (!deck && typeof MAJOR_ARCANA_DECK !== 'undefined') deck = MAJOR_ARCANA_DECK;
    if (!deck) throw new Error('No deck found');

    deck.max_hand_size    = deck.max_hand_size    || 5;
    deck.max_table_cards  = deck.max_table_cards  || 12;
    deck.draw_interval_ms = deck.draw_interval_ms || DRAW_INTERVAL;

    if (typeof MAJOR_ARCANA_DECK !== 'undefined' && MAJOR_ARCANA_DECK.cards) {
        const effectMap = {};
        MAJOR_ARCANA_DECK.cards.forEach(c => { effectMap[c.id] = c.effect; });
        deck.cards = deck.cards.map(card => ({
            ...card,
            effect: card.effect || effectMap[card.id] || 'unknown'
        }));
    }
    return deck;
}

// ── Monaco ──────────────────────────────────
require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' } });
require(['vs/editor/editor.main'], async function() {
    editor = monaco.editor.create(document.getElementById('monacoContainer'), {
        value: '',
        language: 'javascript',
        theme: 'vs-dark',
        fontSize: 11,
        fontFamily: "'Fira Code', 'Courier New', monospace",
        readOnly: true,
        minimap: { enabled: false },
        lineNumbers: 'off',
        scrollBeyondLastLine: false,
        wordWrap: 'on',
        padding: { top: 12, bottom: 12 },
        smoothScrolling: true,
    });
    await initGame();
});

// ── Log ─────────────────────────────────────
function logToEditor(msg) {
    if (!editor) return;
    const ts = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    const model = editor.getModel();
    const atBottom = (() => {
        const scrollTop    = editor.getScrollTop();
        const scrollHeight = editor.getScrollHeight();
        const editorHeight = editor.getDomNode().clientHeight;
        return scrollHeight - scrollTop - editorHeight < 40;
    })();
    model.setValue(model.getValue() + `[${ts}] ${msg}\n`);
    if (atBottom) editor.revealLine(model.getLineCount());
}

function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + type;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = ''; }, 2400);
}

// ── Render notes panel ──────────────────────
function renderNotes() {
    if (!apollo || !apollo.listNotes) return;
    const notes = apollo.listNotes();
    document.getElementById('statNotes').textContent = notes.length;
    const el = document.getElementById('notesContent');
    if (notes.length === 0) {
        el.innerHTML = '<span style="color:var(--text-faint);font-size:0.38rem;">No notes written yet.</span>';
        return;
    }
    el.innerHTML = notes.slice(0, 6).map(n => {
        const short = typeof n.value === 'string'
            ? (n.value.length > 60 ? n.value.slice(0, 57) + '…' : n.value)
            : JSON.stringify(n.value).slice(0, 57);
        return `<div class="note-line">
            <span class="note-key">${n.key}</span>
            <span class="note-value">${short}</span>
            <span class="note-turn">t${n.turn}</span>
        </div>`;
    }).join('');
}

// ── Render grid ─────────────────────────────
function renderGrid() {
    if (!apollo) return;
    const grid = document.getElementById('tarotGrid');
    const allCards = apollo.getAllCardsOnTable();
    // Find the most recently placed card for intent badge
    const newest = allCards.length
        ? allCards.reduce((a, b) => (a.turnsOnTable <= b.turnsOnTable ? a : b), allCards[0])
        : null;

    let html = '';
    for (let row = 0; row < 3; row++) {
        html += `<div class="row-label">${SPREAD_ROWS[row]}</div>`;
        for (let col = 0; col < 4; col++) {
            const card = apollo.table[row][col];
            if (card) {
                const el    = (card.element || 'void').toLowerCase();
                const emoji = godEmoji(card);
                const name  = godName(card);
                const tokens = card.tokens || {};
                const dots = Object.entries(tokens)
                    .filter(([,v]) => v > 0)
                    .map(([el, c]) => `<span class="token-dot ${el}"></span>`.repeat(Math.min(c, 3)))
                    .join('');
                const isNewest = newest && card.row === newest.row && card.col === newest.col;
                const intentBadge = (isNewest && lastIntent && lastIntent !== 'baseline')
                    ? `<div class="cell-intent ${lastIntent}">${lastIntent}</div>`
                    : '';
                html += `<div class="grid-cell occupied ${el}">
                    ${intentBadge}
                    <div class="cell-card">
                        <div class="cell-emoji">${emoji}</div>
                        <div class="cell-god">${name}</div>
                        <div class="cell-arcana">${card.name}</div>
                        ${dots ? `<div class="cell-tokens">${dots}</div>` : ''}
                    </div>
                    <div class="cell-value">${card.value || 0}</div>
                    <div class="cell-turns">${card.turnsOnTable}t</div>
                </div>`;
            } else {
                html += `<div class="grid-cell"></div>`;
            }
        }
    }
    grid.innerHTML = html;
}

// ── Render memory ────────────────────────────
function renderMemory() {
    if (typeof ApolloDB === 'undefined') return;
    const mem = ApolloDB.getShortTermMemory();
    const panel = document.getElementById('memoryContent');
    if (!mem.lastPlays || mem.lastPlays.length === 0) {
        panel.innerHTML = 'Awaiting first play…';
        return;
    }
    panel.innerHTML = mem.lastPlays.slice(-4).map(p => {
        const emoji = EMOJI_MAP[p.god] || '🃏';
        return `<div class="mem-line">${emoji} <span class="mem-god">${p.god}</span> · ${p.name} · ${p.effect}</div>`;
    }).join('');
}

// ── Render dominance ─────────────────────────
function renderDominance(dom) {
    const total = Math.max(1, Object.values(dom).reduce((a, b) => a + b, 0));
    const elements = ['fire','water','earth','air','void'];
    let dominant = elements[0];
    let domMax = 0;

    elements.forEach(el => {
        const count = dom[el] || 0;
        const seg   = document.getElementById('dom' + el.charAt(0).toUpperCase() + el.slice(1));
        const lbl   = document.getElementById('lbl' + el.charAt(0).toUpperCase() + el.slice(1));
        if (seg) {
            seg.style.flex = Math.max(count / total * 100, 0.5);
            seg.className = 'dom-segment' + (count >= 2 ? ' ' + el : '');
        }
        if (lbl) {
            lbl.className = 'dom-label' + (count >= 3 ? ' active ' + el : '');
        }
        if (count > domMax) { domMax = count; dominant = el; }
    });
    return dominant;
}

// ── Render UI ────────────────────────────────
function renderUI() {
    if (!apollo) return;
    const s = apollo.getState();

    document.getElementById('statTurn').textContent  = s.turn;
    document.getElementById('statMana').textContent  = s.mana;
    document.getElementById('statDeck').textContent  = s.deckSize;
    document.getElementById('statTable').textContent = s.tableSize;

    const manaEl = document.getElementById('statMana');
    manaEl.className = 'stat-value' + (s.mana >= (apollo.maxMana || 10) ? ' mana-full' : '');

    const dom = s.elementalDominance || {};
    const dominant = renderDominance(dom);

    // Update pulse ring element tint (no animation unless emergence)
    const ring = document.getElementById('pulseRing');
    if (!ring.classList.contains('pulsing')) {
        ring.className = dominant;
    }

    const handDiv = document.getElementById('handCards');
    if (!s.hand || s.hand.length === 0) {
        handDiv.innerHTML = '<div style="font-size:0.4rem;color:var(--text-faint);text-align:center;padding:0.4rem;">Hand empty — Dealer will provide</div>';
    } else {
        handDiv.innerHTML = s.hand.map(c => {
            const el = (c.element || '').toLowerCase();
            return `<div class="mini-card ${(c.cost || 0) <= s.mana ? 'playable' : ''}">
                <span class="card-emoji">${godEmoji(c)}</span>
                <span class="card-god">${godName(c)}</span>
                <span class="card-el ${el}">${el}</span>
            </div>`;
        }).join('');
    }

    renderGrid();
    renderMemory();
    renderNotes();
}

// ── Golden transforms ────────────────────────
function applyGoldenTransform(mods) {
    const title = document.getElementById('apolloTitle');
    if (title) {
        title.textContent  = mods.titleText;
        title.style.textShadow = mods.titleGlow;
    }
}

// ── Clear table ──────────────────────────────
function clearTable() {
    if (!apollo) return;
    const cards = apollo.getAllCardsOnTable();
    cards.forEach(c => apollo._removeFromGrid(c.row, c.col));
    logToEditor('🧹 Table cleared — ' + cards.length + ' cards sent to graveyard');
    showToast('🧹 Table cleared', 'phi-toast');
    renderUI();
}

// ── Force deal ───────────────────────────────
function forceDeal() {
    if (!apollo) return;
    const dealt = apollo._dealerDeal(7);
    if (dealt && dealt.length > 0) {
        const names = dealt.map(c => godEmoji(c) + ' ' + godName(c)).join(', ');
        logToEditor('🃏 DEALER: ' + dealt.length + ' fresh cards — ' + names);
        showToast('🃏 Dealt ' + dealt.length + ' cards.', 'deal-toast');
        apollo._handStuckTurns = 0;
        apollo._lastHandSize = apollo.hand.length;
        renderUI();
    }
}

// ── Init ─────────────────────────────────────
async function initGame() {
    if (apollo) apollo.stop();
    phiCount  = 0;
    lastIntent = null;

    await loadSkyState();
    const deck = await loadDeck();
    apollo = new ApolloPlayer(deck);

    // ══ ATTACH SENSES + TOOLS — must happen before start() ══
    ApolloSenses.attach(apollo);
    ApolloTools.attach(apollo);

    if (skyState && typeof ApolloSkyBridge !== 'undefined') {
        ApolloSkyBridge.applySkyModifiers(apollo, skyState);
    }

    // Callbacks
    apollo.onDraw = (card, isReveal) => {
        const emoji = godEmoji(card);
        const name  = godName(card);
        if (isReveal) {
            logToEditor(`🔮 Apollo foresees: ${emoji} ${name}`);
        } else {
            logToEditor(`🃏 Apollo draws: ${emoji} ${name} — ${card.name} [${card.element}]`);
        }
        renderUI();
    };

    apollo.onPlay = (card) => {
        const emoji = godEmoji(card);
        const name  = godName(card);
        const quote = cardQuote(card);
        logToEditor(`☀️ Apollo plays: ${emoji} ${name} — "${quote}"`);
        showToast(`${emoji} ${name}: ${card.name}`);

        // Extract intent from mind script for badge
        if (apollo._mindScript) {
            const match = apollo._mindScript.match(/\/\/ (\w+)$/m);
            if (match) lastIntent = match[1].toLowerCase();
        }

        if (apollo.getTableCardCount() >= TABLE_CLEAR_THRESHOLD) {
            setTimeout(clearTable, 500);
        }
        renderUI();
    };

    apollo.onTableChange = () => renderUI();
    apollo.onManaChange  = () => renderUI();

    apollo.onEmergence = (event) => {
        logToEditor(`✨ EMERGENCE: ${event}`);
        showToast(`✨ ${event}`, 'emerge-toast');
        if (typeof ApolloDB !== 'undefined') ApolloDB.saveEmergentEvent(event, 'emergence');
        // Pulse the ring with the emergent element
        const elMatch = event.match(/FIRE|WATER|EARTH|AIR|VOID/i);
        if (elMatch) pulseRing(elMatch[0].toLowerCase());
    };

    apollo.onDeal = (dealtCards) => {
        const names = dealtCards.map(c => godEmoji(c) + ' ' + godName(c)).join(', ');
        logToEditor(`🃏 DEALER: Apollo receives ${dealtCards.length} fresh cards — ${names}`);
        showToast('🃏 Fresh deal! ' + dealtCards.length + ' cards.', 'deal-toast');
        renderUI();
    };

    apollo.onGoldenTick = (data) => {
        phiCount++;
        document.getElementById('statPhi').textContent = phiCount;
        applyGoldenTransform(data.transformations);

        const gods = (data.tableCards || [])
            .map(c => (EMOJI_MAP[c.god || c.name] || '🃏') + (c.god || c.name || '?'))
            .join(', ') || 'empty';

        logToEditor(`φ GOLDEN TICK #${phiCount}: ${data.transformations.titleText} | Table: [${gods}]`);

        if (apollo._mindScript) {
            logToEditor('\n' + apollo._mindScript + '\n');
        }

        // Notes toast when count changes
        if (apollo.listNotes) {
            const noteCount = apollo.listNotes().length;
            const prev = parseInt(document.getElementById('statNotes').textContent) || 0;
            if (noteCount > prev) {
                showToast(`📜 Apollo wrote a note (${noteCount} total)`, 'note-toast');
            }
        }

        if (data.emergentEvents?.length) {
            showToast('✨ ' + data.emergentEvents[data.emergentEvents.length - 1].event, 'emerge-toast');
        }

        renderNotes();
    };

    // onStatePersist — append state block without clobbering scroll
    apollo.onStatePersist = (jsonState) => {
        if (!editor) return;
        const model      = editor.getModel();
        const stateBlock = `\n\n/*🜏STATE_BEGIN*/\n${jsonState}\n/*🜏STATE_END*/`;
        const cv         = model.getValue();

        if (!cv.includes('/*🜏STATE_BEGIN*/')) {
            model.setValue(cv + stateBlock);
        } else {
            model.setValue(
                cv.replace(/\/\*🜏STATE_BEGIN\*\/[\s\S]*?\/\*🜏STATE_END\*\//, stateBlock.trim())
            );
        }
        // Only scroll if user is near bottom
        const scrollTop    = editor.getScrollTop();
        const scrollHeight = editor.getScrollHeight();
        const editorHeight = editor.getDomNode()?.clientHeight || 600;
        if (scrollHeight - scrollTop - editorHeight < 60) {
            editor.revealLine(model.getLineCount());
        }
    };

    apollo.setMonacoReader(() => editor ? editor.getModel().getValue() : '{}');
    apollo.start();

    logToEditor('🌅 APOLLO TAKES HIS SEAT AT THE TAROT TABLE');
    logToEditor(`🃏 Deck: ${deck.card_count} Major Arcana`);
    logToEditor(`⏱ Draw: ${DRAW_INTERVAL}ms (φ·1000) | φ² Tick: ${GOLDEN_TICK}ms | π Stuck: 3 turns | Clear: ${TABLE_CLEAR_THRESHOLD} cards (τ+φ)`);
    logToEditor('📜 The Living Record begins…');

    renderUI();
    document.getElementById('statPhi').textContent = '0';
    document.getElementById('statDeck').textContent = deck.card_count;
}

// ── Controls ─────────────────────────────────
document.getElementById('btnPlay').onclick = () => {
    if (!apollo) return;
    apollo.start();
    document.getElementById('btnPlay').classList.add('active');
    document.getElementById('btnPause').classList.remove('active');
    logToEditor('▶ Apollo resumes play.');
};
document.getElementById('btnPause').onclick = () => {
    if (!apollo) return;
    apollo.stop();
    document.getElementById('btnPause').classList.add('active');
    document.getElementById('btnPlay').classList.remove('active');
    logToEditor('⏸ Apollo pauses.');
};
document.getElementById('btnPhi').onclick = () => {
    if (!apollo || !editor) return;
    apollo.goldenTick(editor.getModel().getValue());
    document.getElementById('btnPhi').classList.add('active');
    setTimeout(() => document.getElementById('btnPhi').classList.remove('active'), 300);
};
document.getElementById('btnDeal').onclick = () => {
    forceDeal();
    document.getElementById('btnDeal').classList.add('active');
    setTimeout(() => document.getElementById('btnDeal').classList.remove('active'), 300);
};
document.getElementById('btnClear').onclick = () => {
    clearTable();
    document.getElementById('btnClear').classList.add('active');
    setTimeout(() => document.getElementById('btnClear').classList.remove('active'), 300);
};
document.getElementById('btnReset').onclick = async () => {
    if (apollo) {
        apollo.stop();
        // Clear Apollo's memory before new session
        if (apollo.clearNotes) apollo.clearNotes();
    }
    if (editor) editor.getModel().setValue('');
    document.getElementById('apolloTitle').textContent = '☀ APOLLO';
    document.getElementById('apolloTitle').style.textShadow = '';
    document.getElementById('statPhi').textContent = '—';
    document.getElementById('statNotes').textContent = '0';
    document.getElementById('pulseRing').className = '';
    document.getElementById('btnPlay').classList.add('active');
    document.getElementById('btnPause').classList.remove('active');
    await initGame();
};

// ── Keyboard ─────────────────────────────────
document.addEventListener('keydown', (e) => {
    if (e.key === ' ' && !e.target.closest('input,textarea,button')) {
        e.preventDefault();
        document.getElementById('btnPhi').click();
    }
    if (e.key === 'd' && e.ctrlKey) { e.preventDefault(); forceDeal(); }
    if (e.key === 'c' && e.ctrlKey && !e.shiftKey) { e.preventDefault(); clearTable(); }
    if (e.key === 'p' && e.ctrlKey) {
        e.preventDefault();
        if (apollo && apollo.running) document.getElementById('btnPause').click();
        else document.getElementById('btnPlay').click();
    }
});

console.log('☀️ APOLLO TAROT TABLE READY');
console.log(`   Draw: ${DRAW_INTERVAL}ms · φ² Tick: ${GOLDEN_TICK}ms · Clear: ${TABLE_CLEAR_THRESHOLD} cards`);
console.log('   Space: φ tick | Ctrl+D: Deal | Ctrl+C: Clear | Ctrl+P: Pause');
</script>
</body>
</html>
