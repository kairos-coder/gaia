<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOLLO · The Living Tarot Table</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Fira+Code:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c; --gold-bright: #f0d080; --gold-dim: #6b5520;
            --sun: #ffcc44; --deep: #0a0c12; --surface: #141820;
            --card-bg: #1a1f2e; --text: #bcbcbc;
            --fire: #ff6644; --water: #4488cc; --earth: #66aa44;
            --air: #9988cc; --void: #664488;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--deep); color: var(--text);
            font-family: 'Cinzel', serif; min-height: 100vh; overflow: hidden;
        }
        #goldenGlow {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            transition: all 2.59s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0.15;
            box-shadow: inset 0 0 120px rgba(201,168,76,0);
        }
        .apollo-layout {
            display: grid; grid-template-columns: 380px 1fr; height: 100vh;
            position: relative; z-index: 1;
            transition: background 2.59s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* LEFT PANEL */
        .card-panel {
            background: var(--surface); border-right: 2px solid rgba(201,168,76,0.25);
            display: flex; flex-direction: column; overflow: hidden;
            transition: border-color 2.59s ease;
        }
        .panel-header {
            padding: 1rem; border-bottom: 1px solid rgba(201,168,76,0.15);
            text-align: center; background: linear-gradient(180deg, rgba(201,168,76,0.05), transparent);
        }
        .panel-title {
            font-family: 'Cinzel Decorative', serif; font-size: 1.2rem;
            color: var(--gold-bright); letter-spacing: 0.25em;
            transition: all 2.59s ease; text-shadow: 0 0 30px rgba(201,168,76,0.5);
        }
        .panel-subtitle {
            font-size: 0.45rem; letter-spacing: 0.35em;
            color: rgba(201,168,76,0.4); margin-top: 0.3rem; text-transform: uppercase;
        }
        .sky-whisper {
            padding: 0.4rem 1rem; border-bottom: 1px solid rgba(201,168,76,0.08);
            font-size: 0.42rem; font-style: italic; letter-spacing: 0.1em;
            color: rgba(180,160,200,0.5); text-align: center; min-height: 1.4rem;
        }
        
        /* STATS */
        .stats-bar {
            display: flex; gap: 0.3rem; padding: 0.5rem 0.6rem;
            border-bottom: 1px solid rgba(201,168,76,0.08);
            font-size: 0.5rem; letter-spacing: 0.1em; color: rgba(200,180,150,0.5);
        }
        .stat {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            gap: 0.1rem; padding: 0.25rem; background: rgba(0,0,0,0.2); border-radius: 4px;
        }
        .stat-label { font-size: 0.38rem; letter-spacing: 0.2em; text-transform: uppercase; }
        .stat-value { font-family: 'Cinzel Decorative', serif; font-size: 0.9rem; color: var(--gold-bright); }
        .stat-value.phi { color: #ff9944; text-shadow: 0 0 10px rgba(255,153,68,0.5); }
        
        /* DOMINANCE BAR */
        .dominance-bar { display: flex; gap: 2px; padding: 0.3rem 0.6rem; border-bottom: 1px solid rgba(201,168,76,0.08); }
        .dom-segment { flex: 1; height: 3px; border-radius: 1px; background: rgba(255,255,255,0.05); transition: all 0.8s; }
        .dom-segment.fire-bg { background: var(--fire); box-shadow: 0 0 6px rgba(255,100,68,0.4); }
        .dom-segment.water-bg { background: var(--water); box-shadow: 0 0 6px rgba(68,136,204,0.4); }
        .dom-segment.earth-bg { background: var(--earth); box-shadow: 0 0 6px rgba(102,170,68,0.4); }
        .dom-segment.air-bg { background: var(--air); box-shadow: 0 0 6px rgba(153,136,204,0.4); }
        .dom-segment.void-bg { background: var(--void); box-shadow: 0 0 6px rgba(102,68,136,0.4); }
        
        /* HAND */
        .hand-area { padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(201,168,76,0.08); }
        .section-label { font-size: 0.4rem; letter-spacing: 0.35em; color: rgba(201,168,76,0.35); margin-bottom: 0.3rem; text-transform: uppercase; }
        .hand-cards { display: flex; flex-direction: column; gap: 0.15rem; max-height: 140px; overflow-y: auto; }
        .mini-card {
            background: var(--card-bg); border: 1px solid rgba(201,168,76,0.12);
            border-radius: 4px; padding: 0.25rem 0.4rem; font-size: 0.5rem;
            display: flex; align-items: center; gap: 0.3rem; transition: all 0.3s;
        }
        .mini-card.playable { border-color: rgba(240,208,128,0.35); background: rgba(201,168,76,0.06); }
        .mini-card .card-emoji { font-size: 0.8rem; width: 18px; text-align: center; flex-shrink: 0; }
        .mini-card .card-god { font-family: 'Cinzel Decorative', serif; font-size: 0.5rem; color: var(--gold-bright); flex: 1; }
        .mini-card .card-cost { font-family: 'Cinzel Decorative', serif; font-size: 0.6rem; color: var(--sun); width: 16px; text-align: center; }
        
        /* TABLE GRID */
        .table-area { flex: 1; padding: 0.5rem 0.6rem; overflow-y: auto; }
        .spread-labels { display: grid; grid-template-columns: 28px repeat(4, 1fr); gap: 0.2rem; padding-bottom: 0.2rem; }
        .spread-labels .spacer { }
        .grid-label-col { text-align: center; font-size: 0.32rem; letter-spacing: 0.15em; color: rgba(201,168,76,0.25); text-transform: uppercase; }
        .tarot-grid { display: grid; grid-template-columns: 28px repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 0.2rem; min-height: 200px; }
        .grid-label-row { display: flex; align-items: center; justify-content: center; font-size: 0.32rem; letter-spacing: 0.15em; color: rgba(201,168,76,0.25); writing-mode: vertical-rl; text-transform: uppercase; }
        .grid-cell {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(201,168,76,0.08);
            border-radius: 6px; min-height: 55px; display: flex; align-items: center;
            justify-content: center; position: relative; transition: all 0.5s;
        }
        .grid-cell.occupied { border-color: rgba(201,168,76,0.25); background: rgba(20,24,36,0.8); }
        .grid-cell .cell-card { text-align: center; padding: 0.2rem; animation: cardAppear 0.5s ease-out; }
        @keyframes cardAppear { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }
        .grid-cell .cell-emoji { font-size: 1.3rem; line-height: 1; margin-bottom: 0.05rem; }
        .grid-cell .cell-god { font-family: 'Cinzel Decorative', serif; font-size: 0.5rem; color: var(--gold-bright); letter-spacing: 0.05em; }
        .grid-cell .cell-arcana { font-size: 0.35rem; color: rgba(201,168,76,0.45); }
        .grid-cell .cell-tokens { display: flex; gap: 0.1rem; justify-content: center; flex-wrap: wrap; margin-top: 0.1rem; }
        .token-dot { width: 4px; height: 4px; border-radius: 50%; opacity: 0.7; }
        .token-dot.fire { background: var(--fire); } .token-dot.water { background: var(--water); }
        .token-dot.earth { background: var(--earth); } .token-dot.air { background: var(--air); }
        .token-dot.void { background: var(--void); }
        .grid-cell .cell-value { position: absolute; top: 2px; right: 4px; font-size: 0.38rem; color: rgba(240,208,128,0.5); }
        .grid-cell .cell-turns { position: absolute; bottom: 2px; right: 4px; font-size: 0.32rem; color: rgba(200,180,150,0.25); }
        .grid-cell .cell-element-border { position: absolute; inset: 0; border-radius: 6px; pointer-events: none; border: 1px solid transparent; transition: all 0.8s; }
        .grid-cell.fire-border .cell-element-border { border-color: rgba(255,100,68,0.3); }
        .grid-cell.water-border .cell-element-border { border-color: rgba(68,136,204,0.3); }
        .grid-cell.earth-border .cell-element-border { border-color: rgba(102,170,68,0.3); }
        .grid-cell.air-border .cell-element-border { border-color: rgba(153,136,204,0.3); }
        
        /* MEMORY PANEL */
        .memory-panel {
            padding: 0.4rem 0.6rem; border-top: 1px solid rgba(201,168,76,0.1);
            font-size: 0.38rem; letter-spacing: 0.1em; color: rgba(200,180,150,0.35);
            max-height: 80px; overflow-y: auto;
        }
        .memory-panel .mem-line { padding: 0.1rem 0; border-bottom: 1px solid rgba(201,168,76,0.04); }
        .memory-panel .mem-god { color: rgba(240,208,128,0.5); }
        
        /* RIGHT PANEL */
        .editor-panel { display: flex; flex-direction: column; transition: border-color 2.59s ease; }
        .editor-header { padding: 0.4rem 0.8rem; border-bottom: 1px solid rgba(201,168,76,0.1); display: flex; justify-content: space-between; align-items: center; }
        .editor-title { font-size: 0.5rem; letter-spacing: 0.25em; color: rgba(201,168,76,0.45); text-transform: uppercase; }
        .editor-controls { display: flex; gap: 0.3rem; }
        .ctrl-btn {
            background: rgba(201,168,76,0.08); border: 1px solid rgba(201,168,76,0.18);
            color: rgba(201,168,76,0.6); font-family: 'Cinzel', serif;
            font-size: 0.42rem; letter-spacing: 0.12em; padding: 0.25rem 0.5rem;
            border-radius: 3px; cursor: pointer; transition: all 0.25s; text-transform: uppercase;
        }
        .ctrl-btn:hover { background: rgba(201,168,76,0.18); border-color: var(--gold); color: var(--gold-bright); }
        .ctrl-btn.active { background: rgba(201,168,76,0.2); border-color: var(--gold-bright); color: var(--gold-bright); box-shadow: 0 0 12px rgba(201,168,76,0.2); }
        .ctrl-btn.phi-btn { border-color: rgba(255,153,68,0.3); color: rgba(255,153,68,0.6); }
        .ctrl-btn.phi-btn.active { border-color: #ff9944; color: #ff9944; box-shadow: 0 0 12px rgba(255,153,68,0.25); }
        .ctrl-btn.deal-btn { border-color: rgba(68,204,136,0.3); color: rgba(68,204,136,0.6); }
        .ctrl-btn.deal-btn:hover { border-color: #44cc88; color: #44cc88; }
        #monacoContainer { flex: 1; border-top: 1px solid rgba(201,168,76,0.05); }
        
        /* TOAST */
        #toast {
            position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
            background: rgba(10,12,18,0.95); border: 1px solid var(--gold);
            color: var(--gold-bright); padding: 0.5rem 1.2rem; border-radius: 4px;
            font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.15em;
            z-index: 100; opacity: 0; transition: opacity 0.35s; pointer-events: none;
        }
        #toast.show { opacity: 1; }
        #toast.phi-toast { border-color: #ff9944; color: #ff9944; }
        #toast.emerge-toast { border-color: #44cc88; color: #44cc88; }
        #toast.deal-toast { border-color: #44cc88; color: #88ffaa; }
        
        @media (max-width: 800px) {
            .apollo-layout { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            .card-panel { border-right: none; border-bottom: 2px solid rgba(201,168,76,0.25); }
        }
    </style>
</head>
<body>

<div id="goldenGlow"></div>

<div class="apollo-layout">
    
    <!-- LEFT: Card Panel -->
    <div class="card-panel">
        <div class="panel-header">
            <div class="panel-title" id="apolloTitle">☀️ APOLLO</div>
            <div class="panel-subtitle">The Living Tarot Table · Major Arcana</div>
        </div>
        
        <div class="sky-whisper" id="skyWhisper">The sky is awakening...</div>
        
        <div class="stats-bar">
            <div class="stat"><span class="stat-label">Turn</span><span class="stat-value" id="statTurn">0</span></div>
            <div class="stat"><span class="stat-label">Mana</span><span class="stat-value" id="statMana">0</span></div>
            <div class="stat"><span class="stat-label">Deck</span><span class="stat-value" id="statDeck">22</span></div>
            <div class="stat"><span class="stat-label">Table</span><span class="stat-value" id="statTable">0</span></div>
            <div class="stat"><span class="stat-label">φ</span><span class="stat-value phi" id="statPhi">—</span></div>
        </div>
        
        <div class="dominance-bar" id="dominanceBar">
            <div class="dom-segment" id="domFire"></div>
            <div class="dom-segment" id="domWater"></div>
            <div class="dom-segment" id="domEarth"></div>
            <div class="dom-segment" id="domAir"></div>
            <div class="dom-segment" id="domVoid"></div>
        </div>
        
        <div class="hand-area">
            <div class="section-label">☀ Apollo's Hand</div>
            <div class="hand-cards" id="handCards"></div>
        </div>
        
        <div class="spread-labels">
            <div class="spacer"></div>
            <div class="grid-label-col">Self</div><div class="grid-label-col">Other</div>
            <div class="grid-label-col">Above</div><div class="grid-label-col">Below</div>
        </div>
        
        <div class="table-area"><div class="tarot-grid" id="tarotGrid"></div></div>
        
        <div class="memory-panel" id="memoryPanel">
            <div class="section-label" style="margin-bottom:0.2rem;">📜 Short-Term Memory</div>
            <div id="memoryContent">Awaiting first play...</div>
        </div>
    </div>
    
    <!-- RIGHT: Monaco Editor -->
    <div class="editor-panel" id="editorPanel">
        <div class="editor-header">
            <div class="editor-title">📜 THE LIVING RECORD</div>
            <div class="editor-controls">
                <button class="ctrl-btn active" id="btnPlay">▶ PLAY</button>
                <button class="ctrl-btn" id="btnPause">⏸ PAUSE</button>
                <button class="ctrl-btn phi-btn" id="btnPhi">φ TICK</button>
                <button class="ctrl-btn deal-btn" id="btnDeal">🃏 DEAL</button>
                <button class="ctrl-btn" id="btnClear">🧹 CLEAR</button>
                <button class="ctrl-btn" id="btnReset">⟳ RESET</button>
            </div>
        </div>
        <div id="monacoContainer"></div>
    </div>
    
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="js/apolloDB.js"></script>
<script src="js/apolloMind.js"></script>
<script src="js/apolloSeed.js"></script>

<script>
// ══════════════════════════════════════════════
// APOLLO TAROT TABLE — Cycle 1 Edition
// ══════════════════════════════════════════════

const DRAW_INTERVAL = Math.round(PHI * 1000);
const GOLDEN_TICK = Math.round(PHI * PHI * 1000);
const TABLE_CLEAR_THRESHOLD = Math.round(TAU + PHI);

let apollo = null;
let editor = null;
let phiCount = 0;
let skyState = null;

const EMOJI_MAP = {
  'Zeus':'⚡','Hera':'🦚','Poseidon':'🌊','Demeter':'🌾','Athena':'🦉',
  'Apollo':'☀️','Artemis':'🏹','Ares':'⚔️','Aphrodite':'💋','Hephaestus':'🔨',
  'Hermes':'🪄','Hestia':'🔥','Dionysus':'🍇','Hades':'💀','Persephone':'🌱',
  'Melinoe':'👻','Thanatos':'🕯️','The Fates':'🧵','Prometheus':'🔓','Gaia':'🌍',
  'Mortal Man':'🧔','The Three Judges':'⚖️'
};

const SPREAD_ROWS = ['Past', 'Present', 'Future'];

// 🜏 Helper: get god name from card
function godName(card) {
  return card.god || card.ruling_god || card.name || 'Unknown';
}

// 🜏 Helper: get emoji for card
function godEmoji(card) {
  return EMOJI_MAP[godName(card)] || '🃏';
}

// 🜏 Helper: get flavor text
function cardQuote(card) {
  return card.flavor || card.description || 
         (card.keywords && card.keywords[0]) || 
         (card.upright && card.upright.slice(0, 60)) || 
         '...';
}

// ══ Load Sky State ══
async function loadSkyState() {
    if (typeof Observe !== 'undefined') {
        try {
            skyState = await Observe.getSkyState();
            document.getElementById('skyWhisper').textContent = 
                typeof ApolloSkyBridge !== 'undefined' ? 
                ApolloSkyBridge.getSkyWhisper(skyState) : 'The sky is watching.';
        } catch(e) {
            document.getElementById('skyWhisper').textContent = 'The sky is silent.';
        }
    }
}

// ══ Load Major Arcana Deck ══
async function loadDeck() {
    let deck = null;
    
    // Try to load from JSON
    try {
        const response = await fetch('json/major_arcana.json');
        if (response.ok) {
            deck = await response.json();
        }
    } catch(e) {}
    
    // Fallback to MAJOR_ARCANA_DECK if loaded as script
    if (!deck && typeof MAJOR_ARCANA_DECK !== 'undefined') {
        deck = MAJOR_ARCANA_DECK;
    }
    
    if (!deck) throw new Error('No deck found');
    
    // 🜏 Enforce defaults
    deck.max_hand_size = deck.max_hand_size || 5;
    deck.max_table_cards = deck.max_table_cards || 12;
    deck.draw_interval_ms = deck.draw_interval_ms || DRAW_INTERVAL;
    
    // 🜏 Inject effects from majorArcanaDeck.js into the loaded JSON cards
    if (typeof MAJOR_ARCANA_DECK !== 'undefined' && MAJOR_ARCANA_DECK.cards) {
        const effectMap = {};
        MAJOR_ARCANA_DECK.cards.forEach(c => {
            effectMap[c.id] = c.effect;
        });
        
        deck.cards = deck.cards.map(card => ({
            ...card,
            effect: card.effect || effectMap[card.id] || 'unknown'
        }));
    }
    
    return deck;
}
// ══ Monaco Init ══
require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' } });
require(['vs/editor/editor.main'], async function() {
    editor = monaco.editor.create(document.getElementById('monacoContainer'), {
        value: '', language: 'javascript', theme: 'vs-dark',
        fontSize: 11, fontFamily: "'Fira Code', 'Courier New', monospace",
        readOnly: true, minimap: { enabled: false },
        lineNumbers: 'off', scrollBeyondLastLine: false,
        wordWrap: 'on', padding: { top: 12, bottom: 12 }
    });
    await initGame();
});

// ══ Logging ══
function logToEditor(msg) {
    if (!editor) return;
    const ts = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    const model = editor.getModel();
    model.setValue(model.getValue() + `[${ts}] ${msg}\n`);
    editor.revealLine(model.getLineCount());
}

function showToast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show ' + type;
    setTimeout(() => t.className = '', 2200);
}

// ══ Render Grid ══
function renderGrid() {
    if (!apollo) return;
    const grid = document.getElementById('tarotGrid');
    let html = '';
    for (let row = 0; row < 3; row++) {
        html += `<div class="grid-label-row">${SPREAD_ROWS[row]}</div>`;
        for (let col = 0; col < 4; col++) {
            const card = apollo.table[row][col];
            if (card) {
                const el = (card.element || 'void').toLowerCase();
                const emoji = godEmoji(card);
                const name = godName(card);
                const tokens = card.tokens || {};
                const dots = Object.entries(tokens).filter(([,v])=>v>0).map(([el,c])=>`<span class="token-dot ${el}"></span>`.repeat(Math.min(c,3))).join('');
                html += `<div class="grid-cell occupied ${el}-border">
                    <div class="cell-element-border"></div>
                    <div class="cell-card">
                        <div class="cell-emoji">${emoji}</div>
                        <div class="cell-god">${name}</div>
                        <div class="cell-arcana">${card.name}</div>
                        ${dots?`<div class="cell-tokens">${dots}</div>`:''}
                    </div>
                    <div class="cell-value">${card.value||0}</div>
                    <div class="cell-turns">${card.turnsOnTable}t</div>
                </div>`;
            } else {
                html += `<div class="grid-cell"></div>`;
            }
        }
    }
    grid.innerHTML = html;
}

// ══ Render Memory Panel ══
function renderMemory() {
    if (typeof ApolloDB === 'undefined') return;
    const mem = ApolloDB.getShortTermMemory();
    const panel = document.getElementById('memoryContent');
    if (mem.lastPlays.length === 0) {
        panel.innerHTML = 'Awaiting first play...';
        return;
    }
    panel.innerHTML = mem.lastPlays.slice(-5).map(p => {
        const emoji = EMOJI_MAP[p.god] || '🃏';
        return `<div class="mem-line">${emoji} <span class="mem-god">${p.god}</span> · ${p.name} · ${p.effect}</div>`;
    }).join('');
}

// ══ Render UI ══
function renderUI() {
    if (!apollo) return;
    const s = apollo.getState();
    document.getElementById('statTurn').textContent = s.turn;
    document.getElementById('statMana').textContent = s.mana;
    document.getElementById('statDeck').textContent = s.deckSize;
    document.getElementById('statTable').textContent = s.tableSize;
    
    const handDiv = document.getElementById('handCards');
    if (s.hand.length === 0) {
        handDiv.innerHTML = '<div style="font-size:0.4rem;color:rgba(200,180,150,0.2);text-align:center;padding:0.5rem;">Hand empty — Dealer will provide</div>';
    } else {
        handDiv.innerHTML = s.hand.map(c => {
            const emoji = godEmoji(c);
            const name = godName(c);
            return `<div class="mini-card ${(c.cost||0)<=s.mana?'playable':''}">
                <span class="card-emoji">${emoji}</span>
                <span class="card-god">${name}</span>
                <span class="card-cost">${c.cost||0}</span>
            </div>`;
        }).join('');
    }
    
    const dom = s.elementalDominance || {};
    const total = Math.max(1, Object.values(dom).reduce((a,b)=>a+b,0));
    ['Fire','Water','Earth','Air','Void'].forEach(el => {
        const seg = document.getElementById('dom'+el);
        if (seg) {
            const count = dom[el.toLowerCase()]||0;
            seg.style.flex = count/total*100;
            seg.className = 'dom-segment' + (count>=3?` ${el.toLowerCase()}-bg`:'');
        }
    });
    
    renderGrid();
    renderMemory();
}

// ══ Golden Transformations ══
function applyGoldenTransform(mods) {
    const layout = document.querySelector('.apollo-layout');
    const glow = document.getElementById('goldenGlow');
    const title = document.getElementById('apolloTitle');
    if (layout) layout.style.background = mods.backgroundGradient;
    if (glow) glow.style.boxShadow = `inset 0 0 140px ${mods.glowColor}`;
    if (title) { title.textContent = mods.titleText; title.style.textShadow = mods.titleGlow; }
}

// ══ Clear Table ══
function clearTable() {
    if (!apollo) return;
    const cards = apollo.getAllCardsOnTable();
    cards.forEach(c => apollo._removeFromGrid(c.row, c.col));
    logToEditor('🧹 Table cleared — ' + cards.length + ' cards sent to graveyard');
    showToast('🧹 Table cleared', 'phi-toast');
    renderUI();
}

// ══ Force Deal ══
function forceDeal() {
    if (!apollo) return;
    const dealt = apollo._dealerDeal(7);
    if (dealt && dealt.length > 0) {
        const names = dealt.map(c => godEmoji(c) + ' ' + godName(c)).join(', ');
        logToEditor('🃏 DEALER: ' + dealt.length + ' fresh cards — ' + names);
        showToast('🃏 Dealt ' + dealt.length + ' cards', 'deal-toast');
        apollo._handStuckTurns = 0;
        apollo._lastHandSize = apollo.hand.length;
        renderUI();
    }
}

// ══ Init Game ══
async function initGame() {
    if (apollo) apollo.stop();
    phiCount = 0;
    await loadSkyState();
    const deck = await loadDeck();
    apollo = new ApolloPlayer(deck);
    
    if (skyState && typeof ApolloSkyBridge !== 'undefined') {
        ApolloSkyBridge.applySkyModifiers(apollo, skyState);
    }
    
    apollo.onDraw = (card, isReveal) => {
        const emoji = godEmoji(card);
        const name = godName(card);
        if (isReveal) {
            logToEditor(`🔮 Apollo foresees: ${emoji} ${name}`);
        } else {
            logToEditor(`🃏 Apollo draws: ${emoji} ${name} — ${card.name} [${card.element}]`);
        }
        renderUI();
    };
    
    apollo.onPlay = (card) => {
        const emoji = godEmoji(card);
        const name = godName(card);
        const quote = cardQuote(card);
        logToEditor(`☀️ Apollo plays: ${emoji} ${name} — "${quote}"`);
        showToast(`${emoji} ${name}: ${card.name}`);
        
        if (apollo.getTableCardCount() >= TABLE_CLEAR_THRESHOLD) {
            setTimeout(clearTable, 500);
        }
        
        renderUI();
    };
    
    apollo.onTableChange = () => renderUI();
    apollo.onManaChange = () => renderUI();
    
    apollo.onEmergence = (event) => {
        logToEditor(`✨ EMERGENCE: ${event}`);
        showToast(`✨ ${event}`, 'emerge-toast');
        if (typeof ApolloDB !== 'undefined') ApolloDB.saveEmergentEvent(event, 'emergence');
    };
    
    apollo.onDeal = (dealtCards) => {
        const names = dealtCards.map(c => godEmoji(c) + ' ' + godName(c)).join(', ');
        logToEditor(`🃏 DEALER: Apollo receives ${dealtCards.length} fresh cards — ${names}`);
        showToast('🃏 Fresh deal! ' + dealtCards.length + ' cards.', 'deal-toast');
        renderUI();
    };
    
apollo.onGoldenTick = (data) => {
    phiCount++;
    document.getElementById('statPhi').textContent = phiCount;
    applyGoldenTransform(data.transformations);

    const gods = (data.tableCards || []).map(c => {
        const name = c.god || c.name || '?';
        return (EMOJI_MAP[name] || '🃏') + name;
    }).join(', ') || 'empty';

    logToEditor(`φ GOLDEN TICK #${phiCount}: ${data.transformations.titleText} | Table: [${gods}]`);

    // 🜏 Emit the mind script so the soul window shows reasoning
    if (apollo._mindScript) {
        logToEditor('\n' + apollo._mindScript + '\n');
    }

    if (data.emergentEvents?.length) {
        showToast('✨ ' + data.emergentEvents[data.emergentEvents.length - 1].event, 'emerge-toast');
    }
};
    
    apollo.onStatePersist = (jsonState) => {
    if (!editor) return;
    const model  = editor.getModel();
    const cv     = model.getValue();

    // 🜏 Mind script — Apollo's reasoning (top of the window)
    const mindScript = apollo._mindScript || '// Apollo is thinking...';

    // 🜏 State block — the persistent record (bottom of the window)
    const stateBlock = `\n\n/*🜏STATE_BEGIN*/\n${jsonState}\n/*🜏STATE_END*/\n`;

    // If Monaco is empty or only has old content, write fresh
    if (!cv.includes('/*🜏STATE_BEGIN*/')) {
        model.setValue(model.getValue() + stateBlock);
    } else {
        // Replace state block in-place
        const updated = cv.replace(
            /\/\*🜏STATE_BEGIN\*\/[\s\S]*?\/\*🜏STATE_END\*\//,
            stateBlock.trim()
        );
        model.setValue(updated);
    }

    editor.revealLine(model.getLineCount());
};
    
    apollo.setMonacoReader(() => editor ? editor.getModel().getValue() : '{}');
    apollo.start();
    
    logToEditor('🌅 APOLLO TAKES HIS SEAT AT THE TAROT TABLE');
    logToEditor(`🃏 Deck: ${deck.card_count} Major Arcana`);
    logToEditor(`⏱ Draw: ${DRAW_INTERVAL}ms (φ·1000) | φ² Tick: ${GOLDEN_TICK}ms | π Stuck: 3 turns | Clear: ${TABLE_CLEAR_THRESHOLD} cards (τ+φ)`);
    logToEditor(`📜 The Living Record begins...`);
    
    renderUI();
    document.getElementById('statPhi').textContent = '0';
    document.getElementById('statDeck').textContent = deck.card_count;
}

// ══ Controls ══
document.getElementById('btnPlay').onclick = () => {
    if (!apollo) return;
    apollo.start();
    document.getElementById('btnPlay').classList.add('active');
    document.getElementById('btnPause').classList.remove('active');
    logToEditor('▶ Apollo resumes play.');
};
document.getElementById('btnPause').onclick = () => {
    if (!apollo) return;
    apollo.stop();
    document.getElementById('btnPause').classList.add('active');
    document.getElementById('btnPlay').classList.remove('active');
    logToEditor('⏸ Apollo pauses.');
};
document.getElementById('btnPhi').onclick = () => {
    if (!apollo||!editor) return;
    apollo.goldenTick(editor.getModel().getValue());
    document.getElementById('btnPhi').classList.add('active');
    setTimeout(()=>document.getElementById('btnPhi').classList.remove('active'),300);
};
document.getElementById('btnDeal').onclick = () => {
    forceDeal();
    document.getElementById('btnDeal').classList.add('active');
    setTimeout(()=>document.getElementById('btnDeal').classList.remove('active'),300);
};
document.getElementById('btnClear').onclick = () => {
    clearTable();
    document.getElementById('btnClear').classList.add('active');
    setTimeout(()=>document.getElementById('btnClear').classList.remove('active'),300);
};
document.getElementById('btnReset').onclick = async () => {
    if (apollo) apollo.stop();
    if (editor) editor.getModel().setValue('');
    document.getElementById('apolloTitle').textContent = '☀️ APOLLO';
    document.getElementById('apolloTitle').style.textShadow = '0 0 30px rgba(201,168,76,0.5)';
    document.querySelector('.apollo-layout').style.background = '';
    document.getElementById('goldenGlow').style.boxShadow = 'inset 0 0 120px rgba(201,168,76,0)';
    document.getElementById('statPhi').textContent = '—';
    document.getElementById('btnPlay').classList.add('active');
    document.getElementById('btnPause').classList.remove('active');
    await initGame();
};

// ══ Keyboard ══
document.addEventListener('keydown', (e) => {
    if (e.key===' ' && !e.target.closest('input,textarea')) { e.preventDefault(); document.getElementById('btnPhi').click(); }
    if (e.key==='d' && e.ctrlKey) { e.preventDefault(); forceDeal(); }
    if (e.key==='c' && e.ctrlKey) { e.preventDefault(); clearTable(); }
    if (e.key==='p' && e.ctrlKey) { e.preventDefault(); if(apollo&&apollo.running) document.getElementById('btnPause').click(); else document.getElementById('btnPlay').click(); }
});

console.log('☀️ APOLLO TAROT TABLE READY — Cycle 1');
console.log(`   Draw: ${DRAW_INTERVAL}ms (φ·1000) | φ² Tick: ${GOLDEN_TICK}ms`);
console.log(`   Clear: ${TABLE_CLEAR_THRESHOLD} cards (τ+φ)`);
console.log('   Space: φ tick | Ctrl+D: Deal | Ctrl+C: Clear | Ctrl+P: Pause');
</script>
</body>
