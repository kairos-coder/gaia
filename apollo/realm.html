<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Solar Temple · Apollo's Realm · GAIA</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep: #0a0c12; --surface: #141820;
            --gold: #c9a84c; --gold-bright: #f0d080; --sun: #ffcc44;
            --laurel: #4a6a3a; --laurel-light: #6a8a5a;
            --text: #d8d0c0; --text-dim: #8a8a7a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--deep);
            color: var(--text);
            font-family: 'Georgia','Times New Roman',serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(255,200,68,0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(10,12,18,0.98) 0%, transparent 50%);
        }

        #solar-temple {
            position: relative; width: 820px; max-width: 98vw;
            height: 1100px; margin: 0 auto 1rem; overflow: hidden;
            background: linear-gradient(180deg, #1a1c14 0%, #141820 50%, #1a1c14 100%);
            border-left: 4px solid #2a2c24;
            border-right: 4px solid #2a2c24;
            box-shadow: 0 0 140px rgba(255,200,68,0.06), 0 0 280px rgba(0,0,0,0.5);
        }
        @media (max-width: 840px) {
            #solar-temple { width: 98vw; height: calc(98vw * 1.34); }
        }

        #ouranos-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 320px;
            z-index: 1; pointer-events: none;
        }
        #pontus-canvas {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 200px;
            z-index: 1; pointer-events: none;
        }

        .zone { cursor: pointer; transition: filter 0.3s, transform 0.3s; }
        .zone:hover { filter: brightness(1.3); z-index: 50 !important; }
        .zone:active { transform: scale(0.94); transition: transform 0.1s; }

        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(10,12,18,0.96); border: 1px solid var(--gold);
            border-radius: 6px; padding: 0.5rem 1.2rem;
            font-family: 'Georgia',serif; font-size: 0.78rem;
            z-index: 200; opacity: 0; transition: opacity 0.35s;
            pointer-events: none; text-align: center; max-width: 420px; line-height: 1.4;
            box-shadow: 0 6px 24px rgba(0,0,0,0.6); white-space: pre-line;
            color: #f0d080;
        }
        #toast.show { opacity: 1; }

        @keyframes sunRayPulse {
            0%,100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        @keyframes poolRipple {
            0%,100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }
        @keyframes tripodGlow {
            0%,100% { box-shadow: 0 0 15px rgba(255,200,68,0.2); }
            50% { box-shadow: 0 0 40px rgba(255,200,68,0.6); }
        }
        @keyframes goldShimmer {
            0%,100% { text-shadow: 0 0 4px rgba(255,200,68,0.2); }
            50% { text-shadow: 0 0 20px rgba(255,200,68,0.6); }
        }
    </style>
</head>
<body>

    <div id="solar-temple">
        <canvas id="ouranos-canvas"></canvas>
        <canvas id="pontus-canvas"></canvas>
    </div>
    <div id="toast"></div>

    <script src="../js/gaia-mason.js"></script>
    <script>
    /*
     * ═══════════════════════════════════════════════════════════════
     * THE SOLAR TEMPLE · Apollo's Realm
     * God of light, prophecy, music, healing, knowledge.
     * Seven Lyre Pillars. The Oracle's Tripod. The Reflecting Pool.
     * Laurel Crown Arch. Sun shafts from Ouranos. Mirror pool of Pontus.
     * All built from typography + canvas. GaiaMason v2.1.
     * ═══════════════════════════════════════════════════════════════
     */

    const DEFAULT_STATE = {
        visits: 0,
        propheciesReceived: 0,
        musicStonesTouched: [],
        poolGazed: 0,
        crownWorn: 0,
    };
    let state = JSON.parse(JSON.stringify(DEFAULT_STATE));

    function loadState() {
        const raw = localStorage.getItem('gaia_apollo_realm');
        if (!raw) return false;
        try { state = { ...DEFAULT_STATE, ...JSON.parse(raw) }; return true; } catch(e) { return false; }
    }
    function saveState() { localStorage.setItem('gaia_apollo_realm', JSON.stringify(state)); }

    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg, d = 3200) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), d);
    }

    function makeZone(x, y, w, h, title, action) {
        const el = document.createElement('div');
        el.className = 'zone';
        el.title = title;
        el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:25;`;
        el.addEventListener('click', action);
        return el;
    }

    // ═══════════════════════════════════
    // OURANOS — intense sun with rays
    // ═══════════════════════════════════

    function setupOuranos() {
        const canvas = document.getElementById('ouranos-canvas');
        const container = document.getElementById('solar-temple');
        canvas.width = container.clientWidth;
        canvas.height = 320;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        const stars = Array.from({ length: 30 }, () => ({
            x: Math.random() * W,
            y: Math.random() * H * 0.5,
            r: Math.random() * 1 + 0.2,
            phase: Math.random() * Math.PI * 2,
            speed: 0.3 + Math.random() * 0.8
        }));

        const sun = { x: W / 2, y: H * 0.15, r: 22, glow: 60 };
        let rayAngle = 0;

        function draw() {
            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, 'rgba(5,4,2,0.95)');
            grad.addColorStop(0.5, 'rgba(15,10,4,0.8)');
            grad.addColorStop(1, 'rgba(26,24,18,0.3)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Zodiac ring
            ctx.strokeStyle = 'rgba(255,200,68,0.15)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 10]);
            ctx.beginPath();
            ctx.arc(W / 2, H * 0.25, 130, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Zodiac house markers
            const houses = ['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
            houses.forEach((h, i) => {
                const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
                const hx = W/2 + Math.cos(angle) * 130;
                const hy = H*0.25 + Math.sin(angle) * 130;
                ctx.font = '9px Georgia, serif';
                ctx.fillStyle = i === 4 ? 'rgba(255,200,68,0.6)' : 'rgba(255,200,68,0.2)';
                ctx.textAlign = 'center';
                ctx.fillText(h, hx, hy + 3);
            });

            const now = Date.now() * 0.001;

            // Stars
            stars.forEach(s => {
                const twinkle = 0.2 + 0.35 * Math.sin(now * s.speed + s.phase);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,240,200,${twinkle})`;
                ctx.fill();
            });

            // Sun rays rotating
            rayAngle += 0.003;
            for (let i = 0; i < 12; i++) {
                const angle = rayAngle + (i / 12) * Math.PI * 2;
                const r1 = sun.r + 10;
                const r2 = sun.glow * 1.5;
                const grad2 = ctx.createLinearGradient(
                    sun.x + Math.cos(angle) * r1, sun.y + Math.sin(angle) * r1,
                    sun.x + Math.cos(angle) * r2, sun.y + Math.sin(angle) * r2
                );
                grad2.addColorStop(0, 'rgba(255,220,100,0.4)');
                grad2.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad2;
                ctx.lineWidth = 2 + Math.sin(now * 2 + i) * 1;
                ctx.beginPath();
                ctx.moveTo(sun.x + Math.cos(angle) * r1, sun.y + Math.sin(angle) * r1);
                ctx.lineTo(sun.x + Math.cos(angle) * r2, sun.y + Math.sin(angle) * r2);
                ctx.stroke();
            }

            // Sun glow
            const sunGrad = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * 3);
            sunGrad.addColorStop(0, 'rgba(255,240,180,0.95)');
            sunGrad.addColorStop(0.15, 'rgba(255,200,68,0.6)');
            sunGrad.addColorStop(0.4, 'rgba(255,180,40,0.2)');
            sunGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.glow * 3, 0, Math.PI * 2);
            ctx.fill();

            // Sun body
            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffe088';
            ctx.fill();

            requestAnimationFrame(draw);
        }
        draw();
    }

    // ═══════════════════════════════════
    // PONTUS — reflecting pool
    // ═══════════════════════════════════

    function setupPontus() {
        const canvas = document.getElementById('pontus-canvas');
        const container = document.getElementById('solar-temple');
        canvas.width = container.clientWidth;
        canvas.height = 200;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        function draw() {
            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, 'rgba(20,18,12,0.5)');
            grad.addColorStop(1, 'rgba(5,4,2,0.95)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const now = Date.now() * 0.001;

            // Mirror pool center — reflecting the "sun" above
            const px = W / 2, py = H * 0.35;
            const poolGrad = ctx.createRadialGradient(px, py, 0, px, py, 80);
            poolGrad.addColorStop(0, 'rgba(255,220,120,0.15)');
            poolGrad.addColorStop(0.5, 'rgba(200,160,60,0.08)');
            poolGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = poolGrad;
            ctx.beginPath();
            ctx.ellipse(px, py, 80, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // Gentle ripples
            for (let r = 0; r < 5; r++) {
                const rx = px + Math.sin(now * 0.8 + r) * 60;
                const ry = py + Math.cos(now * 0.6 + r) * 18;
                ctx.beginPath();
                ctx.arc(rx, ry, 0.8, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,220,140,${0.2 + 0.15 * Math.sin(now + r)})`;
                ctx.fill();
            }

            // Subtle wave lines
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(200,160,80,${0.1 + i * 0.04})`;
                ctx.lineWidth = 0.8;
                const yBase = py - 10 + i * 12;
                for (let x = 0; x <= W; x += 3) {
                    const y = yBase + Math.sin(x * 0.015 + now + i) * 4;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }
        draw();
    }

    // ═══════════════════════════════════
    // BUILD THE SOLAR TEMPLE
    // ═══════════════════════════════════

    function buildTemple() {
        const container = document.getElementById('solar-temple');
        const m = new GaiaMason('solar-temple');

        // Apollo's materials
        GaiaMason.MATERIALS['sun_stone'] = {
            chars: ['◆','◇','◆','◇','◆'], textColor:'#e8d080', mortarColor:'#c8b840',
            fontSize:24, lineHeight:0.5, letterSpacing:0, fontFamily:"'Georgia',serif", weathering:0.02
        };
        GaiaMason.MATERIALS['laurel_dark'] = {
            chars: ['▲','▼','◆','▲','▼'], textColor:'#4a6a3a', mortarColor:'#2a4a1a',
            fontSize:20, lineHeight:0.48, letterSpacing:-1, fontFamily:'monospace', weathering:0.1
        };
        GaiaMason.MATERIALS['marble_sun'] = {
            chars: ['M','N','H','M','N'], textColor:'#d8d0b8', mortarColor:'#b8b098',
            fontSize:38, lineHeight:0.5, letterSpacing:-3, fontFamily:"'Cinzel','Georgia',serif", weathering:0.04
        };
        GaiaMason.MATERIALS['oracle_black'] = {
            chars: ['▓','▒','░','▓','▒'], textColor:'#1a1c14', mortarColor:'#0a0c08',
            fontSize:34, lineHeight:0.5, letterSpacing:-2, fontFamily:"'Cinzel','Georgia',serif", weathering:0.06
        };
        GaiaMason.MATERIALS['tripod_bronze'] = {
            chars: ['▬','▬','▬','▬','▬'], textColor:'#8a7a50', mortarColor:'#5a4a30',
            fontSize:22, lineHeight:0.5, letterSpacing:-1, fontFamily:'monospace', weathering:0.2
        };

        const W = container.clientWidth;

        // ── FLOOR ──
        m.buildFloor({
            ...GaiaMason.mat('oracle_black'),
            x: 20, y: 640, width: W - 40, height: 180, z: 0,
            perspectiveStrength: 6,
            glyphCarving: {
                text: '☀️  ◆  ◇  ♌  ◇  ◆  ☀️',
                x: W/2 - 120, y: 60,
                size: 18, spacing: 28,
                color: 'rgba(255,200,68,0.06)'
            }
        });

        // Stone border
        m.buildFloor({
            ...GaiaMason.mat('marble_sun'),
            x: 15, y: 625, width: W - 30, height: 22, z: 1,
            perspectiveStrength: 3
        });

        // ── SEVEN LYRE PILLARS — semicircle ──
        const notes = ['C','D','E','F','G','A','B'];
        const noteNames = ['DO','RE','MI','FA','SOL','LA','TI'];
        const noteWhispers = [
            'The foundation. Where all music begins. The earth hums this note.',
            'The rising. Hope. The sun climbing after dawn.',
            'Joy. Bright and uncomplicated. A child\'s laugh.',
            'Longing. The note that aches. That remembers.',
            'Triumph. The hero\'s return. The sun at noon.',
            'Beauty. Pure and sorrowful. The most human note.',
            'Release. The final breath. The note that lets go.',
        ];

        const pillarBaseX = W / 2 - 180;
        const pillarBaseY = 340;

        notes.forEach((note, i) => {
            const angle = (i / (notes.length - 1)) * Math.PI - Math.PI;
            const px = W/2 + Math.cos(angle) * 200;
            const py = pillarBaseY + Math.abs(Math.sin(angle)) * 60;

            m.buildPillar({
                ...GaiaMason.mat('marble_sun'),
                x: px - 12, y: py, width: 22, height: 240 - i * 8, z: 4,
                capital: true, capitalHeight: 18
            });

            // Note glyph
            m.buildInscription({
                text: note,
                x: px - 4, y: py - 16,
                fontSize: 14, color: 'rgba(255,200,68,0.5)',
                fontFamily: "'Cinzel',serif", z: 6
            });

            // Name below
            m.buildInscription({
                text: noteNames[i],
                x: px - 8, y: py + 230 - i * 8,
                fontSize: 6, color: 'rgba(200,168,76,0.3)',
                fontFamily: "'Cinzel',serif", z: 5
            });

            // Zone
            const pillarZone = makeZone(px - 16, py, 32, 220, `Touch the ${noteNames[i]} stone`, () => {
                if (!state.musicStonesTouched.includes(note)) {
                    state.musicStonesTouched.push(note);
                }
                toast(`🎵 ${noteNames[i]} — ${noteWhispers[i]}`);
                m.spawnParticles({
                    x: px, y: py + 100, count: 6,
                    color: '#ffe088', minSize: 2, maxSize: 5,
                    riseDistance: 50, spreadX: 30,
                    durationMin: 1.5, durationMax: 3, z: 50
                });
                saveState();
            });
            container.appendChild(pillarZone);
        });

        // ── LAUREL CROWN ARCH — above the pillars ──
        m.buildArch({
            chars: ['▲','▼','◆','▲','▼'],
            textColor: '#5a8a4a', fontSize: 22,
            fontFamily: "'Georgia',serif",
            cx: W/2, cy: 310, innerRadius: 210,
            stoneCount: 27, stoneDepth: 22, z: 7,
            keystoneChar: '☀️', keystoneOversize: 2.0
        });

        m.buildInscription({
            text: 'THE LAUREL CROWN',
            x: W/2 - 60, y: 100,
            fontSize: 7, color: 'rgba(90,138,74,0.5)',
            fontFamily: "'Cinzel',serif", z: 8
        });

        // Crown zone
        const crownZone = makeZone(W/2 - 80, 280, 160, 60, 'Stand beneath the Laurel Crown', () => {
            state.crownWorn++;
            const blessings = [
                'The laurel settles on your brow. For a moment, you understand everything.',
                'Victory. Truth. The crown remembers every champion who wore it.',
                'You are crowned. The light bends toward you. Apollo smiles.',
            ];
            toast('🌿 ' + blessings[state.crownWorn % blessings.length]);
            saveState();
        });
        container.appendChild(crownZone);

        // ── THE ORACLE'S TRIPOD — center ──
        // Base platform
        m.buildWall({
            ...GaiaMason.mat('oracle_black'),
            x: W/2 - 55, y: 500, width: 110, height: 15, z: 8
        });

        // Three legs
        for (let l = 0; l < 3; l++) {
            const lx = W/2 - 8 + Math.cos(l/3*Math.PI*2 - Math.PI/2) * 30;
            const ly = 400;
            m.buildPillar({
                ...GaiaMason.mat('tripod_bronze'),
                x: lx, y: ly, width: 8, height: 100, z: 7
            });
        }

        // Bowl on top
        m.buildWall({
            ...GaiaMason.mat('tripod_bronze'),
            x: W/2 - 30, y: 380, width: 60, height: 25, z: 9,
            shape: 'circle'
        });

        // Inner void
        m.buildWall({
            ...GaiaMason.mat('void_black'),
            x: W/2 - 22, y: 384, width: 44, height: 18, z: 10,
            shape: 'circle'
        });

        // Prophecy vapor glow
        const vaporGlow = document.createElement('div');
        vaporGlow.style.cssText = `
            position: absolute; left: ${W/2 - 28}px; top: 370px;
            width: 56px; height: 40px; border-radius: 50%;
            background: radial-gradient(ellipse, rgba(255,220,120,0.3) 0%, transparent 70%);
            pointer-events: none; z-index: 11;
            animation: tripodGlow 3s ease-in-out infinite;
        `;
        container.appendChild(vaporGlow);

        m.buildInscription({
            text: 'THE ORACLE',
            x: W/2 - 32, y: 520,
            fontSize: 7, color: 'rgba(255,200,68,0.5)',
            fontFamily: "'Cinzel',serif", z: 10,
            animation: 'goldShimmer 4s ease-in-out infinite'
        });

        // Tripod zone
        const tripodZone = makeZone(W/2 - 50, 380, 100, 140, 'Approach the Oracle\'s Tripod', () => {
            state.propheciesReceived++;
            const prophecies = [
                'A golden thread runs through your life. Follow it. It leads to the sun.',
                'You will speak a truth tomorrow that changes someone. Speak it kindly.',
                'The lyre has seven strings. You have heard six. The seventh is yours to pluck.',
                'Beware the shadow at noon. It is your own. It means you are standing in light.',
                'Someone you have not yet met is already grateful for something you will do.',
                'The laurel does not grow for the impatient. But it grows. Wait.',
            ];
            toast('🔮 ' + prophecies[state.propheciesReceived % prophecies.length]);
            m.spawnParticles({
                x: W/2, y: 400, count: 10,
                color: '#ffe088', minSize: 3, maxSize: 7,
                riseDistance: 80, spreadX: 60,
                durationMin: 2, durationMax: 5, z: 50
            });
            saveState();
        });
        container.appendChild(tripodZone);

        // ── THE REFLECTING POOL — foreground ──
        m.buildWall({
            chars: ['~','·','≋','·','~'],
            textColor: '#c8b840', mortarColor: '#8a7a40',
            fontSize: 22, lineHeight: 0.5, letterSpacing: 2,
            fontFamily: "'Georgia',serif",
            x: W/2 - 90, y: 700, width: 180, height: 40, z: 4,
            shape: 'circle'
        });

        m.buildInscription({
            text: 'THE REFLECTING POOL',
            x: W/2 - 60, y: 745,
            fontSize: 6, color: 'rgba(200,168,76,0.4)',
            fontFamily: "'Cinzel',serif", z: 6
        });

        // Pool zone
        const poolZone = makeZone(W/2 - 80, 695, 160, 50, 'Gaze into the Reflecting Pool', () => {
            state.poolGazed++;
            const reflections = [
                'You see the sun reflected. But it\'s not the sun. It\'s your own face, radiant.',
                'The pool shows you healing. A wound you forgot about. It\'s closing.',
                'Light ripples. A face appears. Someone who loves you. They\'re thinking of you now.',
                'You see yourself as a child. Then as an elder. Both are smiling. Both are you.',
            ];
            toast('🌊 ' + reflections[state.poolGazed % reflections.length]);
            saveState();
        });
        container.appendChild(poolZone);

        // ── EXIT PORTALS ──
        // Left — to Demeter
        m.buildArch({
            chars: ['◆','◇','◆','◇'],
            textColor: '#e8d080', fontSize: 16,
            fontFamily: "'Georgia',serif",
            cx: 80, cy: 770, innerRadius: 35,
            stoneCount: 9, stoneDepth: 14, z: 10,
            keystoneChar: '🌾', keystoneOversize: 1.4
        });

        m.buildInscription({
            text: 'TO THE GROVE',
            x: 58, y: 810,
            fontSize: 5, color: 'rgba(136,153,102,0.5)',
            fontFamily: "'Cinzel',serif", z: 11
        });

        const demeterZone = makeZone(45, 750, 70, 55, 'Travel to Demeter\'s Grove', () => {
            saveState();
            toast('🌾 You journey to the Sacred Grove...');
            setTimeout(() => { window.location.href = '../demeter/realm.html?from=apollo'; }, 1000);
        });
        container.appendChild(demeterZone);

        // Center — to Gwalenn
        m.buildArch({
            chars: ['◆','◇','◆','◇'],
            textColor: '#e8d080', fontSize: 16,
            fontFamily: "'Georgia',serif",
            cx: W/2, cy: 800, innerRadius: 40,
            stoneCount: 11, stoneDepth: 16, z: 10,
            keystoneChar: '✦', keystoneOversize: 1.5
        });

        m.buildInscription({
            text: 'TO THE HAVEN',
            x: W/2 - 38, y: 845,
            fontSize: 5, color: 'rgba(212,175,55,0.5)',
            fontFamily: "'Cinzel',serif", z: 11
        });

        const gwalennZone = makeZone(W/2 - 40, 775, 80, 60, 'Rise to Gwalenn', () => {
            saveState();
            toast('🏛️ You rise to the Olympian Haven...');
            setTimeout(() => { window.location.href = '../gwalenn.html?from=apollo'; }, 1000);
        });
        container.appendChild(gwalennZone);

        // Right — to Aphrodite
        m.buildArch({
            chars: ['◆','◇','◆','◇'],
            textColor: '#e8d080', fontSize: 16,
            fontFamily: "'Georgia',serif",
            cx: W - 80, cy: 770, innerRadius: 35,
            stoneCount: 9, stoneDepth: 14, z: 10,
            keystoneChar: '◆', keystoneOversize: 1.4
        });

        m.buildInscription({
            text: 'TO THE TEMPLE',
            x: W - 105, y: 810,
            fontSize: 5, color: 'rgba(216,160,184,0.5)',
            fontFamily: "'Cinzel',serif", z: 11
        });

        const aphroditeZone = makeZone(W - 115, 750, 70, 55, 'Travel to Aphrodite\'s Temple', () => {
            saveState();
            toast('🕊️ You journey to the Sea-Foam Temple...');
            setTimeout(() => { window.location.href = '../aphrodite/realm.html?from=apollo'; }, 1000);
        });
        container.appendChild(aphroditeZone);

        // ── INSCRIPTIONS ──
        m.buildInscription({
            text: 'ΓΝΩΘΙ ΣΕΑΥΤΟΝ  ·  KNOW THYSELF',
            x: W/2 - 120, y: 870,
            fontSize: 7, color: 'rgba(255,200,68,0.25)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        m.buildInscription({
            text: 'APOLLO  ·  PHOEBUS  ·  LOXIAS  ·  PAEAN',
            x: W/2 - 130, y: 888,
            fontSize: 6, color: 'rgba(200,168,76,0.3)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        // ── AMBIENT ──
        m.buildLight({ color: '#ffe088', radius: 90, x: W/2, y: 350, pulse: true, z: 0 });
        m.buildLight({ color: '#ffe088', radius: 60, x: W/2, y: 450, pulse: true, z: 0 });

        m.spawnAmbientFall({
            count: 5,
            color: 'rgba(255,220,120,0.15)',
            minSize: 1, maxSize: 3,
            speedMin: 18, speedMax: 35,
            z: 8
        });

        return m;
    }

    // ═══════════════════════════════════
    // INIT
    // ═══════════════════════════════════

    function init() {
        const loaded = loadState();
        if (!loaded) saveState();

        state.visits++;
        saveState();

        setupOuranos();
        setupPontus();
        buildTemple();

        const params = new URLSearchParams(window.location.search);
        if (params.get('from')) {
            toast(`☀️ You arrive from the ${params.get('from')}. The Solar Temple illuminates your path.`);
            window.history.replaceState({}, '', 'realm.html');
        } else {
            const welcome = state.visits > 1
                ? '☀️ The Solar Temple remembers your light. The oracle awaits your question.'
                : '☀️ You enter the Solar Temple. Seven pillars hum. The tripod glows. Truth awaits.';
            toast(welcome);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.target.closest('input,textarea')) {
                e.preventDefault();
                const tripod = document.querySelector('[title="Approach the Oracle\'s Tripod"]');
                if (tripod) tripod.click();
            }
        });
    }

    init();
    </script>
</body>
