<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☀️ APOLLO · The Complete Sanctuary</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --gold-bright: #f0d080;
            --sun: #ffcc44;
            --sun-bright: #ffe088;
            --deep: #0a0c12;
            --surface: #141820;
            --surface-light: #1e2432;
            --text: #bcbcbc;
            --text-dim: #7a7a8a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--deep);
            color: var(--text);
            font-family: 'EB Garamond', Georgia, serif;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(255,200,68,0.06), transparent 60%);
        }
        
        /* Header / Title Bar */
        .apollo-header {
            text-align: center;
            padding: 1.5rem 1rem 0.5rem;
            border-bottom: 1px solid rgba(201,168,76,0.2);
        }
        .apollo-glyph {
            font-size: 2.5rem;
            display: inline-block;
            margin-right: 0.75rem;
            vertical-align: middle;
        }
        .apollo-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.8rem;
            letter-spacing: 0.2em;
            color: var(--sun-bright);
            display: inline-block;
            vertical-align: middle;
        }
        .phi-sub {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: var(--gold);
            margin-top: 0.25rem;
        }
        
        /* Tab Bar */
        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.25rem;
            padding: 1rem 1rem 0;
            border-bottom: 1px solid rgba(201,168,76,0.15);
            background: rgba(10,12,18,0.8);
        }
        .tab-btn {
            background: var(--surface);
            border: none;
            color: var(--text-dim);
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--surface-light);
            color: var(--sun);
            border-bottom: 2px solid var(--sun);
        }
        .tab-btn:hover:not(.active) {
            color: var(--gold);
            background: #1a1e2a;
        }
        
        /* Content Container — where loaded pages go */
        .content-container {
            margin: 1rem;
            min-height: 70vh;
            background: rgba(10,12,18,0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(201,168,76,0.1);
        }
        
        iframe.sanctum-frame {
            width: 100%;
            height: 75vh;
            border: none;
            background: var(--deep);
            display: block;
        }
        
        .footer-note {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            color: rgba(201,168,76,0.3);
            padding: 1.5rem;
            border-top: 1px solid rgba(201,168,76,0.08);
            margin-top: 1rem;
        }
        
        @media (max-width: 700px) {
            .tab-btn { padding: 0.4rem 0.8rem; font-size: 0.65rem; }
            .apollo-title { font-size: 1.2rem; }
            iframe.sanctum-frame { height: 65vh; }
        }
    </style>
</head>
<body>

<div class="apollo-header">
    <span class="apollo-glyph">☀️</span>
    <span class="apollo-title">APOLLO</span>
    <div class="phi-sub">THE COMPLETE SANCTUARY · φ ENGINE · ALL MODES</div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" data-tab="table">🃏 THE TABLE</button>
    <button class="tab-btn" data-tab="chat">💬 THE VOICE</button>
    <button class="tab-btn" data-tab="prophecy">🔮 PROPHECY</button>
    <button class="tab-btn" data-tab="studio">🎨 STUDIO</button>
</div>

<div class="content-container">
    <iframe id="sanctuaryFrame" class="sanctum-frame" src="apolloTable.html" title="Apollo Sanctuary"></iframe>
</div>

<div class="footer-note">
    GAIA · Apollo Engine · The Table · The Voice · The Prophecy · The Studio
</div>

<script>
    // Map tabs to their respective HTML files
    const tabMap = {
        table: 'apolloTable.html',
        chat: 'chat.html',
        prophecy: 'prophecy.html',
        studio: 'studio.html'
    };
    
    const iframe = document.getElementById('sanctuaryFrame');
    const tabs = document.querySelectorAll('.tab-btn');
    
    function switchTab(tabId) {
        const url = tabMap[tabId];
        if (url && iframe.src.indexOf(url) === -1) {
            iframe.src = url;
        }
        
        // Update active class on buttons
        tabs.forEach(btn => {
            const btnTab = btn.getAttribute('data-tab');
            if (btnTab === tabId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }
    
    // Attach click handlers
    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.getAttribute('data-tab');
            switchTab(tabId);
        });
    });
    
    // Optional: restore last viewed tab from localStorage
    const lastTab = localStorage.getItem('apollo_last_tab');
    if (lastTab && tabMap[lastTab]) {
        switchTab(lastTab);
    }
    
    // Save current tab when changing
    iframe.addEventListener('load', () => {
        const activeTab = document.querySelector('.tab-btn.active')?.getAttribute('data-tab');
        if (activeTab) localStorage.setItem('apollo_last_tab', activeTab);
    });
</script>
</body>
</html>
