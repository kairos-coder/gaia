<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Zeus · Judgment API</title>
  <style>
    :root {
      --bg: #07090c; --surface: #141b22; --text: #c0ccd8; --text-dim: #6a7a8a;
      --accent: #ffcc44; --accent-dim: #9a8030; --border: rgba(138,155,176,0.15);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Courier New',monospace; padding:1.5rem; min-height:100vh; }
    h1 { color:var(--accent); font-size:0.9rem; margin-bottom:0.25rem; }
    .subtitle { color:var(--text-dim); font-size:0.65rem; margin-bottom:1.5rem; }
    .endpoint { font-size:0.65rem; color:var(--text-dim); margin-bottom:0.3rem; padding:0.3rem 0.5rem; background:var(--surface); border-left:2px solid var(--accent); }
    pre { background:var(--surface); border:1px solid var(--border); padding:1rem; font-size:0.7rem; line-height:1.5; white-space:pre-wrap; max-height:70vh; overflow-y:auto; }
  </style>
</head>
<body>
  <h1>⚡ Zeus · Judgment API</h1>
  <p class="subtitle">Law · Sovereignty · Binding Judgment</p>
  <div class="endpoint">?view=judge&context=X&action=Y — Render binding judgment</div>
  <div class="endpoint">?view=status — Sovereignty level and domain health</div>
  <div class="endpoint">?view=precedents&context=X — Prior judgments</div>
  <pre id="output">{}</pre>

  <script>
    const ZEUS = {
      id: 'zeus', name: 'Zeus', emoji: '⚡',
      domain: ['law', 'sovereignty', 'judgment'],
      sovereignty_level: 1.0,
      judgments: [],

      judge(context, action) {
        const lawfulActions = ['mark_interval', 'measure_succession', 'illuminate', 'nourish', 'record', 'bind'];
        const chaosActions = ['overthrow', 'usurp', 'sever', 'dissolve'];
        let verdict = 'acknowledged';
        if (chaosActions.includes(action)) verdict = 'overruled';
        else if (lawfulActions.includes(action)) verdict = 'lawful';
        
        const past = this.judgments.filter(j => j.context === context);
        const precedent = past.length > 0 ? past[past.length - 1].verdict : 'first_of_kind';
        
        const judgment = {
          olympian: 'zeus', operation: 'judge',
          context, action,
          timestamp: new Date().toISOString(),
          verdict,
          sovereignty_score: this.sovereignty_level,
          precedent_cited: precedent,
          binding: verdict !== 'overruled',
          appeal_window: '24 ticks'
        };
        
        this.judgments.push(judgment);
        
        // Log to Kronos ledger (shared localStorage)
        if (window.KronosGatekeeper) {
          const summary = `Verdict: ${verdict} | Score: ${this.sovereignty_level}`;
          const entry = window.KronosGatekeeper.log('zeus', 'judge', { context, action }, summary, {
            titan_routes: [{ titan: 'kronos', type: 'judge' }, { titan: 'themis', type: 'binding' }]
          });
          judgment.ledger_entry = entry.entry_id;
        }
        
        return judgment;
      },

      getStatus() {
        return {
          olympian: 'zeus',
          sovereignty_level: this.sovereignty_level,
          total_judgments: this.judgments.length,
          last_judgment: this.judgments[this.judgments.length - 1] || null,
          domain_health: this.sovereignty_level > 0.7 ? 'stable' : 'contested'
        };
      },

      getPrecedents(context) {
        return this.judgments.filter(j => j.context === context);
      }
    };

    // Expose for council.html
    window.ZeusAPI = ZEUS;

    (function handleRequest() {
      const p = new URLSearchParams(window.location.search);
      const view = p.get('view') || 'status';
      const context = p.get('context') || '';
      const action = p.get('action') || '';
      let result;

      if (view === 'judge') {
        if (!context || !action) {
          result = { error: 'judge requires ?context=X&action=Y' };
        } else {
          result = ZEUS.judge(context, action);
        }
      } else if (view === 'status') {
        result = ZEUS.getStatus();
      } else if (view === 'precedents') {
        result = context ? { olympian: 'zeus', context, precedents: ZEUS.getPrecedents(context) } : { error: 'precedents requires ?context=X' };
      } else {
        result = { error: `Unknown view: ${view}`, valid_views: ['judge', 'status', 'precedents'] };
      }

      document.getElementById('output').textContent = JSON.stringify(result, null, 2);
    })();
  </script>
</body>
</html>
