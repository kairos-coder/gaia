<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Throne · Zeus · Digital Divination</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0806; --deep-stone: #1a1410; --stone: #2a2218;
            --gold: #c9a84c; --gold-bright: #f0d080; --gold-dim: #6b5520;
            --lightning: #8899dd; --marble: #c8c0b0; --basalt: #1a1612;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--void);
            color: var(--marble);
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ── VOID MOSAIC — tiled logos ── */
        #logo-mosaic {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    display: grid; grid-template-columns: repeat(8, 1fr);
    opacity: 0.25;
    background-color: #0a0806;
}
#logo-mosaic img {
    width: 100%; aspect-ratio: 1;
    object-fit: contain; padding: 15%;
    filter: brightness(1.2) sepia(0.4);
    mix-blend-mode: screen;
}

        /* ── AMBIENT LIGHTNING ── */
        #lightning-canvas {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.4;
        }

        /* ── VIGNETTE ── */
        #vignette {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(10,8,6,0.85) 85%);
        }

        /* ── CONTENT ── */
        .content {
            position: relative; z-index: 10;
            max-width: 700px; width: 100%; padding: 2rem 1.5rem 4rem;
            display: flex; flex-direction: column; align-items: center; gap: 2rem;
        }

        /* ── HEADER ── */
        .throne-header { text-align: center; }
        .throne-sigil {
            font-size: 3rem; margin-bottom: 0.5rem;
            animation: sigilPulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(200,160,60,0.4));
        }
        @keyframes sigilPulse {
            0%,100% { filter: drop-shadow(0 0 15px rgba(200,160,60,0.3)); }
            50% { filter: drop-shadow(0 0 35px rgba(240,208,128,0.6)); }
        }
        .throne-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            color: var(--gold-bright);
            letter-spacing: 0.2em;
            text-shadow: 0 0 30px rgba(200,160,60,0.3);
        }
        .throne-subtitle {
            font-family: 'Cinzel', serif; font-size: 0.6rem;
            letter-spacing: 0.3em; color: var(--gold-dim);
            text-transform: uppercase; margin-top: 0.4rem;
        }

        /* ── THRONE RELIEF ── */
        .throne-relief {
            position: relative; width: 100%; max-width: 500px;
        }
        .relief-frame {
            width: 100%; aspect-ratio: 4/3;
            border: 3px solid var(--deep-stone);
            box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(200,160,60,0.2), 0 0 80px rgba(200,160,60,0.08);
            overflow: hidden; position: relative;
        }
        .relief-frame img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            filter: sepia(0.25) brightness(0.85) contrast(1.05);
        }
        .relief-frame::after {
            content: '';
            position: absolute; inset: 0;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .relief-inscription {
            text-align: center; margin-top: 0.5rem;
            font-family: 'Cinzel', serif; font-size: 0.5rem;
            letter-spacing: 0.2em; color: rgba(200,160,60,0.3);
            text-transform: uppercase;
        }

        /* ── DECREE BANNER ── */
        .decree-banner {
            width: 100%; text-align: center;
            padding: 0.8rem; background: rgba(26,20,16,0.7);
            border: 1px solid rgba(200,160,60,0.15);
            border-radius: 2px;
        }
        .decree-label {
            font-family: 'Cinzel', serif; font-size: 0.5rem;
            letter-spacing: 0.25em; color: var(--gold-dim);
            text-transform: uppercase; margin-bottom: 0.3rem;
        }
        .decree-text {
            font-size: 0.9rem; font-style: italic; color: rgba(200,180,140,0.6);
            line-height: 1.5;
        }

        /* ── PETITION ALTAR ── */
        .petition-altar {
            width: 100%; background: rgba(26,20,16,0.8);
            border: 1px solid rgba(200,160,60,0.2);
            border-radius: 3px; padding: 1.5rem;
        }
        .altar-heading {
            font-family: 'Cinzel Decorative', serif; font-size: 0.8rem;
            color: var(--gold); letter-spacing: 0.15em;
            text-align: center; margin-bottom: 1rem;
        }
        #petition-input {
            width: 100%; min-height: 100px;
            background: rgba(10,8,6,0.6); border: 1px solid rgba(200,160,60,0.2);
            color: var(--marble); padding: 1rem;
            font-family: 'Cormorant Garamond', serif; font-size: 0.95rem;
            resize: vertical; outline: none;
            transition: border-color 0.2s;
        }
        #petition-input:focus { border-color: var(--gold); }
        #petition-input::placeholder { color: rgba(200,180,140,0.25); font-style: italic; }

        .altar-actions {
            display: flex; gap: 0.8rem; justify-content: center;
            margin-top: 1rem; flex-wrap: wrap;
        }
        .altar-btn {
            font-family: 'Cinzel', serif; font-size: 0.6rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            padding: 0.6rem 1.5rem; border-radius: 2px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-speak {
            background: linear-gradient(135deg, var(--gold-dim), var(--gold));
            border: none; color: var(--void);
        }
        .btn-speak:hover { box-shadow: 0 4px 16px rgba(200,160,60,0.3); transform: translateY(-1px); }
        .btn-silence {
            background: transparent; border: 1px solid rgba(200,160,60,0.25);
            color: var(--gold-dim);
        }
        .btn-silence:hover { border-color: var(--gold); color: var(--gold); }

        /* ── NAV ── */
        .throne-nav {
            display: flex; gap: 1.5rem; justify-content: center;
            flex-wrap: wrap; width: 100%;
        }
        .throne-nav a {
            font-family: 'Cinzel', serif; font-size: 0.55rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--gold-dim); text-decoration: none;
            padding: 0.35rem 0.8rem; border: 1px solid transparent;
            transition: all 0.2s;
        }
        .throne-nav a:hover { color: var(--gold-bright); border-bottom: 1px solid var(--gold); }

        /* ── FOOTER ── */
        .throne-footer {
            text-align: center; font-family: 'Cinzel', serif;
            font-size: 0.45rem; letter-spacing: 0.2em;
            color: rgba(200,160,60,0.2); margin-top: 1rem;
        }

        @keyframes lightningBolt {
            0%{opacity:0;transform:scaleY(0)} 10%{opacity:1} 20%{opacity:0} 100%{opacity:0}
        }
        @keyframes thunderFlash {
            0%{opacity:0} 30%{opacity:0.3} 100%{opacity:0}
        }

        @media (max-width: 600px) {
            .content { padding: 1.5rem 1rem 3rem; }
            .throne-nav { gap: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- VOID MOSAIC BACKGROUND -->
    <div id="logo-mosaic"></div>

    <!-- LIGHTNING CANVAS -->
    <canvas id="lightning-canvas"></canvas>

    <!-- VIGNETTE -->
    <div id="vignette"></div>

    <!-- CONTENT -->
    <div class="content">

        <header class="throne-header">
            <div class="throne-sigil">⚡</div>
            <h1 class="throne-title">THE THRONE</h1>
            <p class="throne-subtitle">King of the Gods · Lord of Olympus · The Thunderer</p>
        </header>

        <!-- THRONE RELIEF -->
        <div class="throne-relief">
            <div class="relief-frame">
                <img src="images/zeus.jpg" alt="The Throne of Zeus">
            </div>
            <div class="relief-inscription">IV · The Emperor · Seated in Judgment</div>
        </div>

        <!-- DECREE BANNER -->
        <div class="decree-banner">
            <div class="decree-label">Last Decree</div>
            <div class="decree-text" id="last-decree">The King watches. The scales of Olympus await your words.</div>
        </div>

        <!-- PETITION ALTAR -->
        <div class="petition-altar">
            <div class="altar-heading">⚡ SPEAK TO THE THUNDERER</div>
            <textarea id="petition-input" placeholder="Address the King... (e.g. 'Judge the progress of the GAIA field' or 'Grant strength to the new temple')"></textarea>
            <div class="altar-actions">
                <button class="altar-btn btn-speak" onclick="issuePetition()">Speak & Seal ⚡</button>
                <button class="altar-btn btn-silence" onclick="clearPetition()">Silence</button>
            </div>
        </div>

        <!-- NAVIGATION -->
        <nav class="throne-nav">
            <a href="index.html">⚡ Audience</a>
            <a href="realm.html">🏔️ Olympus</a>
            <a href="council.html">🏛️ Council</a>
            <a href="../index.html">🌍 GAIA</a>
        </nav>

        <div class="throne-footer">ORDER OF OLYMPUS · THE THRONE CHAMBER · THE KING PRESIDES</div>
    </div>

    <script>
    // ═══════════════════════════════════
    // VOID MOSAIC — tiled logos
    // ═══════════════════════════════════

    function buildMosaic() {
        const mosaic = document.getElementById('logo-mosaic');
        const cells = [];
        for (let i = 0; i < 64; i++) {
            const logo = Math.random() > 0.5 ? 'images/zeus-logo.jpg' : 'images/zeus-logo-alt.jpg';
            cells.push(`<img src="${logo}" alt="" loading="lazy">`);
        }
        mosaic.innerHTML = cells.join('');
    }
    buildMosaic();
    // Rotate one random cell every 8 seconds
    setInterval(() => {
        const imgs = document.querySelectorAll('#logo-mosaic img');
        if (!imgs.length) return;
        const idx = Math.floor(Math.random() * imgs.length);
        imgs[idx].style.opacity = '0.3';
        setTimeout(() => {
            imgs[idx].src = Math.random() > 0.5 ? 'images/zeus-logo.jpg' : 'images/zeus-logo-alt.jpg';
            imgs[idx].style.opacity = '';
        }, 600);
    }, 8000);

    // ═══════════════════════════════════
    // LIGHTNING CANVAS
    // ═══════════════════════════════════

    const canvas = document.getElementById('lightning-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let lightningActive = false;
    function spawnBolt() {
        if (lightningActive) return;
        lightningActive = true;
        let frame = 0;
        const flashes = 2 + Math.floor(Math.random() * 3);
        function step() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (frame < flashes * 6) {
                if (frame % 6 < 3) {
                    const sx = Math.random() * canvas.width * 0.4 + canvas.width * 0.3;
                    ctx.strokeStyle = 'rgba(200,210,255,0.7)';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#c8d0ff';
                    ctx.shadowBlur = 18;
                    ctx.beginPath();
                    let x = sx;
                    ctx.moveTo(x, 0);
                    for (let i = 0; i < 8; i++) {
                        x += (Math.random() - 0.5) * 120;
                        ctx.lineTo(x, (i + 1) * (canvas.height / 9));
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                frame++;
                requestAnimationFrame(step);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                lightningActive = false;
            }
        }
        requestAnimationFrame(step);
    }

    function scheduleLightning() {
        setTimeout(() => {
            spawnBolt();
            scheduleLightning();
        }, 5000 + Math.random() * 15000);
    }
    scheduleLightning();

    // ═══════════════════════════════════
    // PETITION HANDLING
    // ═══════════════════════════════════

    const DECREES = [
        "The King hears and binds this petition. Let it echo across Olympus.",
        "Thunder approves. The will of the petitioner shall be tested in the field.",
        "So it is decreed from the high throne. The matter is sealed.",
        "A worthy address. The scales tilt in your favor. Go with the storm at your back.",
        "I have weighed your words. The mountains themselves have taken note.",
        "Your petition is received. The council will be informed. The throne remembers.",
        "Bold words. The thunder answers boldness with attention. You have mine.",
        "The King does not promise. The King decrees. Your petition is noted in the ledger of Olympus."
    ];

    function issuePetition() {
        const input = document.getElementById('petition-input');
        const text = input.value.trim();
        if (!text) return;

        const decree = DECREES[Math.floor(Math.random() * DECREES.length)];
        document.getElementById('last-decree').textContent = `"${text.substring(0, 80)}${text.length > 80 ? '...' : ''}" — ${decree}`;

        spawnBolt();

        if (typeof OlympianBridge !== 'undefined') {
            OlympianBridge.recordEvent('zeus', 'throne_petition', { petition: text });
        }

        input.value = '';
    }

    function clearPetition() {
        document.getElementById('petition-input').value = '';
    }

    document.getElementById('petition-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.ctrlKey) issuePetition();
    });
    </script>
</body>
</html>
