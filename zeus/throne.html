<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THRONE · Zeus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <script src="/nexus/olympian-bridge.js"></script>
    
    <style>
        :root {
            --gold: #c8970a;
            --gold-bright: #f0c040;
            --storm: #0a0a14;
            --storm-mid: #11112a;
            --white: #f5f0e0;
        }
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            background: var(--storm);
            color: var(--white);
            font-family: 'IM Fell English', serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #background {
            position: fixed; inset: 0; z-index: 0;
            background: url('images/zeus-background.jpg') center/cover no-repeat;
            filter: brightness(0.65) contrast(1.1);
            opacity: 0.85;
        }
        #throne-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(to bottom, transparent 40%, rgba(10,10,20,0.92) 75%);
            pointer-events: none;
        }
        canvas#lightning { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.45; }

        header {
            position: relative; z-index: 10;
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
        }
        .bolt { font-size: 4rem; animation: boltPulse 3s infinite alternate; }
        @keyframes boltPulse { 0% { opacity: 0.7; } 100% { opacity: 1; } }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(2.8rem, 9vw, 5rem);
            background: linear-gradient(90deg, #c8970a, #f0c040, #c8970a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.1em;
        }

        .throne-container {
            position: relative; z-index: 10;
            max-width: 820px;
            margin: 2rem auto;
            text-align: center;
        }
        .throne-image {
            width: 100%;
            max-width: 520px;
            border: 4px solid var(--gold);
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(240, 192, 64, 0.5);
            margin-bottom: 1.5rem;
        }

        .petition-box {
            position: relative; z-index: 10;
            max-width: 820px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(17,17,42,0.92);
            border: 2px solid var(--gold);
            border-radius: 12px;
        }
        #petition-input {
            width: 100%;
            min-height: 130px;
            background: rgba(10,10,20,0.8);
            border: 1px solid var(--gold);
            color: var(--white);
            padding: 1.2rem;
            font-family: 'IM Fell English', serif;
            font-size: 1.1rem;
        }
        button {
            margin-top: 1.2rem;
            background: var(--gold);
            color: #111;
            border: none;
            padding: 1rem 3rem;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 0.2em;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: var(--gold-bright);
            transform: scale(1.05);
        }

        .status {
            position: relative; z-index: 10;
            text-align: center;
            margin: 1.5rem auto;
            max-width: 600px;
            font-size: 0.95rem;
            color: #c8970a;
        }
    </style>
</head>
<body>

<div id="background"></div>
<div id="throne-overlay"></div>
<canvas id="lightning"></canvas>

<header>
    <div class="bolt">⚡</div>
    <h1>THE THRONE OF ZEUS</h1>
    <p style="font-family:Cinzel; color:#f0c040; letter-spacing:0.3em;">KING OF THE GODS · LORD OF OLYMPUS</p>
</header>

<div class="throne-container">
    <img src="images/zeus.jpg" alt="Throne of Zeus" class="throne-image">
    <!-- Fallback options: zeus-classical.jpg or zeus-card.jpg -->
</div>

<div class="status">
    <strong>TELOS:</strong> The King watches. The scales of Olympus await your words.<br>
    <span id="last-decree">LAST DECREE: —</span>
</div>

<div class="petition-box">
    <h3 style="color:var(--gold); margin-bottom:1rem; font-family:Cinzel;">SPEAK TO THE THUNDERER</h3>
    <textarea id="petition-input" placeholder="Address the King... (e.g. 'Judge the progress of GAIA field' or 'Grant strength to the new temple')"></textarea>
    <button onclick="issuePetition()">SPEAK &amp; SEAL ⚡</button>
</div>

<footer style="text-align:center; padding:2rem; color:#888; font-size:0.85rem; position:relative; z-index:10;">
    <a href="council.html" style="color:var(--gold);">→ Council Chamber</a> | 
    <a href="realm.html" style="color:var(--gold);">Realm Overview</a> | 
    <a href="index.html" style="color:var(--gold);">← Back to Zeus</a>
</footer>

<script>
// Lightning canvas
const canvas = document.getElementById('lightning');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function drawLightning() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (Math.random() > 0.78) {
        ctx.strokeStyle = 'rgba(255, 230, 120, 0.75)';
        ctx.lineWidth = 4 + Math.random() * 3;
        let x = Math.random() * canvas.width;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        for (let i = 0; i < 12; i++) {
            x += (Math.random() - 0.5) * 90;
            ctx.lineTo(x, i * (canvas.height / 11));
        }
        ctx.stroke();
    }
    requestAnimationFrame(drawLightning);
}
drawLightning();
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// Petition handling
function issuePetition() {
    const input = document.getElementById('petition-input');
    const text = input.value.trim();
    if (!text) return;

    const responses = [
        "The King hears and binds this petition. Let it echo across Olympus.",
        "Thunder approves. The will of the petitioner shall be tested in the field.",
        "So it is decreed from the high throne.",
        "A worthy address. The scales tilt in your favor."
    ];
    const response = responses[Math.floor(Math.random() * responses.length)];

    document.getElementById('last-decree').textContent = `LAST DECREE: \( {text.substring(0, 80)} \){text.length > 80 ? '...' : ''}`;

    // Flash
    canvas.style.opacity = '0.9';
    setTimeout(() => canvas.style.opacity = '0.45', 350);

    alert(`⚡ ZEUS RESPONDS ⚡\n\n${response}`);

    if (window.OlympianBridge) {
        window.OlympianBridge.recordEvent('zeus', 'throne_petition', { petition: text });
    }

    input.value = '';
}
</script>
</body>
</html>
