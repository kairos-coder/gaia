<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Council · Olympus · Digital Divination</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0806; --deep-stone: #1a1410; --stone: #2a2218;
            --gold: #c9a84c; --gold-bright: #f0d080; --gold-dim: #6b5520;
            --lightning: #8899dd; --marble: #c8c0b0; --basalt: #1a1612;
            --hearth: #c44f1c;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--void);
            color: var(--marble);
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ── VOID MOSAIC ── */
        #logo-mosaic {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            display: grid; grid-template-columns: repeat(8, 1fr);
            opacity: 0.08;
        }
        #logo-mosaic img {
            width: 100%; aspect-ratio: 1;
            object-fit: contain; padding: 25%;
            filter: brightness(0.8) sepia(0.4);
        }

        /* ── LIGHTNING ── */
        #lightning-canvas {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.3;
        }

        /* ── VIGNETTE ── */
        #vignette {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at 50% 40%, transparent 25%, rgba(10,8,6,0.9) 90%);
        }

        /* ── CONTENT ── */
        .content {
            position: relative; z-index: 10;
            max-width: 800px; width: 100%; padding: 2rem 1.5rem 4rem;
            display: flex; flex-direction: column; align-items: center; gap: 2rem;
        }

        /* ── HEADER ── */
        .council-header { text-align: center; }
        .council-sigil {
            font-size: 2.5rem; margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 20px rgba(200,160,60,0.3));
        }
        .council-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            color: var(--gold-bright); letter-spacing: 0.2em;
            text-shadow: 0 0 30px rgba(200,160,60,0.3);
        }
        .council-subtitle {
            font-family: 'Cinzel', serif; font-size: 0.55rem;
            letter-spacing: 0.3em; color: var(--gold-dim);
            text-transform: uppercase; margin-top: 0.4rem;
        }

        /* ── GODS ASSEMBLY ── */
        .gods-assembly {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1rem; width: 100%;
        }
        .god-seat {
            background: rgba(26,20,16,0.7);
            border: 1px solid rgba(200,160,60,0.12);
            border-radius: 3px; padding: 1.2rem 0.8rem;
            text-align: center; cursor: pointer;
            transition: all 0.3s; position: relative;
        }
        .god-seat::before {
            content: '';
            position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .god-seat:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 16px rgba(200,160,60,0.08);
        }
        .god-seat:hover::before { opacity: 1; }
        .god-glyph {
            font-size: 2rem; margin-bottom: 0.4rem;
            filter: drop-shadow(0 0 6px rgba(200,160,60,0.2));
        }
        .god-name {
            font-family: 'Cinzel Decorative', serif; font-size: 0.7rem;
            color: var(--gold); letter-spacing: 0.1em; margin-bottom: 0.2rem;
        }
        .god-domain {
            font-family: 'Cinzel', serif; font-size: 0.4rem;
            letter-spacing: 0.15em; color: var(--gold-dim);
            text-transform: uppercase;
        }

        /* ── MOTION ALTAR ── */
        .motion-altar {
            width: 100%; background: rgba(26,20,16,0.8);
            border: 1px solid rgba(200,160,60,0.2);
            border-radius: 3px; padding: 1.5rem;
        }
        .altar-heading {
            font-family: 'Cinzel Decorative', serif; font-size: 0.8rem;
            color: var(--gold); letter-spacing: 0.15em;
            text-align: center; margin-bottom: 1rem;
        }
        #motion-input {
            width: 100%; min-height: 90px;
            background: rgba(10,8,6,0.6); border: 1px solid rgba(200,160,60,0.2);
            color: var(--marble); padding: 1rem;
            font-family: 'Cormorant Garamond', serif; font-size: 0.9rem;
            resize: vertical; outline: none;
            transition: border-color 0.2s;
        }
        #motion-input:focus { border-color: var(--gold); }
        #motion-input::placeholder { color: rgba(200,180,140,0.25); font-style: italic; }

        .altar-actions {
            display: flex; gap: 0.8rem; justify-content: center;
            margin-top: 1rem; flex-wrap: wrap;
        }
        .altar-btn {
            font-family: 'Cinzel', serif; font-size: 0.6rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            padding: 0.6rem 1.5rem; border-radius: 2px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-call {
            background: linear-gradient(135deg, var(--gold-dim), var(--gold));
            border: none; color: var(--void);
        }
        .btn-call:hover { box-shadow: 0 4px 16px rgba(200,160,60,0.3); transform: translateY(-1px); }

        /* ── MINUTES TABLETS ── */
        .minutes-section { width: 100%; }
        .minutes-heading {
            font-family: 'Cinzel Decorative', serif; font-size: 0.8rem;
            color: var(--gold); letter-spacing: 0.15em;
            text-align: center; margin-bottom: 1rem;
        }
        .minute-tablet {
            background: rgba(26,20,16,0.7);
            border-left: 3px solid var(--gold-dim);
            padding: 0.8rem 1rem; margin-bottom: 0.6rem;
            border-radius: 0 2px 2px 0;
            font-size: 0.85rem; line-height: 1.6;
        }
        .minute-motion { color: var(--gold); font-style: italic; margin-bottom: 0.3rem; }
        .minute-decree { color: rgba(200,180,140,0.6); }
        .minute-time {
            font-family: 'Cinzel', serif; font-size: 0.4rem;
            letter-spacing: 0.15em; color: rgba(200,160,60,0.25);
            margin-top: 0.4rem;
        }
        .minutes-empty {
            text-align: center; padding: 2rem;
            color: rgba(200,180,140,0.2); font-style: italic;
        }

        /* ── NAV ── */
        .council-nav {
            display: flex; gap: 1.5rem; justify-content: center;
            flex-wrap: wrap; width: 100%;
        }
        .council-nav a {
            font-family: 'Cinzel', serif; font-size: 0.55rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--gold-dim); text-decoration: none;
            padding: 0.35rem 0.8rem; border: 1px solid transparent;
            transition: all 0.2s;
        }
        .council-nav a:hover { color: var(--gold-bright); border-bottom: 1px solid var(--gold); }

        /* ── FOOTER ── */
        .council-footer {
            text-align: center; font-family: 'Cinzel', serif;
            font-size: 0.45rem; letter-spacing: 0.2em;
            color: rgba(200,160,60,0.2);
        }

        @keyframes lightningBolt { 0%{opacity:0;transform:scaleY(0)} 10%{opacity:1} 20%{opacity:0} 100%{opacity:0} }

        @media (max-width: 600px) {
            .content { padding: 1.5rem 1rem 3rem; }
            .gods-assembly { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>

    <div id="logo-mosaic"></div>
    <canvas id="lightning-canvas"></canvas>
    <div id="vignette"></div>

    <div class="content">

        <header class="council-header">
            <div class="council-sigil">⚡🏛️⚡</div>
            <h1 class="council-title">THE COUNCIL</h1>
            <p class="council-subtitle">Zeus Presiding · All Voices Heard · Olympus Assembled</p>
        </header>

        <!-- GODS ASSEMBLY -->
        <div class="gods-assembly" id="gods-assembly"></div>

        <!-- MOTION ALTAR -->
        <div class="motion-altar">
            <div class="altar-heading">⚡ BRING A MOTION BEFORE THE COUNCIL</div>
            <textarea id="motion-input" placeholder="Speak the matter for judgment... (e.g. 'Shall we advance the temple build?' or 'What counsel for the chthonic audit?')"></textarea>
            <div class="altar-actions">
                <button class="altar-btn btn-call" onclick="callCouncil()">Call Council ⚡</button>
            </div>
        </div>

        <!-- MINUTES -->
        <div class="minutes-section">
            <div class="minutes-heading">📜 COUNCIL MINUTES</div>
            <div id="minutes-container">
                <div class="minutes-empty">No council minutes yet. Call the first motion.</div>
            </div>
        </div>

        <!-- NAVIGATION -->
        <nav class="council-nav">
            <a href="index.html">⚡ Audience</a>
            <a href="throne.html">⚡ Throne</a>
            <a href="realm.html">🏔️ Olympus</a>
            <a href="../index.html">🌍 GAIA</a>
        </nav>

        <div class="council-footer">ORDER OF OLYMPUS · THE COUNCIL CHAMBER · THE GODS ASSEMBLE</div>
    </div>

    <script>
    // ═══════════════════════════════════
    // VOID MOSAIC
    // ═══════════════════════════════════

    function buildMosaic() {
        const mosaic = document.getElementById('logo-mosaic');
        const cells = [];
        for (let i = 0; i < 64; i++) {
            const logo = Math.random() > 0.5 ? 'images/zeus-logo.jpg' : 'images/zeus-logo-alt.jpg';
            cells.push(`<img src="${logo}" alt="" loading="lazy" onerror="this.style.opacity='0'">`);
        }
        mosaic.innerHTML = cells.join('');
    }
    buildMosaic();
    setInterval(() => {
        const imgs = document.querySelectorAll('#logo-mosaic img');
        if (!imgs.length) return;
        const idx = Math.floor(Math.random() * imgs.length);
        imgs[idx].style.opacity = '0.3';
        setTimeout(() => {
            imgs[idx].src = Math.random() > 0.5 ? 'images/zeus-logo.jpg' : 'images/zeus-logo-alt.jpg';
            imgs[idx].style.opacity = '';
        }, 600);
    }, 8000);

    // ═══════════════════════════════════
    // LIGHTNING
    // ═══════════════════════════════════

    const canvas = document.getElementById('lightning-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let lightningActive = false;
    function spawnBolt() {
        if (lightningActive) return;
        lightningActive = true;
        let frame = 0;
        const flashes = 2 + Math.floor(Math.random() * 3);
        function step() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (frame < flashes * 6) {
                if (frame % 6 < 3) {
                    const sx = Math.random() * canvas.width * 0.4 + canvas.width * 0.3;
                    ctx.strokeStyle = 'rgba(200,210,255,0.6)';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#c8d0ff';
                    ctx.shadowBlur = 16;
                    ctx.beginPath();
                    let x = sx;
                    ctx.moveTo(x, 0);
                    for (let i = 0; i < 8; i++) {
                        x += (Math.random() - 0.5) * 120;
                        ctx.lineTo(x, (i + 1) * (canvas.height / 9));
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                frame++;
                requestAnimationFrame(step);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                lightningActive = false;
            }
        }
        requestAnimationFrame(step);
    }
    function scheduleLightning() {
        setTimeout(() => { spawnBolt(); scheduleLightning(); }, 5000 + Math.random() * 15000);
    }
    scheduleLightning();

    // ═══════════════════════════════════
    // GODS ASSEMBLY
    // ═══════════════════════════════════

    const OLYMPIANS = [
        { name:'Zeus', glyph:'⚡', domain:'King · Authority', color:'#f0d080' },
        { name:'Hera', glyph:'🦚', domain:'Covenant · Binding', color:'#55aabb' },
        { name:'Poseidon', glyph:'🔱', domain:'The Deep · Storms', color:'#44aaaa' },
        { name:'Demeter', glyph:'🌾', domain:'Harvest · Growth', color:'#88bb66' },
        { name:'Athena', glyph:'🦉', domain:'Wisdom · Strategy', color:'#aa88ee' },
        { name:'Apollo', glyph:'☀️', domain:'Light · Prophecy', color:'#ffaa44' },
        { name:'Artemis', glyph:'🏹', domain:'Hunt · Wilds', color:'#aaccaa' },
        { name:'Ares', glyph:'⚔️', domain:'War · Courage', color:'#d04030' },
        { name:'Aphrodite', glyph:'💋', domain:'Love · Desire', color:'#ff88aa' },
        { name:'Hephaestus', glyph:'🔨', domain:'Forge · Craft', color:'#ff8833' },
        { name:'Hermes', glyph:'☿', domain:'Messages · Trade', color:'#ccb888' },
        { name:'Hestia', glyph:'🔥', domain:'Hearth · Center', color:'#ddaa55' },
        { name:'Dionysus', glyph:'🍇', domain:'Ecstasy · Vine', color:'#cc88cc' },
        { name:'Hades', glyph:'🌑', domain:'Underworld · Gate', color:'#9966cc' },
    ];

    function renderGods() {
        const container = document.getElementById('gods-assembly');
        container.innerHTML = OLYMPIANS.map(god => `
            <div class="god-seat" onclick="godSpeaks('${god.name}')" title="${god.name} · ${god.domain}">
                <div class="god-glyph">${god.glyph}</div>
                <div class="god-name">${god.name.toUpperCase()}</div>
                <div class="god-domain">${god.domain}</div>
            </div>
        `).join('');
    }

    const GOD_WISDOM = {
        Zeus:     "Authority is not claimed. It is demonstrated in the silence before the thunder.",
        Hera:     "The veil is not a lie. It is a boundary. Honor it.",
        Poseidon: "What was built on sand will not be saved by argument. Only by rebuilding.",
        Demeter:  "The harvest comes from the field she starved. Even grief is a season.",
        Athena:   "The battle is already won or lost in the mind. The sword only confirms it.",
        Apollo:   "Your radiance is not an offering. It is a demand on the world.",
        Artemis:  "Sovereignty begins the moment you stop waiting to be chosen.",
        Ares:     "Every tradition was once a fresh wound. Ask what this one is still protecting.",
        Aphrodite:"The mirror shows what you want. It also shows what you are afraid to want.",
        Hephaestus:"The forge does not care that you were cast out. It only cares that you returned.",
        Hermes:   "You are the conduit. What passes through you is changed by passing through you.",
        Hestia:   "The flame does not need to roar to be eternal.",
        Dionysus: "The vine does not ask the wall for permission to climb it.",
        Hades:    "The underworld is not a punishment. It is where things go when they are finished."
    };

    function godSpeaks(name) {
        const wisdom = GOD_WISDOM[name] || 'I stand with the council.';
        
        // Flash the god's seat
        const seats = document.querySelectorAll('.god-seat');
        seats.forEach(seat => {
            if (seat.querySelector('.god-name').textContent === name) {
                seat.style.borderColor = 'var(--gold-bright)';
                seat.style.boxShadow = '0 0 20px rgba(200,160,60,0.3)';
                setTimeout(() => {
                    seat.style.borderColor = 'rgba(200,160,60,0.12)';
                    seat.style.boxShadow = '';
                }, 1500);
            }
        });

        // Show wisdom as toast-like inscription
        const existingToast = document.querySelector('.god-utterance');
        if (existingToast) existingToast.remove();
        
        const utterance = document.createElement('div');
        utterance.className = 'god-utterance';
        utterance.style.cssText = `
            width:100%; text-align:center; padding:1rem;
            background:rgba(26,20,16,0.9); border:1px solid var(--gold);
            border-radius:3px; margin-top:0.5rem;
            font-style:italic; color:var(--gold-bright);
            animation: utteranceFade 3s ease-out forwards;
        `;
        utterance.innerHTML = `<span style="font-size:1.2rem;">${OLYMPIANS.find(o=>o.name===name)?.glyph||''}</span><br>"${wisdom}"<br><span style="font-size:0.6rem;color:var(--gold-dim);">— ${name}</span>`;
        
        const assembly = document.getElementById('gods-assembly');
        assembly.after(utterance);
        setTimeout(() => utterance.remove(), 3500);

        // Add style for animation
        if (!document.getElementById('utterance-style')) {
            const style = document.createElement('style');
            style.id = 'utterance-style';
            style.textContent = '@keyframes utteranceFade { 0%{opacity:0;transform:translateY(8px)} 15%{opacity:1;transform:translateY(0)} 85%{opacity:1} 100%{opacity:0} }';
            document.head.appendChild(style);
        }
    }

    // ═══════════════════════════════════
    // COUNCIL MINUTES
    // ═══════════════════════════════════

    let minutes = JSON.parse(localStorage.getItem('zeus_council_minutes')) || [];

    function saveMinutes() {
        localStorage.setItem('zeus_council_minutes', JSON.stringify(minutes));
    }

    function renderMinutes() {
        const container = document.getElementById('minutes-container');
        if (!minutes.length) {
            container.innerHTML = '<div class="minutes-empty">No council minutes yet. Call the first motion.</div>';
            return;
        }
        container.innerHTML = minutes.slice().reverse().map(m => `
            <div class="minute-tablet">
                <div class="minute-motion">"${m.motion}"</div>
                <div class="minute-decree">⚡ ${m.decree}</div>
                <div class="minute-time">${new Date(m.time).toLocaleString()}</div>
            </div>
        `).join('');
    }

    function callCouncil() {
        const input = document.getElementById('motion-input');
        const motion = input.value.trim();
        if (!motion) return;

        const decrees = [
            "The Council finds favor. Let it be enacted.",
            "The gods are divided. Refine the motion and return.",
            "Zeus pounds the throne. The motion carries with thunder.",
            "Hera raises an objection. The covenant must be honored. Amend the motion.",
            "Athena counsels wisdom. The motion is sound in strategy. Advance.",
            "The Council is silent. The motion hangs. Return with clearer purpose.",
            "Hermes carries the motion to all realms. It is sealed and dispatched."
        ];
        const decree = decrees[Math.floor(Math.random() * decrees.length)];

        minutes.push({ time: new Date().toISOString(), motion, decree });
        if (minutes.length > 50) minutes = minutes.slice(-50);
        saveMinutes();
        renderMinutes();

        spawnBolt();
        input.value = '';

        if (typeof OlympianBridge !== 'undefined') {
            OlympianBridge.recordEvent('zeus', 'council_motion', { motion, decree });
        }
    }

    document.getElementById('motion-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.ctrlKey) callCouncil();
    });

    // ═══════════════════════════════════
    // INIT
    // ═══════════════════════════════════

    renderGods();
    renderMinutes();
    </script>
</body>
</html>
