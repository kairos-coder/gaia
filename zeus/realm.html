<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mount Olympus · Realm of Zeus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c; --gold-bright: #f0d080; --void: #0a0806;
            --lightning: #8899dd; --pontus: #2a4a6a; --marble: #d8d0c8;
            --storm: #1a1a2a; --amber: #ff8c00; --deep-stone: #2a2520;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--void);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            font-family: 'EB Garamond','Georgia',serif; color: var(--marble);
            background-image: radial-gradient(ellipse at 50% 15%, rgba(120,140,200,0.06) 0%, transparent 60%);
        }

        #olympus-container {
            width: 860px; max-width: 98vw; margin: 0 auto;
            overflow-y: auto; overflow-x: hidden; position: relative; z-index: 3;
            scroll-behavior: smooth; height: 100vh;
            border-left: 3px solid rgba(201,168,76,0.12);
            border-right: 3px solid rgba(201,168,76,0.12);
            box-shadow: 0 0 100px rgba(0,0,0,0.6), 0 0 200px rgba(0,0,0,0.3);
        }
        #olympus-container::-webkit-scrollbar { width: 6px; }
        #olympus-container::-webkit-scrollbar-track { background: var(--void); }
        #olympus-container::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 3px; }

        .mountain-level {
            position: relative; width: 100%;
            border-bottom: 1px solid rgba(201,168,76,0.08);
        }
        .level-scene { width: 100%; height: 100%; position: relative; }

        /* ── SCROLL MARKERS (logos between levels) ── */
        .scroll-marker {
            width: 100%; height: 60px; position: relative;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, rgba(10,8,6,0.95) 0%, rgba(26,20,16,0.8) 50%, rgba(10,8,6,0.95) 100%);
            border-bottom: 1px solid rgba(201,168,76,0.12);
        }
        .scroll-marker img {
            height: 36px; opacity: 0.5;
            filter: drop-shadow(0 0 8px rgba(200,160,60,0.3));
            transition: opacity 0.3s;
        }
        .scroll-marker:hover img { opacity: 0.8; }

        /* ── NAVIGATION ── */
        .mountain-nav {
            display: flex; gap: 0.4rem; justify-content: center;
            padding: 0.4rem; flex-wrap: wrap; position: sticky; top: 0;
            z-index: 50; background: rgba(10,8,6,0.9);
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(201,168,76,0.15);
        }
        .nav-btn {
            font-family: 'Cinzel',serif; font-size: 0.55rem;
            letter-spacing: 0.15em; background: rgba(26,20,16,0.7);
            border: 1px solid rgba(201,168,76,0.25); color: var(--gold);
            padding: 0.3rem 0.8rem; border-radius: 3px; cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: rgba(201,168,76,0.1); border-color: var(--gold); }

        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(10,8,6,0.95); border: 1px solid var(--gold);
            border-radius: 6px; padding: 0.5rem 1.2rem;
            font-family: 'EB Garamond',serif; font-size: 0.8rem;
            z-index: 200; opacity: 0; transition: opacity 0.4s;
            pointer-events: none; text-align: center; max-width: 440px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); white-space: pre-line;
        }
        #toast.show { opacity: 1; }

        .zone { cursor: pointer; transition: filter 0.25s, transform 0.25s; }
        .zone:hover { filter: brightness(1.35); z-index: 50 !important; }
        .zone:active { transform: scale(0.94); }

        @keyframes sparkFade { 0%{transform:scale(0.5);opacity:1} 100%{transform:scale(2.5);opacity:0} }
        @keyframes thunderFlash { 0%{opacity:0} 30%{opacity:0.35} 100%{opacity:0} }
        @keyframes lightningBolt { 0%{opacity:0;transform:scaleY(0)} 10%{opacity:1;transform:scaleY(1)} 20%{opacity:0} 100%{opacity:0} }
        @keyframes throneGlow { 0%,100%{box-shadow:0 0 20px rgba(200,160,60,0.15)} 50%{box-shadow:0 0 40px rgba(200,160,60,0.3)} }
        @keyframes eagleShift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
        @keyframes styxShimmer { 0%,100%{opacity:0.2} 50%{opacity:0.4} }
        @keyframes markerPulse { 0%,100%{filter:drop-shadow(0 0 6px rgba(200,160,60,0.2))} 50%{filter:drop-shadow(0 0 16px rgba(200,160,60,0.5))} }

        @media (max-width: 880px) {
            #olympus-container { width: 98vw; height: 100vh; }
        }
    </style>
</head>
<body>

    <nav class="mountain-nav">
        <button class="nav-btn" onclick="scrollToLevel('summit-level')">⚡ Summit</button>
        <button class="nav-btn" onclick="scrollToLevel('storm-belt-level')">🌪️ Storm</button>
        <button class="nav-btn" onclick="scrollToLevel('pantheon-ledge-level')">🏛️ Pantheon</button>
        <button class="nav-btn" onclick="scrollToLevel('great-hall-level')">🔥 Hall</button>
        <button class="nav-btn" onclick="scrollToLevel('lower-peak-level')">🪜 Ascent</button>
        <button class="nav-btn" onclick="window.location.href='../gwalenn.html'" style="border-color:rgba(201,168,76,0.4);">🔮 Gwalenn</button>
    </nav>

    <div id="olympus-container">

        <!-- ═══════════════════════════════════ -->
        <!-- SUMMIT LEVEL — zeus.jpg as centerpiece -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="summit-level" style="height:560px;">
            <div class="level-scene" id="summit-scene"></div>
        </div>

        <!-- Scroll Marker — logo-alt -->
        <div class="scroll-marker" id="marker1">
            <img src="images/zeus-logo-alt.jpg" alt="⚡" style="animation:markerPulse 3s ease-in-out infinite;" />
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- STORM BELT — zeus-background.jpg -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="storm-belt-level" style="height:160px;">
            <div class="level-scene" id="storm-scene"></div>
        </div>

        <!-- Scroll Marker — logo -->
        <div class="scroll-marker" id="marker2">
            <img src="images/zeus-logo.jpg" alt="⚡" />
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- PANTHEON LEDGE — zeus-classical.jpg -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="pantheon-ledge-level" style="height:280px;">
            <div class="level-scene" id="pantheon-scene"></div>
        </div>

        <!-- Scroll Marker — logo-alt -->
        <div class="scroll-marker" id="marker3">
            <img src="images/zeus-logo-alt.jpg" alt="⚡" />
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- GREAT HALL — GaiaMason pillars -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="great-hall-level" style="height:220px;">
            <div class="level-scene" id="hall-scene"></div>
        </div>

        <!-- Scroll Marker — logo -->
        <div class="scroll-marker" id="marker4">
            <img src="images/zeus-logo.jpg" alt="⚡" />
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- LOWER PEAK / ASCENT — card offering -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="lower-peak-level" style="height:160px;">
            <div class="level-scene" id="lower-scene"></div>
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- PONTUS FOUNDATION -->
        <!-- ═══════════════════════════════════ -->
        <div id="pontus-foundation" style="width:100%;height:80px;position:relative;"></div>

    </div>

    <div id="toast"></div>

    <script src="../js/gaia-mason.js"></script>
    <script>
    /*
     * ═══════════════════════════════════════════════════════
     * MOUNT OLYMPUS · Realm of Zeus · Refactored
     * Five levels. Four scroll markers. One throne.
     * Images woven into GaiaMason architecture.
     * ═══════════════════════════════════════════════════════
     */

    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg, d = 3500) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), d);
    }

    window.scrollToLevel = (levelId) => {
        document.getElementById(levelId)?.scrollIntoView({ behavior: 'smooth' });
    };

    function makeZone(x, y, w, h, title, action) {
        const el = document.createElement('div');
        el.className = 'zone'; el.title = title;
        el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:25;`;
        el.addEventListener('click', action);
        return el;
    }

    function spawnSparks(x, y, color, count, container) {
        for (let i = 0; i < count; i++) {
            const spark = document.createElement('div');
            spark.style.cssText = `position:absolute;left:${x+(Math.random()-0.5)*60}px;top:${y+(Math.random()-0.5)*40}px;width:3px;height:3px;background:${color};border-radius:50%;box-shadow:0 0 12px ${color};pointer-events:none;z-index:60;animation:sparkFade ${1+Math.random()}s ease-out forwards;`;
            container.appendChild(spark);
            setTimeout(() => spark.remove(), 1500);
        }
    }

    // ═══════════════════════════════════
    // PONTUS FOUNDATION
    // ═══════════════════════════════════

    function buildPontus() {
        const container = document.getElementById('pontus-foundation');
        const canvas = document.createElement('canvas');
        canvas.width = 860; canvas.height = 80;
        canvas.style.cssText = 'display:block;width:100%;height:100%;';
        container.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const waveTitans = [
            { freq: 0.6, amp: 0.8, color: [25, 80, 140] },
            { freq: 0.75, amp: 0.6, color: [35, 95, 155] },
            { freq: 0.9, amp: 0.5, color: [30, 85, 145] },
            { freq: 0.55, amp: 0.7, color: [20, 75, 135] },
        ];
        const offsets = waveTitans.map(() => Math.random() * Math.PI * 2);
        (function draw() {
            ctx.clearRect(0, 0, 860, 80);
            const bg = ctx.createLinearGradient(0, 0, 0, 80);
            bg.addColorStop(0, '#0a1828'); bg.addColorStop(1, '#152838');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, 860, 80);
            waveTitans.forEach((t, i) => {
                offsets[i] += 0.008 * t.freq;
                const yC = 18 + i * 18, amp = 4 + t.amp * 8;
                ctx.beginPath();
                ctx.strokeStyle = `rgba(${t.color[0]},${t.color[1]},${t.color[2]},0.4)`;
                ctx.lineWidth = 1;
                for (let x = 0; x <= 860; x += 3) {
                    const y = yC + Math.sin(x * 0.008 + offsets[i]) * amp + Math.sin(x * 0.02 + offsets[i] * 0.6) * (amp * 0.25);
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            });
            ctx.font = '7px Cinzel, serif';
            ctx.fillStyle = 'rgba(100,150,200,0.35)';
            ctx.textAlign = 'center';
            ctx.fillText('~  PONTUS  ·  THE ENCIRCLING SEA  ·  FOUNDATION OF OLYMPUS  ~', 430, 65);
            requestAnimationFrame(draw);
        })();
    }

    // ═══════════════════════════════════
    // SUMMIT — zeus.jpg centerpiece
    // ═══════════════════════════════════

    function buildSummit() {
        const container = document.getElementById('summit-scene');
        const m = new GaiaMason('summit-scene');
        const W = 860;

        // Custom materials
        GaiaMason.MATERIALS['olympus_marble'] = {
            chars: ['M','N','H','M','N'], textColor:'#e8e0d0', mortarColor:'#c8c0b0',
            fontSize:36, lineHeight:0.5, letterSpacing:-3, fontFamily:"'Cinzel','Georgia',serif", weathering:0.02
        };
        GaiaMason.MATERIALS['throne_gold'] = {
            chars: ['◆','◇','◆','◇','◆'], textColor:'#f0d080', mortarColor:'#a08030',
            fontSize:20, lineHeight:0.5, letterSpacing:0, fontFamily:"'Georgia',serif", weathering:0.01
        };
        GaiaMason.MATERIALS['cloud_olympus'] = {
            chars: ['⌒','⌣','~','⋅','⌒'], textColor:'#c8c8d8', mortarColor:'#a0a0b0',
            fontSize:18, lineHeight:0.6, letterSpacing:2, fontFamily:"'Georgia',serif", weathering:0
        };
        GaiaMason.MATERIALS['styx_water'] = {
            chars: ['~','≈','≋','~','≈'], textColor:'#3a6b8c', mortarColor:'#2a4a6a',
            fontSize:16, lineHeight:0.45, letterSpacing:1, fontFamily:"'Georgia',serif", weathering:0
        };

        // ── STORM BACKGROUND (zeus-background.jpg as CSS) ──
        const bgDiv = document.createElement('div');
        bgDiv.style.cssText = `
            position:absolute; inset:0; z-index:0;
            background-image:url('images/zeus-background.jpg');
            background-size:cover; background-position:center;
            opacity:0.12; filter:saturate(0.5) brightness(0.6);
            pointer-events:none;
        `;
        container.appendChild(bgDiv);

        // ── CLOUD LAYER (GaiaMason) ──
        m.buildWall({
            ...GaiaMason.mat('cloud_olympus'),
            x: 0, y: 0, width: W, height: 40, z: 1
        });
        m.buildWall({
            ...GaiaMason.mat('cloud_olympus'),
            x: 0, y: 520, width: W, height: 40, z: 1
        });

        // ── ZEUS IMAGE FRAME — zeus.jpg as centerpiece ──
        const imgW = 300, imgH = 220;
        const imgX = W/2 - imgW/2, imgY = 50;

        // Outer marble frame
        m.buildWall({
            ...GaiaMason.mat('olympus_marble'),
            x: imgX - 14, y: imgY - 8, width: imgW + 28, height: imgH + 24, z: 3
        });
        // Gold inner frame
        m.buildWall({
            ...GaiaMason.mat('throne_gold'),
            x: imgX - 6, y: imgY - 2, width: imgW + 12, height: imgH + 12, z: 4
        });

        const imgFrame = document.createElement('div');
        imgFrame.style.cssText = `
            position:absolute; left:${imgX}px; top:${imgY}px;
            width:${imgW}px; height:${imgH}px; z-index:5;
            animation:throneGlow 4s ease-in-out infinite;
            overflow:hidden;
        `;
        const img = document.createElement('img');
        img.src = 'images/zeus.jpg';
        img.alt = 'Zeus Enthroned';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1.05);';
        imgFrame.appendChild(img);
        container.appendChild(imgFrame);

        // Arch above image
        m.buildArch({
            ...GaiaMason.mat('throne_gold'),
            cx: W/2, cy: imgY - 4, innerRadius: imgW/2 + 4,
            stoneCount: 17, stoneDepth: 16, z: 6,
            keystoneChar: '⚡', keystoneOversize: 1.5
        });

        // Flanking eagle pillars
        m.buildPillar({
            ...GaiaMason.mat('olympus_marble'),
            x: imgX - 22, y: imgY + 10, width: 20, height: imgH + 4, z: 3,
            capital: true, capitalHeight: 14
        });
        m.buildPillar({
            ...GaiaMason.mat('olympus_marble'),
            x: imgX + imgW + 2, y: imgY + 10, width: 20, height: imgH + 4, z: 3,
            capital: true, capitalHeight: 14
        });
        // Eagle glyphs on pillars
        m.buildInscription({
            text: '🦅', x: imgX - 18, y: imgY + 2,
            fontSize: 16, color: 'rgba(240,208,128,0.6)',
            fontFamily: "'Georgia',serif", z: 6
        });
        m.buildInscription({
            text: '🦅', x: imgX + imgW + 6, y: imgY + 2,
            fontSize: 16, color: 'rgba(240,208,128,0.6)',
            fontFamily: "'Georgia',serif", z: 6
        });

        // ── TITLE ──
        m.buildInscription({
            text: 'ZEUS · KING OF THE GODS',
            x: W/2 - 100, y: imgY + imgH + 12,
            fontSize: 10, color: 'rgba(240,208,128,0.6)',
            fontFamily: "'Cinzel Decorative',serif", z: 5
        });
        m.buildInscription({
            text: 'IV · The Emperor · Lord of Olympus · The Thunderer',
            x: W/2 - 140, y: imgY + imgH + 28,
            fontSize: 6, color: 'rgba(200,160,60,0.4)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        // ── THUNDERBOLT RELIQUARY ──
        m.buildWall({
            ...GaiaMason.mat('olympus_marble'),
            x: W/2 - 30, y: imgY + imgH + 50, width: 60, height: 10, z: 5
        });
        m.buildPillar({
            ...GaiaMason.mat('throne_gold'),
            x: W/2 - 8, y: imgY + imgH + 60, width: 16, height: 40, z: 4,
            capital: true, capitalHeight: 8
        });
        m.buildInscription({
            text: '⚡', x: W/2 - 10, y: imgY + imgH + 48,
            fontSize: 20, color: '#f0d080',
            fontFamily: "'Georgia',serif", z: 6
        });
        const boltZone = makeZone(W/2 - 35, imgY + imgH + 42, 70, 60, 'Touch the Thunderbolt', () => {
            toast('⚡ THE THUNDERBOLT\n\n"Authority is not claimed. It is demonstrated in the silence before the thunder."\n\nZeus regards you. The sky holds its breath.');
            spawnSparks(W/2, imgY + imgH + 70, '#ffd700', 15, container);
            spawnLightning(container);
        });
        container.appendChild(boltZone);

        // ── STYX RIVER ──
        m.buildWall({
            ...GaiaMason.mat('styx_water'),
            x: 100, y: 500, width: 660, height: 16, z: 2
        });
        m.buildInscription({
            text: 'THE RIVER STYX · OATHS SWORN HERE BIND EVEN THE GODS',
            x: W/2 - 160, y: 520,
            fontSize: 6, color: 'rgba(100,150,200,0.35)',
            fontFamily: "'Cinzel',serif", z: 3
        });
        const styxZone = makeZone(100, 495, 660, 30, 'Approach the Styx', () => {
            toast('🌊 THE RIVER STYX\n\n"Oaths sworn upon the Styx bind even the gods. What promise have you made that you cannot unmake?"');
            spawnSparks(430, 505, '#8899cc', 10, container);
        });
        container.appendChild(styxZone);

        // ── LIGHTNING ENGINE ──
        function spawnLightning(cnt) {
            const bolt = document.createElement('div');
            bolt.style.cssText = `position:absolute;left:${200+Math.random()*460}px;top:0;width:2px;height:${80+Math.random()*120}px;background:linear-gradient(to bottom,rgba(200,210,255,0.9),rgba(150,170,240,0.4),transparent);z-index:20;pointer-events:none;transform-origin:top center;animation:lightningBolt 0.6s ease-out forwards;box-shadow:0 0 20px rgba(180,200,255,0.5);`;
            cnt.appendChild(bolt); setTimeout(() => bolt.remove(), 700);
            const flash = document.createElement('div');
            flash.style.cssText = 'position:absolute;inset:0;background:rgba(180,200,240,0.06);z-index:18;pointer-events:none;animation:thunderFlash 0.4s ease-out forwards;';
            cnt.appendChild(flash); setTimeout(() => flash.remove(), 500);
        }
        function scheduleLightning() {
            setTimeout(() => { spawnLightning(container); if(Math.random()<0.4)setTimeout(()=>spawnLightning(container),200+Math.random()*600); scheduleLightning(); }, 4000+Math.random()*15000);
        }
        scheduleLightning();
    }

    // ═══════════════════════════════════
    // STORM BELT — zeus-background.jpg layer
    // ═══════════════════════════════════

    function buildStormBelt() {
        const container = document.getElementById('storm-scene');
        const m = new GaiaMason('storm-scene');

        // Background image as CSS
        const bgDiv = document.createElement('div');
        bgDiv.style.cssText = `
            position:absolute; inset:0; z-index:0;
            background-image:url('images/zeus-background.jpg');
            background-size:cover; background-position:center 40%;
            opacity:0.2; filter:saturate(0.4) brightness(0.5);
            pointer-events:none;
        `;
        container.appendChild(bgDiv);

        // Storm clouds (GaiaMason)
        GaiaMason.MATERIALS['storm_cloud'] = {
            chars: ['⌒','⌣','~','⋅','⌒'], textColor:'#8888aa', mortarColor:'#555588',
            fontSize:22, lineHeight:0.55, letterSpacing:2, fontFamily:"'Georgia',serif", weathering:0
        };
        m.buildWall({ ...GaiaMason.mat('storm_cloud'), x: 0, y: 10, width: 860, height: 30, z: 1 });
        m.buildWall({ ...GaiaMason.mat('storm_cloud'), x: 0, y: 100, width: 860, height: 30, z: 1 });

        // Inscription
        m.buildInscription({
            text: 'THE STORM BELT · WHERE THUNDER IS FORGED',
            x: 200, y: 60,
            fontSize: 7, color: 'rgba(180,190,220,0.4)',
            fontFamily: "'Cinzel',serif", z: 3
        });

        const stormZone = makeZone(100, 0, 660, 160, 'Enter the Storm', () => {
            toast('🌪️ THE STORM BELT\n\n"Order made from chaos requires that you first understand what chaos was protecting."\n\nThe clouds churn. The thunder builds. Zeus is near.');
            spawnSparks(430, 80, '#8899dd', 12, container);
        });
        container.appendChild(stormZone);
    }

    // ═══════════════════════════════════
    // PANTHEON LEDGE — zeus-classical.jpg
    // ═══════════════════════════════════

    function buildPantheon() {
        const container = document.getElementById('pantheon-scene');
        const m = new GaiaMason('pantheon-scene');

        // Classical assembly image
        const imgW = 400, imgH = 180;
        const imgX = 230, imgY = 20;

        m.buildWall({
            ...GaiaMason.mat('olympus_marble'),
            x: imgX - 10, y: imgY - 6, width: imgW + 20, height: imgH + 16, z: 2
        });
        m.buildWall({
            ...GaiaMason.mat('throne_gold'),
            x: imgX - 4, y: imgY, width: imgW + 8, height: imgH + 4, z: 3
        });

        const imgFrame = document.createElement('div');
        imgFrame.style.cssText = `
            position:absolute; left:${imgX}px; top:${imgY}px;
            width:${imgW}px; height:${imgH}px; z-index:4;
            overflow:hidden; border:2px solid rgba(200,160,60,0.2);
        `;
        const img = document.createElement('img');
        img.src = 'images/zeus-classical.jpg';
        img.alt = 'The Court of Olympus';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;filter:brightness(0.9) sepia(0.2);';
        imgFrame.appendChild(img);
        container.appendChild(imgFrame);

        m.buildInscription({
            text: 'THE COURT OF OLYMPUS',
            x: 310, y: imgY + imgH + 8,
            fontSize: 8, color: 'rgba(240,208,128,0.5)',
            fontFamily: "'Cinzel Decorative',serif", z: 5
        });
        m.buildInscription({
            text: 'Twelve thrones. One king. The gods assemble.',
            x: 280, y: imgY + imgH + 24,
            fontSize: 6, color: 'rgba(200,160,60,0.35)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        // Doorways to other realms
        const doorways = [
            { god: 'Hera', link: '../hera/realm.html', x: 40, y: 160 },
            { god: 'Poseidon', link: '../poseidon/realm.html', x: 720, y: 160 },
            { god: 'Hades', link: '../descent.html', x: 380, y: 220 },
        ];
        doorways.forEach(d => {
            m.buildArch({
                ...GaiaMason.mat('throne_gold'),
                cx: d.x + 25, cy: d.y, innerRadius: 22,
                stoneCount: 7, stoneDepth: 10, z: 6,
                keystoneChar: '🏛️', keystoneOversize: 1.2
            });
            m.buildInscription({
                text: d.god.toUpperCase(),
                x: d.x + 5, y: d.y + 26,
                fontSize: 5, color: 'rgba(240,208,128,0.4)',
                fontFamily: "'Cinzel',serif", z: 7
            });
            const dz = makeZone(d.x, d.y - 15, 50, 50, `Enter ${d.god}'s Realm`, () => {
                toast(`🏛️ Approaching the realm of ${d.god}...`);
                setTimeout(() => { window.location.href = d.link; }, 800);
            });
            container.appendChild(dz);
        });
    }

    // ═══════════════════════════════════
    // GREAT HALL — GaiaMason pillars
    // ═══════════════════════════════════

    function buildGreatHall() {
        const container = document.getElementById('hall-scene');
        const m = new GaiaMason('hall-scene');

        GaiaMason.MATERIALS['hall_marble'] = {
            chars: ['M','N','H','M','N'], textColor:'#d8d0c8', mortarColor:'#b0a8a0',
            fontSize:34, lineHeight:0.5, letterSpacing:-3, fontFamily:"'Cinzel','Georgia',serif", weathering:0.03
        };

        // Floor
        m.buildFloor({
            ...GaiaMason.mat('hall_marble'),
            x: 30, y: 140, width: 800, height: 60, z: 0,
            perspectiveStrength: 6,
            glyphCarving: {
                text: '⚡  ◆  ⚡  ◆  ⚡',
                x: 320, y: 20, size: 14, spacing: 30,
                color: 'rgba(200,160,60,0.06)'
            }
        });

        // Pillars
        for (let i = 0; i < 6; i++) {
            const px = 80 + i * 140;
            m.buildPillar({
                ...GaiaMason.mat('olympus_marble'),
                x: px, y: 40, width: 20, height: 120, z: 3,
                capital: true, capitalHeight: 14
            });
            m.buildInscription({
                text: '⚡', x: px + 2, y: 30,
                fontSize: 12, color: 'rgba(240,208,128,0.4)',
                fontFamily: "'Georgia',serif", z: 5
            });
        }

        // Hearth
        m.buildWall({
            ...GaiaMason.mat('throne_gold'),
            x: 395, y: 135, width: 70, height: 8, z: 4
        });
        const hearthGlow = document.createElement('div');
        hearthGlow.style.cssText = `
            position:absolute; left:410px; top:120px;
            width:40px; height:40px; border-radius:50%;
            background:radial-gradient(circle, rgba(255,200,60,0.25) 0%, transparent 70%);
            pointer-events:none; z-index:5;
            animation:styxShimmer 2s ease-in-out infinite;
        `;
        container.appendChild(hearthGlow);

        m.buildInscription({
            text: 'THE GREAT HALL · HEARTH OF OLYMPUS',
            x: 250, y: 168,
            fontSize: 7, color: 'rgba(240,208,128,0.4)',
            fontFamily: "'Cinzel Decorative',serif", z: 5
        });

        const hallZone = makeZone(350, 100, 160, 70, 'Stand before the Hearth', () => {
            toast('🔥 THE HEARTH OF OLYMPUS\n\n"Every tradition was once a fresh wound. Ask what this one is still protecting."');
            spawnSparks(430, 130, '#ff8833', 8, container);
        });
        container.appendChild(hallZone);
    }

    // ═══════════════════════════════════
    // LOWER PEAK — The Ascent + Card Offering
    // ═══════════════════════════════════

    function buildLowerPeak() {
        const container = document.getElementById('lower-scene');
        const m = new GaiaMason('lower-scene');

        // The Ascent path
        m.buildFloor({
            ...GaiaMason.mat('olympus_marble'),
            x: 200, y: 80, width: 460, height: 50, z: 0,
            perspectiveStrength: 4
        });
        m.buildInscription({
            text: 'THE ASCENT',
            x: 380, y: 90,
            fontSize: 7, color: 'rgba(240,208,128,0.4)',
            fontFamily: "'Cinzel Decorative',serif", z: 3
        });
        m.buildInscription({
            text: 'The mountain does not ask permission to rise.',
            x: 280, y: 108,
            fontSize: 6, color: 'rgba(200,160,60,0.3)',
            fontFamily: "'Cinzel',serif", z: 3, fontStyle: 'italic'
        });

        // ── EMPEROR'S CARD OFFERING ──
        const cardX = 60, cardY = 20;
        m.buildWall({
            ...GaiaMason.mat('throne_gold'),
            x: cardX - 4, y: cardY - 2, width: 78, height: 108, z: 4
        });
        m.buildWall({
            ...GaiaMason.mat('olympus_marble'),
            x: cardX, y: cardY, width: 70, height: 100, z: 5
        });

        const cardFrame = document.createElement('div');
        cardFrame.style.cssText = `
            position:absolute; left:${cardX + 4}px; top:${cardY + 4}px;
            width:62px; height:92px; z-index:6;
            overflow:hidden; cursor:pointer;
        `;
        const cardImg = document.createElement('img');
        cardImg.src = 'images/zeus-card.jpg';
        cardImg.alt = 'IV · The Emperor';
        cardImg.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        cardImg.title = 'IV · The Emperor · Zeus';
        cardFrame.appendChild(cardImg);
        container.appendChild(cardFrame);

        const cardZone = makeZone(cardX, cardY, 78, 105, 'The Emperor\'s Card', () => {
            toast('🜁 IV · THE EMPEROR\n\nZeus grips the thunderbolt and the realm bends toward law. Authority demonstrated in the silence before the storm.\n\nThis card is available as a Digital Greeting Card in the Tarot Store.');
            spawnSparks(cardX + 35, cardY + 50, '#ffd700', 10, container);
        });
        container.appendChild(cardZone);

        // Stripe button
        const stripeBtn = document.createElement('a');
        stripeBtn.href = 'https://buy.stripe.com/eVq8wPfnKaTX98A9f22Ji00';
        stripeBtn.target = '_blank';
        stripeBtn.rel = 'noopener';
        stripeBtn.style.cssText = `
            position:absolute; left:180px; top:50px;
            font-family:'Cinzel',serif; font-size:0.55rem; letter-spacing:0.15em;
            text-transform:uppercase; color:#0a0806;
            background:linear-gradient(135deg, #f0d080, #c9a84c);
            padding:0.5rem 1.2rem; border-radius:3px; text-decoration:none;
            z-index:10; transition:all 0.2s;
        `;
        stripeBtn.textContent = '⚡ Buy Card · $1.61';
        stripeBtn.onmouseover = () => stripeBtn.style.boxShadow = '0 4px 16px rgba(200,160,60,0.4)';
        stripeBtn.onmouseout = () => stripeBtn.style.boxShadow = 'none';
        container.appendChild(stripeBtn);

        // Return portal
        m.buildArch({
            ...GaiaMason.mat('throne_gold'),
            cx: 730, cy: 70, innerRadius: 30,
            stoneCount: 9, stoneDepth: 12, z: 6,
            keystoneChar: '🌍', keystoneOversize: 1.3
        });
        m.buildInscription({
            text: 'GAIA',
            x: 708, y: 104,
            fontSize: 5, color: 'rgba(240,208,128,0.4)',
            fontFamily: "'Cinzel',serif", z: 7
        });
        const gaiaZone = makeZone(700, 50, 60, 50, 'Return to GAIA', () => {
            toast('🌍 Descending from Olympus...');
            setTimeout(() => { window.location.href = '../index.html?from=zeus'; }, 800);
        });
        container.appendChild(gaiaZone);
    }

    // ═══════════════════════════════════
    // INIT
    // ═══════════════════════════════════

    function init() {
        buildPontus();
        buildSummit();
        buildStormBelt();
        buildPantheon();
        buildGreatHall();
        buildLowerPeak();
        toast('⚡ MOUNT OLYMPUS\n\nSummit · Storm Belt · Pantheon Ledge · Great Hall · The Ascent\nScroll to explore. The King awaits at the peak.');
    }

    init();
    </script>
</body>
