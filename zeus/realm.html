<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mount Olympus · Realm of Zeus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0806; --deep-stone: #1a1410; --stone: #2a2218;
            --basalt: #1a1612; --granite: #3d362f; --limestone: #5c5040;
            --gold: #c9a84c; --gold-dim: #6b5520; --lightning: #8899dd;
            --pontus: #2a4a6a; --marble: #c8c0b0;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--void);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            font-family: 'EB Garamond','Georgia',serif; color: var(--marble);
            background-image: radial-gradient(ellipse at 50% 10%, rgba(80,60,30,0.08) 0%, transparent 60%);
        }

        #olympus-container {
            width: 860px; max-width: 98vw; margin: 0 auto;
            overflow-y: auto; overflow-x: hidden; position: relative; z-index: 3;
            scroll-behavior: smooth; height: 100vh;
            border-left: 4px solid var(--basalt);
            border-right: 4px solid var(--basalt);
            box-shadow: 0 0 120px rgba(0,0,0,0.6), 0 0 240px rgba(0,0,0,0.3);
        }
        #olympus-container::-webkit-scrollbar { width: 6px; }
        #olympus-container::-webkit-scrollbar-track { background: var(--void); }
        #olympus-container::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.15); border-radius: 3px; }

        .mountain-level {
            position: relative; width: 100%;
            border-bottom: 1px solid rgba(201,168,76,0.06);
        }
        .level-scene { width: 100%; height: 100%; position: relative; }

        /* ── STONE SCROLL MARKERS ── */
        .scroll-marker {
            width: 100%; height: 50px; position: relative;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, var(--deep-stone) 0%, var(--basalt) 50%, var(--deep-stone) 100%);
            border-bottom: 2px solid rgba(201,168,76,0.1);
            overflow: hidden;
        }
        .scroll-marker::before {
            content: '';
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(201,168,76,0.03) 2px, rgba(201,168,76,0.03) 4px
            );
            pointer-events: none;
        }
        .scroll-marker img {
            height: 28px; opacity: 0.35;
            filter: drop-shadow(0 0 6px rgba(200,160,60,0.2));
            transition: opacity 0.3s;
        }
        .scroll-marker:hover img { opacity: 0.6; }

        /* ── NAVIGATION ── */
        .mountain-nav {
            display: flex; gap: 0.3rem; justify-content: center;
            padding: 0.35rem; flex-wrap: wrap; position: sticky; top: 0;
            z-index: 50; background: rgba(10,8,6,0.92);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(201,168,76,0.1);
        }
        .nav-btn {
            font-family: 'Cinzel',serif; font-size: 0.5rem;
            letter-spacing: 0.15em; background: rgba(26,20,16,0.7);
            border: 1px solid rgba(201,168,76,0.2); color: rgba(201,168,76,0.6);
            padding: 0.25rem 0.7rem; border-radius: 2px; cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: rgba(201,168,76,0.08); border-color: var(--gold); color: var(--gold); }

        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(10,8,6,0.96); border: 1px solid var(--gold);
            border-radius: 4px; padding: 0.5rem 1.2rem;
            font-family: 'EB Garamond',serif; font-size: 0.8rem;
            z-index: 200; opacity: 0; transition: opacity 0.4s;
            pointer-events: none; text-align: center; max-width: 440px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); white-space: pre-line;
        }
        #toast.show { opacity: 1; }

        .zone { cursor: pointer; transition: filter 0.25s, transform 0.25s; }
        .zone:hover { filter: brightness(1.3); z-index: 50 !important; }
        .zone:active { transform: scale(0.94); }

        @keyframes sparkFade { 0%{transform:scale(0.5);opacity:1} 100%{transform:scale(2.5);opacity:0} }
        @keyframes lightningBolt { 0%{opacity:0;transform:scaleY(0)} 10%{opacity:1} 20%{opacity:0} 100%{opacity:0} }
        @keyframes reliefGlow { 0%,100%{box-shadow:0 0 15px rgba(200,160,60,0.08)} 50%{box-shadow:0 0 30px rgba(200,160,60,0.18)} }
        @keyframes styxShimmer { 0%,100%{opacity:0.15} 50%{opacity:0.35} }
        @keyframes markerPulse { 0%,100%{filter:drop-shadow(0 0 4px rgba(200,160,60,0.15))} 50%{filter:drop-shadow(0 0 12px rgba(200,160,60,0.4))} }

        @media (max-width: 880px) {
            #olympus-container { width: 98vw; height: 100vh; }
        }
    </style>
</head>
<body>

    <nav class="mountain-nav">
        <button class="nav-btn" onclick="scrollToLevel('summit-level')">⚡ Summit</button>
        <button class="nav-btn" onclick="scrollToLevel('storm-belt-level')">🌪️ Storm</button>
        <button class="nav-btn" onclick="scrollToLevel('pantheon-ledge-level')">🏛️ Pantheon</button>
        <button class="nav-btn" onclick="scrollToLevel('great-hall-level')">🔥 Hall</button>
        <button class="nav-btn" onclick="scrollToLevel('lower-peak-level')">🪜 Ascent</button>
        <button class="nav-btn" onclick="window.location.href='../gwalenn.html'" style="border-color:rgba(201,168,76,0.3);">🔮 Gwalenn</button>
    </nav>

    <div id="olympus-container">

        <!-- ═══════════════════════════════════ -->
        <!-- SUMMIT — zeus.jpg carved into the peak -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="summit-level" style="height:580px;">
            <div class="level-scene" id="summit-scene"></div>
        </div>

        <div class="scroll-marker" id="marker1">
            <img src="images/zeus-logo-alt.jpg" alt="⚡" style="animation:markerPulse 3s ease-in-out infinite;" />
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- STORM BELT — rubble and cloud -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="storm-belt-level" style="height:160px;">
            <div class="level-scene" id="storm-scene"></div>
        </div>

        <div class="scroll-marker" id="marker2">
            <img src="images/zeus-logo.jpg" alt="⚡" />
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- PANTHEON LEDGE — zeus-classical.jpg relief -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="pantheon-ledge-level" style="height:300px;">
            <div class="level-scene" id="pantheon-scene"></div>
        </div>

        <div class="scroll-marker" id="marker3">
            <img src="images/zeus-logo-alt.jpg" alt="⚡" />
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- GREAT HALL — ashlar and hearth -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="great-hall-level" style="height:230px;">
            <div class="level-scene" id="hall-scene"></div>
        </div>

        <div class="scroll-marker" id="marker4">
            <img src="images/zeus-logo.jpg" alt="⚡" />
        </div>

        <!-- ═══════════════════════════════════ -->
        <!-- LOWER PEAK — the ascent, card offering -->
        <!-- ═══════════════════════════════════ -->
        <div class="mountain-level" id="lower-peak-level" style="height:170px;">
            <div class="level-scene" id="lower-scene"></div>
        </div>

        <!-- PONTUS FOUNDATION -->
        <div id="pontus-foundation" style="width:100%;height:90px;position:relative;"></div>

    </div>

    <div id="toast"></div>

    <script src="../js/gaia-mason.js"></script>
    <script>
    /*
     * ═══════════════════════════════════════════════════════
     * MOUNT OLYMPUS · Realm of Zeus · Stone Refactor
     * Cyclopean foundations. Ashlar halls. Rubble belts.
     * Images carved into the mountain as reliefs.
     * ═══════════════════════════════════════════════════════
     */

    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg, d = 3500) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), d);
    }

    window.scrollToLevel = (levelId) => {
        document.getElementById(levelId)?.scrollIntoView({ behavior: 'smooth' });
    };

    function makeZone(x, y, w, h, title, action) {
        const el = document.createElement('div');
        el.className = 'zone'; el.title = title;
        el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:25;`;
        el.addEventListener('click', action);
        return el;
    }

    function spawnSparks(x, y, color, count, container) {
        for (let i = 0; i < count; i++) {
            const spark = document.createElement('div');
            spark.style.cssText = `position:absolute;left:${x+(Math.random()-0.5)*60}px;top:${y+(Math.random()-0.5)*40}px;width:3px;height:3px;background:${color};border-radius:50%;box-shadow:0 0 12px ${color};pointer-events:none;z-index:60;animation:sparkFade ${1+Math.random()}s ease-out forwards;`;
            container.appendChild(spark);
            setTimeout(() => spark.remove(), 1500);
        }
    }

    function spawnLightning(container) {
        const bolt = document.createElement('div');
        bolt.style.cssText = `position:absolute;left:${200+Math.random()*460}px;top:0;width:2px;height:${80+Math.random()*120}px;background:linear-gradient(to bottom,rgba(200,210,255,0.9),rgba(150,170,240,0.4),transparent);z-index:20;pointer-events:none;transform-origin:top center;animation:lightningBolt 0.6s ease-out forwards;`;
        container.appendChild(bolt); setTimeout(() => bolt.remove(), 700);
    }

    // ═══════════════════════════════════
    // PONTUS — The Encircling Sea
    // ═══════════════════════════════════

    function buildPontus() {
        const container = document.getElementById('pontus-foundation');
        const canvas = document.createElement('canvas');
        canvas.width = 860; canvas.height = 90;
        canvas.style.cssText = 'display:block;width:100%;height:100%;';
        container.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        const waveTitans = [
            { freq: 0.6, amp: 0.8, color: [20, 70, 130] },
            { freq: 0.75, amp: 0.6, color: [30, 85, 145] },
            { freq: 0.9, amp: 0.5, color: [25, 75, 135] },
            { freq: 0.55, amp: 0.7, color: [15, 65, 125] },
        ];
        const offsets = waveTitans.map(() => Math.random() * Math.PI * 2);
        (function draw() {
            ctx.clearRect(0, 0, 860, 90);
            const bg = ctx.createLinearGradient(0, 0, 0, 90);
            bg.addColorStop(0, '#060f1a'); bg.addColorStop(1, '#0f1f30');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, 860, 90);
            waveTitans.forEach((t, i) => {
                offsets[i] += 0.008 * t.freq;
                const yC = 20 + i * 20, amp = 4 + t.amp * 8;
                ctx.beginPath();
                ctx.strokeStyle = `rgba(${t.color[0]},${t.color[1]},${t.color[2]},0.35)`;
                ctx.lineWidth = 1.2;
                for (let x = 0; x <= 860; x += 3) {
                    const y = yC + Math.sin(x * 0.008 + offsets[i]) * amp + Math.sin(x * 0.02 + offsets[i] * 0.6) * (amp * 0.25);
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            });
            ctx.font = '7px Cinzel, serif';
            ctx.fillStyle = 'rgba(80,130,180,0.3)';
            ctx.textAlign = 'center';
            ctx.fillText('~  PONTUS  ·  THE ENCIRCLING SEA  ·  FOUNDATION OF OLYMPUS  ~', 430, 78);
            requestAnimationFrame(draw);
        })();
    }

    // ═══════════════════════════════════
    // SUMMIT — Stone peak with carved relief
    // ═══════════════════════════════════

    function buildSummit() {
        const container = document.getElementById('summit-scene');
        const m = new GaiaMason('summit-scene');
        const W = 860;

        // ── CYCLOPEAN FOUNDATION WALLS ──
        m.buildWall({
            chars: ['█','▓','█','▒','█'], textColor:'#3d362f', mortarColor:'#1a1410',
            fontSize:50, lineHeight:0.55, letterSpacing:-1, fontFamily:'monospace',
            x:0, y:500, width:W, height:80, z:0, weathering:0.5
        });
        m.buildWall({
            chars: ['█','▓','█','▒','█'], textColor:'#2a2218', mortarColor:'#0a0806',
            fontSize:44, lineHeight:0.52, letterSpacing:-2, fontFamily:'monospace',
            x:0, y:540, width:W, height:40, z:0, weathering:0.6
        });

        // ── STORM BACKGROUND LAYER ──
        const bgDiv = document.createElement('div');
        bgDiv.style.cssText = `
            position:absolute; inset:0; z-index:0;
            background-image:url('images/zeus-background.jpg');
            background-size:cover; background-position:center;
            opacity:0.08; filter:saturate(0.3) brightness(0.5);
            pointer-events:none;
        `;
        container.appendChild(bgDiv);

        // ── DRESSED GRANITE PEAK (behind the relief) ──
        m.buildWall({
            chars: ['H','H','H','N','N'], textColor:'#5c4f42', mortarColor:'#3d362f',
            fontSize:38, lineHeight:0.5, letterSpacing:-4, fontFamily:"'Cinzel','Georgia',serif",
            x:180, y:10, width:500, height:460, z:1
        });

        // ── THE RELIEF — zeus.jpg carved into granite ──
        const imgW = 340, imgH = 250;
        const imgX = W/2 - imgW/2, imgY = 30;

        // Recessed stone niche
        m.buildWall({
            chars: ['▓','▒','░','▓','▒'], textColor:'#2a2218', mortarColor:'#1a1410',
            fontSize:42, lineHeight:0.5, letterSpacing:-2, fontFamily:'monospace',
            x:imgX-20, y:imgY-10, width:imgW+40, height:imgH+30, z:2, weathering:0.3
        });

        // The relief image
        const imgFrame = document.createElement('div');
        imgFrame.style.cssText = `
            position:absolute; left:${imgX}px; top:${imgY}px;
            width:${imgW}px; height:${imgH}px; z-index:4;
            animation:reliefGlow 5s ease-in-out infinite;
            overflow:hidden;
            box-shadow:inset 0 0 40px rgba(0,0,0,0.5);
        `;
        const img = document.createElement('img');
        img.src = 'images/zeus.jpg';
        img.alt = 'Zeus Enthroned — Carved Relief';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;filter:sepia(0.3) brightness(0.85) contrast(1.1);';
        imgFrame.appendChild(img);
        container.appendChild(imgFrame);

        // ── RELIEF BORDER — ashlar limestone ──
        m.buildWall({
            chars: ['M','W','H','N','M'], textColor:'#5c5040', mortarColor:'#3d362f',
            fontSize:32, lineHeight:0.48, letterSpacing:-2, fontFamily:"'UnifrakturMaguntia','Cinzel',serif",
            x:imgX-24, y:imgY-16, width:imgW+48, height:imgH+38, z:3, weathering:0.1,
            openings:[{x:24, y:16, width:imgW, height:imgH}]
        });

        // ── RELIEF INSCRIPTION — carved into stone below ──
        m.buildInscription({
            text: 'ZEUS  ·  KING  OF  THE  GODS',
            x: W/2 - 130, y: imgY + imgH + 14,
            fontSize: 11, color: 'rgba(201,168,76,0.5)',
            fontFamily: "'Cinzel Decorative',serif", z: 5
        });
        m.buildInscription({
            text: 'IV · THE EMPEROR · LORD OF OLYMPUS · THE THUNDERER',
            x: W/2 - 150, y: imgY + imgH + 30,
            fontSize: 6, color: 'rgba(201,168,76,0.3)',
            fontFamily: "'Cinzel',serif", z: 5
        });

        // ── THE THUNDERBOLT — reliquary in stone ──
        const boltX = W/2 - 20, boltY = imgY + imgH + 48;
        m.buildWall({
            chars: ['▓','▒','░','▓','▒'], textColor:'#3d362f', mortarColor:'#1a1410',
            fontSize:24, lineHeight:0.48, letterSpacing:-1, fontFamily:'monospace',
            x:boltX-16, y:boltY, width:72, height:36, z:4, weathering:0.2
        });
        m.buildInscription({
            text: '⚡', x: boltX + 10, y: boltY + 6,
            fontSize: 24, color: '#c9a84c',
            fontFamily: "'Georgia',serif", z: 6
        });
        m.buildInscription({
            text: 'THUNDERBOLT', x: boltX - 8, y: boltY + 40,
            fontSize: 5, color: 'rgba(201,168,76,0.35)',
            fontFamily: "'Cinzel',serif", z: 6
        });

        const boltZone = makeZone(boltX-20, boltY-5, 80, 75, 'Touch the Thunderbolt', () => {
            toast('⚡ THE THUNDERBOLT\n\n"Authority is not claimed. It is demonstrated in the silence before the thunder."');
            spawnSparks(boltX+36, boltY+18, '#ffd700', 16, container);
            spawnLightning(container);
        });
        container.appendChild(boltZone);

        // ── STYX — river at the base of the peak ──
        m.buildWall({
            chars: ['~','≈','≋','~','≈'], textColor:'#2a4a6a', mortarColor:'#1a3040',
            fontSize:20, lineHeight:0.5, letterSpacing:1, fontFamily:"'Georgia',serif",
            x:80, y:485, width:700, height:18, z:2
        });
        m.buildInscription({
            text: 'THE RIVER STYX  ·  OATHS SWORN HERE BIND EVEN THE GODS',
            x: W/2 - 160, y: 508,
            fontSize: 6, color: 'rgba(100,150,200,0.3)',
            fontFamily: "'Cinzel',serif", z: 3
        });

        const styxZone = makeZone(80, 478, 700, 35, 'Approach the Styx', () => {
            toast('🌊 THE RIVER STYX\n\n"Oaths sworn upon the Styx bind even the gods."');
            spawnSparks(430, 492, '#8899cc', 10, container);
        });
        container.appendChild(styxZone);

        // ── LIGHTNING ENGINE ──
        function scheduleLightning() {
            setTimeout(() => {
                spawnLightning(container);
                if(Math.random()<0.4) setTimeout(()=>spawnLightning(container), 200+Math.random()*600);
                scheduleLightning();
            }, 4000+Math.random()*15000);
        }
        scheduleLightning();
    }

    // ═══════════════════════════════════
    // STORM BELT — Rubble and cloud
    // ═══════════════════════════════════

    function buildStormBelt() {
        const container = document.getElementById('storm-scene');
        const m = new GaiaMason('storm-scene');

        // Rubble basalt walls
        m.buildWall({
            chars: ['▓','▒','░','█','▓'], textColor:'#2a2520', mortarColor:'#1a1410',
            fontSize:36, lineHeight:0.55, letterSpacing:-2, fontFamily:'monospace',
            x:0, y:0, width:860, height:160, z:0, weathering:0.4
        });

        // Background image as faint storm layer
        const bgDiv = document.createElement('div');
        bgDiv.style.cssText = `
            position:absolute; inset:0; z-index:1;
            background-image:url('images/zeus-background.jpg');
            background-size:cover; background-position:center 40%;
            opacity:0.12; filter:saturate(0.3) brightness(0.4);
            pointer-events:none;
        `;
        container.appendChild(bgDiv);

        // Cloud wisps
        m.buildWall({
            chars: ['⌒','⌣','~','⋅','⌒'], textColor:'#666688', mortarColor:'#333355',
            fontSize:16, lineHeight:0.55, letterSpacing:2, fontFamily:"'Georgia',serif",
            x:0, y:20, width:860, height:20, z:2
        });
        m.buildWall({
            chars: ['⌒','⌣','~','⋅','⌒'], textColor:'#555577', mortarColor:'#222244',
            fontSize:14, lineHeight:0.55, letterSpacing:3, fontFamily:"'Georgia',serif",
            x:0, y:120, width:860, height:18, z:2
        });

        // Inscription carved into rubble
        m.buildInscription({
            text: 'THE STORM BELT  ·  WHERE THUNDER IS FORGED  ·  WHERE LIGHTNING IS BORN',
            x: 140, y: 65,
            fontSize: 7, color: 'rgba(180,190,220,0.3)',
            fontFamily: "'Cinzel',serif", z: 3
        });

        const stormZone = makeZone(100, 0, 660, 160, 'Enter the Storm Belt', () => {
            toast('🌪️ THE STORM BELT\n\n"Order made from chaos requires that you first understand what chaos was protecting."');
            spawnSparks(430, 80, '#8899dd', 12, container);
            spawnLightning(container);
        });
        container.appendChild(stormZone);
    }

    // ═══════════════════════════════════
    // PANTHEON LEDGE — Stone portals
    // ═══════════════════════════════════

    function buildPantheon() {
        const container = document.getElementById('pantheon-scene');
        const m = new GaiaMason('pantheon-scene');

        // Foundation — ashlar limestone
        m.buildWall({
            chars: ['M','W','H','N','M'], textColor:'#5c5040', mortarColor:'#3d362f',
            fontSize:36, lineHeight:0.5, letterSpacing:-3, fontFamily:"'UnifrakturMaguntia','Cinzel',serif",
            x:0, y:0, width:860, height:300, z:0, weathering:0.15
        });

        // ── CLASSICAL RELIEF — zeus-classical.jpg ──
        const imgW = 420, imgH = 180;
        const imgX = 220, imgY = 15;

        // Recessed niche
        m.buildWall({
            chars: ['▓','▒','░','▓','▒'], textColor:'#2a2218', mortarColor:'#1a1410',
            fontSize:38, lineHeight:0.5, letterSpacing:-2, fontFamily:'monospace',
            x:imgX-16, y:imgY-8, width:imgW+32, height:imgH+24, z:2, weathering:0.25
        });

        const imgFrame = document.createElement('div');
        imgFrame.style.cssText = `
            position:absolute; left:${imgX}px; top:${imgY}px;
            width:${imgW}px; height:${imgH}px; z-index:4;
            overflow:hidden;
            box-shadow:inset 0 0 30px rgba(0,0,0,0.5);
        `;
        const img = document.createElement('img');
        img.src = 'images/zeus-classical.jpg';
        img.alt = 'The Court of Olympus — Stone Relief';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;filter:sepia(0.3) brightness(0.8) contrast(1.05);';
        imgFrame.appendChild(img);
        container.appendChild(imgFrame);

        // Relief border
        m.buildWall({
            chars: ['M','W','H','N','M'], textColor:'#5c5040', mortarColor:'#3d362f',
            fontSize:28, lineHeight:0.48, letterSpacing:-2, fontFamily:"'UnifrakturMaguntia','Cinzel',serif",
            x:imgX-20, y:imgY-12, width:imgW+40, height:imgH+30, z:3, weathering:0.1,
            openings:[{x:20, y:12, width:imgW, height:imgH}]
        });

        // Relief caption
        m.buildInscription({
            text: 'THE COURT OF OLYMPUS',
            x: 310, y: imgY + imgH + 8,
            fontSize: 8, color: 'rgba(201,168,76,0.35)',
            fontFamily: "'Cinzel Decorative',serif", z: 5
        });

        // ── STONE PORTALS ──
        const portals = [
            { god:'HERA', glyph:'🦚', domain:'Covenant', x:30, y:210, color:'#55aabb', link:'../hera/realm.html',
              mat:{chars:['◈','◇','◈','◇','◈'],textColor:'#55aabb',mortarColor:'#1a3a4a',fontSize:14,lineHeight:0.45,fontFamily:"'Georgia',serif"} },
            { god:'POSEIDON', glyph:'🔱', domain:'The Deep', x:740, y:210, color:'#44aaaa', link:'../poseidon/realm.html',
              mat:{chars:['~','≈','~','≈','~'],textColor:'#44aaaa',mortarColor:'#1a3a3a',fontSize:14,lineHeight:0.45,fontFamily:"'Georgia',serif"} },
            { god:'HADES', glyph:'🌑', domain:'Underworld', x:385, y:245, color:'#9966cc', link:'../../descent.html',
              mat:{chars:['▓','▒','░','▓','▒'],textColor:'#9966cc',mortarColor:'#2a1a3a',fontSize:12,lineHeight:0.45,fontFamily:'monospace'} },
        ];

        portals.forEach(p => {
            // Portal arch — god-specific stone
            const portalMat = `portal_${p.god.toLowerCase()}`;
            GaiaMason.MATERIALS[portalMat] = p.mat;

            m.buildArch({
                ...GaiaMason.mat(portalMat),
                cx: p.x + 30, cy: p.y, innerRadius: 28,
                stoneCount: 11, stoneDepth: 14, z: 6,
                keystoneChar: p.glyph, keystoneOversize: 1.4
            });

            // Portal pillar
            m.buildPillar({
                chars: ['H','H','H'], textColor:'#5c5040', mortarColor:'#3d362f',
                fontSize:16, fontFamily:"'Cinzel',serif",
                x: p.x + 20, y: p.y + 14, width: 20, height: 28, z: 5,
                capital: true, capitalHeight: 8
            });

            // Glyph
            m.buildInscription({
                text: p.glyph, x: p.x + 22, y: p.y - 6,
                fontSize: 18, color: p.color,
                fontFamily: "'Georgia',serif", z: 7
            });

            // Label
            m.buildInscription({
                text: p.god, x: p.x + 12, y: p.y + 48,
                fontSize: 6, color: `${p.color}88`,
                fontFamily: "'Cinzel',serif", z: 7
            });
            m.buildInscription({
                text: p.domain, x: p.x + 6, y: p.y + 58,
                fontSize: 4, color: `${p.color}55`,
                fontFamily: "'Cinzel',serif", z: 7
            });

            const pz = makeZone(p.x, p.y-22, 65, 90, `Enter ${p.god}'s Realm`, () => {
                toast(`${p.glyph} THE REALM OF ${p.god}\n\n${p.domain}. The portal opens.`);
                spawnSparks(p.x+30, p.y+10, p.color, 8, container);
                setTimeout(() => { window.location.href = p.link; }, 800);
            });
            container.appendChild(pz);
        });
    }

    // ═══════════════════════════════════
    // GREAT HALL — Ashlar and hearth
    // ═══════════════════════════════════

    function buildGreatHall() {
        const container = document.getElementById('hall-scene');
        const m = new GaiaMason('hall-scene');

        // Ashlar limestone walls
        m.buildWall({
            chars: ['M','W','H','N','M'], textColor:'#5c5040', mortarColor:'#3d362f',
            fontSize:36, lineHeight:0.5, letterSpacing:-3, fontFamily:"'UnifrakturMaguntia','Cinzel',serif",
            x:0, y:0, width:860, height:230, z:0, weathering:0.1
        });

        // Floor — flagstone
        m.buildFloor({
            chars: ['▓','░','▒','█','░'], textColor:'#5c4f42', mortarColor:'#3a3028',
            fontSize:44, lineHeight:0.47, letterSpacing:-2, fontFamily:"'Georgia',serif",
            x:30, y:140, width:800, height:70, z:1, perspectiveStrength:7,
            glyphCarving: {
                text: '⚡  ◆  ⚡  ◆  ⚡',
                x: 310, y: 25, size: 16, spacing: 32,
                color: 'rgba(201,168,76,0.05)'
            }
        });

        // Pillars — dressed granite
        for (let i = 0; i < 6; i++) {
            const px = 80 + i * 140;
            m.buildPillar({
                chars: ['H','H','H','N','N'], textColor:'#5c4f42', mortarColor:'#3d362f',
                fontSize:20, fontFamily:"'Cinzel','Georgia',serif",
                x: px, y: 30, width: 24, height: 130, z: 3,
                capital: true, capitalHeight: 16
            });
            m.buildInscription({
                text: '⚡', x: px + 4, y: 22,
                fontSize: 14, color: 'rgba(201,168,76,0.3)',
                fontFamily: "'Georgia',serif", z: 5
            });
        }

        // Central hearth
        m.buildWall({
            chars: ['▓','▒','░','▓','▒'], textColor:'#4a3a2a', mortarColor:'#2a1a10',
            fontSize:22, lineHeight:0.5, letterSpacing:-1, fontFamily:'monospace',
            x:395, y:138, width:70, height:12, z:4, weathering:0.3
        });

        const hearthGlow = document.createElement('div');
        hearthGlow.style.cssText = `
            position:absolute; left:405px; top:118px;
            width:50px; height:50px; border-radius:50%;
            background:radial-gradient(circle, rgba(255,180,40,0.2) 0%, transparent 70%);
            pointer-events:none; z-index:5;
            animation:styxShimmer 2s ease-in-out infinite;
        `;
        container.appendChild(hearthGlow);

        m.buildInscription({
            text: 'THE GREAT HALL  ·  HEARTH OF OLYMPUS',
            x: 240, y: 175,
            fontSize: 8, color: 'rgba(201,168,76,0.3)',
            fontFamily: "'Cinzel Decorative',serif", z: 5
        });
        m.buildInscription({
            text: 'The fire holds. The gods assemble. The mountain remembers.',
            x: 230, y: 190,
            fontSize: 6, color: 'rgba(201,168,76,0.18)',
            fontFamily: "'Cinzel',serif", z: 5, fontStyle: 'italic'
        });

        const hallZone = makeZone(350, 100, 160, 80, 'Stand before the Hearth', () => {
            toast('🔥 THE HEARTH OF OLYMPUS\n\n"The fire holds. The gods assemble. The mountain remembers."');
            spawnSparks(430, 130, '#ff8833', 10, container);
        });
        container.appendChild(hallZone);
    }

    // ═══════════════════════════════════
    // LOWER PEAK — The Ascent + Card
    // ═══════════════════════════════════

    function buildLowerPeak() {
        const container = document.getElementById('lower-scene');
        const m = new GaiaMason('lower-scene');

        // Rubble basalt foundation
        m.buildWall({
            chars: ['▓','▒','░','█','▓'], textColor:'#2a2520', mortarColor:'#1a1410',
            fontSize:34, lineHeight:0.55, letterSpacing:-2, fontFamily:'monospace',
            x:0, y:0, width:860, height:170, z:0, weathering:0.45
        });

        // The Ascent path — flagstone
        m.buildFloor({
            chars: ['▓','░','▒','█','░'], textColor:'#5c4f42', mortarColor:'#3a3028',
            fontSize:36, lineHeight:0.47, letterSpacing:-2, fontFamily:"'Georgia',serif",
            x:200, y:90, width:460, height:50, z:1, perspectiveStrength:5
        });

        m.buildInscription({
            text: 'THE ASCENT',
            x: 370, y: 100,
            fontSize: 8, color: 'rgba(201,168,76,0.35)',
            fontFamily: "'Cinzel Decorative',serif", z: 3
        });
        m.buildInscription({
            text: 'The mountain does not ask permission to rise. Neither does its king.',
            x: 230, y: 118,
            fontSize: 6, color: 'rgba(201,168,76,0.2)',
            fontFamily: "'Cinzel',serif", z: 3, fontStyle: 'italic'
        });

        // ── EMPEROR'S CARD — carved into the stone ──
        const cardX = 50, cardY = 22;

        // Stone niche for card
        m.buildWall({
            chars: ['▓','▒','░','▓','▒'], textColor:'#2a2218', mortarColor:'#1a1410',
            fontSize:22, lineHeight:0.5, letterSpacing:-1, fontFamily:'monospace',
            x:cardX-8, y:cardY-4, width:84, height:114, z:3, weathering:0.2
        });

        // Ashlar border
        m.buildWall({
            chars: ['M','W','H','N','M'], textColor:'#5c5040', mortarColor:'#3d362f',
            fontSize:20, lineHeight:0.48, letterSpacing:-1, fontFamily:"'UnifrakturMaguntia','Cinzel',serif",
            x:cardX-12, y:cardY-8, width:92, height:122, z:4, weathering:0.08,
            openings:[{x:12, y:8, width:68, height:102}]
        });

        const cardFrame = document.createElement('div');
        cardFrame.style.cssText = `
            position:absolute; left:${cardX}px; top:${cardY}px;
            width:68px; height:100px; z-index:5;
            overflow:hidden; cursor:pointer;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        `;
        const cardImg = document.createElement('img');
        cardImg.src = 'images/zeus-card.jpg';
        cardImg.alt = 'IV · The Emperor';
        cardImg.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;filter:sepia(0.15) brightness(0.9);';
        cardImg.title = 'IV · The Emperor · Zeus';
        cardFrame.appendChild(cardImg);
        container.appendChild(cardFrame);

        m.buildInscription({
            text: 'IV · THE EMPEROR',
            x: cardX - 4, y: cardY + 106,
            fontSize: 5, color: 'rgba(201,168,76,0.35)',
            fontFamily: "'Cinzel',serif", z: 6
        });

        const cardZone = makeZone(cardX-4, cardY-4, 76, 112, 'The Emperor\'s Card', () => {
            toast('🜁 IV · THE EMPEROR\n\n"Authority is not claimed. It is demonstrated in the silence before the thunder."\n\nThis card is available in the Tarot Store.');
            spawnSparks(cardX+34, cardY+50, '#ffd700', 10, container);
        });
        container.appendChild(cardZone);

        // Stripe link
        const stripeBtn = document.createElement('a');
        stripeBtn.href = 'https://buy.stripe.com/eVq8wPfnKaTX98A9f22Ji00';
        stripeBtn.target = '_blank';
        stripeBtn.rel = 'noopener';
        stripeBtn.style.cssText = `
            position:absolute; left:170px; top:50px;
            font-family:'Cinzel',serif; font-size:0.52rem; letter-spacing:0.15em;
            text-transform:uppercase; color:#1a1410;
            background:linear-gradient(135deg, #c9a84c, #8a6820);
            padding:0.45rem 1rem; border-radius:2px; text-decoration:none;
            z-index:10; transition:all 0.2s;
        `;
        stripeBtn.textContent = '⚡ Buy Card · $1.61';
        stripeBtn.onmouseover = () => stripeBtn.style.boxShadow = '0 4px 16px rgba(200,160,60,0.4)';
        stripeBtn.onmouseout = () => stripeBtn.style.boxShadow = 'none';
        container.appendChild(stripeBtn);

        // Return portal — stone arch
        m.buildArch({
            chars: ['M','W','H','N','M'], textColor:'#5c5040', fontSize:18,
            fontFamily:"'UnifrakturMaguntia','Cinzel',serif",
            cx: 760, cy: 70, innerRadius: 32,
            stoneCount: 11, stoneDepth: 14, z: 6,
            keystoneChar: '🌍', keystoneOversize: 1.3
        });
        m.buildInscription({
            text: 'GAIA', x: 735, y: 106,
            fontSize: 5, color: 'rgba(201,168,76,0.3)',
            fontFamily: "'Cinzel',serif", z: 7
        });
        const gaiaZone = makeZone(730, 45, 60, 55, 'Return to GAIA', () => {
            toast('🌍 Descending from Olympus...');
            setTimeout(() => { window.location.href = '../index.html?from=zeus'; }, 800);
        });
        container.appendChild(gaiaZone);
    }

    // ═══════════════════════════════════
    // INIT
    // ═══════════════════════════════════

    function init() {
        buildPontus();
        buildSummit();
        buildStormBelt();
        buildPantheon();
        buildGreatHall();
        buildLowerPeak();
        toast('⚡ MOUNT OLYMPUS\n\nSummit · Storm Belt · Pantheon Ledge · Great Hall · The Ascent\nCarved from cyclopean stone. The King awaits at the peak.');
    }

    init();
    </script>
