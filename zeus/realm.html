<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mount Olympus · Realm of Zeus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c; --void: #0a0806; --lightning: #8899dd;
            --pontus: #2a4a6a; --marble: #d8d0c8;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--void);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(ellipse at 50% 15%, rgba(120,140,200,0.06) 0%, transparent 60%);
            font-family: 'EB Garamond','Georgia',serif;
            color: var(--marble);
        }

        /* ── ORRERY ── */
        #celestial-orrery {
            width: 860px; max-width: 98vw;
            height: 130px; margin: 0.3rem auto 0;
            position: relative; z-index: 5;
        }

        /* ── MOUNTAIN ── */
        #olympus-container {
            width: 860px; max-width: 98vw;
            height: 720px; margin: 0 auto; overflow-y: auto; overflow-x: hidden;
            position: relative; z-index: 3;
            scroll-behavior: smooth;
            border-left: 3px solid rgba(201,168,76,0.12);
            border-right: 3px solid rgba(201,168,76,0.12);
            box-shadow: 0 0 100px rgba(0,0,0,0.6), 0 0 200px rgba(0,0,0,0.3);
        }
        #olympus-container::-webkit-scrollbar { width: 6px; }
        #olympus-container::-webkit-scrollbar-track { background: var(--void); }
        #olympus-container::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 3px; }

        /* ── LEVELS ── */
        .mountain-level {
            position: relative;
            border-bottom: 1px solid rgba(201,168,76,0.08);
        }
        .level-label {
            position: absolute; top: 8px; right: 16px;
            font-family: 'Cinzel',serif; font-size: 0.55rem;
            color: rgba(201,168,76,0.3); letter-spacing: 0.2em;
            z-index: 20; pointer-events: none;
        }
        .level-scene {
            width: 100%; height: 100%; position: relative;
        }
        #summit-level { height: 540px; }
        #storm-belt-level { height: 140px; }
        #pantheon-ledge-level { height: 260px; }
        #great-hall-level { height: 200px; }
        #lower-peak-level { height: 140px; }

        /* ── PONTUS ── */
        #pontus-foundation {
            width: 860px; max-width: 98vw;
            height: 80px; margin: 0 auto;
            position: relative; z-index: 2;
            border-top: 2px solid rgba(42,74,106,0.3);
        }

        /* ── NAVIGATION ── */
        .mountain-nav {
            display: flex; gap: 0.4rem; justify-content: center;
            padding: 0.4rem; flex-wrap: wrap;
        }
        .nav-btn {
            font-family: 'Cinzel',serif; font-size: 0.55rem;
            letter-spacing: 0.15em;
            background: rgba(26,20,16,0.7);
            border: 1px solid rgba(201,168,76,0.25);
            color: var(--gold); padding: 0.3rem 0.8rem;
            border-radius: 3px; cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: rgba(201,168,76,0.1); border-color: var(--gold); }

        /* ── TOAST ── */
        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: rgba(10,8,6,0.95); border: 1px solid var(--gold);
            border-radius: 6px; padding: 0.5rem 1.2rem;
            font-family: 'EB Garamond',serif; font-size: 0.8rem;
            z-index: 200; opacity: 0; transition: opacity 0.4s;
            pointer-events: none; text-align: center; max-width: 440px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); white-space: pre-line;
        }
        #toast.show { opacity: 1; }
        .zone, .altar-zone, .altar-object-zone, .doorway-zone { cursor: pointer; transition: filter 0.25s, transform 0.25s; }
        .zone:hover, .altar-zone:hover, .altar-object-zone:hover, .doorway-zone:hover { filter: brightness(1.35); z-index: 50 !important; }

        /* ── ANIMATIONS ── */
        @keyframes sparkFade { 0%{transform:scale(0.5);opacity:1} 100%{transform:scale(2.5);opacity:0} }
        @keyframes thunderFlash { 0%{opacity:0} 30%{opacity:0.35} 100%{opacity:0} }
        @keyframes lightningBolt { 0%{opacity:0;transform:scaleY(0)} 10%{opacity:1;transform:scaleY(1)} 20%{opacity:0;transform:scaleY(1)} 100%{opacity:0;transform:scaleY(1)} }
        @keyframes throneGlow { 0%,100%{text-shadow:0 0 10px rgba(255,215,0,0.4)} 50%{text-shadow:0 0 25px rgba(255,215,0,0.8),0 0 50px rgba(255,200,0,0.4)} }
        @keyframes eagleShift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
        @keyframes inscriptionGlow { 0%,100%{text-shadow:0 0 6px rgba(201,168,76,0.2)} 50%{text-shadow:0 0 16px rgba(201,168,76,0.5)} }
        @keyframes styxShimmer { 0%,100%{opacity:0.2} 50%{opacity:0.4} }
        @keyframes hearthPulse { 0%,100%{transform:scaleY(1);opacity:0.85} 50%{transform:scaleY(1.1);opacity:1} }

        @media (max-width: 880px) {
            #celestial-orrery, #pontus-foundation, #olympus-container { width: 98vw; }
            #olympus-container { height: calc(98vw * 0.84); }
            #summit-level { height: calc(98vw * 0.63); }
            #storm-belt-level { height: calc(98vw * 0.16); }
            #pantheon-ledge-level { height: calc(98vw * 0.30); }
            #great-hall-level { height: calc(98vw * 0.23); }
            #lower-peak-level { height: calc(98vw * 0.16); }
            #pontus-foundation { height: calc(98vw * 0.09); }
            #celestial-orrery { height: calc(98vw * 0.15); }
        }
    </style>
</head>
<body>

    <!-- CELESTIAL ORRERY -->
    <div id="celestial-orrery"></div>

    <!-- NAVIGATION -->
    <nav class="mountain-nav">
        <button class="nav-btn" onclick="scrollToLevel('summit-level')">⚡ Summit</button>
        <button class="nav-btn" onclick="scrollToLevel('storm-belt-level')">🌪️ Storm Belt</button>
        <button class="nav-btn" onclick="scrollToLevel('pantheon-ledge-level')">🏛️ Pantheon</button>
        <button class="nav-btn" onclick="scrollToLevel('great-hall-level')">🔥 Great Hall</button>
        <button class="nav-btn" onclick="scrollToLevel('lower-peak-level')">🪜 The Ascent</button>
        <button class="nav-btn" onclick="window.location.href='../gwalenn.html'" style="border-color:rgba(201,168,76,0.4);">🔮 Return to Ring</button>
    </nav>

    <!-- MOUNT OLYMPUS -->
    <div id="olympus-container">
        <div class="mountain-level" id="summit-level">
            <div class="level-label">SUMMIT · THUNDER PEAK</div>
            <div class="level-scene" id="summit-scene"></div>
        </div>
        <div class="mountain-level" id="storm-belt-level">
            <div class="level-label">STORM BELT</div>
            <div class="level-scene" id="storm-scene"></div>
        </div>
        <div class="mountain-level" id="pantheon-ledge-level">
            <div class="level-label">PANTHEON LEDGE</div>
            <div class="level-scene" id="pantheon-scene"></div>
        </div>
        <div class="mountain-level" id="great-hall-level">
            <div class="level-label">HALL OF ASSEMBLY</div>
            <div class="level-scene" id="hall-scene"></div>
        </div>
        <div class="mountain-level" id="lower-peak-level">
            <div class="level-label">THE ASCENT</div>
            <div class="level-scene" id="lower-scene"></div>
        </div>
    </div>

    <!-- PONTUS FOUNDATION -->
    <div id="pontus-foundation"></div>

    <div id="toast"></div>

    <script src="../js/gaia-mason.js"></script>
    <script src="../js/gaia-scene-loader.js"></script>
    <script src="../js/gaia-object-renderer.js"></script>
    <script src="../js/gaia-orrery.js"></script>
    <script src="../js/gaia-suncalc.js"></script>
    <script src="../js/gaia-celestial.js"></script>
    <script src="../js/gaia-deck.js"></script>
    <script>
    /*
     * ═══════════════════════════════════════════════════════
     * MOUNT OLYMPUS · Realm of Zeus
     * gaia/zeus/realm.html
     *
     * Ouranos above. Pontus below. Olympus between.
     * Five levels. Index-driven scene loading.
     * ═══════════════════════════════════════════════════════
     */

    // ── CONFIG ──
    const INDEX_PATH = '../json/index.json';
    const LEVELS = [
        { id: 'summit', sceneId: 'summit-scene', jsonName: 'zeus-realm.json', height: 540, special: true },
        { id: 'storm', sceneId: 'storm-scene', jsonName: 'olympus-storm.json', height: 140 },
        { id: 'pantheon', sceneId: 'pantheon-scene', jsonName: 'olympus-pantheon.json', height: 260, hasDoorways: true },
        { id: 'hall', sceneId: 'hall-scene', jsonName: 'olympus-hall.json', height: 200 },
        { id: 'lower', sceneId: 'lower-scene', jsonName: 'olympus-lower.json', height: 140 },
    ];

    // ── TOAST ──
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(msg, d = 3500) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), d);
    }

    // ── SCROLL ──
    window.scrollToLevel = (levelId) => {
        document.getElementById(levelId)?.scrollIntoView({ behavior: 'smooth' });
    };

    // ── PONTUS ──
    function buildPontusFoundation() {
        const container = document.getElementById('pontus-foundation');
        const canvas = document.createElement('canvas');
        canvas.width = 860; canvas.height = 80;
        canvas.style.cssText = 'display:block;width:100%;height:100%;';
        container.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        const waveTitans = [
            { freq: 0.6, amp: 0.8, color: [25, 80, 140] },
            { freq: 0.75, amp: 0.6, color: [35, 95, 155] },
            { freq: 0.9, amp: 0.5, color: [30, 85, 145] },
            { freq: 0.55, amp: 0.7, color: [20, 75, 135] },
        ];
        const offsets = waveTitans.map(() => Math.random() * Math.PI * 2);

        (function draw() {
            ctx.clearRect(0, 0, 860, 80);
            const bg = ctx.createLinearGradient(0, 0, 0, 80);
            bg.addColorStop(0, '#0a1828'); bg.addColorStop(0.5, '#102030'); bg.addColorStop(1, '#152838');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, 860, 80);
            waveTitans.forEach((t, i) => {
                offsets[i] += 0.008 * t.freq;
                const yC = 18 + i * 18;
                const amp = 4 + t.amp * 8;
                ctx.beginPath();
                ctx.strokeStyle = `rgba(${t.color[0]},${t.color[1]},${t.color[2]},0.4)`;
                ctx.lineWidth = 1;
                for (let x = 0; x <= 860; x += 3) {
                    const y = yC + Math.sin(x * 0.008 + offsets[i]) * amp + Math.sin(x * 0.02 + offsets[i] * 0.6) * (amp * 0.25);
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            });
            ctx.font = '7px Cinzel, serif';
            ctx.fillStyle = 'rgba(100,150,200,0.35)';
            ctx.textAlign = 'center';
            ctx.fillText('~  THE ENCIRCLING SEA  ·  PONTUS  ·  FOUNDATION OF OLYMPUS  ~', 430, 65);
            requestAnimationFrame(draw);
        })();
    }

    // ── CELESTIAL ──
    let sunPos = null, moonPos = null, skyState = null, period = 'SUN', orrery = null;

    function loadCelestial() {
        try {
            if (typeof GaiaSuncalc !== 'undefined') {
                sunPos = GaiaSuncalc.getSunPosition();
                moonPos = GaiaSuncalc.getMoonPosition();
            }
            if (typeof Observe !== 'undefined' && Observe.getCurrentPeriod) period = Observe.getCurrentPeriod();
            if (!skyState && typeof GaiaSuncalc !== 'undefined') {
                skyState = {
                    ascendant: GaiaSuncalc.getAscendant(), planets: {}, period,
                    moonPhase: { name: moonPos?.phaseName || 'Unknown', illumination: moonPos?.illumination || 50, phase: moonPos?.phase || 0.5 }
                };
            }
        } catch(e) {}
        try { if (typeof Observe !== 'undefined' && Observe.getSkyState) Observe.getSkyState().then(s => { skyState = s; orrery?.updateState(sunPos, moonPos, skyState, period); }).catch(() => {}); } catch(e) {}
    }

    // ── BUILD LEVEL ──
    async function buildLevel(config) {
        const container = document.getElementById(config.sceneId);
        container.style.width = '860px';
        container.style.height = config.height + 'px';

        const loader = new GaiaSceneLoader(config.sceneId);
        
        // Load materials from index first
        try {
            const idxResp = await fetch(INDEX_PATH);
            if (idxResp.ok) {
                const idx = await idxResp.json();
                const matFile = idx.files?.materials?.['olympian-materials.json'];
                if (matFile) {
                    const matResp = await fetch(matFile.path);
                    if (matResp.ok) {
                        const extMats = await matResp.json();
                        loader.materials = { ...GaiaMason.MATERIALS };
                        for (const category of Object.values(extMats)) {
                            if (typeof category === 'object') Object.assign(loader.materials, category);
                        }
                    }
                }
            }
        } catch(e) { console.warn('Materials load failed, using built-ins'); }

        await loader.load(`../json/${config.jsonName}`);
        return { loader, container, config };
    }

    // ── SUMMIT (special: lightning, styx, eagles, storm clouds) ──
    async function buildSummit(levelData) {
        const { loader, container } = levelData;

        const objRenderer = new GaiaObjectRenderer(container.id);
        objRenderer.setMason(loader.mason);
        await objRenderer.loadObjects('../json/altar-objects.json');

        objRenderer.place('thunderbolt', 412, 82);
        objRenderer.place('offering_bowl', 275, 338);
        objRenderer.place('offering_bowl', 498, 338);
        objRenderer.place('brazier_gold', 155, 358);
        objRenderer.place('brazier_gold', 638, 358);

        // Styx shimmer
        const styx = document.createElement('div');
        styx.style.cssText = `position:absolute;left:200px;top:465px;width:460px;height:22px;z-index:5;color:rgba(120,140,200,0.3);font-size:11px;font-family:Georgia,serif;letter-spacing:4px;pointer-events:none;animation:styxShimmer 3s ease-in-out infinite;`;
        styx.textContent = '~  ≋  ~  ≈  ~  ≋  ~  ≈  ~  ≋  ~  ≈  ~  ≋';
        container.appendChild(styx);

        // Storm clouds
        const stormCanvas = document.createElement('canvas');
        stormCanvas.width = 860; stormCanvas.height = 160;
        stormCanvas.style.cssText = 'position:absolute;left:0;top:0;z-index:15;pointer-events:none;';
        container.appendChild(stormCanvas);
        const stormCtx = stormCanvas.getContext('2d');
        const clouds = Array.from({length:12}, () => ({ x:Math.random()*900, y:Math.random()*130, w:60+Math.random()*180, h:20+Math.random()*45, speed:0.1+Math.random()*0.3, opacity:0.06+Math.random()*0.1 }));
        (function drawStorm() { stormCtx.clearRect(0,0,860,160); clouds.forEach(c => { c.x+=c.speed; if(c.x>900)c.x=-c.w; stormCtx.fillStyle=`rgba(60,65,90,${c.opacity})`; stormCtx.beginPath(); stormCtx.ellipse(c.x+c.w/2,c.y,c.w/2,c.h/2,0,0,Math.PI*2); stormCtx.fill(); }); requestAnimationFrame(drawStorm); })();

        // Lightning
        function spawnLightning() {
            const bolt = document.createElement('div');
            bolt.style.cssText = `position:absolute;left:${200+Math.random()*460}px;top:0;width:2px;height:${80+Math.random()*120}px;background:linear-gradient(to bottom,rgba(200,210,255,0.9),rgba(150,170,240,0.4),transparent);z-index:20;pointer-events:none;transform-origin:top center;animation:lightningBolt 0.6s ease-out forwards;box-shadow:0 0 20px rgba(180,200,255,0.5);`;
            container.appendChild(bolt); setTimeout(() => bolt.remove(), 700);
            const flash = document.createElement('div');
            flash.style.cssText = 'position:absolute;inset:0;background:rgba(180,200,240,0.06);z-index:18;pointer-events:none;animation:thunderFlash 0.4s ease-out forwards;';
            container.appendChild(flash); setTimeout(() => flash.remove(), 500);
            container.style.transform = 'translateX(-2px)'; setTimeout(()=>container.style.transform='translateX(2px)',80); setTimeout(()=>container.style.transform='translateX(-1px)',160); setTimeout(()=>container.style.transform='translateX(0)',240);
        }
        function scheduleLightning() { setTimeout(() => { spawnLightning(); if(Math.random()<0.4)setTimeout(()=>spawnLightning(),200+Math.random()*600); scheduleLightning(); }, 4000+Math.random()*15000); }
        scheduleLightning();

        // Eagles
        setTimeout(() => { container.querySelectorAll('[style*="font-size: 30px"]').forEach(e => e.style.animation = 'eagleShift 4s ease-in-out infinite'); }, 500);

        // Interactions
        container.addEventListener('object-interact', (e) => {
            const { object, action, x, y } = e.detail;
            if (object === 'thunderbolt' || action === 'approach_throne') {
                const card = GaiaDeck.getCard('zeus');
                toast(`⚡ THE THRONE OF ZEUS\n\n"${card?.whisper || 'I bound the Titans.'}"\n\n${card?.intervention?.message || 'The King regards you.'}`);
                spawnSparks(x+50, y+70, '#ffd700', 18, container); spawnLightning();
            }
            if (action === 'approach_styx') { toast('🌊 THE RIVER STYX\n\n"Oaths sworn upon the Styx bind even the gods."'); spawnSparks(x+230, y+15, '#8899cc', 8, container); }
            if (action === 'leave_offering') { toast('🙏 An oath sworn before Zeus cannot be broken.'); spawnSparks(x+25, y+25, '#ffd700', 6, container); }
            if (action === 'tend_flame') { toast('🔥 The sacred flame burns brighter.'); spawnSparks(x+25, y+10, '#ff8833', 10, container); }
        });
    }

    // ── DOORWAYS ──
    function wireDoorways(container) {
        container.addEventListener('click', (e) => {
            const doorway = e.target.closest('[data-doorway]');
            if (doorway) {
                const link = doorway.dataset.link;
                const god = doorway.dataset.god;
                if (link) {
                    toast(`🏛️ Entering the realm of ${god}...`);
                    setTimeout(() => { window.location.href = link; }, 800);
                }
            }
        });
    }

    // ── SPARKS ──
    function spawnSparks(x, y, color, count, container) {
        for (let i = 0; i < count; i++) {
            const spark = document.createElement('div');
            spark.style.cssText = `position:absolute;left:${x+(Math.random()-0.5)*60}px;top:${y+(Math.random()-0.5)*40}px;width:3px;height:3px;background:${color};border-radius:50%;box-shadow:0 0 12px ${color};pointer-events:none;z-index:60;animation:sparkFade ${1+Math.random()}s ease-out forwards;`;
            container.appendChild(spark);
            setTimeout(() => spark.remove(), 1500);
        }
    }

    // ═══════════════════════════════════
    // INIT
    // ═══════════════════════════════════

    async function init() {
        buildPontusFoundation();
        loadCelestial();

        orrery = new GaiaOrrery('celestial-orrery');
        orrery.init(860, 130);
        orrery.updateState(sunPos, moonPos, skyState, period);

        // Build all levels
        for (const levelCfg of LEVELS) {
            const levelData = await buildLevel(levelCfg);
            if (levelCfg.special) await buildSummit(levelData);
            if (levelCfg.hasDoorways) setTimeout(() => wireDoorways(levelData.container), 1000);
        }

        // Refresh orrery
        setInterval(() => { loadCelestial(); orrery.updateState(sunPos, moonPos, skyState, period); }, 60000);

        toast('⚡ MOUNT OLYMPUS\n\nSummit · Storm Belt · Pantheon Ledge · Great Hall · The Ascent\nScroll to explore. Click doorways to enter realms.');
    }

    init().catch(err => {
        console.error('Mount Olympus failed:', err);
        document.getElementById('olympus-container').innerHTML = `
            <div style="color:#c9a84c;text-align:center;padding:3rem;font-family:'Cinzel',serif;line-height:1.6;">
                <span style="font-size:2rem;">⚡</span><br>
                Olympus could not rise.<br>
                <span style="font-size:0.7rem;color:#6b5520;">${err.message}</span>
            </div>`;
    });
    </script>
</body>
</html>
